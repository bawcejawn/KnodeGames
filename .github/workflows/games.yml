                  continue
              if f == "index.json":
                  assert set(j) == {"v", "updated", "weeks", "contract", "game", "prizesFromWeek"} and one(j["v"]) and iso.fullmatch(str(j["updated"])), f
                  assert type(j["weeks"]) is list and len(j["weeks"]) <= 10000 and all(type(w) is int and 0 <= w < 10000 for w in j["weeks"]), f
                  assert (type(j["game"]) is int and j["game"] == gid) and (j["prizesFromWeek"] is None or nat(j["prizesFromWeek"])), f
                  assert j["contract"] is None or isaddr(j["contract"]), f
                  continue
              assert set(j) == {"v", "week", "start", "end", "game", "targets"} and one(j["v"]) and nat(j["week"]) and (type(j["game"]) is int and j["game"] == week_game(j["week"])[0]) and f == "W%03d.json" % j["week"], f
              assert nat(j["start"]) and nat(j["end"]) and j["end"] - j["start"] == WEEK, f
