            mkdir -p "$PUB/bracket/ruler"
            { git ls-tree --name-only "$parent:bracket/ruler" 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]{3}(-R[0-4])?\.json$ ]]; then git show "$parent:bracket/ruler/$f" > "$PUB/bracket/ruler/$f"; fi
