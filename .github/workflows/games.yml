                  if pk is None or not r["done"]: return "final without every result"
                  if pk.get("re") != 1: return "final on picks no later run read again (fix-check 2 PK-1)"
                  if not all(h is not None and h.get("re") == 1 for day in ds for h in day): return "final before every hour was re-read in a later run"
                  if j.get("vault") != "missed" and (st is None or "held" not in st): return "final without the end-of-week stakes"
              return None
          def ruler_file_problem(f, path_, pub_, week_file):
              m = re.fullmatch(r"W([0-9]{3})(?:-R([0-4]))?\.json", f)
              if not m: return "not a ruler file name"
              w = int(m.group(1)); raw = open(path_, encoding="utf-8").read()
              if m.group(2) is not None and os.path.isfile(pub_):
                  return None if open(pub_, encoding="utf-8").read() == raw else "a published ruler card changed (cards are written once)"
              wf = week_file(w)
              if type(wf) is not dict or wf.get("rulerMode") not in ("shadow", "on") or type(wf.get("seeding")) is not dict or not wf["seeding"].get("size"):
                  return "its week isn't a ruler week (shadow or on) with a bracket"
              j = json.loads(raw); size = wf["seeding"]["size"]
              if m.group(2) is not None:
                  r = int(m.group(2))
                  if r >= rounds_of(size): return "a round the bracket doesn't have"
                  day = wf["days"][r] if type(wf.get("days")) is list and r < len(wf["days"]) else None
                  if not (type(day) is list and len(day) == 24 and all(type(h) is dict and h.get("re") == 1 for h in day)): return "a card before all 24 of its day's hours were recorded and re-read"
                  S0, S1 = day[0]["from"], day[23]["to"]; L = S0 - 1
                  t = time.gmtime(round_day(w, r, size) // 1000)
                  want = {"ruleVersion": 4, "game": 9, "round": "%04d%02d%02d" % (t.tm_year, t.tm_mon, t.tm_mday), "ownRule": "spot", "paying": True,
                          "window": {"W0": L - 7199, "W1": L, "L": L, "S0": S0, "S1": S1}, "c": "500000", "minK": 10, "poolRule": "min"}
                  if type(j) is not dict or any(not same(j.get(k), v) for k, v in want.items()): return "not the Bracket's settings for that day (window, round, rule)"
                  if type(j.get("producers")) is not list or not all(type(p) is dict and isa(p.get("a")) and (p.get("fpct") is None or (type(p["fpct"]) is str and re.fullmatch(r"[0-9]{1,7}", p["fpct"]) and int(p["fpct"]) <= 1000000)) for p in j["producers"]): return "producers"
                  return None
              # the shadow summary: shown beside the real result, never scored
              if not (type(j) is dict and set(j) == {"v", "game", "week", "shadow", "rulerFrom", "rulerMode", "settings", "cards", "rounds", "done", "real"} and one(j["v"]) and j["game"] == 9 and j["week"] == w and j["shadow"] is True):
                  return "not a shadow summary"
              if j["rulerMode"] != "shadow" or wf.get("rulerMode") != "shadow" or j["rulerFrom"] != wf.get("rulerFrom"): return "a summary for a week that isn't the shadow week"
              if not same(j["settings"], {"ownRule": "spot", "minK": 10, "poolRule": "min", "c": "500000"}): return "settings"
              R = rounds_of(size)
              if not (type(j["cards"]) is list and len(j["cards"]) == R and all(c is None or c == "W%03d-R%d.json" % (w, i) for i, c in enumerate(j["cards"]))): return "cards"
              if not (type(j["done"]) is bool and type(j["rounds"]) is list and len(j["rounds"]) <= R and all(type(x) is list and len(x) == size // 2 ** (i + 1) and all(type(v) is int and 1 <= v <= size for v in x) for i, x in enumerate(j["rounds"]))): return "rounds"
              if not same(j["real"], (wf.get("results") or {}).get("rounds", [])): return "the real result beside it isn't the week file's"
              return None
          def rows_ok(rows):
              return type(rows) is list and len(rows) <= 4000 and all(type(x) is dict and set(x) == {"a", "place", "boardPlace", "pts", "champion", "correct", "ranked", "earns"} and isa(x["a"])
                  and nat(x["place"]) and nat(x["boardPlace"]) and nat(x["pts"]) and type(x["champion"]) is bool and nat(x["correct"]) and type(x["ranked"]) is bool
                  and type(x["earns"]) is int and x["earns"] in (0, 1, 2, 3) for x in rows)
          def view_ok(v, last=False):
              keys = {"week", "start", "status", "final", "rows"} | ({"prizes"} if last else set())
              if type(v) is not dict or set(v) != keys or not nat(v["week"]) or v["start"] != week_start(v["week"]) or type(v["status"]) is not str or len(v["status"]) > 10 or type(v["final"]) is not bool or not rows_ok(v["rows"]): return False
              return not last or (type(v["prizes"]) is list and len(v["prizes"]) <= 20 and all(type(p) is dict and set(p) == {"player", "place", "vhp"} and isa(p["player"]) and type(p["place"]) is int and p["place"] in (1, 2) and num(p["vhp"]) and 0 < p["vhp"] <= 2 for p in v["prizes"]))
          def vault_shape(j, f):
              if type(j) is not dict or set(j) != {"game", "week", "final", "rows", "first", "second"} or not (type(j["game"]) is int and j["game"] == 9) or j["final"] is not True: return False
              if not nat(j["week"]) or f != "W%d.json" % j["week"]: return False
              if type(j["rows"]) is not list or len(j["rows"]) > 100000 or not all(type(x) is dict and set(x) == {"player", "points"} and isa(x["player"]) and type(x["points"]) is int and 1 <= x["points"] <= 255 for x in j["rows"]): return False
              if not (alist(j["first"], 10) and alist(j["second"], 10)) or (j["second"] and len(j["first"]) != 1): return False
              allw = j["first"] + j["second"] + [x["player"] for x in j["rows"]]
              return len(set(allw)) == len(allw)

          # ── the Vault file from a final week (bot/games/bracket.ts vaultRows / freeWinners; #E-3 C-1) ──
          def groups(rows, tm):
              key = lambda r: (-r[1], -r[2], -r[3], tm.get(r[0], 0))
              s = sorted(rows, key=lambda r: (key(r), r[0])); out = []
              for i, r in enumerate(s):
                  if i and key(s[i - 1]) == key(r): out[-1].append(r[0])
                  else: out.append([r[0]])
              return out
          def expected_vault(wf):
              tm = {x[0]: x[2] for x in wf["picks"]["rows"]}; st = wf["staked"]; staked = set(st["list"]); heldset = staked | set(st.get("held", []))
              g = groups([x for x in wf["points"] if x[0] in staked and x[1] >= 1], tm)
              n = sum(len(x) for x in g); need = (n * 30 + 99) // 100; got = 0; paid = 0   # the Vault's own formula
              while paid < len(g) and got < need: got += len(g[paid]); paid += 1
              rows = []
              for i, grp in enumerate(g):
                  v = max(2, 255 - i) if i < paid else 1
                  rows += [{"player": a, "points": v} for a in grp]
              rows.sort(key=lambda x: (-x["points"], x["player"]))
              fg = groups([x for x in wf["points"] if x[0] not in heldset and x[1] >= 1], tm)
              first = sorted(fg[0]) if fg else []
              if len(first) > 10: first, second = [], []
              elif len(first) != 1: second = []
              else: second = sorted(fg[1]) if len(fg) > 1 and len(fg[1]) <= 10 else []
              return {"game": 9, "week": wf["week"], "final": True, "rows": rows, "first": first, "second": second}

          def main():
              now = int(os.environ.get("CHECK_NOW_MS") or time.time() * 1000); cw = (now - GENESIS) // WEEK
              # Repo Lens #G-20: the owner's ruler switch, read strictly (an unreadable value holds the Bracket)
              global RULER_VAR
              try: RULER_VAR = switch_from(os.environ.get("BRACKET_RULER_FROM_WEEK", ""))
              except ValueError: return "the BRACKET_RULER_FROM_WEEK variable isn't empty or a vault week (1 to 999999)"
              # G20-2: phase 1 can't score an "on" week. From 2 days before the first "on" week starts (and while one is
              # open), every run alerts, so the ruler-on update is merged in time or the variable moved a week later
              if RULER_VAR is not None and now >= week_start(RULER_VAR) - 2 * DAY:
                  RULER_ALERT.append("BRACKET_RULER_FROM_WEEK = %d: vault week %d is scored by the VHP ruler, which this build can't do (the week is held and void at its backstop). Merge the ruler-on update before %s UTC, or set the variable to %d before then." % (RULER_VAR, RULER_VAR, time.strftime("%a %d %b %H:%M", time.gmtime(week_start(RULER_VAR) / 1000)), RULER_VAR + 1))
              def pubjson(name):
                  p = os.path.join(pub, name) if pub else ""
                  return load(p) if p and os.path.isfile(p) else None
              for root, _dirs, files in os.walk(d):
                  for f in files:
                      if f.endswith(".json") and not js_safe(load(os.path.join(root, f))): return "a value the recorder (JavaScript) can't read back exactly: " + f
              problems = []
              weeks_in = {}
              # ── week files: shape, load rules, recompute (M-9, H-2) and the clock (H-3) ──
              def week_of(wk):
                  f = "W%03d.json" % wk
                  # #B-15 B15-3: an incoming copy that failed this run (weeks are judged in order, so an earlier week's
                  # verdict is known) is never the last seeding: the published copy is
                  if os.path.isfile(os.path.join(d, f)) and not any(p_.startswith(f + ": ") for p_ in problems):
                      try: return load(os.path.join(d, f))
                      except Exception: return None
                  return pubjson(f)
              for f in sorted(os.listdir(d)):
                  if not re.fullmatch(r"W[0-9]{3}\.json", f): continue
                  j = load(os.path.join(d, f)); why = week_ok(j, f)
                  if why: problems.append(f + ": " + why); continue
                  w = j["week"]; weeks_in[w] = j; rel = w in RELEASE
                  old = pubjson(f)
                  if old is not None and type(old) is not dict: problems.append(f + ": the published copy is unreadable"); continue
                  # R-BR-7: a week that has started never changes whether the ruler scores it (switch_change, this job's clock;
                  # a published copy without the field counts as unset)
                  sw = switch_change(old.get("rulerFrom") if old else None, j.get("rulerFrom"), cw)
                  if sw: problems.append(f + ": " + sw); continue
                  # Repo Lens #G-20 G20-1: an open week carries the owner's variable exactly (also before it starts, when
                  # switch_change can't see a difference yet); final, none and void weeks keep the value they closed with
                  # (a file without the field counts as unset, as switch_change reads it)
                  if j["status"] not in ("final", "none", "void") and j.get("rulerFrom") != RULER_VAR:
                      problems.append(f + ": its ruler switch (%s) isn't the owner's BRACKET_RULER_FROM_WEEK (%s)" % (j.get("rulerFrom", "missing"), "unset" if RULER_VAR is None else RULER_VAR)); continue
                  s = j["seeding"]; olds = old.get("seeding") if old else None
                  if old is None:
                      if not (cw - 1 <= w <= cw + 1): problems.append(f + ": a new week file that isn't last, this or next week by this job's clock"); continue
                      if j["status"] == "final": problems.append(f + ": a new week file can't start out final"); continue
                  else:
                      os_, ns = old.get("status"), j["status"]
                      if os_ == "final" and not same(j, old): problems.append(f + ": a final week changed"); continue
                      if os_ in ("none", "void") and not same(j, old): problems.append(f + ": a closed week changed"); continue
                      order = {"waiting": 0, "open": 1, "locked": 2, "final": 3}
                      if ns in order and os_ in order and order[ns] < order[os_]: problems.append(f + ": status went backwards (" + str(os_) + " -> " + ns + ")"); continue
                      if ns == "void" and os_ in ("open", "locked") and now < week_start(w + 1) + VAULT_DAYS: problems.append(f + ": turned void before its backstop"); continue
                      op, np_ = old.get("picks"), j["picks"]
                      # fix-check 2 PK-1: picks, like hours, need two runs. Picks a later run confirmed (re) never change; picks
                      # without it may only gain it, or (under release, before round 1's first hour is over) be replaced
                      if op is not None:
                          plain = lambda x: {k: v for k, v in x.items() if k != "re"} if type(x) is dict else x
                          if np_ is None: problems.append(f + ": its picks went missing"); continue
                          if op.get("re") == 1 and not same(np_, op): problems.append(f + ": its picks changed after a later run confirmed them"); continue
                          if op.get("re") != 1 and not same(plain(np_), plain(op)) and not (rel and "re" not in np_): problems.append(f + ": its picks changed (BRACKET_RELEASE not set for it)"); continue
                      ost, nst = old.get("staked"), j["staked"]
                      if ost is not None and nst is None: problems.append(f + ": its stakes went missing"); continue
                      if type(ost) is dict and "held" in ost and not same(nst, ost) and not (rel and ns != "final"): problems.append(f + ": its end-of-week stakes changed (BRACKET_RELEASE not set for it)"); continue
                      if type(ost) is dict and "held" not in ost and "held" not in nst and not same(nst, ost): problems.append(f + ": its stakes changed during the week"); continue
                      if olds is not None:
                          # a seeding may only gain its re-read mark, or (under release, before picks) be replaced by a new reading
                          plain_old = {k: v for k, v in olds.items() if k != "re"}; plain_new = {k: v for k, v in (s or {}).items() if k != "re"}
                          if s is None: problems.append(f + ": its seeding went missing"); continue
                          if same(plain_old, plain_new):
                              if olds.get("re") == 1 and s.get("re") != 1: problems.append(f + ": its seeding lost its re-read mark"); continue
                          elif not (rel and op is None and olds.get("re") != 1 and s.get("re") != 1): problems.append(f + ": its seeding changed"); continue
                      od = old.get("days")
                      if type(od) is list and len(od) and same({k: v for k, v in (olds or {}).items() if k != "re"}, {k: v for k, v in (s or {}).items() if k != "re"}):
                          if len(j["days"]) != len(od): problems.append(f + ": its days changed"); continue
                          bad = None
                          for r, day in enumerate(od):
                              for i, h in enumerate(day if type(day) is list else []):
                                  if h is None: continue
                                  nh = j["days"][r][i]
                                  if nh is not None and (same(nh, h) or ("re" not in h and same({k: v for k, v in nh.items() if k != "re"}, h))): continue
                                  # fix-check F4: under release, a recorded hour may be replaced (or cleared, when its day's hour 0
                                  # is) by a new reading, which carries no re-read mark until a later run checks it
                                  if rel and ns != "final" and (nh is None or "re" not in nh): continue
                                  bad = (r, i); break
                              if bad: break
                          if bad: problems.append(f + ": a recorded hour changed (round %d hour %d)" % (bad[0] + 1, bad[1])); continue
                  # what's new in this run, against this job's clock
                  if s is not None and (olds is None or not same({k: v for k, v in olds.items() if k != "re"}, {k: v for k, v in s.items() if k != "re"})):
                      if now < seed_time(w): problems.append(f + ": seeded before its time"); continue
                      # fix-check F2: no seeding first written after its 24 hours (the recorder voids the week then; a margin for the run)
                      if now > seed_time(w) + SEED_GRACE + 2 * HOUR: problems.append(f + ": a seeding first written more than 24 hours after its time"); continue
                      if s.get("re") == 1: problems.append(f + ": a seeding marked re-read in the run that wrote it (the two-run rule)"); continue
                  if s is not None:
                      # fix-check F2: the seeds, their VHP and the size follow from the recorded raw averages and the last seeding's
                      last = {}
                      for k in range(1, LAST_SEEDING_WEEKS + 1):
                          pw = week_of(w - k)
                          ps = pw.get("seeding") if type(pw) is dict else None
                          if type(ps) is dict and type(ps.get("raw")) is dict and len(ps["raw"]): last = ps["raw"]; break
                      dv = derive_seeding(s["raw"], last)
                      if not all(same(dv[k], s[k]) for k in ("size", "seeds", "vhp", "out", "outVhp")): problems.append(f + ": its seeding doesn't follow from its raw averages and the last seeding's (fix-check F2)"); continue
                  if j["status"] == "void" and (old is None or old.get("status") in (None, "waiting")) and s is None and now < seed_time(w) + SEED_GRACE: problems.append(f + ": void before the seeding's 24 hours were over"); continue
                  oldpk = old.get("picks") if old else None
                  newpk = j["picks"] is not None and (oldpk is None or not same({k: v for k, v in j["picks"].items() if k != "re"}, {k: v for k, v in oldpk.items() if k != "re"}))
                  if newpk:
                      if now < lock_time(w): problems.append(f + ": picks recorded before the lock"); continue
                      if "re" in j["picks"]: problems.append(f + ": picks marked read again in the run that recorded them (the two-run rule, fix-check 2 PK-1)"); continue
                      # fix-check F3: picks are taken within PICKS_GRACE of the lock (plus an hour for the run). Fix-check 2 PK-2:
                      # under release too, never once round 1's first hour is over (no picks written with hindsight)
                      if now > lock_time(w) + PICKS_GRACE + HOUR and not rel: problems.append(f + ": picks first recorded more than %d h after the lock (BRACKET_RELEASE not set for it)" % (PICKS_GRACE // HOUR)); continue
                      # (#B-15 B15-1: only under release, as the recorder: without one, the window is lock + PICKS_GRACE above,
                      #  which for 32 seeds runs past round 1's start)
                      if rel and now > round_day(w, 0, s["size"]) + HOUR: problems.append(f + ": picks recorded under release after round 1's first hour (fix-check 2 PK-2)"); continue
                  if j["picks"] is not None and any(x[2] >= lock_time(w) for x in j["picks"]["rows"]): problems.append(f + ": a pick timed at or after the lock"); continue
                  if s is not None and s["size"]:
                      od = (old.get("days") if old else None) or []
                      early = None
                      for r, day in enumerate(j["days"]):
                          for i, h in enumerate(day):
                              if h is None: continue
                              was = od[r][i] if r < len(od) and type(od[r]) is list and i < len(od[r]) else None
                              if was is None or not same({k: v for k, v in h.items() if k != "re"}, {k: v for k, v in was.items() if k != "re"}):
