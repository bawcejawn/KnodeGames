                  if st is not None and (old is None or old.get("staked") is None) and now < week_start(w): problems.append(f + ": stakes read before the week started"); continue
                  if st is not None and "held" in st and not (old and type(old.get("staked")) is dict and "held" in old["staked"]) and now < week_start(w + 1): problems.append(f + ": end-of-week stakes read before the week ended"); continue
                  if j["status"] == "final" and not (old and old.get("status") == "final"):
                      if now < week_start(w + 1): problems.append(f + ": final before Monday 00:00 UTC after the week (the review day)"); continue
                      # fix-check 2 R-1: a week the owner has opened for correction never goes final (nor gets a vault file) until
                      # the release is cleared, so every replaced item is read again by a run outside the release first
                      if rel: problems.append(f + ": final while BRACKET_RELEASE names it (fix-check 2 R-1)"); continue
                      if j.get("vault") == "missed":
                          if now < week_start(w + 1) + VAULT_DAYS: problems.append(f + ": closed as missed before its backstop"); continue
                      # fix-check F1: the end-of-week stakes a final week pays from were published by an EARLIER run, unchanged
                      elif not (old and same(old.get("staked"), j["staked"])): problems.append(f + ": final with end-of-week stakes no earlier run published (the two-run rule, fix-check F1)"); continue
                      # #B-15 B15-2: likewise every hour's and the picks' re-read mark must already be in the PUBLISHED copy:
                      # the run that confirms an item (e.g. one replaced under a release just cleared) never also closes the week
                      elif not (all(type(h) is dict and h.get("re") == 1 for dd in (old.get("days") or [[None]]) for h in dd) and type(old.get("picks")) is dict and old["picks"].get("re") == 1):
                          problems.append(f + ": final in the run that re-reads its hours or picks (the published copy must already carry every re mark; #B-15 B15-2)"); continue
              # fix-check 2 S-1: a week file that fails is held on its own (with its vault file and the board), never every
              # Bracket file: another week's final and vault file are still judged and published
              bad_weeks = {}
