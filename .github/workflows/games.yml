# KnodeGames recorders: every hour, records each game's results from the chain (irreversible blocks only, two nodes
# must agree). Today: Who Signs Block X (bot/games/blockx.ts) and the Producer Bracket (bot/games/bracket.ts). Each game has its own folder on the games-data branch.
#
# Two jobs, like the race and the main bot, so repository code never runs next to a write token:
#   record   runs the recorders with a read-only token and no secrets (they only read the chain), and hands the files on.
#   publish  runs no repository code: it checks the files' shape and pushes them to the games-data branch.
# It never touches main, holds no key, and does not run on pull requests.
#
# Turn it on: Settings → Secrets and variables → Actions → Variables: GAMES_ENABLED = true
name: KnodeGames recorders

on:
  schedule:
    - cron: "47 * * * *"     # every hour at minute 47 (after the race recorder at :37 has taken the hour's card)
  workflow_dispatch: {}

concurrency:
  group: knode-games
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # R-VAULT-9: when this run fails, a plain-language summary at the top of the run page (what happened, does it
  # matter, what to do), from .ai/platform/ALERTS.md §8. Reads two files from main; no secrets, read-only.
  summary:
    needs: [record, publish, alert]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            bot/alert-summary.mjs
            .ai/platform/ALERTS.md
          sparse-checkout-cone-mode: false
      - name: Plain-language summary (ALERTS.md §8)
        env:
          WORKFLOW_NAME: KnodeGames recorders
        run: node bot/alert-summary.mjs --workflow "$WORKFLOW_NAME" --section 8

  record:
    if: ${{ vars.GAMES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Repo Lens E4-7: "true" when the recorder held a week before its prize list (read by the alert job below).
    outputs:
      held: ${{ steps.blockx.outputs.held }}
      # Daily Questions (game 1): "failure" when its recorder failed (read by the questions-alert job below).
      questions: ${{ steps.questions-prev.outcome == 'failure' && 'failure' || steps.questions.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      # When this job started: the Daily Questions recorder below runs only for the time left of the job's 30 minutes
      # (Repo Lens F3-1), so a slow Block X plus a slow Questions run can't cancel the job before the upload.
      - name: Note the job's start
        run: date +%s > "$RUNNER_TEMP/job-start"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # The files the last run published, and the race recorder's cards (public branches; read without a token).
      # Only plain JSON files with the expected names are taken.
      - name: Take the last run's files and the race cards
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prev/blockx" "$RUNNER_TEMP/race"
          if git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" games-data 2>/dev/null; then
            # (audit BX-34: names read line by line, never word-split; only expected names are taken)
            { git ls-tree --name-only FETCH_HEAD:blockx 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^(index|board|W[0-9]{3}|P[0-9]{3})\.json$ ]]; then git show "FETCH_HEAD:blockx/$f" > "$RUNNER_TEMP/prev/blockx/$f"; fi
            done
            # Audit BX-81: the published vault files too, so the recorder doesn't write one again once it is published.
            mkdir -p "$RUNNER_TEMP/prev/blockx/vault"
            { git ls-tree --name-only FETCH_HEAD:blockx/vault 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]+\.json$ ]]; then git show "FETCH_HEAD:blockx/vault/$f" > "$RUNNER_TEMP/prev/blockx/vault/$f"; fi
            done
          else
            # Repo Lens E4-1 (a): only a branch that really isn't there means "nothing yet". Any other failed fetch stops
            # the run: carrying on without last run's files is never safe (git ls-remote --exit-code: 2 = no such ref).
            set +e; git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/games-data >/dev/null 2>&1; rc=$?; set -e
            if [ "$rc" -eq 2 ]; then echo "No games-data branch yet."; else echo "::error::The games-data branch could not be fetched (git ls-remote exit $rc). Nothing recorded this run; the next run tries again."; exit 1; fi
          fi
          if git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" race-data 2>/dev/null; then
            { git ls-tree --name-only FETCH_HEAD 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]{3}\.json$ ]]; then git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/race/$f"; fi
            done
          else
            # Repo Lens E4-1 (a): with no race cards the recorder would wait anyway, but a run with an empty race folder
            # must never get that far: a failed fetch of a branch that exists stops the run.
            set +e; git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/race-data >/dev/null 2>&1; rc=$?; set -e
            if [ "$rc" -eq 2 ]; then echo "No race-data branch yet: targets wait for cards."; else echo "::error::The race-data branch could not be fetched (git ls-remote exit $rc). Nothing recorded this run; the next run tries again."; exit 1; fi
          fi
      - name: Record Who Signs Block X
        id: blockx
        run: npm run blockx
        env:
          RPC: ${{ vars.RPC || 'https://koinos.armana.io' }}
          RPC_CHECK: ${{ vars.RPC_CHECK || 'https://api.koinosblocks.com' }}
          BLOCKX_PREV: ${{ runner.temp }}/prev/blockx
          BLOCKX_OUT: ${{ runner.temp }}/games-data/blockx
          RACE_DATA: ${{ runner.temp }}/race
          # The first week the vault pays Block X's free prize (the "from week" that npm run bot -- games shows once
          # game 2 is applied in the vault). Unset: no prizes are listed.
          PRIZES_FROM_WEEK: ${{ vars.PRIZES_FROM_WEEK }}
          # Fix-check L-2: the owner's one-off release of a held week ("<week>:<code>", the code the hold prints). Unset: none.
          BLOCKX_RELEASE: ${{ vars.BLOCKX_RELEASE }}
      # Daily Questions (game 1), from Vault v6.1's rule week (D-116): games/questions/recorder.ts. Independent of Block X
      # (RECORDER_STANDARD §6.5): its steps may fail without stopping the others; the questions-alert job then fails
      # the run after publishing, so the owner is emailed. Its files go out only if the recorder finished (exit 0) or wrote
      # them and raised the late alert (exit 3); the owner's HOLD and RELEASE files go out whatever the exit.
      # Each step has its own time limit, so a node that never answers can't use up the job's 30 minutes and cost Block X
      # its hour (Repo Lens QF-1); a step that times out fails alone and the upload still runs.
      - name: Take Daily Questions' last files
        id: questions-prev
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/prev/questions"; mkdir -p "$P/vault"
          if git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" games-data 2>/dev/null; then
            { git ls-tree --name-only FETCH_HEAD:questions 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^(board|W[0-9]{3})\.json$ ]]; then git show "FETCH_HEAD:questions/$f" > "$P/$f"; fi
            done
            { git ls-tree --name-only FETCH_HEAD:questions/vault 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^((HOLD-|RELEASE-)?W[0-9]+)\.json$ ]]; then git show "FETCH_HEAD:questions/vault/$f" > "$P/vault/$f"; fi
            done
          else
            set +e; git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/games-data >/dev/null 2>&1; rc=$?; set -e
            if [ "$rc" -ne 2 ]; then echo "::error::The games-data branch could not be fetched (git ls-remote exit $rc): Daily Questions records nothing this run."; exit 1; fi
          fi
          # The recorder refuses to write without this mark (a run that couldn't see the published weeks must not write).
          touch "$P/.fetched"
      - name: Record Daily Questions
        id: questions
        if: ${{ steps.questions-prev.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/questions-out"; rm -rf "$O"; mkdir -p "$O"
          # Time left of the job's 30 minutes, keeping 2.5 minutes for the upload; at most 7.5 minutes (Repo Lens F3-1).
          # coreutils timeout exits 124, which takes the "failed" path below (holds still go out, and an alert).
          start=$(cat "$RUNNER_TEMP/job-start" 2>/dev/null || date +%s)
          left=$(( 30 * 60 - 150 - $(date +%s) + start )); [ "$left" -gt 450 ] && left=450
          rc=0
          if [ "$left" -lt 60 ]; then echo "::warning::Daily Questions skipped this run: only ${left} s of the job left."; rc=124
          else timeout --kill-after=15s "${left}s" npm run questions || rc=$?; fi
          D="$RUNNER_TEMP/games-data/questions"; mkdir -p "$RUNNER_TEMP/games-data"; rm -rf "$D"
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]; then cp -r "$O" "$D"
          else
            mkdir -p "$D/vault"
            for f in "$O"/vault/HOLD-W*.json "$O"/vault/RELEASE-W*.json; do [ -f "$f" ] && cp "$f" "$D/vault/"; done
          fi
          exit "$rc"
        env:
          RPC: ${{ vars.RPC || 'https://koinos.armana.io' }}
          RPC_CHECK: ${{ vars.RPC_CHECK || 'https://api.koinosblocks.com' }}
          QUESTIONS_PREV: ${{ runner.temp }}/prev/questions
          QUESTIONS_OUT: ${{ runner.temp }}/questions-out
          # The owner's holds: QUESTIONS_HOLD = "<week>[,<week>]" (reason in QUESTIONS_HOLD_REASON), later
          # QUESTIONS_RELEASE = "<week>". Unset: none.
          QUESTIONS_HOLD: ${{ vars.QUESTIONS_HOLD }}
          QUESTIONS_HOLD_REASON: ${{ vars.QUESTIONS_HOLD_REASON }}
          QUESTIONS_RELEASE: ${{ vars.QUESTIONS_RELEASE }}
          # QUESTIONS_FROM_WEEK = the first vault week paid from a results file (4, Mon 16 Nov): from then a week read as
          # "not shared" fails the run (an email) instead of rolling over quietly (Repo Lens C11-1).
          QUESTIONS_FROM_WEEK: ${{ vars.QUESTIONS_FROM_WEEK }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: games-data
          path: ${{ runner.temp }}/games-data/
          retention-days: 1
          if-no-files-found: ignore

  # Fix-check F9 (Repo Lens #E-3 M-3, M-4): the Producer Bracket records in its OWN job, so its code never runs next to
  # Block X's output, and its artifact is separate. If it fails, Block X is still published and the alert job emails.
  record_bracket:
    if: ${{ vars.GAMES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # The Bracket's files the last run published (a public branch; read without a token). Only plain JSON files with
      # the expected names are taken, names read line by line.
      - name: Take the Bracket's last published files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prev/bracket/vault"
          if git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" games-data 2>/dev/null; then
            { git ls-tree --name-only FETCH_HEAD:bracket 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^(index|board|W[0-9]{3})\.json$ ]]; then git show "FETCH_HEAD:bracket/$f" > "$RUNNER_TEMP/prev/bracket/$f"; fi
            done
            { git ls-tree --name-only FETCH_HEAD:bracket/vault 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]+\.json$ ]]; then git show "FETCH_HEAD:bracket/vault/$f" > "$RUNNER_TEMP/prev/bracket/vault/$f"; fi
            done
          else
            # Repo Lens E4-1 (a): only a branch that really isn't there means "nothing yet"; any other failed fetch stops the run.
            set +e; git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/games-data >/dev/null 2>&1; rc=$?; set -e
            if [ "$rc" -eq 2 ]; then echo "No games-data branch yet."; else echo "::error::The games-data branch could not be fetched (git ls-remote exit $rc). Nothing recorded this run; the next run tries again."; exit 1; fi
          fi
      # It writes its files only at the end of a good run.
      - name: Record the Producer Bracket
        id: bracket
        run: npm run bracket
        env:
          RPC: ${{ vars.RPC || 'https://koinos.armana.io' }}
          RPC_CHECK: ${{ vars.RPC_CHECK || 'https://api.koinosblocks.com' }}
          BRACKET_PREV: ${{ runner.temp }}/prev/bracket
          BRACKET_OUT: ${{ runner.temp }}/games-data/bracket
          # The first week the vault pays game 9 (its "from week" once game 9 is applied). Unset: no medals or prize lists.
          BRACKET_PRIZES_FROM_WEEK: ${{ vars.BRACKET_PRIZES_FROM_WEEK }}
          # Fix-check F4: the owner's one-off correction window ("3" or "3,4"); the publish job reads the same variable.
          BRACKET_RELEASE: ${{ vars.BRACKET_RELEASE }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: games-data-bracket
          path: ${{ runner.temp }}/games-data/
          retention-days: 1
          if-no-files-found: ignore

  publish:
    needs: [record, record_bracket]
    # Block X's recorder must have succeeded; the Bracket's may have failed (its files then stay as they were).
    if: ${{ always() && vars.GAMES_ENABLED == 'true' && github.ref == 'refs/heads/main' && needs.record.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # push the games-data branch (never main)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: games-data
          path: ${{ runner.temp }}/incoming
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.record_bracket.result == 'success' }}
        continue-on-error: true
        with:
          name: games-data-bracket
          # fix-check 2 F9-1: its own folder; only its bracket/ folder is ever taken (below)
          path: ${{ runner.temp }}/incoming-bracket
      # Audit BX-131 (round 9): the same Node as the recorders (22), for the recorders'-own-JSON check below.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Push games-data (and nothing else)
        env:
          GH_TOKEN: ${{ github.token }}
          # fix-check F4: the owner's one-off correction window for named Bracket weeks (the recorder reads it too)
          BRACKET_RELEASE: ${{ vars.BRACKET_RELEASE }}
          IN: ${{ runner.temp }}/incoming
        run: |
          set -euo pipefail
          if [ ! -d "$IN" ]; then echo "Nothing to publish."; exit 0; fi
          # Repo Lens #E-3 M-3: the Producer Bracket's names, sizes and JSON form are checked on their own first. A bad Bracket
          # file holds the Bracket only (its folder is set aside, with an alert); it never stops Block X being published.
          BRACKET_ALERT=""
          # fix-check 2 F9-1: the Bracket's files come only from its own artifact (its own folder), and only its bracket/
          # folder: Block X's artifact never carries Bracket files, and anything else in the Bracket's artifact (a stray
          # file, blockx/ files) holds the Bracket this run and never reaches Block X's files.
          rm -rf "$IN/bracket"
          BRIN="${RUNNER_TEMP:-$(dirname "$IN")}/incoming-bracket"   # (= $RUNNER_TEMP on GitHub: IN is $RUNNER_TEMP/incoming)
          if [ -e "$BRIN" ] || [ -L "$BRIN" ]; then
            brstray=$(find "$BRIN" -mindepth 1 -maxdepth 1 ! \( -name bracket -type d \) -print)
            if [ -L "$BRIN" ] || [ -n "$brstray" ]; then
              echo "::error::Producer Bracket artifact held this run (files outside bracket/; nothing of the Bracket is published; Block X still is): $brstray"
              BRACKET_ALERT=1
            elif [ -d "$BRIN/bracket" ]; then
              mv "$BRIN/bracket" "$IN/bracket"
            fi
          fi
          if [ -d "$IN/bracket" ]; then
            brbad=$(find "$IN/bracket" -mindepth 1 \( -type l -o \( -type d ! -path "$IN/bracket/vault" \) -o \( -type f ! -regex "$IN/bracket/\(index\|board\|W[0-9][0-9][0-9]\)\.json" ! -regex "$IN/bracket/vault/W[0-9][0-9]*\.json" \) -o \( -type f -size +2048k \) \) -print)
            if [ -z "$brbad" ] && ! node -e 'const fs=require("fs"),p=require("path");let bad=0;(function w(d){for(const f of fs.readdirSync(d)){const q=p.join(d,f),s=fs.lstatSync(q);if(s.isDirectory()){w(q);continue}const raw=fs.readFileSync(q);let ok=false;try{ok=Buffer.compare(Buffer.from(JSON.stringify(JSON.parse(raw.toString("utf8")))+"\n","utf8"),raw)===0}catch(e){}if(!ok)bad++}})(process.argv[1]);process.exit(bad?1:0)' -- "$IN/bracket"; then brbad="a file not in the recorder's own JSON form"; fi
            # fix-check F7: the recorder writes at most 3 week files, index, board and a vault file or two; anything near
            # this many files is not its output (and a flood of them could run the job out of time)
            if [ -z "$brbad" ] && [ "$(find "$IN/bracket" -type f | wc -l)" -gt 12 ]; then brbad="more than 12 files"; fi
            if [ -n "$brbad" ]; then
              echo "::error::Producer Bracket files held this run (nothing of the Bracket is published; Block X still is): $brbad"
              mv "$IN/bracket" "$RUNNER_TEMP/bracket-held"; BRACKET_ALERT=1
            fi
          fi
          bad=$(find "$IN" -mindepth 1 \( -type l -o \( -type d ! -path "$IN/blockx" ! -path "$IN/blockx/vault" ! -path "$IN/bracket" ! -path "$IN/bracket/vault" ! -path "$IN/questions" ! -path "$IN/questions/vault" \) -o \( -type f ! -regex "$IN/blockx/\(index\|board\|W[0-9][0-9][0-9]\|P[0-9][0-9][0-9]\)\.json" ! -regex "$IN/blockx/vault/W[0-9][0-9]*\.json" ! -regex "$IN/bracket/\(index\|board\|W[0-9][0-9][0-9]\)\.json" ! -regex "$IN/bracket/vault/W[0-9][0-9]*\.json" ! -regex "$IN/questions/\(board\|W[0-9][0-9][0-9]\)\.json" ! -regex "$IN/questions/vault/\(HOLD-\|RELEASE-\)\?W[0-9][0-9]*\.json" \) \) -print)
          if [ -n "$bad" ]; then echo "::error::Refusing to publish unexpected files: $bad"; exit 1; fi
          big=$(find "$IN" -type f -size +2048k -print)
          if [ -n "$big" ]; then echo "::error::Refusing to publish files over 2 MB: $big"; exit 1; fi
          # Round 8 (BX-122) and the class behind BX-95 / BX-112 / BX-113: every incoming file must be EXACTLY what the
          # JavaScript recorder writes for its own content (JSON.stringify of its parse, plus a newline). Then the next
          # recorder run reads back the same values and writes the same bytes, whatever Python thinks of them: no 5.0, no
          # -0, no 1e2, no big integer, no spacing or escaping a recorder never writes.
          command -v node >/dev/null || { echo "::error::node is missing on this runner; nothing published"; exit 1; }
          node -e 'const fs=require("fs"),p=require("path"),bad=[];(function w(d){for(const f of fs.readdirSync(d)){const q=p.join(d,f),s=fs.lstatSync(q);if(s.isDirectory()){w(q);continue}if(!f.endsWith(".json"))continue;if(!s.isFile()){bad.push(p.relative(process.argv[1],q));continue}const raw=fs.readFileSync(q);let ok=false;try{ok=Buffer.compare(Buffer.from(JSON.stringify(JSON.parse(raw.toString("utf8")))+"\n","utf8"),raw)===0}catch(e){}if(!ok)bad.push(p.relative(process.argv[1],q))}})(process.argv[1]);if(bad.length){console.log("::error::not in the recorders own JSON form (JSON.stringify of its parse), nothing published: "+bad.join(", "));process.exit(1)}' -- "$IN"
          # Audit BX-79 / BX-80: the published branch first (read only here): the vault and prize files are judged against
          # what is ALREADY published and the job's own clock, never against this run's own board.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUB=$(mktemp -d); HELD="$PUB/held"; : > "$HELD"; mkdir -p "$PUB/blockx" "$PUB/bracket"
          if [ -n "$BRACKET_ALERT" ]; then echo '!alert' >> "$HELD"; fi
          git init -q work && cd work
          parent=""
          if git fetch -q --depth 1 "$remote" games-data 2>/dev/null; then
            parent=$(git rev-parse FETCH_HEAD)
            git read-tree FETCH_HEAD
            { git ls-tree --name-only "$parent:blockx" 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^(board|index|P[0-9]{3}|W[0-9]{3})\.json$ ]]; then git show "$parent:blockx/$f" > "$PUB/blockx/$f"; fi
            done
            { git ls-tree --name-only "$parent:bracket" 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^(board|index|W[0-9]{3})\.json$ ]]; then git show "$parent:bracket/$f" > "$PUB/bracket/$f"; fi
            done
            mkdir -p "$PUB/bracket/vault"
            { git ls-tree --name-only "$parent:bracket/vault" 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]+\.json$ ]]; then git show "$parent:bracket/vault/$f" > "$PUB/bracket/vault/$f"; fi
            done
          else git read-tree --empty; fi
          # The content must be the recorder's own shape, not only parse as JSON.
          /usr/bin/python3 - "$IN/blockx" 2 "$PUB/blockx" "$HELD" blockx 2400 0 12:1200:0:3 <<'PY'
          import json, os, re, sys
          d = sys.argv[1]; gid = int(sys.argv[2]); addr = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}")
          iso = re.compile(r"[0-9]{4}-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9](\.[0-9]{3})?Z"); ymd = re.compile(r"[0-9]{4}-[0-9][0-9]-[0-9][0-9]")
          # Audit BX-95 (round 6): the recorder is JavaScript, which rounds integers above 2^53 - 1, so nothing larger is
          # ever published (a number it can't read back exactly would make every honest run look like a rewrite).
          # Audit BX-112 (round 7): an address is a JSON string, never a number made of 1s (which JavaScript rounds).
          isaddr = lambda v: type(v) is str and addr.fullmatch(v) is not None
          SAFE = 2**53 - 1
          num = lambda x: type(x) in (int, float) and x == x and abs(x) <= SAFE
          nat = lambda x: type(x) is int and 0 <= x <= SAFE
          WEEK = 7 * 86400000
          # Round-7 blind review: JavaScript compares with ===, Python's == says True == 1 and 3.0 == 3. So every check of
          # a file's header is type-strict (v, week, game), and published content is compared with same() (types too).
          def same(a, b):
              if type(a) is not type(b): return False
