                  # #B-15 B15-3: an incoming copy that failed this run (weeks are judged in order, so an earlier week's
                  # verdict is known) is never the last seeding: the published copy is
                  if os.path.isfile(os.path.join(d, f)) and not any(p_.startswith(f + ": ") for p_ in problems):
                      try: return load(os.path.join(d, f))
                      except Exception: return None
                  return pubjson(f)
              for f in sorted(os.listdir(d)):
                  if not re.fullmatch(r"W[0-9]{3}\.json", f): continue
                  j = load(os.path.join(d, f)); why = week_ok(j, f)
                  if why: problems.append(f + ": " + why); continue
                  w = j["week"]; weeks_in[w] = j; rel = w in RELEASE
                  old = pubjson(f)
                  if old is not None and type(old) is not dict: problems.append(f + ": the published copy is unreadable"); continue
                  s = j["seeding"]; olds = old.get("seeding") if old else None
                  if old is None:
                      if not (cw - 1 <= w <= cw + 1): problems.append(f + ": a new week file that isn't last, this or next week by this job's clock"); continue
                      if j["status"] == "final": problems.append(f + ": a new week file can't start out final"); continue
                  else:
                      os_, ns = old.get("status"), j["status"]
                      if os_ == "final" and not same(j, old): problems.append(f + ": a final week changed"); continue
                      if os_ in ("none", "void") and not same(j, old): problems.append(f + ": a closed week changed"); continue
                      order = {"waiting": 0, "open": 1, "locked": 2, "final": 3}
                      if ns in order and os_ in order and order[ns] < order[os_]: problems.append(f + ": status went backwards (" + str(os_) + " -> " + ns + ")"); continue
                      if ns == "void" and os_ in ("open", "locked") and now < week_start(w + 1) + VAULT_DAYS: problems.append(f + ": turned void before its backstop"); continue
                      op, np_ = old.get("picks"), j["picks"]
                      # fix-check 2 PK-1: picks, like hours, need two runs. Picks a later run confirmed (re) never change; picks
                      # without it may only gain it, or (under release, before round 1's first hour is over) be replaced
                      if op is not None:
                          plain = lambda x: {k: v for k, v in x.items() if k != "re"} if type(x) is dict else x
                          if np_ is None: problems.append(f + ": its picks went missing"); continue
                          if op.get("re") == 1 and not same(np_, op): problems.append(f + ": its picks changed after a later run confirmed them"); continue
                          if op.get("re") != 1 and not same(plain(np_), plain(op)) and not (rel and "re" not in np_): problems.append(f + ": its picks changed (BRACKET_RELEASE not set for it)"); continue
                      ost, nst = old.get("staked"), j["staked"]
                      if ost is not None and nst is None: problems.append(f + ": its stakes went missing"); continue
                      if type(ost) is dict and "held" in ost and not same(nst, ost) and not (rel and ns != "final"): problems.append(f + ": its end-of-week stakes changed (BRACKET_RELEASE not set for it)"); continue
                      if type(ost) is dict and "held" not in ost and "held" not in nst and not same(nst, ost): problems.append(f + ": its stakes changed during the week"); continue
                      if olds is not None:
                          # a seeding may only gain its re-read mark, or (under release, before picks) be replaced by a new reading
                          plain_old = {k: v for k, v in olds.items() if k != "re"}; plain_new = {k: v for k, v in (s or {}).items() if k != "re"}
                          if s is None: problems.append(f + ": its seeding went missing"); continue
                          if same(plain_old, plain_new):
                              if olds.get("re") == 1 and s.get("re") != 1: problems.append(f + ": its seeding lost its re-read mark"); continue
                          elif not (rel and op is None and olds.get("re") != 1 and s.get("re") != 1): problems.append(f + ": its seeding changed"); continue
                      od = old.get("days")
                      if type(od) is list and len(od) and same({k: v for k, v in (olds or {}).items() if k != "re"}, {k: v for k, v in (s or {}).items() if k != "re"}):
                          if len(j["days"]) != len(od): problems.append(f + ": its days changed"); continue
                          bad = None
                          for r, day in enumerate(od):
                              for i, h in enumerate(day if type(day) is list else []):
                                  if h is None: continue
                                  nh = j["days"][r][i]
                                  if nh is not None and (same(nh, h) or ("re" not in h and same({k: v for k, v in nh.items() if k != "re"}, h))): continue
                                  # fix-check F4: under release, a recorded hour may be replaced (or cleared, when its day's hour 0
                                  # is) by a new reading, which carries no re-read mark until a later run checks it
                                  if rel and ns != "final" and (nh is None or "re" not in nh): continue
                                  bad = (r, i); break
                              if bad: break
                          if bad: problems.append(f + ": a recorded hour changed (round %d hour %d)" % (bad[0] + 1, bad[1])); continue
                  # what's new in this run, against this job's clock
                  if s is not None and (olds is None or not same({k: v for k, v in olds.items() if k != "re"}, {k: v for k, v in s.items() if k != "re"})):
                      if now < seed_time(w): problems.append(f + ": seeded before its time"); continue
                      # fix-check F2: no seeding first written after its 24 hours (the recorder voids the week then; a margin for the run)
                      if now > seed_time(w) + SEED_GRACE + 2 * HOUR: problems.append(f + ": a seeding first written more than 24 hours after its time"); continue
                      if s.get("re") == 1: problems.append(f + ": a seeding marked re-read in the run that wrote it (the two-run rule)"); continue
                  if s is not None:
                      # fix-check F2: the seeds, their VHP and the size follow from the recorded raw averages and the last seeding's
                      last = {}
                      for k in range(1, LAST_SEEDING_WEEKS + 1):
                          pw = week_of(w - k)
                          ps = pw.get("seeding") if type(pw) is dict else None
                          if type(ps) is dict and type(ps.get("raw")) is dict and len(ps["raw"]): last = ps["raw"]; break
                      dv = derive_seeding(s["raw"], last)
                      if not all(same(dv[k], s[k]) for k in ("size", "seeds", "vhp", "out", "outVhp")): problems.append(f + ": its seeding doesn't follow from its raw averages and the last seeding's (fix-check F2)"); continue
                  if j["status"] == "void" and (old is None or old.get("status") in (None, "waiting")) and s is None and now < seed_time(w) + SEED_GRACE: problems.append(f + ": void before the seeding's 24 hours were over"); continue
                  oldpk = old.get("picks") if old else None
                  newpk = j["picks"] is not None and (oldpk is None or not same({k: v for k, v in j["picks"].items() if k != "re"}, {k: v for k, v in oldpk.items() if k != "re"}))
                  if newpk:
                      if now < lock_time(w): problems.append(f + ": picks recorded before the lock"); continue
                      if "re" in j["picks"]: problems.append(f + ": picks marked read again in the run that recorded them (the two-run rule, fix-check 2 PK-1)"); continue
                      # fix-check F3: picks are taken within PICKS_GRACE of the lock (plus an hour for the run). Fix-check 2 PK-2:
                      # under release too, never once round 1's first hour is over (no picks written with hindsight)
                      if now > lock_time(w) + PICKS_GRACE + HOUR and not rel: problems.append(f + ": picks first recorded more than %d h after the lock (BRACKET_RELEASE not set for it)" % (PICKS_GRACE // HOUR)); continue
                      # (#B-15 B15-1: only under release, as the recorder: without one, the window is lock + PICKS_GRACE above,
                      #  which for 32 seeds runs past round 1's start)
                      if rel and now > round_day(w, 0, s["size"]) + HOUR: problems.append(f + ": picks recorded under release after round 1's first hour (fix-check 2 PK-2)"); continue
                  if j["picks"] is not None and any(x[2] >= lock_time(w) for x in j["picks"]["rows"]): problems.append(f + ": a pick timed at or after the lock"); continue
                  if s is not None and s["size"]:
                      od = (old.get("days") if old else None) or []
                      early = None
                      for r, day in enumerate(j["days"]):
                          for i, h in enumerate(day):
                              if h is None: continue
                              was = od[r][i] if r < len(od) and type(od[r]) is list and i < len(od[r]) else None
                              if was is None or not same({k: v for k, v in h.items() if k != "re"}, {k: v for k, v in was.items() if k != "re"}):
                                  if now < round_day(w, r, s["size"]) + (i + 1) * HOUR: early = "an hour recorded before it ended (round %d hour %d)" % (r + 1, i); break
                                  if "re" in h: early = "an hour marked re-read in the run that recorded it (round %d hour %d)" % (r + 1, i); break
                          if early: break
                      if early: problems.append(f + ": " + early); continue
                  st = j["staked"]
                  if st is not None and (old is None or old.get("staked") is None) and now < week_start(w): problems.append(f + ": stakes read before the week started"); continue
                  if st is not None and "held" in st and not (old and type(old.get("staked")) is dict and "held" in old["staked"]) and now < week_start(w + 1): problems.append(f + ": end-of-week stakes read before the week ended"); continue
                  if j["status"] == "final" and not (old and old.get("status") == "final"):
                      if now < week_start(w + 1): problems.append(f + ": final before Monday 00:00 UTC after the week (the review day)"); continue
                      # fix-check 2 R-1: a week the owner has opened for correction never goes final (nor gets a vault file) until
                      # the release is cleared, so every replaced item is read again by a run outside the release first
                      if rel: problems.append(f + ": final while BRACKET_RELEASE names it (fix-check 2 R-1)"); continue
                      if j.get("vault") == "missed":
                          if now < week_start(w + 1) + VAULT_DAYS: problems.append(f + ": closed as missed before its backstop"); continue
                      # fix-check F1: the end-of-week stakes a final week pays from were published by an EARLIER run, unchanged
                      elif not (old and same(old.get("staked"), j["staked"])): problems.append(f + ": final with end-of-week stakes no earlier run published (the two-run rule, fix-check F1)"); continue
                      # #B-15 B15-2: likewise every hour's and the picks' re-read mark must already be in the PUBLISHED copy:
                      # the run that confirms an item (e.g. one replaced under a release just cleared) never also closes the week
                      elif not (all(type(h) is dict and h.get("re") == 1 for dd in (old.get("days") or [[None]]) for h in dd) and type(old.get("picks")) is dict and old["picks"].get("re") == 1):
                          problems.append(f + ": final in the run that re-reads its hours or picks (the published copy must already carry every re mark; #B-15 B15-2)"); continue
              # fix-check 2 S-1: a week file that fails is held on its own (with its vault file and the board), never every
              # Bracket file: another week's final and vault file are still judged and published
              bad_weeks = {}
              for p_ in problems:
                  m_ = re.match(r"(W([0-9]{3})\.json): ", p_)
                  if m_ and m_.group(1) not in bad_weeks: bad_weeks[m_.group(1)] = p_
              problems = [p_ for p_ in problems if not re.match(r"W[0-9]{3}\.json: ", p_)]
              for f_ in bad_weeks: weeks_in.pop(int(f_[1:4]), None)
              # ── index: only weeks with their file, only last, this or next week when new; none lost (H-3) ──
              ni = load(os.path.join(d, "index.json")) if os.path.isfile(os.path.join(d, "index.json")) else None
              pi = pubjson("index.json")
              if ni is not None:
                  if not (type(ni) is dict and set(ni) == {"v", "updated", "weeks", "contract", "game", "prizesFromWeek"} and one(ni["v"]) and iso.fullmatch(str(ni["updated"]))): problems.append("index.json: shape")
                  elif not (type(ni["weeks"]) is list and len(ni["weeks"]) <= 10000 and all(type(w) is int and 0 <= w < 10000 for w in ni["weeks"]) and sorted_unique(ni["weeks"])): problems.append("index.json: weeks")
                  elif not ((type(ni["game"]) is int and ni["game"] == 9) and (ni["prizesFromWeek"] is None or nat(ni["prizesFromWeek"])) and (ni["contract"] is None or isa(ni["contract"]))): problems.append("index.json: fields")
                  else:
                      pw = set(pi["weeks"]) if type(pi) is dict and type(pi.get("weeks")) is list else set()
                      lost = [w for w in pw if w not in ni["weeks"]]
                      if lost: problems.append("index.json: published weeks " + ", ".join(str(w) for w in sorted(lost)[:10]) + " are missing")
                      for w in ni["weeks"]:
                          if w in pw: continue
                          if not (cw - 1 <= w <= cw + 1): problems.append("index.json: a new week %d that isn't last, this or next week" % w); break
                          if w not in weeks_in: problems.append("index.json: a new week %d without its file" % w); break
              # ── board ──
              bp = os.path.join(d, "board.json")
              if os.path.isfile(bp):
                  j = load(bp)
                  if not (type(j) is dict and set(j) == {"v", "updated", "next", "week", "lastWeek", "allTime"} and one(j["v"]) and iso.fullmatch(str(j["updated"]))
                          and view_ok(j["next"]) and view_ok(j["week"]) and (j["lastWeek"] is None or view_ok(j["lastWeek"], True))
                          and type(j["allTime"]) is dict and set(j["allTime"]) == {"rows"} and rows_ok(j["allTime"]["rows"])): problems.append("board.json: shape")
              for f in os.listdir(d):
                  if f not in ("vault", "board.json", "index.json") and not re.fullmatch(r"W[0-9]{3}\.json", f): problems.append(f + ": an unexpected file")
              if problems: return "; ".join((problems + list(bad_weeks.values()))[:5])
              for f_, why_ in bad_weeks.items(): hold("bracket/" + f_, why_, True)
              if bad_weeks and os.path.isfile(bp): hold("bracket/board.json", "a week file was held this run (" + ", ".join(sorted(bad_weeks)) + ")", True)
              # ── the Vault files (every week file they could come from passed) ──
              vdir = os.path.join(d, "vault")
              for f in (sorted(os.listdir(vdir)) if os.path.isdir(vdir) else []):
                  name = "bracket/vault/" + f; j = load(os.path.join(vdir, f))
                  pv = pubjson("vault/" + f)
                  if pv is not None and same(j, pv): continue            # #E-3 L-6: already published, unchanged: nothing to judge
                  if not vault_shape(j, f): hold(name, "not the vault file's shape", True); continue
                  w = j["week"]; end = week_start(w + 1)
                  if "W%03d.json" % w in bad_weeks: hold(name, "its week file was held this run", True); continue
                  if now < end or now > end + VAULT_DAYS: hold(name, "outside its window (after the week ends, until Thursday 00:00 UTC), by this job's clock", True); continue
                  src = weeks_in.get(w)
                  if not (src and src["status"] == "final"): src = pubjson("W%03d.json" % w)
                  if type(src) is not dict or src.get("status") != "final" or week_ok(src, "W%03d.json" % w) is not None or src["staked"] is None or "held" not in src["staked"]: hold(name, "its week isn't final yet", False); continue
                  if src.get("vault") == "missed": hold(name, "the week closed without the Vault's stakes", True); continue
                  if not same(j, expected_vault(src)): hold(name, "it isn't what the final week gives (rows, first or second)", True); continue
              return None

          def deepest(e):
              t = e.__traceback__
              while t and t.tb_next: t = t.tb_next
              return t.tb_lineno if t else "?"
          try:
              why = main()
              if why: hold_all(why)
          except Exception as e:
              hold_all("the check could not read this run's files (%s: %s, line %s)" % (type(e).__name__, str(e)[:200], deepest(e)))
          if heldf: open(heldf, "a").write("".join(x + "\n" for x in held))
          elif held: sys.exit("held: " + ", ".join(x for x in held if x != "!alert"))
          print("bracket check done:", d, "(held %d)" % len([x for x in held if x != "!alert"]))
          PY
          fi
          # Daily Questions (game 1): the published files, then its own checks (they append to the same held list).
          mkdir -p "$PUB/questions/vault"
          if [ -n "$parent" ]; then
            { git ls-tree --name-only "$parent:questions" 2>/dev/null || true; } | while IFS= read -r f; do
              # A file that can't be read is left out (|| rm), so only Daily Questions is affected, never Block X (C11-6).
              if [[ "$f" =~ ^(board|W[0-9]{3})\.json$ ]]; then git show "$parent:questions/$f" > "$PUB/questions/$f" || rm -f "$PUB/questions/$f"; fi
            done
            { git ls-tree --name-only "$parent:questions/vault" 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^((HOLD-|RELEASE-)?W[0-9]+)\.json$ ]]; then git show "$parent:questions/vault/$f" > "$PUB/questions/vault/$f" || rm -f "$PUB/questions/vault/$f"; fi
            done
          fi
          /usr/bin/python3 - "$IN/questions" "$PUB/questions" "$HELD" <<'PY'
          # Daily Questions (game 1) publish checks (RECORDER_STANDARD §3, §4, §6): judged against the PUBLISHED branch and this
          # job's own clock, never against this run's own files. A file that fails is HELD (not published) and the rest of the
          # run, Block X included, still publishes. Any failure that isn't just "not yet" fails the job at the end (an email).
          # The points are recomputed here from the published inputs with this job's own copy of games/questions/math.js
          # (games/questions/tests/math.test.mjs and tests/audit/questions-publish.test.ts run both over thousands of random weeks).
          import hashlib, json, os, re, sys, time
          d, pub, heldf = sys.argv[1], sys.argv[2], sys.argv[3]
          GENESIS = 1792368000000; WEEK = 7 * 86400000; DAY = 86400000; HOUR = 3600000; VOID = 1000; MAXP = 10
          now = int(os.environ.get("CHECK_NOW_MS") or time.time() * 1000); cw = (now - GENESIS) // WEEK
          addr = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}"); digits = re.compile(r"0|[1-9][0-9]{0,30}")
          isaddr = lambda v: type(v) is str and addr.fullmatch(v) is not None
          nat = lambda x: type(x) is int and 0 <= x <= 2**53 - 1
          held = []
          def hold(name, why, alert):
              held.append(name); print(("::error::" if alert else "::notice::") + "held, not published: questions/" + name + ": " + why)
              if alert: held.append("!alert")
          def load(path):
              return json.load(open(path, encoding="utf-8")) if os.path.isfile(path) else None
          def pubjson(name): return load(os.path.join(pub, name))
          def injson(name): return load(os.path.join(d, name))

          def week_ok(j, f):
              if type(j) is not dict or set(j) != {"v", "game", "week", "start", "end", "min", "final", "seen", "questions", "players"}: return False
              if not (type(j["v"]) is int and j["v"] == 1 and type(j["game"]) is int and j["game"] == 1 and nat(j["week"]) and f == "W%03d.json" % j["week"]): return False
              if j["start"] != GENESIS + j["week"] * WEEK or j["end"] != j["start"] + WEEK or type(j["final"]) is not bool: return False
              if type(j["min"]) is not str or not digits.fullmatch(j["min"]): return False
              s = j["seen"]
              if type(s) is not dict or set(s) != {"hash", "at"} or type(s["hash"]) is not str or not re.fullmatch(r"[0-9a-f]{64}", s["hash"]) or not nat(s["at"]): return False
              q = j["questions"]
              if type(q) is not list or len(q) > 400 or not all(type(x) is list and len(x) == 3 and all(nat(v) for v in x) for x in q): return False
              ids = [x[0] for x in q]
              if ids != sorted(set(ids)): return False
              p = j["players"]
              if type(p) is not list or len(p) > 20000: return False
              for x in p:
                  if not (type(x) is list and len(x) == 5 and isaddr(x[0]) and type(x[1]) is str and digits.fullmatch(x[1]) and type(x[2]) is str and digits.fullmatch(x[2])
                          and type(x[3]) is int and x[3] in (0, 1) and type(x[4]) is list and 0 < len(x[4]) <= 400
                          and all(type(a) is list and len(a) == 2 and nat(a[0]) and nat(a[1]) for a in x[4])): return False
              names = [x[0] for x in p]
              return names == sorted(set(names))

          def shash(j):
              return hashlib.sha256(json.dumps([j["week"], j["min"], j["questions"], j["players"]], separators=(",", ":")).encode()).hexdigest()

          def score(j):
              """games/questions/math.js scoreWeek, ported."""
              sunday = j["start"] + 6 * DAY
              out = {}; complete = True
              for qid, outcome, lock in j["questions"]:
                  counts = lock <= sunday
                  if counts and outcome == 0: complete = False
                  out[qid] = (outcome, counts, lock)
              mn = int(j["min"]); rows = []; missing = set()
              for a, st, pk, vd, ans in j["players"]:
                  pts = cnt = score_at = 0
                  for qid, opt in ans:
                      q = out.get(qid)
                      if q is None: missing.add(qid); continue
                      if vd or not q[1] or q[0] == VOID or q[0] == 0: continue
                      cnt += 1
                      if q[0] == opt + 1:
                          pts += 1
                          if q[2] > score_at: score_at = q[2]
                  stake = 0 if vd else int(st); peak = max(int(pk), stake)
                  ok = not vd and cnt >= 2 and pts >= 1
                  staked = ok and stake > 0 and stake >= mn
                  free = ok and peak < mn
                  rows.append({"a": a, "pts": pts, "counted": cnt, "answers": len(ans), "scoreAt": score_at, "staked": staked, "free": free, "ranked": staked, "board": "staked" if peak >= mn and not vd else "free", "place": 0})
              for b in ("staked", "free"):
                  xs = [r for r in rows if r["board"] == b]
                  for r in xs: r["place"] = 1 + sum(1 for o in xs if o["pts"] > r["pts"])
              rows.sort(key=lambda r: (0 if r["board"] == "staked" else 1, -r["pts"], r["a"]))
              vrows = [{"player": r["a"], "points": r["pts"]} for r in rows if r["staked"]]
              fr = [r for r in rows if r["free"]]
              best = max([r["pts"] for r in fr], default=0)
              # Up to 10 per place; past 10, the 10 with the earlier score time, then address (owner, 5 Nov). Never zero for the cap.
              pick = lambda xs: sorted(r["a"] for r in sorted(xs, key=lambda r: (r["scoreAt"], r["a"]))[:MAXP])
              tied_first = [r for r in fr if r["pts"] == best and best > 0]
              first = pick(tied_first)
              rest = [r for r in fr if r["pts"] < best]
              nxt = max([r["pts"] for r in rest], default=0)
              second = pick([r for r in rest if r["pts"] == nxt and nxt > 0]) if len(tied_first) == 1 else []
              prizes = [{"player": p, "place": 1} for p in first] + [{"player": p, "place": 2} for p in second]
              return {"complete": complete, "missing": sorted(missing), "rows": rows, "vault": {"rows": vrows, "first": first, "second": second}, "prizes": prizes}

          def board_of(j, r, updated):
              return {"v": 1, "updated": updated, "lastWeek": {"week": j["week"], "start": j["start"], "final": j["final"], "complete": r["complete"],
                  "rows": [{"a": x["a"], "board": x["board"], "place": x["place"], "pts": x["pts"], "points": x["pts"], "counted": x["counted"], "answers": x["answers"], "ranked": x["ranked"]} for x in r["rows"]],
                  "prizes": r["prizes"]}}

          files = sorted(os.listdir(d)) if os.path.isdir(d) else []
          vfiles = sorted(os.listdir(os.path.join(d, "vault"))) if os.path.isdir(os.path.join(d, "vault")) else []
          try:
              weeks = {}   # week -> (file name, the week file this run would leave published)
              heldweeks = set()   # weeks whose incoming week file is held this run
              for f in files:
                  if not re.fullmatch(r"W[0-9]{3}\.json", f): continue
                  j = injson(f); old = pubjson(f)
                  if not week_ok(j, f): hold(f, "not the week file's shape", True); continue
                  if j["seen"]["hash"] != shash(j): hold(f, "its hash isn't its content's", True); continue
                  w = j["week"]; heldweeks.add(w)
                  if old is not None and type(old) is dict and old.get("final") is True:
                      if json.dumps(old, sort_keys=True) != json.dumps(j, sort_keys=True): hold(f, "it changes a published final week", True)
                      if json.dumps(old, sort_keys=True) == json.dumps(j, sort_keys=True): heldweeks.discard(w)
                      weeks[w] = (f, old); continue
                  if w != cw - 1 or now < j["end"]: hold(f, "not the week that just ended, by this job's clock", True); continue
                  if now > j["end"] + 3 * DAY: hold(f, "past the vault's 3 days for that week", True); continue
                  r = score(j)
                  if r["missing"]: hold(f, "answers to questions it doesn't list: " + ", ".join(str(x) for x in r["missing"][:10]), True); continue
                  if j["seen"]["at"] > now + 10 * 60000: hold(f, "seen in the future by this job's clock", True); continue
                  if j["final"]:
                      # Final only after an earlier PUBLISHED run saw the same snapshot at least an hour before, by this job's clock.
                      if not r["complete"]: hold(f, "final while questions are still unresolved", True); continue
                      if not (type(old) is dict and type(old.get("seen")) is dict and old["seen"].get("hash") == j["seen"]["hash"] and old["seen"].get("at") == j["seen"]["at"]):
                          hold(f, "final without an earlier published run of the same snapshot", True); continue
                      if now - j["seen"]["at"] < HOUR: hold(f, "final less than an hour after its snapshot was first seen", False); continue
                  weeks[w] = (f, j); heldweeks.discard(w)
              b = injson("board.json") if "board.json" in files else None
              if b is not None:
                  lw = b.get("lastWeek") if type(b) is dict else None
                  w = lw.get("week") if type(lw) is dict else None
                  src = weeks.get(w, (None, None))[1] if type(w) is int else None
                  if src is None and type(w) is int: src = pubjson("W%03d.json" % w)
                  if type(b) is not dict or set(b) != {"v", "updated", "lastWeek"} or type(b["updated"]) is not str or not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z", b["updated"]):
                      hold("board.json", "not the board's shape", True)
                  elif type(w) is int and w in heldweeks:
                      hold("board.json", "its week file is held this run", False)
                  elif src is None or not week_ok(src, "W%03d.json" % w):
                      hold("board.json", "its week has no week file (published or in this run)", True)
                  elif json.dumps(board_of(src, score(src), b["updated"]), sort_keys=True) != json.dumps(b, sort_keys=True):
                      hold("board.json", "its rows aren't the ones recomputed from the week file", True)
              for f in vfiles:
                  name = "vault/" + f; j = injson(name)
                  m = re.fullmatch(r"(HOLD-|RELEASE-)?W([0-9]+)\.json", f)
                  if not m or type(j) is not dict: hold(name, "not a vault file", True); continue
                  w = int(m.group(2))
                  if m.group(1) == "HOLD-":
                      if set(j) != {"game", "week", "reason"} or j["game"] != 1 or type(j["game"]) is not int or j["week"] != w or type(j["week"]) is not int or type(j["reason"]) is not str or len(j["reason"]) > 200: hold(name, "not a HOLD file's shape", True)
                      continue
                  if m.group(1) == "RELEASE-":
                      if set(j) != {"game", "week"} or j["game"] != 1 or type(j["game"]) is not int or j["week"] != w or type(j["week"]) is not int: hold(name, "not a RELEASE file's shape", True)
                      elif pubjson("vault/HOLD-W%d.json" % w) is None and ("HOLD-W%d.json" % w) not in vfiles: hold(name, "releases a week that has no HOLD file", True)
                      continue
                  src = weeks.get(w, (None, None))[1]
                  if src is None:
                      pw = pubjson("W%03d.json" % w)
                      src = pw if type(pw) is dict and pw.get("final") is True and week_ok(pw, "W%03d.json" % w) else None
                  end = GENESIS + (w + 1) * WEEK
                  if not (end <= now <= end + 3 * DAY): hold(name, "not inside the vault's 3 days for that week, by this job's clock", True); continue
                  if src is None or src.get("final") is not True: hold(name, "its week isn't final (published or in this run)", False); continue
                  r = score(src)
                  want = {"game": 1, "week": w, "final": True, "rows": r["vault"]["rows"], "first": r["vault"]["first"], "second": r["vault"]["second"]}
                  if json.dumps(want, sort_keys=True) != json.dumps(j, sort_keys=True): hold(name, "its rows or winners aren't the ones recomputed from the final week file", True)
          except Exception as e:
              # Never let one game's bad file stop the job: hold all of Daily Questions' files this run, with an alert.
              print("::error::Daily Questions' files couldn't be checked (" + type(e).__name__ + ": " + str(e)[:200] + "): none published this run")
              held += [f for f in files if f.endswith(".json")] + ["vault/" + f for f in vfiles] + ["!alert"]
          open(heldf, "a").write("".join(("questions/" + x if x != "!alert" else x) + "\n" for x in held))
          print("questions files checked:", d, "held:", len([x for x in held if x != "!alert"]))
          PY
          shopt -s nullglob
          for f in "$IN"/blockx/*.json "$IN"/blockx/vault/*.json "$IN"/bracket/*.json "$IN"/bracket/vault/*.json "$IN"/questions/*.json "$IN"/questions/vault/*.json; do
            name="${f#"$IN"/}"
            # Audit BX-5: a final week's prize file (P###.json), and the Vault's results file (vault/W<week>.json), are
            # written once and never replaced.
            if grep -qxF "$name" "$HELD"; then continue; fi
            # Daily Questions: its HOLD and RELEASE files are only ever added (its vault files match the line below, and its
            # final week files are checked above).
            if [[ "$name" =~ ^questions/vault/(HOLD|RELEASE)-W[0-9]+\.json$ ]] && git cat-file -e ":$name" 2>/dev/null; then continue; fi
            if [[ "$name" =~ (/P[0-9]{3}|/vault/W[0-9]+)\.json$ ]] && git cat-file -e ":$name" 2>/dev/null; then
              # Audit BX-81: a write-once file that differs from the published one is held (with an error, failing the job
              # at the end), never replaced; everything else is still published.
              if [ "$(git hash-object "$f")" != "$(git rev-parse ":$name")" ]; then echo "::error::$name differs from the published file: not replaced."; echo '!alert' >> "$HELD"; fi
              continue
            fi
            blob=$(git hash-object -w "$f")
            git update-index --add --cacheinfo 100644 "$blob" "$name"
          done
          tree=$(git write-tree)
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then echo "No changes."
          else
            export GIT_AUTHOR_NAME=kpred-bot GIT_AUTHOR_EMAIL=kpred-bot@users.noreply.github.com GIT_COMMITTER_NAME=kpred-bot GIT_COMMITTER_EMAIL=kpred-bot@users.noreply.github.com
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "games: record")
            git push -q "$remote" "$commit:refs/heads/games-data"
          fi
          if grep -qxF '!alert' "$HELD"; then echo "::error::A file was held, or a published file needs your check (see the errors above); everything else was published."; exit 1; fi
          echo "Games files published."

  # Repo Lens E4-7: a held week fails the run (so GitHub emails the owner), but only after publishing, so the hour's
  # files still go out. Runs no repository code and needs no permissions.
  alert:
    needs: [record, record_bracket, publish]
    if: ${{ always() && (needs.record.outputs.held == 'true' || needs.record_bracket.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: A week is held, or a recorder failed
        env:
          BLOCKX_HELD: ${{ needs.record.outputs.held }}
          BRACKET_FAILED: ${{ needs.record_bracket.result == 'failure' }}
        run: |
          if [ "$BLOCKX_HELD" = "true" ]; then echo "::error::Block X held a week before its prize list (see the record job's errors). Nothing is paid for it until a run reads the whole week the same."; fi
          if [ "$BRACKET_FAILED" = "true" ]; then echo "::error::The Producer Bracket recorder failed this run (see the record_bracket job). Its files stay as they were; the next run tries again. Block X was still published."; fi
          exit 1

  # Daily Questions (game 1): its recorder failed this run (RECORDER_STANDARD §6.5). Fails the run after publishing, so
  # the owner is emailed and Block X's files still went out. Runs no repository code and needs no permissions.
  questions-alert:
    needs: [record, publish]
    if: ${{ always() && needs.record.outputs.questions == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: The Daily Questions recorder failed
        run: |
          echo "::error::The Daily Questions recorder failed this run (see the record job's 'Record Daily Questions' step). Nothing of it was published; the next run tries again."
          exit 1
