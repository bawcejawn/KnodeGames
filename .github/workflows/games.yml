                  if type(r) is not dict or set(r) != {"rounds", "done"} or type(r["done"]) is not bool or type(r["rounds"]) is not list or len(r["rounds"]) > R: return "results"
                  if not all(type(x) is list and len(x) == s["size"] // 2 ** (i + 1) and all(type(v) is int and 1 <= v <= len(seeds) for v in x) for i, x in enumerate(r["rounds"])): return "results rounds"
                  if not (type(pts) is list and len(pts) == len(pk["rows"]) and all(type(x) is list and len(x) == 4 and x[0] == pk["rows"][i][0] and nat(x[1]) and x[1] <= 82 and type(x[2]) is int and x[2] in (0, 1) and nat(x[3]) and x[3] <= 31 for i, x in enumerate(pts))): return "points rows"
                  # H-2: results and points follow from the seeding, the hours and the checked picks
