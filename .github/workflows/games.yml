                  if m_ and m_.group(1) not in bad_weeks: bad_weeks[m_.group(1)] = p_
              problems = [p_ for p_ in problems if not re.match(r"W[0-9]{3}\.json: ", p_)]
              for f_ in bad_weeks: weeks_in.pop(int(f_[1:4]), None)
              # ── index: only weeks with their file, only last, this or next week when new; none lost (H-3) ──
              ni = load(os.path.join(d, "index.json")) if os.path.isfile(os.path.join(d, "index.json")) else None
              pi = pubjson("index.json")
              if ni is not None:
                  if not (type(ni) is dict and set(ni) in ({"v", "updated", "weeks", "contract", "game", "prizesFromWeek"}, {"v", "updated", "weeks", "contract", "game", "prizesFromWeek", "rulerFrom"}) and one(ni["v"]) and iso.fullmatch(str(ni["updated"]))
                          and ni.get("rulerFrom") == RULER_VAR): problems.append("index.json: shape")
                  elif not (type(ni["weeks"]) is list and len(ni["weeks"]) <= 10000 and all(type(w) is int and 0 <= w < 10000 for w in ni["weeks"]) and sorted_unique(ni["weeks"])): problems.append("index.json: weeks")
                  elif not ((type(ni["game"]) is int and ni["game"] == 9) and (ni["prizesFromWeek"] is None or nat(ni["prizesFromWeek"])) and (ni["contract"] is None or isa(ni["contract"]))): problems.append("index.json: fields")
                  else:
                      pw = set(pi["weeks"]) if type(pi) is dict and type(pi.get("weeks")) is list else set()
                      lost = [w for w in pw if w not in ni["weeks"]]
                      if lost: problems.append("index.json: published weeks " + ", ".join(str(w) for w in sorted(lost)[:10]) + " are missing")
                      for w in ni["weeks"]:
                          if w in pw: continue
                          if not (cw - 1 <= w <= cw + 1): problems.append("index.json: a new week %d that isn't last, this or next week" % w); break
                          if w not in weeks_in: problems.append("index.json: a new week %d without its file" % w); break
              # ── board ──
              bp = os.path.join(d, "board.json")
              if os.path.isfile(bp):
                  j = load(bp)
                  if not (type(j) is dict and set(j) == {"v", "updated", "next", "week", "lastWeek", "allTime"} and one(j["v"]) and iso.fullmatch(str(j["updated"]))
                          and view_ok(j["next"]) and view_ok(j["week"]) and (j["lastWeek"] is None or view_ok(j["lastWeek"], True))
                          and type(j["allTime"]) is dict and set(j["allTime"]) == {"rows"} and rows_ok(j["allTime"]["rows"])): problems.append("board.json: shape")
              for f in os.listdir(d):
                  if f not in ("vault", "ruler", "board.json", "index.json") and not re.fullmatch(r"W[0-9]{3}\.json", f): problems.append(f + ": an unexpected file")
              if problems: return "; ".join((problems + list(bad_weeks.values()))[:5])
              for f_, why_ in bad_weeks.items(): hold("bracket/" + f_, why_, True)
              # ── R-BR-7: the ruler's day cards and shadow summaries (phase 1: shown only, never scored or paid). A file that
              # fails is held on its own; the week, its vault file and the board are judged without it. ──
              rdir = os.path.join(d, "ruler")
              for f in (sorted(os.listdir(rdir)) if os.path.isdir(rdir) else []):
                  # the week file a ruler file belongs to: this run's when it passed, else the published copy
                  why = ruler_file_problem(f, os.path.join(rdir, f), os.path.join(pub, "ruler", f), lambda w: weeks_in[w] if w in weeks_in else pubjson("W%03d.json" % w))
                  if why: hold("bracket/ruler/" + f, why, True)
              if bad_weeks and os.path.isfile(bp): hold("bracket/board.json", "a week file was held this run (" + ", ".join(sorted(bad_weeks)) + ")", True)
              # ── the Vault files (every week file they could come from passed) ──
              vdir = os.path.join(d, "vault")
              for f in (sorted(os.listdir(vdir)) if os.path.isdir(vdir) else []):
                  name = "bracket/vault/" + f; j = load(os.path.join(vdir, f))
                  pv = pubjson("vault/" + f)
                  if pv is not None and same(j, pv): continue            # #E-3 L-6: already published, unchanged: nothing to judge
                  if not vault_shape(j, f): hold(name, "not the vault file's shape", True); continue
                  w = j["week"]; end = week_start(w + 1)
                  if "W%03d.json" % w in bad_weeks: hold(name, "its week file was held this run", True); continue
                  if now < end or now > end + VAULT_DAYS: hold(name, "outside its window (after the week ends, until Thursday 00:00 UTC), by this job's clock", True); continue
                  src = weeks_in.get(w)
                  if not (src and src["status"] == "final"): src = pubjson("W%03d.json" % w)
                  if type(src) is not dict or src.get("status") != "final" or week_ok(src, "W%03d.json" % w) is not None or src["staked"] is None or "held" not in src["staked"]: hold(name, "its week isn't final yet", False); continue
                  if src.get("vault") == "missed": hold(name, "the week closed without the Vault's stakes", True); continue
                  if not same(j, expected_vault(src)): hold(name, "it isn't what the final week gives (rows, first or second)", True); continue
              return None

          def deepest(e):
              t = e.__traceback__
              while t and t.tb_next: t = t.tb_next
              return t.tb_lineno if t else "?"
          try:
              why = main()
              if why: hold_all(why)
          except Exception as e:
              hold_all("the check could not read this run's files (%s: %s, line %s)" % (type(e).__name__, str(e)[:200], deepest(e)))
          for m in RULER_ALERT:   # Repo Lens #G-20 G20-2: loud (an email); the files themselves are judged as above
              print("::error::Producer Bracket: " + m)
              if "!alert" not in held: held.append("!alert")
          if heldf: open(heldf, "a").write("".join(x + "\n" for x in held))
          elif held: sys.exit("held: " + ", ".join(x for x in held if x != "!alert"))
          print("bracket check done:", d, "(held %d)" % len([x for x in held if x != "!alert"]))
          PY
          fi
          # Daily Questions (game 1): the published files, then its own checks (they append to the same held list).
          mkdir -p "$PUB/questions/vault"
          if [ -n "$parent" ]; then
            { git ls-tree --name-only "$parent:questions" 2>/dev/null || true; } | while IFS= read -r f; do
              # A file that can't be read is left out (|| rm), so only Daily Questions is affected, never Block X (C11-6).
              if [[ "$f" =~ ^(board|W[0-9]{3})\.json$ ]]; then git show "$parent:questions/$f" > "$PUB/questions/$f" || rm -f "$PUB/questions/$f"; fi
            done
            { git ls-tree --name-only "$parent:questions/vault" 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^((HOLD-|RELEASE-)?W[0-9]+)\.json$ ]]; then git show "$parent:questions/vault/$f" > "$PUB/questions/vault/$f" || rm -f "$PUB/questions/vault/$f"; fi
            done
          fi
          /usr/bin/python3 - "$IN/questions" "$PUB/questions" "$HELD" <<'PY'
          # Daily Questions (game 1) publish checks (RECORDER_STANDARD §3, §4, §6): judged against the PUBLISHED branch and this
          # job's own clock, never against this run's own files. A file that fails is HELD (not published) and the rest of the
          # run, Block X included, still publishes. Any failure that isn't just "not yet" fails the job at the end (an email).
          # The points are recomputed here from the published inputs with this job's own copy of games/questions/math.js
          # (games/questions/tests/math.test.mjs and tests/audit/questions-publish.test.ts run both over thousands of random weeks).
          import hashlib, json, os, re, sys, time
          d, pub, heldf = sys.argv[1], sys.argv[2], sys.argv[3]
          GENESIS = 1792368000000; WEEK = 7 * 86400000; DAY = 86400000; HOUR = 3600000; VOID = 1000; MAXP = 10
          now = int(os.environ.get("CHECK_NOW_MS") or time.time() * 1000); cw = (now - GENESIS) // WEEK
          addr = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}"); digits = re.compile(r"0|[1-9][0-9]{0,30}")
          isaddr = lambda v: type(v) is str and addr.fullmatch(v) is not None
          nat = lambda x: type(x) is int and 0 <= x <= 2**53 - 1
          held = []
          def hold(name, why, alert):
              held.append(name); print(("::error::" if alert else "::notice::") + "held, not published: questions/" + name + ": " + why)
              if alert: held.append("!alert")
          def load(path):
              return json.load(open(path, encoding="utf-8")) if os.path.isfile(path) else None
          def pubjson(name): return load(os.path.join(pub, name))
          def injson(name): return load(os.path.join(d, name))

          def week_ok(j, f):
              if type(j) is not dict or set(j) != {"v", "game", "week", "start", "end", "min", "final", "seen", "questions", "players"}: return False
              if not (type(j["v"]) is int and j["v"] == 1 and type(j["game"]) is int and j["game"] == 1 and nat(j["week"]) and f == "W%03d.json" % j["week"]): return False
              if j["start"] != GENESIS + j["week"] * WEEK or j["end"] != j["start"] + WEEK or type(j["final"]) is not bool: return False
              if type(j["min"]) is not str or not digits.fullmatch(j["min"]): return False
              s = j["seen"]
              if type(s) is not dict or set(s) != {"hash", "at"} or type(s["hash"]) is not str or not re.fullmatch(r"[0-9a-f]{64}", s["hash"]) or not nat(s["at"]): return False
              q = j["questions"]
              if type(q) is not list or len(q) > 400 or not all(type(x) is list and len(x) == 3 and all(nat(v) for v in x) for x in q): return False
              ids = [x[0] for x in q]
              if ids != sorted(set(ids)): return False
              p = j["players"]
              if type(p) is not list or len(p) > 20000: return False
              for x in p:
                  if not (type(x) is list and len(x) == 5 and isaddr(x[0]) and type(x[1]) is str and digits.fullmatch(x[1]) and type(x[2]) is str and digits.fullmatch(x[2])
                          and type(x[3]) is int and x[3] in (0, 1) and type(x[4]) is list and 0 < len(x[4]) <= 400
                          and all(type(a) is list and len(a) == 2 and nat(a[0]) and nat(a[1]) for a in x[4])): return False
              names = [x[0] for x in p]
              return names == sorted(set(names))

          def shash(j):
              return hashlib.sha256(json.dumps([j["week"], j["min"], j["questions"], j["players"]], separators=(",", ":")).encode()).hexdigest()

          def score(j):
              """games/questions/math.js scoreWeek, ported."""
              sunday = j["start"] + 6 * DAY
              out = {}; complete = True
              for qid, outcome, lock in j["questions"]:
                  counts = lock <= sunday
                  if counts and outcome == 0: complete = False
                  out[qid] = (outcome, counts, lock)
              mn = int(j["min"]); rows = []; missing = set()
              for a, st, pk, vd, ans in j["players"]:
                  pts = cnt = score_at = 0
                  for qid, opt in ans:
                      q = out.get(qid)
                      if q is None: missing.add(qid); continue
                      if vd or not q[1] or q[0] == VOID or q[0] == 0: continue
                      cnt += 1
                      if q[0] == opt + 1:
                          pts += 1
                          if q[2] > score_at: score_at = q[2]
                  stake = 0 if vd else int(st); peak = max(int(pk), stake)
                  ok = not vd and cnt >= 2 and pts >= 1
                  staked = ok and stake > 0 and stake >= mn
                  free = ok and peak < mn
                  rows.append({"a": a, "pts": pts, "counted": cnt, "answers": len(ans), "scoreAt": score_at, "staked": staked, "free": free, "ranked": staked, "board": "staked" if peak >= mn and not vd else "free", "place": 0})
              for b in ("staked", "free"):
                  xs = [r for r in rows if r["board"] == b]
                  for r in xs: r["place"] = 1 + sum(1 for o in xs if o["pts"] > r["pts"])
              rows.sort(key=lambda r: (0 if r["board"] == "staked" else 1, -r["pts"], r["a"]))
              vrows = [{"player": r["a"], "points": r["pts"]} for r in rows if r["staked"]]
              fr = [r for r in rows if r["free"]]
              best = max([r["pts"] for r in fr], default=0)
              # Up to 10 per place; past 10, the 10 with the earlier score time, then address (owner, 5 Nov). Never zero for the cap.
              pick = lambda xs: sorted(r["a"] for r in sorted(xs, key=lambda r: (r["scoreAt"], r["a"]))[:MAXP])
              tied_first = [r for r in fr if r["pts"] == best and best > 0]
              first = pick(tied_first)
              rest = [r for r in fr if r["pts"] < best]
              nxt = max([r["pts"] for r in rest], default=0)
              second = pick([r for r in rest if r["pts"] == nxt and nxt > 0]) if len(tied_first) == 1 else []
              prizes = [{"player": p, "place": 1} for p in first] + [{"player": p, "place": 2} for p in second]
              return {"complete": complete, "missing": sorted(missing), "rows": rows, "vault": {"rows": vrows, "first": first, "second": second}, "prizes": prizes}

          def board_of(j, r, updated):
              return {"v": 1, "updated": updated, "lastWeek": {"week": j["week"], "start": j["start"], "final": j["final"], "complete": r["complete"],
                  "rows": [{"a": x["a"], "board": x["board"], "place": x["place"], "pts": x["pts"], "points": x["pts"], "counted": x["counted"], "answers": x["answers"], "ranked": x["ranked"]} for x in r["rows"]],
                  "prizes": r["prizes"]}}

          files = sorted(os.listdir(d)) if os.path.isdir(d) else []
          vfiles = sorted(os.listdir(os.path.join(d, "vault"))) if os.path.isdir(os.path.join(d, "vault")) else []
          try:
              weeks = {}   # week -> (file name, the week file this run would leave published)
              heldweeks = set()   # weeks whose incoming week file is held this run
              for f in files:
                  if not re.fullmatch(r"W[0-9]{3}\.json", f): continue
                  j = injson(f); old = pubjson(f)
                  if not week_ok(j, f): hold(f, "not the week file's shape", True); continue
                  if j["seen"]["hash"] != shash(j): hold(f, "its hash isn't its content's", True); continue
                  w = j["week"]; heldweeks.add(w)
                  if old is not None and type(old) is dict and old.get("final") is True:
                      if json.dumps(old, sort_keys=True) != json.dumps(j, sort_keys=True): hold(f, "it changes a published final week", True)
                      if json.dumps(old, sort_keys=True) == json.dumps(j, sort_keys=True): heldweeks.discard(w)
                      weeks[w] = (f, old); continue
                  if w != cw - 1 or now < j["end"]: hold(f, "not the week that just ended, by this job's clock", True); continue
                  if now > j["end"] + 3 * DAY: hold(f, "past the vault's 3 days for that week", True); continue
                  r = score(j)
                  if r["missing"]: hold(f, "answers to questions it doesn't list: " + ", ".join(str(x) for x in r["missing"][:10]), True); continue
                  if j["seen"]["at"] > now + 10 * 60000: hold(f, "seen in the future by this job's clock", True); continue
                  if j["final"]:
                      # Final only after an earlier PUBLISHED run saw the same snapshot at least an hour before, by this job's clock.
                      if not r["complete"]: hold(f, "final while questions are still unresolved", True); continue
                      if not (type(old) is dict and type(old.get("seen")) is dict and old["seen"].get("hash") == j["seen"]["hash"] and old["seen"].get("at") == j["seen"]["at"]):
                          hold(f, "final without an earlier published run of the same snapshot", True); continue
                      if now - j["seen"]["at"] < HOUR: hold(f, "final less than an hour after its snapshot was first seen", False); continue
                  weeks[w] = (f, j); heldweeks.discard(w)
              b = injson("board.json") if "board.json" in files else None
              if b is not None:
                  lw = b.get("lastWeek") if type(b) is dict else None
                  w = lw.get("week") if type(lw) is dict else None
                  src = weeks.get(w, (None, None))[1] if type(w) is int else None
                  if src is None and type(w) is int: src = pubjson("W%03d.json" % w)
                  if type(b) is not dict or set(b) != {"v", "updated", "lastWeek"} or type(b["updated"]) is not str or not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z", b["updated"]):
                      hold("board.json", "not the board's shape", True)
                  elif type(w) is int and w in heldweeks:
                      hold("board.json", "its week file is held this run", False)
                  elif src is None or not week_ok(src, "W%03d.json" % w):
                      hold("board.json", "its week has no week file (published or in this run)", True)
                  elif json.dumps(board_of(src, score(src), b["updated"]), sort_keys=True) != json.dumps(b, sort_keys=True):
                      hold("board.json", "its rows aren't the ones recomputed from the week file", True)
              for f in vfiles:
                  name = "vault/" + f; j = injson(name)
                  m = re.fullmatch(r"(HOLD-|RELEASE-)?W([0-9]+)\.json", f)
                  if not m or type(j) is not dict: hold(name, "not a vault file", True); continue
                  w = int(m.group(2))
                  if m.group(1) == "HOLD-":
                      if set(j) != {"game", "week", "reason"} or j["game"] != 1 or type(j["game"]) is not int or j["week"] != w or type(j["week"]) is not int or type(j["reason"]) is not str or len(j["reason"]) > 200: hold(name, "not a HOLD file's shape", True)
                      continue
                  if m.group(1) == "RELEASE-":
                      if set(j) != {"game", "week"} or j["game"] != 1 or type(j["game"]) is not int or j["week"] != w or type(j["week"]) is not int: hold(name, "not a RELEASE file's shape", True)
                      elif pubjson("vault/HOLD-W%d.json" % w) is None and ("HOLD-W%d.json" % w) not in vfiles: hold(name, "releases a week that has no HOLD file", True)
                      continue
                  src = weeks.get(w, (None, None))[1]
                  if src is None:
                      pw = pubjson("W%03d.json" % w)
                      src = pw if type(pw) is dict and pw.get("final") is True and week_ok(pw, "W%03d.json" % w) else None
                  end = GENESIS + (w + 1) * WEEK
                  if not (end <= now <= end + 3 * DAY): hold(name, "not inside the vault's 3 days for that week, by this job's clock", True); continue
                  if src is None or src.get("final") is not True: hold(name, "its week isn't final (published or in this run)", False); continue
                  r = score(src)
                  want = {"game": 1, "week": w, "final": True, "rows": r["vault"]["rows"], "first": r["vault"]["first"], "second": r["vault"]["second"]}
                  if json.dumps(want, sort_keys=True) != json.dumps(j, sort_keys=True): hold(name, "its rows or winners aren't the ones recomputed from the final week file", True)
          except Exception as e:
              # Never let one game's bad file stop the job: hold all of Daily Questions' files this run, with an alert.
              print("::error::Daily Questions' files couldn't be checked (" + type(e).__name__ + ": " + str(e)[:200] + "): none published this run")
              held += [f for f in files if f.endswith(".json")] + ["vault/" + f for f in vfiles] + ["!alert"]
          open(heldf, "a").write("".join(("questions/" + x if x != "!alert" else x) + "\n" for x in held))
          print("questions files checked:", d, "held:", len([x for x in held if x != "!alert"]))
          PY
          shopt -s nullglob
          for f in "$IN"/blockx/*.json "$IN"/blockx/vault/*.json "$IN"/bracket/*.json "$IN"/bracket/vault/*.json "$IN"/bracket/ruler/*.json "$IN"/questions/*.json "$IN"/questions/vault/*.json; do
            name="${f#"$IN"/}"
            # Audit BX-5: a final week's prize file (P###.json), and the Vault's results file (vault/W<week>.json), are
            # written once and never replaced.
            if grep -qxF "$name" "$HELD"; then continue; fi
            # Daily Questions: its HOLD and RELEASE files are only ever added (its vault files match the line below, and its
            # final week files are checked above).
            if [[ "$name" =~ ^questions/vault/(HOLD|RELEASE)-W[0-9]+\.json$ ]] && git cat-file -e ":$name" 2>/dev/null; then continue; fi
            # R-BR-7: the Bracket's ruler day cards (bracket/ruler/W<week>-R<round>.json) are written once too: one that differs
            # from the published card is held with an error, never replaced
            if [[ "$name" =~ ^bracket/ruler/W[0-9]{3}-R[0-4]\.json$ ]] && git cat-file -e ":$name" 2>/dev/null; then
              if [ "$(git hash-object "$f")" != "$(git rev-parse ":$name")" ]; then echo "::error::$name differs from the published ruler card: not replaced."; echo '!alert' >> "$HELD"; fi
              continue
            fi
            if [[ "$name" =~ (/P[0-9]{3}|/vault/W[0-9]+)\.json$ ]] && git cat-file -e ":$name" 2>/dev/null; then
              # Audit BX-81: a write-once file that differs from the published one is held (with an error, failing the job
              # at the end), never replaced; everything else is still published.
              if [ "$(git hash-object "$f")" != "$(git rev-parse ":$name")" ]; then echo "::error::$name differs from the published file: not replaced."; echo '!alert' >> "$HELD"; fi
              continue
            fi
            blob=$(git hash-object -w "$f")
            git update-index --add --cacheinfo 100644 "$blob" "$name"
          done
          tree=$(git write-tree)
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then echo "No changes."
          else
            export GIT_AUTHOR_NAME=kpred-bot GIT_AUTHOR_EMAIL=kpred-bot@users.noreply.github.com GIT_COMMITTER_NAME=kpred-bot GIT_COMMITTER_EMAIL=kpred-bot@users.noreply.github.com
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "games: record")
            git push -q "$remote" "$commit:refs/heads/games-data"
          fi
          if grep -qxF '!alert' "$HELD"; then echo "::error::A file was held, or a published file needs your check (see the errors above); everything else was published."; exit 1; fi
          echo "Games files published."

  # Repo Lens E4-7: a held week fails the run (so GitHub emails the owner), but only after publishing, so the hour's
  # files still go out. Runs no repository code and needs no permissions.
  alert:
    needs: [record, record_bracket, publish]
    if: ${{ always() && (needs.record.outputs.held == 'true' || needs.record_bracket.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: A week is held, or a recorder failed
        env:
          BLOCKX_HELD: ${{ needs.record.outputs.held }}
          BRACKET_FAILED: ${{ needs.record_bracket.result == 'failure' }}
        run: |
          if [ "$BLOCKX_HELD" = "true" ]; then echo "::error::Block X held a week before its prize list (see the record job's errors). Nothing is paid for it until a run reads the whole week the same."; fi
          if [ "$BRACKET_FAILED" = "true" ]; then echo "::error::The Producer Bracket recorder failed this run (see the record_bracket job). Its files stay as they were; the next run tries again. Block X was still published."; fi
          exit 1

  # Daily Questions (game 1): its recorder failed this run (RECORDER_STANDARD §6.5). Fails the run after publishing, so
  # the owner is emailed and Block X's files still went out. Runs no repository code and needs no permissions.
  questions-alert:
    needs: [record, publish]
    if: ${{ always() && needs.record.outputs.questions == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: The Daily Questions recorder failed
        run: |
          echo "::error::The Daily Questions recorder failed this run (see the record job's 'Record Daily Questions' step). Nothing of it was published; the next run tries again."
          exit 1

  # ── BEGIN kit-rendered jobs (tools/kit-render-workflows.mjs; edit kit/, never these lines) ──
  # Games on the Shared Game Kit (.ai/standards/GAME_KIT.md): Fantasy Producers. One record job per game
  # (its own timeout and artifact); each runs only when its own variable is on. The publish job runs no repository code.
  record-fantasy:
    name: "Record Fantasy Producers (kit)"
    if: ${{ vars.FANTASY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      rc: ${{ steps.rec.outputs.rc }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Take fantasy's last files
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/prev"; mkdir -p "$P/vault" "$P/inputs"
          if git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" games-data 2>/dev/null; then
            { git ls-tree --name-only FETCH_HEAD:fantasy 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^(board|alltime|W([0-9]{3}|[1-9][0-9]{3}))\.json$ ]]; then git show "FETCH_HEAD:fantasy/$f" > "$P/$f"; fi
            done
            { git ls-tree --name-only FETCH_HEAD:fantasy/vault 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^((HOLD-|RELEASE-)?W(0|[1-9][0-9]{0,3}))\.json$ ]]; then git show "FETCH_HEAD:fantasy/vault/$f" > "$P/vault/$f"; fi
            done
            { git ls-tree --name-only FETCH_HEAD:fantasy/inputs 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W(0|[1-9][0-9]{0,3})\.json$ ]]; then git show "FETCH_HEAD:fantasy/inputs/$f" > "$P/inputs/$f"; fi
            done
          else
            set +e; git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/games-data >/dev/null 2>&1; rc=$?; set -e
            if [ "$rc" -ne 2 ]; then echo "::error::The games-data branch could not be fetched (git ls-remote exit $rc). Nothing recorded this run."; exit 1; fi
            echo "No games-data branch yet."
          fi
          touch "$P/.fetched"
      - name: Take the ruler's data (vhp-data, read-only)
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/vhp-data"
          if git -C "$RUNNER_TEMP/vhp-data" fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" vhp-data 2>/dev/null; then
            git -C "$RUNNER_TEMP/vhp-data" checkout -q FETCH_HEAD
          else
            echo "::warning::vhp-data couldn't be fetched this run"
          fi
      - name: Record
        id: rec
        # GitHub runs this as bash -e: the recorder's exit code is captured, never fatal, so the files it wrote (a HOLD
        # included) are always uploaded and outputs.rc always carries 0, 1 or 2 (#B-12 NK-1).
        run: |
          set -uo pipefail
          O="$RUNNER_TEMP/out"; rm -rf "$O"; mkdir -p "$O"
          rc=0; npm run kit -- fantasy || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then rm -rf "$O"; mkdir -p "$O"; echo "rc $rc: a stop, nothing uploaded"; fi
        env:
          RPC: ${{ vars.RPC || 'https://koinos.armana.io' }}
          RPC_CHECK: ${{ vars.RPC_CHECK || 'https://api.koinosblocks.com' }}
          KIT_PREV: ${{ runner.temp }}/prev
          KIT_OUT: ${{ runner.temp }}/out
          KIT_VHP_DATA: ${{ runner.temp }}/vhp-data
          # The owner's holds (GAME_KIT.md §3): weeks kept pending, and the one-off release of a held week ("<week>:<code>").
          FANTASY_HOLD_WEEKS: ${{ vars.FANTASY_HOLD_WEEKS }}
          FANTASY_RELEASE: ${{ vars.FANTASY_RELEASE }}
          FANTASY_RESET_FROM_WEEK: ${{ vars.FANTASY_RESET_FROM_WEEK }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.rec.outputs.rc == '0' || steps.rec.outputs.rc == '1' }}
        with:
          name: kit-games-data-fantasy
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: ignore

  publish-kit:
    # After the hand-written publish job (when it runs), so the two never push games-data at the same time.
    needs: [record-fantasy, publish]
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.record-fantasy.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # push the games-data branch (never main)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: kit-games-data-fantasy
          path: ${{ runner.temp }}/incoming/fantasy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Take the ruler's data and code (vhp-data read-only; vhp_ruler.py embedded, no repository code)
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/vhp-data"
          if git -C "$RUNNER_TEMP/vhp-data" fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" vhp-data 2>/dev/null; then
            git -C "$RUNNER_TEMP/vhp-data" checkout -q FETCH_HEAD
          else
            echo "::error::vhp-data couldn't be fetched: ruler games' new files are held this run"
          fi
          mkdir -p "$RUNNER_TEMP/ruler-code" "$RUNNER_TEMP/kit-cards"
          cat > "$RUNNER_TEMP/ruler-code/vhp_ruler.py" <<'KIT_RULER_PY'
          # BEGIN vhp_ruler.py
          """Knode Games — the shared VHP ruler, Python twin of vhp-ruler.js (design .ai/standards/VHP_RULER.md v2, D-111, D-112).

          The publish job runs no repo code (RECORDER_STANDARD §6), so it carries a copy of this file inside the workflow; a test
          keeps the two byte-identical, and another test checks that this file and vhp-ruler.js make byte-identical cards (§8
          sim 11). Pure: standard library only, integers only (no float anywhere). Read vhp-ruler.js for the rules in words.
          """
          import array, bisect, hashlib, json, re

          VHP_CONTRACT = "12Y5vW6gk8GceH53YfRkRre2Rrcsgw7Naq"
          DELAY, ACTIVE, HIGH, AVG, FORM, HISTORY, SEED_AFTER = 20, 7200, 1200, 28800, 403200, 28800, 20
          M = 1000000
          MIN_K, FORM_GATE = 10 * M, 800000
          RULE_VERSION, OWN_RULES, POOL_RULES = 4, ("spot", "high1h", "avg24h"), ("min",)
          RULE_VERSIONS = (4, 5)   # 5: the core judged on [T - 14 d, T - 3 d) (as vhp-ruler.js); a card without version is 4
          STEADY_BAND = 150000   # D-120 as the owner ruled (5 Nov), millionths: steady = every daily rate within this of the 14-day rate
          CORE_LINE = 970000     # D-165: A′'s core is the field members with form ≥ this × the field's median form (millionths)
          BAND_SD = 2            # D-171: an other core member more than this many sd from its share is left out of a yardstick
          SET_ASIDE_EXPECTED = 45500  # D-172: millionths of core member-races a 2-sd band leaves aside by chance
          PCT_SCALE = 1 << 256
          # Rules for every race length (owner, 11 Nov 2026; RULE_VERSION 4), as in vhp-ruler.js: the void band [down, up] by the
          # scoring window's length, and the luck cap (no producer is scored on more than LUCK_CAP expected blocks)
          # the length classes reach a quarter past their nominal length (UTC-clock races hold about, not exactly, 1,200 blocks an hour)
          VOID_BANDS, VOID_LONG = ((3000, 50000, 250000), (9000, 100000, 250000), (36000, 120000, 500000)), (150000, 1000000)
          LUCK_CAP = 1000 * M
          # Scoring modes (owner, 11 Nov 2026), as in vhp-ruler.js: A VHP only; B clear edge and C best day, raise only: the best
          # of 11 one-day stretches over [T - 14 days, T - 3 days), each (signed - sd*isqrt(signed)) / expected (sd 2 in B, 1 in C)
          # against the field's median raw form that day (Repo Lens #G-19); D even odds (luck cap 100). A card without a mode
          # scores exactly as before.
          MODES, MODE_CAP = ("A", "B", "C", "D"), {"A": LUCK_CAP, "B": LUCK_CAP, "C": LUCK_CAP, "D": 100 * M}
          LIFT_SKIP, LIFT_SPAN, STRETCHES, LIFT_SD = 86400, 316800, {"B": 11, "C": 11}, {"B": 2, "C": 1}


          def lift_form(signed, expected, sd=1):
              """A stretch's measure for the lift: (signed - sd*sqrt(signed)) / expected share, millionths, as liftForm in vhp-ruler.js."""
              sm = signed * M
              x = sm - sd * isqrt(sm * M)
              return x * M // expected if expected > 0 and x > 0 else 0


          def void_band(blocks):
              if type(blocks) is not int or blocks < 1:
                  raise ValueError("blocks must be a whole number from 1")
              for up_to, down, up in VOID_BANDS:
                  if blocks <= up_to:
                      return (down, up)
              return VOID_LONG


          def _int(x):
              if type(x) is bool:
                  raise ValueError("not an integer")
              if type(x) is int:
                  return x
              if type(x) is str and re.fullmatch(r"-?[0-9]+", x):
                  return int(x)
              raise ValueError("not an integer: %r" % (x,))


          def _dec(x, what):
              """A game id or round as plain decimal text (no sign, spaces or hex), exactly as vhp-ruler.js's dec()."""
              if type(x) is int and 0 <= x <= 2 ** 53 - 1:
                  return str(x)
              if type(x) is str and re.fullmatch(r"[0-9]{1,30}", x) and int(x) <= 2 ** 53 - 1:
                  return str(int(x))
              raise ValueError("%s must be a whole number from 0 to 2^53 - 1" % what)


          def card_time(seed_block_id, game, rnd, W0, W1):
              if type(W0) is not int or type(W1) is not int or W1 < W0:
                  raise ValueError("bad card window")
              if type(seed_block_id) is not str or not re.fullmatch(r"0x[0-9a-f]+", seed_block_id):
                  raise ValueError("seed block id must be lowercase 0x-hex")
              d = hashlib.sha256(("%s|%s|%s" % (seed_block_id, _dec(game, "game"), _dec(rnd, "round"))).encode("utf-8")).digest()
              return W0 + int.from_bytes(d[:8], "big") % (W1 - W0 + 1)


          def isqrt(n):
              if n < 0:
                  raise ValueError("isqrt of a negative number")
              if n < 2:
                  return n
              x = 1 << ((n.bit_length() + 1) >> 1)
              while True:
                  y = (x + n // x) >> 1
                  if y >= x:
                      return x
                  x = y


          def trim(k, c):
              k, c = _int(k), _int(c)
              if k <= 0:
                  raise ValueError("trim needs k > 0")
              if c < 0:
                  raise ValueError("trim needs c >= 0")
              return isqrt(c * c * M // k)


          def credit_of(own, eff_b):
              return M if eff_b <= own else own * M // eff_b


          def pct(lam, x):
              """Fix A: the mid-p Poisson percentile in millionths, the same arithmetic as pct in vhp-ruler.js."""
              lam, x = _int(lam), _int(x)
              if lam < 0 or x < 0:
                  raise ValueError("pct needs λ ≥ 0 and x ≥ 0")
              n, f = divmod(x, M)
              q, i, total, below, qn, qn1 = PCT_SCALE, 0, 0, 0, 0, 0
              while True:
                  if i < n:
                      below += q
                  elif i == n:
                      qn = q
                  elif i == n + 1:
                      qn1 = q
                  total += q
                  nx = q * lam // (M * (i + 1))
                  i += 1
                  if nx == 0 and i * M > lam and i > n + 1:
                      break
                  q = nx
              mid0, mid1 = 2 * below + qn, 2 * below + 2 * qn + qn1
              r = (mid0 * (M - f) + mid1 * f) * M // (2 * total * M)
              return M - 1 if lam > 0 and r >= M else r


          def fpct(n, a, b, x):
              """A′: the field percentile, the same arithmetic as fpct in vhp-ruler.js."""
              n, a, b, x = _int(n), _int(a), _int(b), _int(x)
              if n < 0 or a < 0 or b < a or x < 0:
                  raise ValueError("fpct needs n ≥ 0 and 0 ≤ a ≤ b, x ≥ 0")
              k, f = divmod(x, M)
              if k > n:
                  return M  # x above every possible count: certain (Repo Lens #B-10 P1)

              def mid_at(j):
                  if a == 0:
                      return (2, 1) if j > 0 else (1, 1)
                  if a == b or b == 0:
                      return (0, 1) if j < n else (1, 1) if j == n else (2, 1)
                  return None
              if mid_at(k):
                  m0, t = mid_at(k)
                  m1, _ = mid_at(k + 1)
                  return (m0 * (M - f) + m1 * f) * M // (2 * t * M)
              q, total, below, qk, qk1 = PCT_SCALE, 0, 0, 0, 0
              i = 0
              while i <= n:
                  if i < k:
                      below += q
                  elif i == k:
                      qk = q
                  elif i == k + 1:
                      qk1 = q
                  total += q
                  q = q * (n - i) * a // ((i + 1) * (b - a))
                  if q == 0 and i > k:
                      break
                  i += 1
              mid0, mid1 = 2 * below + qk, 2 * below + 2 * qk + qk1
              r = (mid0 * (M - f) + mid1 * f) * M // (2 * total * M)
              return M - 1 if r >= M else r


          def k_of(blocks, own, total):
              return blocks * own * M // total if total > 0 else 0


          def vhp_deltas(events, contract=VHP_CONTRACT):
              out = []
              for e in events if isinstance(events, list) else []:
                  if not isinstance(e, dict) or e.get("src") != contract or type(e.get("h")) is not int:
                      continue
                  n = str(e.get("name") or "")
                  if not re.fullmatch(r"(token\.)?(transfer|mint|burn)_event", n):
                      continue
                  if not re.fullmatch(r"[0-9]+", str(e.get("value"))):
                      raise ValueError("bad VHP event value at block %d" % e["h"])
                  v = int(e["value"])
                  # kind and c (the other address) are recorded for D-172's void record only; no number uses them
                  if n.endswith("transfer_event"):
                      out.append({"h": e["h"], "a": e["from"], "d": -v, "inc": 0, "kind": "out", "c": str(e["to"])})
                      out.append({"h": e["h"], "a": e["to"], "d": v, "inc": v, "kind": "in", "c": str(e["from"])})
                  elif n.endswith("mint_event"):
                      out.append({"h": e["h"], "a": e["to"], "d": v, "inc": v, "kind": "mint", "c": None})
                  else:
                      out.append({"h": e["h"], "a": e["from"], "d": -v, "inc": 0, "kind": "burn", "c": None})
              return out


          class Ledger:
              """Same contract as ledger() in vhp-ruler.js."""

              def __init__(self, tl):
                  frm, to = tl["from"], tl["to"]
                  n = to - frm + 1
                  if type(frm) is not int or type(to) is not int or n < ACTIVE + DELAY:
                      raise ValueError("the timeline is too short")
                  if len(tl["signers"]) != n:
                      raise ValueError("one signer per block is required")
                  self.frm, self.to, self.valid_from = frm, to, frm + ACTIVE
                  self.ids = tl.get("ids")
                  self.bad = tl.get("bad") or []
                  self.rebuilt = tl.get("rebuilt") or []
                  self.pending = tl.get("pending") or []
                  addrs, ix = [], {}

                  def add(a):
                      if a not in ix:
                          ix[a] = len(addrs)
                          addrs.append(a)
                      return ix[a]
                  sig = [add(a) for a in tl["signers"]]
                  anchors = tl.get("anchors") or {}
                  for a in sorted(anchors):
                      add(a)
                  for a in addrs:
                      if a not in anchors:
                          raise ValueError("no anchor for %s" % a)
                  per = [dict() for _ in addrs]
                  allx = [[] for _ in addrs]
                  for x in tl.get("deltas") or []:
                      i = ix.get(x["a"])
                      if i is None:
                          continue
                      allx[i].append(x)
                      if x["h"] < frm or x["h"] > to:
                          continue
                      g = per[i].setdefault(x["h"], [0, 0])
                      g[0] += _int(x["d"])
                      g[1] += _int(x.get("inc", 0))
                  self.addrs, self.ix, self.sig = addrs, ix, sig
                  self.allx = allx
                  lo, hi = frm + DELAY, to + 1
                  self.cp, self.ev, self.ps, self.bal = [], [], [], []
                  for i, a in enumerate(addrs):
                      an = anchors[a]
                      ah, av = an["h"], _int(an["v"])
                      if type(ah) is not int or ah < frm - 1:
                          raise ValueError("anchor for %s is before the timeline" % a)
                      b0 = av
                      for x in allx[i]:
                          if frm <= x["h"] <= ah:
                              b0 -= _int(x["d"])
                      hs = sorted(per[i])
                      net, inc = [0], [0]
                      for h in hs:
                          net.append(net[-1] + per[i][h][0])
                          inc.append(inc[-1] + per[i][h][1])

                      def bal_before(H, hs=hs, net=net, b0=b0):
                          return b0 + net[bisect.bisect_right(hs, H - 1)]

                      def eff_at(H, hs=hs, inc=inc, bal_before=bal_before, a=a):
                          b = bal_before(H)
                          if b < 0:
                              raise ValueError("the VHP rebuild for %s went below zero at block %d (a missed event)" % (a, H))
                          e = b - (inc[bisect.bisect_right(hs, H - 1)] - inc[bisect.bisect_right(hs, H - DELAY)])
                          return e if e > 0 else 0
                      pts = {lo}
                      for h in hs:
                          if lo < h + 1 <= hi:
                              pts.add(h + 1)
                          if per[i][h][1] > 0 and lo < h + DELAY <= hi:
                              pts.add(h + DELAY)
                      cp = sorted(pts)
                      ev = [eff_at(H) for H in cp]
                      ps = [0]
                      for j in range(len(cp)):
                          ps.append(ps[j] + ev[j] * ((cp[j + 1] if j + 1 < len(cp) else hi + 1) - cp[j]))
                      self.cp.append(cp)
                      self.ev.append(ev)
                      self.ps.append(ps)
                      self.bal.append(bal_before)
                  self.signed_at = [[] for _ in addrs]
                  for k in range(n):
                      self.signed_at[sig[k]].append(frm + k)
                  vf = self.valid_from
                  cnt = [0] * len(addrs)
                  cur = [self._eff(i, vf) for i in range(len(addrs))]
                  for h in range(frm, vf):
                      cnt[sig[h - frm]] += 1
                  N = sum(cur[i] for i in range(len(addrs)) if cnt[i] > 0)
                  changes = {}
                  for i in range(len(addrs)):
                      for j, H in enumerate(self.cp[i]):
                          if H > vf:
                              changes.setdefault(H, []).append((i, self.ev[i][j]))
                  Nb = [N]
                  for H in range(vf + 1, to + 2):
                      for i, v in changes.get(H, ()):
                          if cnt[i] > 0:
                              N += v - cur[i]
                          cur[i] = v
                      s, r = sig[H - 1 - frm], sig[H - 1 - ACTIVE - frm]
                      if cnt[s] == 0:
                          N += cur[s]
                      cnt[s] += 1
                      cnt[r] -= 1
                      if cnt[r] == 0:
                          N -= cur[r]
                      Nb.append(N)
                  self.Nb = Nb
                  self._shares = {}

              def _need(self, a):
                  if a not in self.ix:
                      raise ValueError("unknown address %s" % a)
                  return self.ix[a]

              def _eff(self, i, H):
                  if H < self.frm + DELAY or H > self.to + 1:
                      raise ValueError("block %d is outside the data" % H)
                  return self.ev[i][bisect.bisect_right(self.cp[i], H) - 1]

              def eff(self, a, H):
                  return self._eff(self._need(a), H)

              def balance_before(self, a, H):
                  return self.bal[self._need(a)](H)

              def sum_eff(self, a, H0, H1):
                  if H1 < H0:
                      return 0
                  i = self._need(a)
                  self._eff(i, H0)
                  self._eff(i, H1)
                  cp, ev, ps = self.cp[i], self.ev[i], self.ps[i]

                  def S(x):
                      j = bisect.bisect_right(cp, x - 1) - 1
                      return 0 if j < 0 else ps[j] + ev[j] * (x - cp[j])
                  return S(H1 + 1) - S(H0)

              def max_eff(self, a, H0, H1):
                  i = self._need(a)
                  m = self._eff(i, H0)
                  cp, ev = self.cp[i], self.ev[i]
                  j = bisect.bisect_right(cp, H0)
                  while j < len(cp) and cp[j] <= H1:
                      if ev[j] > m:
                          m = ev[j]
                      j += 1
                  return m

              def N(self, H):
                  if H < self.valid_from or H > self.to + 1:
                      raise ValueError("no network total at block %d" % H)
                  return self.Nb[H - self.valid_from]

              def signer(self, h):
                  if h < self.frm or h > self.to:
                      raise ValueError("block %d is outside the data" % h)
                  return self.addrs[self.sig[h - self.frm]]

              def active(self, H):
                  if H < self.valid_from or H > self.to + 1:
                      raise ValueError("no active set at block %d" % H)
                  return sorted({self.addrs[self.sig[h - self.frm]] for h in range(H - ACTIVE, H)})

              def signed_in(self, a, H0, H1):
                  if H1 < H0:
                      return 0
                  l = self.signed_at[self._need(a)]
                  return bisect.bisect_right(l, H1) - bisect.bisect_left(l, H0)

              def signed_blocks(self, a, H0, H1):
                  l = self.signed_at[self._need(a)]
                  return l[bisect.bisect_left(l, H0):bisect.bisect_right(l, H1)]

              def moves(self, a, H0, H1):
                  """D-172: a producer's VHP moves in [H0, H1], in data order."""
                  out = []
                  for x in self.allx[self._need(a)]:
                      if H0 <= x["h"] <= H1:
                          d = _int(x["d"])
                          out.append({"h": x["h"], "d": d, "kind": x.get("kind") or ("burn" if d < 0 else "in"), "c": x.get("c")})
                  return out

              def first_signed(self, a):
                  l = self.signed_at[self._need(a)]
                  return l[0] if l else None

              def share_sum(self, a, H0, H1):
                  if H1 < H0:
                      return 0
                  if H0 < self.valid_from or H1 > self.to:
                      raise ValueError("no shares for blocks %d … %d" % (H0, H1))
                  i = self._need(a)
                  s = self._shares.get(i)
                  if s is None:
                      vf, cp, ev, Nb = self.valid_from, self.cp[i], self.ev[i], self.Nb
                      # prefix sums ~ blocks x 10^6 (a producer outside the active set can exceed 1 a block; still far inside 64 bits)
                      s = array.array("q", bytes(8 * (self.to - vf + 2)))
                      j = bisect.bisect_right(cp, vf) - 1
                      acc = 0
                      for H in range(vf, self.to + 1):
                          while j + 1 < len(cp) and cp[j + 1] <= H:
                              j += 1
                          Nh = Nb[H - vf]
                          if Nh > 0:
                              acc += ev[j] * M // Nh
                          s[H - vf + 1] = acc
                      self._shares[i] = s
                  return s[H1 - self.valid_from + 1] - s[H0 - self.valid_from]


          def own(L, a, T, rule):
              if rule == "spot":
                  return L.eff(a, T)
              if rule == "high1h":
                  return L.max_eff(a, T - HIGH + 1, T)
              if rule == "avg24h":
                  return avg(L, a, T)
              raise ValueError("unknown own rule %s" % rule)


          def avg(L, a, T):
              return L.sum_eff(a, T - AVG, T - 1) // AVG


          def total(L, T):
              return sum(avg(L, q, T) for q in L.active(T))


          def rate_of(L, a, T, f=None):
              """D-120: (rate, steady), as rateOf in vhp-ruler.js."""
              f = f or form_of(L, a, T)
              if T - FORM < L.valid_from or f["expected"] <= 0:
                  return M, False
              for d in range(FORM // AVG):
                  H0 = T - FORM + d * AVG
                  e, s = L.share_sum(a, H0, H0 + AVG - 1), L.signed_in(a, H0, H0 + AVG - 1)
                  dr = s * M * M // e if e > 0 else 0
                  if abs(dr - f["form"]) > STEADY_BAND:
                      return M, False
              return (f["form"] if f["form"] < M else M), True


          def form_of(L, a, T):
              H0, H1 = max(L.valid_from, T - FORM), T - 1
              expected, signed = L.share_sum(a, H0, H1), L.signed_in(a, H0, H1)
              return {"form": signed * M * M // expected if expected > 0 else 0, "signed": signed, "expected": expected, "from": H0}


          def _bad_for(L, a, h0, h1):
              return any(r["h0"] <= h1 and r["h1"] >= h0 and (not r.get("a") or r.get("a") == a) for r in L.bad)


          def _rebuilt_in(L, h0, h1):
              return any(r["h0"] <= h1 and r["h1"] >= h0 for r in L.rebuilt)


          def _pending_in(L, h0, h1):
              return any(r["h0"] <= h1 and r["h1"] >= h0 for r in L.pending)


          EARLY = DELAY - 1   # a change up to 19 blocks before a window still moves effective VHP inside it (Repo Lens #B-5 N-7)


          def _not_yet(L, h0, h1):
              r = sorted((x for x in L.pending if x["h0"] <= h1 and x["h1"] >= h0), key=lambda x: x["h0"])[0]
              return "not yet: unverified chained hours in the card's windows (from block %d); it is made once the next live hour checks them" % r["h0"]


          def newcomer(L, a, T):
              """(isNew, history) of producer a at T, as newcomer in vhp-ruler.js (Repo Lens #B-5 N-6)."""
              lb0 = T - FORM - ACTIVE
              if lb0 >= L.frm:
                  return L.signed_in(a, lb0, T - FORM - 1) == 0, L.signed_in(a, lb0, T - HISTORY) > 0
              first = L.first_signed(a)
              seen_at_start = first is not None and first < L.valid_from
              return ((not seen_at_start) and first is not None and T - first < FORM,
                      first is not None and (T - L.frm >= HISTORY if seen_at_start else T - first >= HISTORY))


          def _js(v):
              if type(v) is bool or v is None or type(v) is str:
                  return v
              if type(v) is int:
                  return v
              if isinstance(v, dict):
                  return {k: _js(x) for k, x in v.items()}
              if isinstance(v, list):
                  return [_js(x) for x in v]
              raise ValueError("not a card value: %r" % (v,))


          # the card's fields that are BigInt in JavaScript (written as decimal strings)
          _BIG_TOP, _BIG_ROW = ("c", "total"), ("own", "avg", "k", "form", "rate", "expected", "lift", "target", "credited", "pct", "coreForm", "z", "fpct")


          def week_summary(cards):
              """D-172's weekly summary, as weekSummary in vhp-ruler.js. Data only."""
              voids, sets, senders = {}, {}, {}
              races = field_races = core_races = set_asides = void_count = own_moves = 0
              for c in cards:
                  c = json.loads(c) if isinstance(c, str) else c
                  if not any("credited" in p for p in c.get("producers") or []):
                      continue
                  races += 1
                  race = "%s:%s" % (c["game"], c["round"])
                  for p in c["producers"]:
                      if p["entry"] and not p["void"]:
                          field_races += 1
                      if p.get("core"):
                          core_races += 1
                      if p.get("setAside"):
                          set_asides += 1
                          sets[p["a"]] = sets.get(p["a"], 0) + 1
                      if p["void"] and p.get("moves"):
                          void_count += 1
                          voids[p["a"]] = voids.get(p["a"], 0) + 1
                          if p["moves"]["ownMove"]:
                              own_moves += 1
                          for r in p["moves"].get("received") or []:
                              x = senders.setdefault(r["a"], (set(), set()))
                              x[0].add(race)
                              x[1].add(p["a"])

              def counts(m):
                  return [{"a": a, "races": k} for a, k in sorted(m.items(), key=lambda t: (-t[1], t[0]))]
              repeat = sorted(({"a": a, "races": len(x[0]), "producers": sorted(x[1])} for a, x in senders.items() if len(x[0]) >= 2),
                              key=lambda t: (-t["races"], t["a"]))
              return {"races": races, "fieldRaces": field_races, "coreRaces": core_races, "voids": void_count, "ownMoves": own_moves,
                      "setAsides": set_asides, "setAsideRate": set_asides * 1000000 // core_races if core_races else 0,
                      "setAsideExpected": SET_ASIDE_EXPECTED, "voidsByProducer": counts(voids), "setAsidesByProducer": counts(sets),
                      "repeatSenders": repeat}


          SWITCH_MAX = 999999


          def switch_from(v):
              """The ruler switch (owner, 11 Nov 2026), as switchFrom in vhp-ruler.js: None, or the vault week N."""
              if v is None or (type(v) is str and v == ""):
                  return None
              if type(v) is str and re.fullmatch(r"[1-9][0-9]{0,5}", v):
                  return int(v)
              if type(v) is int and 1 <= v <= SWITCH_MAX:
                  return v
              raise ValueError("the ruler switch must be empty or a vault week from 1 to 999999")


          def _switch_week(w):
              if type(w) is int and 0 <= w <= SWITCH_MAX:
                  return w
              raise ValueError("week must be a vault week from 0 to 999999")


          def _mode_of(w, f):
              return "off" if f is None or w < f - 1 else "shadow" if w < f else "on"


          def ruler_mode(week, frm):
              """as rulerMode: "off", "shadow" (week N − 1) or "on" (from week N)."""
              return _mode_of(_switch_week(week), switch_from(frm))


          def switch_change(prev, nxt, week):
              """as switchChange: None, or why the change would change whether a started week is scored by the ruler."""
              w, p, n = _switch_week(week), switch_from(prev), switch_from(nxt)
              if p == n:
                  return None
              at = sorted(x for x in (0, w, -1 if p is None else p - 1, -1 if p is None else p, -1 if n is None else n - 1,
                                      -1 if n is None else n) if 0 <= x <= w)
              for x in at:
                  a, b = _mode_of(x, p), _mode_of(x, n)
                  if (a == "on") != (b == "on"):
                      return ("the ruler switch moved from %s to %s: week %d has started and would change from %s to %s; whether a "
                              "started week is scored by the ruler never changes (a first switch-on: %d or later)"
                              % ("unset" if p is None else p, "unset" if n is None else n, x, a, b, w + 1))
              return None


          _SCHED = re.compile(r"[1-9][0-9]{0,5}:[ABCD](,[1-9][0-9]{0,5}:[ABCD])*")
          _VSCHED = re.compile(r"[1-9][0-9]{0,5}:[45](,[1-9][0-9]{0,5}:[45])*")
          _INC_ADDR = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}")


          def check_include(x):
              """The kit's include list, as checkInclude in vhp-ruler.js: a non-empty list of distinct addresses in rising order."""
              if not isinstance(x, list) or not x or not all(type(a) is str and _INC_ADDR.fullmatch(a) for a in x):
                  raise ValueError("include must be a non-empty list of addresses")
              for i in range(1, len(x)):
                  if not x[i - 1] < x[i]:
                      raise ValueError("include must be in rising order with no repeats")


          def version_schedule(v):
              """A game's RULE_VERSION schedule, as versionSchedule in vhp-ruler.js: None, or [(week, version), ...] with rising weeks."""
              if v is None or (type(v) is str and v == ""):
                  return None
              if type(v) is not str or not _VSCHED.fullmatch(v):
                  raise ValueError("the ruler version schedule must be empty or week:version pairs like 6:5 (versions 4 or 5)")
              out = [(int(x.split(":")[0]), int(x.split(":")[1])) for x in v.split(",")]
              for i in range(1, len(out)):
                  if out[i][0] <= out[i - 1][0]:
                      raise ValueError("the ruler version schedule's weeks must rise")
              if out[-1][0] > SWITCH_MAX:
                  raise ValueError("the ruler version schedule's weeks must be at most 999999")
              return out


          def version_at(week, schedule):
              """as versionAt: the RULE_VERSION of a vault week under the schedule (4 before the first pair or with no schedule)."""
              w, s = _switch_week(week), version_schedule(schedule)
              n = RULE_VERSION
              for x, v in s or ():
                  if x <= w:
                      n = v
              return n


          def version_change(prev, nxt, week):
              """as versionChange: None, or why the change would alter the version of a week that has started."""
              w, p, n = _switch_week(week), version_schedule(prev), version_schedule(nxt)
              at = sorted(set([0] + [x for x, _ in p or ()] + [x for x, _ in n or ()]))
              for x in at:
                  if x > w:
                      continue
                  a, b = version_at(x, prev), version_at(x, nxt)
                  if a != b:
                      return ("the ruler version schedule moved from %s to %s: week %d has started and would change from %d to %d; a change "
                              "may only touch weeks after %d" % (json.dumps(prev if prev is not None else ""), json.dumps(nxt if nxt is not None else ""), x, a, b, w))
              return None


          def mode_schedule(v):
              """The admin's mode schedule, as modeSchedule in vhp-ruler.js: None, or [(week, mode), ...] with rising weeks."""
              if v is None or (type(v) is str and v == ""):
                  return None
              if type(v) is not str or not _SCHED.fullmatch(v):
                  raise ValueError("the ruler mode schedule must be empty or week:mode pairs like 5:B,8:C (modes A, B, C or D)")
              out = [(int(x.split(":")[0]), x.split(":")[1]) for x in v.split(",")]
              for i in range(1, len(out)):
                  if out[i][0] <= out[i - 1][0]:
                      raise ValueError("the ruler mode schedule's weeks must rise")
              if out[-1][0] > SWITCH_MAX:
                  raise ValueError("the ruler mode schedule's weeks must be at most 999999")
              return out


          def mode_at(week, schedule):
              """as modeAt: the mode of a vault week under the schedule ("A" before the first pair or with no schedule)."""
              w, s = _switch_week(week), mode_schedule(schedule)
              m = "A"
              for x, mm in s or ():
                  if x <= w:
                      m = mm
              return m


          def mode_change(prev, nxt, week):
              """as modeChange: None, or why the change would alter the mode of a week that has started."""
              w, p, n = _switch_week(week), mode_schedule(prev), mode_schedule(nxt)
              at = sorted(set([0] + [x for x, _ in p or ()] + [x for x, _ in n or ()]))
              for x in at:
                  if x > w:
                      continue
                  a, b = mode_at(x, prev), mode_at(x, nxt)
                  if a != b:
                      return ("the ruler mode schedule moved from %s to %s: week %d has started and would change from %s to %s; a change "
                              "may only touch weeks after %d" % (json.dumps(prev if prev is not None else ""), json.dumps(nxt if nxt is not None else ""), x, a, b, w))
              return None


          def card_json(card):
              c = dict(card)
              for k in _BIG_TOP:
                  c[k] = str(_int(c[k]))
              rows = []
              for p in c["producers"]:
                  p = dict(p)
                  for k in _BIG_ROW:
                      if k in p and p[k] is not None:
                          p[k] = str(_int(p[k]))
                  rows.append(p)
              c["producers"] = rows
              return json.dumps(_js(c), separators=(",", ":"), ensure_ascii=False) + "\n"


          def _check_window(w):
              for k in ("W0", "W1", "S0", "S1", "L"):
                  if type(w.get(k)) is not int:
                      raise ValueError("window %s must be a block height" % k)
              if not (w["W0"] <= w["W1"] <= w["L"] <= w["S0"] <= w["S1"]):
                  raise ValueError("window order must be W0 <= W1 <= L <= S0 <= S1")


          def make_card(L, game, rnd, window, c, own_rule, paying, pooled=(), min_k=10, pool_rule="min", mode=None, include=None, version=RULE_VERSION):
              w = window
              _check_window(w)
              if own_rule not in OWN_RULES:
                  raise ValueError("ownRule must be spot, high1h or avg24h")
              seed_block = w["L"] + SEED_AFTER
              if not L.ids:
                  raise ValueError("the data has no block ids")
              seed_id = L.ids[seed_block - L.frm] if 0 <= seed_block - L.frm < len(L.ids) else None
              if type(seed_id) is not str:
                  raise ValueError("no id for the seed block %d" % seed_block)
              T = card_time(seed_id, game, rnd, w["W0"], w["W1"])
              if T - AVG < L.frm + DELAY:
                  raise ValueError("not enough history before the card time (24 h of data are needed)")
              pooled, c, paying = set(pooled), _int(c), bool(paying)
              if type(min_k) is not int or not 1 <= min_k <= 100000:
                  raise ValueError("minK must be a whole number of blocks from 1")
              if pool_rule not in POOL_RULES:
                  raise ValueError("poolRule must be min")
              if mode is not None and mode not in MODES:
                  raise ValueError("mode must be A, B, C or D")
              if type(version) is not int or version not in RULE_VERSIONS:
                  raise ValueError("version must be 4 or 5")
              if include is not None:
                  check_include(include)
              if paying and T - L.frm < FORM + ACTIVE:
                  raise ValueError("a paying card needs %d blocks of data before its moment (14 days + 6 h)" % (FORM + ACTIVE))
              if paying and _pending_in(L, T - AVG - EARLY, T):
                  raise ValueError(_not_yet(L, T - AVG - EARLY, T))
              form_from = max(L.valid_from, T - FORM)
              look0 = min(T - AVG, form_from)
              blocks, tot = w["S1"] - w["S0"] + 1, total(L, T)
              rows = []
              # the kit's include, as in vhp-ruler.js: listed producers get a row even when not active(T); not in the total
              act = L.active(T)
              act_set = set(act)
              for a in list(act) + [x for x in (include or []) if x not in act_set]:
                  o, av, f = own(L, a, T, own_rule), avg(L, a, T), form_of(L, a, T)
                  k = k_of(blocks, o, tot)
                  is_new, history = newcomer(L, a, T)
                  rate, steady = rate_of(L, a, T, f)   # owner, 5 Nov: steady producers play at full size; rate is shown only
                  rows.append({"a": a, "own": o, "avg": av, "k": k, "form": f["form"], "rate": rate,
                               "entry": k >= min_k * M and (steady or f["form"] >= FORM_GATE) and history and (a in act_set or f["signed"] > 0), "pooled": a in pooled,
                               "isNew": is_new, "quality": "ok"})
                  if a not in act_set:
                      rows[-1]["listed"] = True   # here only because of include (Repo Lens #G-40 G40-2), as in vhp-ruler.js
              rows.sort(key=lambda r: (-r["own"], r["a"]))
              # D-113: on a paying card only the 24-h size window must be free of rebuilt hours; form's older days may read them
              if any(_bad_for(L, r["a"], look0 - EARLY, T) for r in rows) or (paying and _rebuilt_in(L, T - AVG - EARLY, T)):
                  for r in rows:
                      r["quality"] = "flagged"
              out = {"ruleVersion": version, "game": int(_dec(game, "game")), "round": _dec(rnd, "round"), "ownRule": own_rule, "paying": paying,
                     "T": T, "seedBlock": seed_block, "seedBlockId": seed_id, "seedProducer": L.signer(seed_block),
                     "window": {"W0": w["W0"], "W1": w["W1"], "L": w["L"], "S0": w["S0"], "S1": w["S1"]},
                     "c": c, "minK": min_k, "poolRule": pool_rule}
              if mode is not None:
                  out["mode"] = mode
              if include is not None:
                  out["include"] = list(include)
              out.update({"total": tot, "formFrom": form_from, "producers": rows})
              return out


          def isqrt(v):
              """floor(sqrt(v)) for a whole number v ≥ 0, as isqrt in vhp-ruler.js."""
              if v < 2:
                  return v
              x = 1 << ((v.bit_length() + 1) // 2)
              y = (x + v // x) >> 1
              while y < x:
                  x = y
                  y = (x + v // x) >> 1
              return x


          def void_record(L, a, o, T, S0, S1):
              """D-172, as voidRecord in vhp-ruler.js. Data only."""
              lo = hi = None
              H = S0
              while H <= S1:
                  e = L.eff(a, H)
                  H2 = H
                  while H2 + 1 <= S1 and L.eff(a, H2 + 1) == e:
                      H2 += 1
                  lo = e if lo is None or e < lo else lo
                  hi = e if hi is None or e > hi else hi
                  H = H2 + 1
              inn, out, minted, burned = {}, {}, 0, 0
              for x in L.moves(a, T + 1, S1):
                  if x["kind"] == "mint":
                      minted += x["d"]
                  elif x["kind"] == "burn":
                      burned -= x["d"]
                  else:
                      m = inn if x["kind"] == "in" else out
                      k = "?" if x["c"] is None else x["c"]
                      m[k] = m.get(k, 0) + abs(x["d"])

              def lst(m):
                  return [{"a": k, "v": str(m[k])} for k in sorted(m)]
              return {"own": str(o), "effS0": str(L.eff(a, S0)), "effS1": str(L.eff(a, S1)), "lo": str(lo), "hi": str(hi),
                      "received": lst(inn), "sent": lst(out), "minted": str(minted), "burned": str(burned), "ownMove": len(out) > 0}


          def score_card(L, card):
              S0, S1 = card["window"]["S0"], card["window"]["S1"]
              tot = _int(card["total"])
              if card["paying"] and _pending_in(L, S0 - EARLY, S1):
                  raise ValueError(_not_yet(L, S0 - EARLY, S1))
              flagged = any(p["quality"] == "flagged" or _bad_for(L, p["a"], S0 - EARLY, S1) for p in card["producers"]) \
                  or (card["paying"] and _rebuilt_in(L, S0 - EARLY, S1))
              mode = card.get("mode")
              if mode is not None and mode not in MODES:
                  raise ValueError("mode must be A, B, C or D")
              cap = LUCK_CAP if mode is None else MODE_CAP[mode]
              blocks = S1 - S0 + 1
              band_down, band_up = void_band(blocks)
              draws = {}

              def draw(H):
                  u = draws.get(H)
                  if u is None:
                      d = hashlib.sha256(("sample|%s|%d" % (card["seedBlockId"], H)).encode("utf-8")).digest()
                      u = int.from_bytes(d[:8], "big") % M
                      draws[H] = u
                  return u
              rows = []
              for p in card["producers"]:
                  o, k = _int(p["own"]), _int(p["k"])
                  sample = cap * M // k if k > cap else M
                  every = sample == M
                  credited = sum(credit_of(o, L.eff(p["a"], b)) for b in L.signed_blocks(p["a"], S0, S1) if every or draw(b) < sample)
                  lo, hi = o * (M - band_down) // M, o * (M + band_up) // M
                  is_void, expected = False, 0
                  H = S0
                  while H <= S1:
                      e = L.eff(p["a"], H)
                      H2 = H
                      while H2 + 1 <= S1 and L.eff(p["a"], H2 + 1) == e:
                          H2 += 1
                      if e < lo or e > hi:
                          is_void = True
                      cnt = H2 - H + 1 if every else sum(1 for b in range(H, H2 + 1) if draw(b) < sample)
                      m = e if e < o else o
                      expected += cnt * (m * M // tot if tot > 0 else 0)
                      H = H2 + 1
                  q = dict(p)
                  q.update({"quality": "flagged" if flagged else "ok", "sample": sample, "expected": expected,
                            "signed": L.signed_in(p["a"], S0, S1), "credited": credited, "pct": pct(expected, credited),
                            "void": is_void, "moves": void_record(L, p["a"], o, card["T"], S0, S1) if is_void else None})
                  rows.append(q)
              # A′ (D-165, D-171), as scoreCard in vhp-ruler.js: the core is the field members with form ≥ CORE_LINE × the field's
              # median form weighted by expected blocks (exact tie: the lower member's form), at full size; a producer's yardstick
              # is the core less any other core member more than BAND_SD sd from its share of the core's blocks, plus itself
              def in_field(r):
                  return r["entry"] and not r["void"]
              def in_ref(r):   # the reference field: a listed-only row (include) never sets the medians or joins the core (G40-2)
                  return in_field(r) and not r.get("listed")
              frows = sorted((r for r in rows if in_ref(r)), key=lambda r: _int(r["form"]))
              e_all = sum(r["expected"] for r in frows)
              median, cum = 0, 0
              for r in frows:
                  cum += r["expected"]
                  if 2 * cum >= e_all:
                      median = _int(r["form"])
                      break
              # the mode's target (lift and target on each row only on a card with a mode); the yardstick, the band, fpct and pct
              # use the target, as in vhp-ruler.js
              def E(r):
                  return r["expected"] if mode is None else r["target"]
              if mode is not None:
                  # B and C: the best of the mode's stretches over [T - LIFT_SKIP - LIFT_SPAN, T - LIFT_SKIP), as in vhp-ruler.js
                  for r in rows:
                      r["lift"] = M
                  k = STRETCHES.get(mode, 0)
                  span = LIFT_SPAN // (k or 1)
                  for i in range(k):
                      H0 = card["T"] - LIFT_SKIP - LIFT_SPAN + i * span
                      H1 = H0 + span - 1
                      if H0 < L.valid_from:
                          continue
                      raw, lf = {}, {}
                      for r in rows:
                          e, sg = L.share_sum(r["a"], H0, H1), L.signed_in(r["a"], H0, H1)
                          raw[r["a"]] = sg * M * M // e if e > 0 else 0
                          lf[r["a"]] = lift_form(sg, e, LIFT_SD[mode])
                      med, c = 0, 0
                      for r in sorted(frows, key=lambda r: raw[r["a"]]):
                          c += r["expected"]
                          if 2 * c >= e_all:
                              med = raw[r["a"]]
                              break
                      if med <= 0:
                          continue
                      for r in rows:
                          x = lf[r["a"]] * M // med
                          if x > r["lift"]:
                              r["lift"] = x
                  for r in rows:
                      r["target"] = r["expected"] * r["lift"] // M
                      r["pct"] = pct(r["target"], r["credited"])
              # RULE_VERSION 5, as in vhp-ruler.js: the core is judged on the form over [T - 14 d, T - 3 d)
              if card.get("ruleVersion") not in RULE_VERSIONS or type(card.get("ruleVersion")) is not int:
                  raise ValueError("the card's ruleVersion must be 4 or 5")
              v5, core_form, c_median = card["ruleVersion"] == 5, {}, median
              if v5:
                  H0, H1 = max(L.valid_from, card["T"] - FORM), card["T"] - LIFT_SKIP - 1
                  for r in rows:
                      e = L.share_sum(r["a"], H0, H1)
                      core_form[r["a"]] = _int(r["form"]) if H1 < H0 else (L.signed_in(r["a"], H0, H1) * M * M // e if e > 0 else 0)
                  c_median, c5 = 0, 0
                  for r in sorted(frows, key=lambda r: core_form[r["a"]]):
                      c5 += r["expected"]
                      if 2 * c5 >= e_all:
                          c_median = core_form[r["a"]]
                          break
              line = c_median * CORE_LINE // M

              def in_core(r):
                  return in_ref(r) and (core_form[r["a"]] if v5 else _int(r["form"])) >= line
              # the yardstick counts CREDITED blocks (millionths), as in vhp-ruler.js
              n = sum(r["credited"] for r in rows if in_core(r))
              b = sum(E(r) for r in rows if in_core(r))
              nY, bY = n, b
              for r in rows:
                  if v5:
                      r["coreForm"] = core_form[r["a"]]
                  r["core"], r["z"], r["setAside"] = in_core(r), None, False
                  if not r["core"]:
                      continue
                  e = E(r)
                  dev, v = r["credited"] * b - n * e, n * e * (b - e) * M
                  if v > 0:
                      q = abs(dev) * M // isqrt(v)
                      r["z"] = -q if dev < 0 else q
                  if dev * dev > BAND_SD * BAND_SD * v:
                      r["setAside"] = True
                      nY -= r["credited"]
                      bY -= e
              for r in rows:
                  if not in_field(r):
                      r["fpct"] = None
                  elif r["core"] and not r["setAside"]:
                      r["fpct"] = fpct(nY // M, E(r), bY, r["credited"])
                  else:
                      r["fpct"] = fpct((nY + r["credited"]) // M, E(r), bY + E(r), r["credited"])
              out = dict(card)
              out["producers"] = rows
              return out


          _SETTINGS, _WKEYS = ("game", "round", "window", "c", "minK", "poolRule", "ownRule", "paying", "pooled"), ("W0", "W1", "L", "S0", "S1")
          _OPTIONAL = ("mode", "include", "version")


          def check_settings(g):
              """The game's settings, strictly (Repo Lens #B-5 N-5), as checkSettings in vhp-ruler.js."""
              if not isinstance(g, dict):
                  raise ValueError("recompute needs the game's own settings")
              if any(k not in g for k in _SETTINGS) or any(k not in _SETTINGS and k not in _OPTIONAL for k in g):
                  raise ValueError("the game's settings must have exactly: " + ", ".join(_SETTINGS) + " (and, optionally, " + ", ".join(_OPTIONAL) + ")")
              if "mode" in g and g["mode"] not in MODES:
                  raise ValueError("mode must be A, B, C or D")
              if "version" in g and (type(g["version"]) is not int or g["version"] not in RULE_VERSIONS):
                  raise ValueError("version must be 4 or 5")
              if "include" in g:
                  check_include(g["include"])
              _dec(g["game"], "game")
              _dec(g["round"], "round")
              w = g["window"]
              if not isinstance(w, dict) or sorted(w) != sorted(_WKEYS):
                  raise ValueError("window must have exactly: " + ", ".join(_WKEYS))
              c = g["c"]
              if not ((type(c) is int and 0 <= c <= 2 ** 53 - 1) or (type(c) is str and re.fullmatch(r"[0-9]{1,30}", c))):
                  raise ValueError("c must be a whole number of millionths")
              if type(g["minK"]) is not int or not 1 <= g["minK"] <= 100000:
                  raise ValueError("minK must be a whole number of blocks from 1")
              if g["poolRule"] not in POOL_RULES:
                  raise ValueError("poolRule must be min")
              if g["ownRule"] not in OWN_RULES:
                  raise ValueError("ownRule must be spot, high1h or avg24h")
              if type(g["paying"]) is not bool:
                  raise ValueError("paying must be true or false")
              if not isinstance(g["pooled"], list) or not all(type(a) is str for a in g["pooled"]):
                  raise ValueError("pooled must be a list of addresses")


          def card_digest(card):
              """The compact card, as cardDigest in vhp-ruler.js: the sha256 of the card's canonical text, and whether it was scored."""
              return {"sha256": hashlib.sha256(card_json(card).encode("utf-8")).hexdigest(),
                      "scored": any("credited" in p for p in card.get("producers", []))}


          _HEX64 = re.compile(r"[0-9a-f]{64}")


          def _is_digest(x):
              return (isinstance(x, dict) and sorted(x) == ["scored", "sha256"] and type(x["sha256"]) is str
                      and _HEX64.fullmatch(x["sha256"]) is not None and type(x["scored"]) is bool)


          def recompute_card(L, published, game):
              """published: the card's JSON text; game: the game's OWN settings {game, round, window, c, minK, poolRule, ownRule, paying, pooled}
              (Repo Lens #E-12 M-1: never the card's own settings). Returns (same, diff)."""
              try:
                  check_settings(game)
              except ValueError as e:
                  return False, "the game's settings: %s" % e, None
              try:
                  pub_d = json.loads(published)
              except ValueError:
                  pub_d = None
              if _is_digest(pub_d):   # the compact card, as in vhp-ruler.js
                  w = game["window"]
                  try:
                      mine = make_card(L, game["game"], game["round"], w, int(game["c"]), game["ownRule"], game["paying"], game["pooled"],
                                       game["minK"], game["poolRule"], game.get("mode"), game.get("include"), game.get("version", RULE_VERSION))
                      if pub_d["scored"]:
                          mine = score_card(L, mine)
                  except ValueError as e:
                      return False, "the data can't make this card: %s" % e, None
                  d = card_digest(mine)["sha256"]
                  return (True, "", mine) if d == pub_d["sha256"] else (False, "sha256 differs: published %s, recomputed %s" % (pub_d["sha256"], d), None)
              pub = json.loads(published)
              w = game["window"]
              want = {"game": int(_dec(game["game"], "game")), "round": _dec(game["round"], "round"), "ownRule": game["ownRule"],
                      "paying": game["paying"], "c": str(int(game["c"])), "minK": game["minK"], "poolRule": game["poolRule"]}
              want["mode"] = game.get("mode")   # always compared (Repo Lens #G-19): no mode on one side is a clear refusal
              want["version"] = game.get("version", RULE_VERSION)
              want["include"] = json.dumps(game.get("include"), separators=(",", ":"))
              want.update({"W0": w["W0"], "W1": w["W1"], "L": w["L"], "S0": w["S0"], "S1": w["S1"]})
              got = {"game": pub.get("game"), "round": pub.get("round"), "ownRule": pub.get("ownRule"), "paying": pub.get("paying"),
                     "c": str(pub.get("c")), "minK": pub.get("minK"), "poolRule": pub.get("poolRule"), "mode": pub.get("mode"),
                     "version": pub.get("ruleVersion"), "include": json.dumps(pub.get("include"), separators=(",", ":"))}
              got.update(pub.get("window") or {})
              for k in want:
                  if got.get(k) != want[k] or type(got.get(k)) is not type(want[k]):
                      return False, "setting %s: the card says %s, the game says %s" % (k, json.dumps(got.get(k)), json.dumps(want[k])), None
              try:
                  mine = make_card(L, game["game"], game["round"], w, int(game["c"]), game["ownRule"], game["paying"], game["pooled"],
                                   game["minK"], game["poolRule"], game.get("mode"), game.get("include"), game.get("version", RULE_VERSION))
                  if any("credited" in p for p in pub.get("producers", [])):
                      mine = score_card(L, mine)
              except ValueError as e:
                  return False, "the data can't make this card: %s" % e, None
              a = card_json(mine)
              if a == published:
                  return True, "", mine
              i = 0
              while i < min(len(a), len(published)) and a[i] == published[i]:
                  i += 1
              return False, "differs at byte %d" % i, None


          # ── the vhp-data format and its checks: the twin of vhp-data.js (read it for the format in words) ──
          HOUR, DAY, DATA_VERSION = 1200, 28800, 1
          _ADDR = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}")
          _ID = re.compile(r"0x1220[0-9a-f]{64}")
          _SAT = re.compile(r"(0|[1-9][0-9]{0,24})")



          def recompute(L, published, game):
              """(same, diff): as recompute in vhp-ruler.js. recompute_card also returns the rebuilt card when same (for a game that
              stores only digests: the Race, Repo Lens #G-40 Info)."""
              ok, diff, _ = recompute_card(L, published, game)
              return ok, diff

          def canon(o):
              return json.dumps(o, separators=(",", ":"), ensure_ascii=False) + "\n"


          def sha_hex(text):
              return hashlib.sha256(text.encode("utf-8")).hexdigest()


          def _safe_int(x):
              return type(x) is int and -(2 ** 53 - 1) <= x <= 2 ** 53 - 1


          def _sorted_keys(o):
              ks = list(o.keys())
              return all(ks[i - 1] < ks[i] for i in range(1, len(ks)))


          def _check_shape(h):
              if not isinstance(h, dict) or type(h.get("v")) is not int or h.get("v") != DATA_VERSION:
                  return "not a version-1 hour"
              keys = ["v", "n", "from", "to", "prev", "kind", "addrs", "sig", "ids", "burns", "events", "tail", "anchor"]
              if list(h.keys()) != keys:
                  return "fields must be exactly " + ", ".join(keys)
              if not _safe_int(h["n"]) or h["n"] < 0 or not _safe_int(h["from"]) or not _safe_int(h["to"]) \
                      or h["from"] != h["n"] * HOUR or h["to"] != h["from"] + HOUR - 1:
                  return "from/to must be block-hour n"
              if type(h["prev"]) is not str or not re.fullmatch(r"([0-9a-f]{64})?", h["prev"]):
                  return "prev must be a sha256"
              if h["kind"] not in ("live", "rebuilt", "chained"):
                  return "kind must be live, rebuilt or chained"
              addrs = h["addrs"]
              if not isinstance(addrs, list) or not all(type(a) is str and _ADDR.fullmatch(a) for a in addrs):
                  return "bad address"
              if any(not addrs[i - 1] < addrs[i] for i in range(1, len(addrs))):
                  return "addrs must be sorted and unique"
              aset = set(addrs)

              def blocks(b, n, where):
                  if not isinstance(b, dict) or not all(isinstance(b.get(k), list) for k in ("sig", "ids", "burns", "events")):
                      return where + ": sig, ids, burns, events"
                  if len(b["sig"]) != n or len(b["ids"]) != n or len(b["burns"]) != n:
                      return where + ": exactly one signer, one id and one burn per block"
                  if not all(_safe_int(i) and 0 <= i < len(addrs) for i in b["sig"]):
                      return where + ": bad signer index"
                  if not all(type(x) is str and _ID.fullmatch(x) for x in b["ids"]):
                      return where + ": bad block id"
                  if not all(type(x) is str and _SAT.fullmatch(x) and x != "0" for x in b["burns"]):
                      return where + ": every block burns VHP from its signer"
                  return None
              e1 = blocks(h, HOUR, "hour")
              if e1:
                  return e1
              a = h["anchor"]
              if not isinstance(a, dict) or list(a.keys()) != ["at", "id", "bal", "reads"]:
                  return "anchor fields must be at, id, bal, reads"
              if not _safe_int(a["at"]) or a["at"] < h["to"] or a["at"] > h["to"] + DAY:
                  return "the anchor block must be at most a day after the hour"
              if type(a["id"]) is not str or not _ID.fullmatch(a["id"]):
                  return "bad anchor block id"
              t = h["tail"]
              if not isinstance(t, dict) or list(t.keys()) != ["sig", "ids", "burns", "events"]:
                  return "tail fields must be sig, ids, burns, events"
              e2 = blocks(t, a["at"] - h["to"], "tail")
              if e2:
                  return e2
              if (t["ids"][a["at"] - h["to"] - 1] if a["at"] > h["to"] else h["ids"][HOUR - 1]) != a["id"]:
                  return "the anchor block id isn't the id of block `at`"
              for lo, hi, lst in ((h["from"], h["to"], h["events"]), (h["to"] + 1, a["at"], t["events"])):
                  last = lo
                  for e in lst:
                      if not isinstance(e, list) or len(e) != 5:
                          return "an event is [h, kind, from, to, value]"
                      eh, k, f, to, v = e
                      if not _safe_int(eh) or eh < lo or eh > hi or eh < last:
                          return "events out of range or order"
                      last = eh
                      if k not in ("m", "t", "b") or type(v) is not str or not _SAT.fullmatch(v) or type(f) is not str or type(to) is not str:
                          return "bad event"
                      if (k == "m") != (f == "") or (k == "b") != (to == ""):
                          return "bad event ends"
                      if (f != "" and f not in aset) or (to != "" and to not in aset):
                          return "an event names an address not in addrs"
              if not isinstance(a["bal"], dict) or not _sorted_keys(a["bal"]):
                  return "anchor bal must be an object with sorted keys"
              if not all(k in aset and type(v) is str and _SAT.fullmatch(v) for k, v in a["bal"].items()):
                  return "bad anchor bal"
              if not isinstance(a["reads"], dict) or list(a["reads"].keys()) != ["A", "B"]:
                  return "anchor reads must be A and B"
              for node in ("A", "B"):
                  rs = a["reads"][node]
                  if not isinstance(rs, dict) or not _sorted_keys(rs):
                      return "reads %s must be an object with sorted keys" % node
                  for k, r in rs.items():
                      if k not in a["bal"]:
                          return "reads %s: %s isn't anchored" % (node, k)
                      if not isinstance(r, list) or len(r) != 3 or not _safe_int(r[0]) or r[0] < h["to"] or r[0] > a["at"]:
                          return "reads %s: %s must be [h, balance, eff] read between the hour's end and the anchor block" % (node, k)
                      if type(r[1]) is not str or not _SAT.fullmatch(r[1]) or type(r[2]) is not str or not (r[2] == "" or _SAT.fullmatch(r[2])):
                          return "reads %s: bad numbers for %s" % (node, k)
              if h["kind"] != "live" and (a["reads"]["A"] or a["reads"]["B"]):
                  return "a %s hour carries no reads" % h["kind"]
              if h["kind"] == "live":
                  for node in ("A", "B"):
                      for k in a["bal"]:
                          if k not in a["reads"][node]:
                              return "a live hour reads every anchored address on both nodes (%s on %s)" % (k, node)
              return None


          def deltas_of(h, with_tail=True):
              out = []

              def take(b, start):
                  for i, v in enumerate(b["burns"]):
                      out.append({"h": start + i, "a": h["addrs"][b["sig"][i]], "d": -int(v), "inc": 0, "kind": "burn", "c": None})
                  for eh, k, f, t, v in b["events"]:  # kind and c (the other address): D-172's void record only
                      x = int(v)
                      if k != "m":
                          out.append({"h": eh, "a": f, "d": -x, "inc": 0, "kind": "burn" if k == "b" else "out", "c": None if k == "b" else t})
                      if k != "b":
                          out.append({"h": eh, "a": t, "d": x, "inc": x, "kind": "mint" if k == "m" else "in", "c": None if k == "m" else f})
              take(h, h["from"])
              if with_tail:
                  take(h["tail"], h["to"] + 1)
              return out


          def _block_of(f, x):
              if f["from"] <= x <= f["to"]:
                  i = x - f["from"]
                  return "%s|%s|%s" % (f["addrs"][f["sig"][i]], f["ids"][i], f["burns"][i])
              if f["to"] < x <= f["anchor"]["at"]:
                  i = x - f["to"] - 1
                  t = f["tail"]
                  return "%s|%s|%s" % (f["addrs"][t["sig"][i]], t["ids"][i], t["burns"][i])
              return None


          def _events_in(f, x0, x1):
              return "|".join(canon(e)[:-1] for e in f["events"] + f["tail"]["events"] if x0 <= e[0] <= x1)


          def _fail(why):
              return {"ok": False, "why": why}


          def check_hour(prev_text, text):
              """Same answers as checkHour in vhp-data.js."""
              try:
                  h = json.loads(text)
                  if canon(h) != text:
                      return _fail("not in canonical form")
              except Exception:
                  return _fail("not JSON")
              bad = _check_shape(h)
              if bad:
                  return _fail(bad)
              prev = None
              if prev_text:
                  try:
                      prev = json.loads(prev_text)
                  except Exception:
                      return _fail("previous file is not JSON")
                  if h["prev"] != sha_hex(prev_text):
                      return _fail("the hash chain is broken (prev isn't the previous file's sha256)")
                  if h["n"] != prev["n"] + 1:
                      return _fail("hours must be consecutive")
                  if prev["kind"] != "rebuilt" and h["kind"] == "rebuilt":
                      return _fail("a rebuilt hour can't follow a %s one" % prev["kind"])
                  if h["anchor"]["at"] < prev["anchor"]["at"]:
                      return _fail("anchors go forward")
                  if h["kind"] == "chained" and h["anchor"]["at"] != max(h["to"], prev["anchor"]["at"]):
                      return _fail("a chained hour's anchor is its own last block, or the previous anchor if that is later")
                  for x in range(h["from"], prev["anchor"]["at"] + 1):
                      if _block_of(prev, x) != _block_of(h, x):
                          return _fail("block %d differs from the previous hour's tail" % x)
                  if _events_in(prev, h["from"], prev["anchor"]["at"]) != _events_in(h, h["from"], prev["anchor"]["at"]):
                      return _fail("the events after the previous hour differ from its tail")
              elif h["prev"] != "":
                  return _fail("the first file must have an empty prev")
              elif h["kind"] == "chained":
                  return _fail("a chained hour needs the hour before it")
              bal = h["anchor"]["bal"]
              addrs = list(bal.keys())
              for s in [h["addrs"][i] for i in h["sig"] + h["tail"]["sig"]]:
                  if s not in bal:
                      return _fail("signer %s has no anchor" % s)
              ds = deltas_of(h)
              by_a = {}
              for x in ds:
                  by_a.setdefault(x["a"], []).append(x)

              def after(a, h0):
                  return sum(x["d"] for x in by_a.get(a, ()) if x["h"] > h0)
              if prev is not None:
                  for a in prev["anchor"]["bal"]:
                      if a not in bal:
                          return _fail("%s was anchored before and must stay anchored" % a)
                  for a in addrs:
                      if a not in prev["anchor"]["bal"]:
                          continue
                      v = int(prev["anchor"]["bal"][a]) + after(a, prev["anchor"]["at"])
                      if v != int(bal[a]):
                          return _fail("%s: the previous anchor plus the changes since isn't this anchor (%d vs %s)" % (a, v, bal[a]))
              for a in addrs:
                  v = int(bal[a])
                  for x in sorted(by_a.get(a, ()), key=lambda x: -x["h"]):
                      v -= x["d"]
                      if v < 0:
                          return _fail("%s: the rebuild goes below zero (a missed event)" % a)
              hsh = sha_hex(text)
              if h["kind"] != "live":
                  return {"ok": True, "quality": "ok", "flagged": [], "hash": hsh}
              reads = h["anchor"]["reads"]
              for node in ("A", "B"):
                  for a in addrs:
                      rh, rb, _ = reads[node][a]
                      if int(rb) + after(a, rh) != int(bal[a]):
                          return _fail("%s: node %s's balance read at block %d plus the changes since isn't the anchor" % (a, node, rh))

              def eff_of(a, H):
                  b, recv = int(bal[a]), 0
                  for x in by_a.get(a, ()):
                      if x["h"] >= H:
                          b -= x["d"]
                      elif x["h"] >= H - DELAY + 1:
                          recv += x["inc"]
                  e = b - recv
                  return e if e > 0 else 0
              missed, nxt, head = [], True, True
              for a in addrs:
                  ra, rb = reads["A"][a], reads["B"][a]
                  if ra[2] == "" or rb[2] == "":
                      missed.append("%s (no answer)" % a)
                      continue
                  for r in (ra, rb):
                      v = int(r[2])
                      if v != eff_of(a, r[0] + 1):
                          nxt = False
                      if v != eff_of(a, r[0]):
                          head = False
              eff_at = "next" if nxt else "head" if head else ""
              if missed or not eff_at:
                  return {"ok": True, "quality": "flagged", "flagged": ["*"], "hash": hsh,
                          "why": ("effective balance not answered: " + ", ".join(missed)) if missed
                          else "the effective balances match the rebuild neither at the block after each read nor at each read block"}
              return {"ok": True, "quality": "ok", "flagged": [], "effAt": eff_at, "hash": hsh}


          def check_day(text, prev_hour_text):
              try:
                  d = json.loads(text)
                  if not isinstance(d, dict) or canon(d) != text:
                      return _fail("not in canonical form")
              except Exception:
                  return _fail("not JSON")
              if list(d.keys()) != ["v", "n", "from", "to", "hashes", "hours"] or type(d["v"]) is not int or d["v"] != DATA_VERSION:
                  return _fail("fields must be v, n, from, to, hashes, hours")
              if not _safe_int(d["n"]) or not _safe_int(d["from"]) or not _safe_int(d["to"]) or d["from"] != d["n"] * DAY or d["to"] != d["from"] + DAY - 1:
                  return _fail("from/to must be day n")
              if not isinstance(d["hours"], list) or len(d["hours"]) != 24 or not isinstance(d["hashes"], list) or len(d["hashes"]) != 24:
                  return _fail("a day holds 24 hours")
              prev, flagged = prev_hour_text or "", []
              for i in range(24):
                  hr = d["hours"][i]
                  if not isinstance(hr, dict) or hr.get("n") != d["n"] * 24 + i:
                      return _fail("hour %d is not block-hour %d" % (i, d["n"] * 24 + i))
                  t = canon(hr)
                  if sha_hex(t) != d["hashes"][i]:
                      return _fail("hour %d: its sha256 isn't the one listed" % i)
                  r = check_hour(prev, t)
                  if not r["ok"]:
                      return _fail("hour %d: %s" % (i, r["why"]))
                  if r["quality"] == "flagged":
                      flagged.append({"n": hr["n"], "flagged": r["flagged"]})
                  prev = t
              return {"ok": True, "flagged": flagged, "last": prev}


          def timeline_from(hours, checks=None):
              if not hours:
                  raise ValueError("no hours")
              signers, ids, deltas, bad, rebuilt, pending = [], [], [], [], [], []
              for i, h in enumerate(hours):
                  if i and h["n"] != hours[i - 1]["n"] + 1:
                      raise ValueError("hours %d and %d aren't consecutive" % (hours[i - 1]["n"], h["n"]))
                  signers.extend(h["addrs"][s] for s in h["sig"])
                  ids.extend(h["ids"])
                  deltas.extend(deltas_of(h, i == len(hours) - 1))
                  if h["kind"] == "rebuilt":
                      rebuilt.append({"h0": h["from"], "h1": h["to"]})
                  elif h["kind"] == "chained" and not any(x["kind"] == "live" for x in hours[i + 1:]):
                      pending.append({"h0": h["from"], "h1": h["to"]})
                  c = checks[i] if checks else None
                  if c and c["quality"] == "flagged":
                      if "*" in c["flagged"]:
                          bad.append({"h0": h["from"], "h1": h["to"]})
                      else:
                          bad.extend({"h0": h["from"], "h1": h["to"], "a": a} for a in c["flagged"])
              last = hours[-1]
              anchors = {a: {"h": last["anchor"]["at"], "v": int(v)} for a, v in last["anchor"]["bal"].items()}
              return {"from": hours[0]["from"], "to": last["to"], "signers": signers, "ids": ids, "deltas": deltas,
                      "anchors": anchors, "bad": bad, "rebuilt": rebuilt, "pending": pending}


          # ── the publish job (.github/workflows/vhp-ruler.yml runs this whole file, then publish_main) ──
          # canonical numbers only (Repo Lens #D-10 M-5): h/024010.json can't stand beside h/24010.json
          _HOUR_FILE, _DAY_FILE = re.compile(r"h/(0|[1-9][0-9]{0,8})\.json"), re.compile(r"d/(0|[1-9][0-9]{0,8})\.json")
          # MIN_KEEP_DAYS: Repo Lens #G-9 G9-1, a 6-day race's card needs about 25.3 days of hours when the week closes
          MAX_HOUR_BYTES, MAX_DAY_BYTES, MIN_KEEP_DAYS = 4 << 20, 16 << 20, 26


          def _read_tree(d):
              """{relative path: text} for h/*.json and d/*.json under d (other files are an error, reported by the caller)."""
              import os
              out, other = {}, []
              if not d or not os.path.isdir(d):
                  return out, other
              for root, dirs, files in os.walk(d):
                  for f in files:
                      p = os.path.relpath(os.path.join(root, f), d).replace(os.sep, "/")
                      if p in ("remove.txt", "verify.txt"):
                          continue
                      if os.path.islink(os.path.join(root, f)) or not (_HOUR_FILE.fullmatch(p) or _DAY_FILE.fullmatch(p)):
                          other.append(p)
                          continue
                      with open(os.path.join(root, f), "rb") as fh:
                          raw = fh.read()
                      try:
                          out[p] = raw.decode("utf-8")
                      except UnicodeDecodeError:
                          other.append(p)
              return out, other


          def _num_inside(text):
              try:
                  n = json.loads(text).get("n")
                  return n if _safe_int(n) else None
              except Exception:
                  return None


          def publish_check(incoming, published, removals, keep_days):
              """incoming / published: {path: text}; removals: paths the run asks to remove. Returns (errors, warnings)."""
              errs, warns = [], []
              keep_days = max(MIN_KEEP_DAYS, keep_days)
              hours = {int(_HOUR_FILE.fullmatch(p).group(1)): t for p, t in published.items() if _HOUR_FILE.fullmatch(p)}
              days = {int(_DAY_FILE.fullmatch(p).group(1)): t for p, t in published.items() if _DAY_FILE.fullmatch(p)}
              new_h = {int(_HOUR_FILE.fullmatch(p).group(1)): t for p, t in incoming.items() if _HOUR_FILE.fullmatch(p)}
              new_d = {int(_DAY_FILE.fullmatch(p).group(1)): t for p, t in incoming.items() if _DAY_FILE.fullmatch(p)}
              empty = not hours and not days
              for n, t in list(new_h.items()):
                  if _num_inside(t) != n:
                      errs.append("h/%d.json holds another hour's number" % n)   # #D-10 L-12
                  if len(t.encode("utf-8")) > MAX_HOUR_BYTES:
                      errs.append("h/%d.json is over %d bytes" % (n, MAX_HOUR_BYTES))
                  if n in hours:
                      if hours[n] != t:
                          errs.append("h/%d.json is already published and can't be rewritten" % n)
                      del new_h[n]
              for n, t in list(new_d.items()):
                  if _num_inside(t) != n:
                      errs.append("d/%d.json holds another day's number" % n)
                  if len(t.encode("utf-8")) > MAX_DAY_BYTES:
                      errs.append("d/%d.json is over %d bytes" % (n, MAX_DAY_BYTES))
                  if n in days:
                      if days[n] != t:
                          errs.append("d/%d.json is already published and can't be rewritten" % n)
                      del new_d[n]

              def hour_text(n):
                  for src in (hours, new_h):
                      if n in src:
                          return src[n]
                  for src in (days, new_d):
                      if n // 24 in src:
                          try:
                              return canon(json.loads(src[n // 24])["hours"][n % 24])
                          except Exception:
                              return None
                  return None
              known = set(hours) | {d * 24 + i for d in days for i in range(24)}
              newest = max(known) if known else None
              # new hours: consecutive, after the newest published one, each checked against the one before
              if new_h:
                  ns = sorted(new_h)
                  if ns != list(range(ns[0], ns[0] + len(ns))):
                      errs.append("new hours must be consecutive")
                  elif newest is not None and ns[0] != newest + 1:
                      errs.append("the first new hour must be h/%d.json" % (newest + 1))
                  else:
                      prev = hour_text(ns[0] - 1) if newest is not None else ""
                      if prev is None:
                          errs.append("the hour before h/%d.json isn't published" % ns[0])
                      elif not empty and prev == "":
                          errs.append("only the very first publish may start a chain")
                      else:
                          for n in ns:
                              r = check_hour(prev, new_h[n])
                              if not r["ok"]:
                                  errs.append("h/%d.json: %s" % (n, r["why"]))
                                  break
                              if r["quality"] == "flagged":
                                  warns.append("h/%d.json is flagged: %s" % (n, r.get("why", "")))
                              prev = new_h[n]
              # new days (#D-10 M-6): only roll up hours that already exist (published or new h/ files), byte for byte; the
              # chain is checked from the hour before
              for d in sorted(new_d):
                  try:
                      hrs = json.loads(new_d[d])["hours"]
                      texts = [canon(h) for h in hrs]
                  except Exception:
                      errs.append("d/%d.json is not a day file" % d)
                      continue
                  missing = [d * 24 + i for i in range(len(texts)) if (hours.get(d * 24 + i) or new_h.get(d * 24 + i)) != texts[i]]
                  if len(texts) != 24 or missing:
                      errs.append("d/%d.json: its hours must be published (or new) hour files, byte for byte (hour %s)" % (d, missing[0] if missing else "count"))
                      continue
                  first_prev = json.loads(texts[0]).get("prev")
                  prev = hour_text(d * 24 - 1)
                  if prev is None:
                      if first_prev != "" or d * 24 != min(known | set(new_h)):   # only the day that starts the chain
                          errs.append("d/%d.json: the hour before it isn't available" % d)
                          continue
                      prev = ""
                  r = check_day(new_d[d], prev)
                  if not r["ok"]:
                      errs.append("d/%d.json: %s" % (d, r["why"]))
              # removals: an hour only once a day file holds it (same sha256); days only beyond retention, oldest first, with
              # no hole (#D-10 M-6); newest day from the hour files themselves
              all_days = dict(days)
              all_days.update(new_d)
              hour_ns = set(hours) | set(new_h)
              newest_day = (max(hour_ns) // 24) if hour_ns else (max(all_days) if all_days else 0)
              day_rm = []
              for p in removals:
                  m_h, m_d = _HOUR_FILE.fullmatch(p), _DAY_FILE.fullmatch(p)
                  if m_h:
                      n = int(m_h.group(1))
                      if n not in hours:
                          errs.append("remove %s: not published" % p)
                      elif n // 24 not in all_days or json.loads(all_days[n // 24])["hashes"][n % 24] != sha_hex(hours[n]):
                          errs.append("remove %s: no day file holds it" % p)
                  elif m_d:
                      n = int(m_d.group(1))
                      if n not in days:
                          errs.append("remove %s: not published" % p)
                      elif n >= newest_day - keep_days:
                          errs.append("remove %s: still inside the %d days kept" % (p, keep_days))
                      day_rm.append(n)
                  else:
                      errs.append("remove %s: not a vhp-data file" % p)
              if day_rm and sorted(day_rm) != sorted(days)[:len(day_rm)]:
                  errs.append("days are removed oldest first, with no hole")
              return errs, warns


          def _rpc(url, method, params, timeout=60):
              import urllib.request
              body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode("utf-8")
              req = urllib.request.Request(url, data=body, headers={"content-type": "application/json", "user-agent": "knode-vhp-ruler-publish"})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          out = json.loads(r.read().decode("utf-8"))
                      if "error" in out:
                          raise ValueError(str(out["error"])[:200])
                      return out["result"]
                  except Exception:
                      if attempt == 3:
                          raise
                      import time
                      time.sleep(2 * (attempt + 1))


          def verify_blocks(new_hours, url):
              """Repo Lens #D-10 M-1: the record job's files prove consistency, not truth. Every new block's id and signer (and
              each anchor block's id) must also be what a node says when this job, with no repository code, asks it itself.
              Returns a list of errors."""
              want = {}
              for t in new_hours:
                  h = json.loads(t)
                  for part, start in ((h, h["from"]), (h["tail"], h["to"] + 1)):
                      for i, idx in enumerate(part["sig"]):
                          want[start + i] = (part["ids"][i], h["addrs"][idx])
              if not want:
                  return []
              head = _rpc(url, "chain.get_head_info", {})
              head_id, lib = head["head_topology"]["id"], int(head.get("last_irreversible_block", 0))
              hs = sorted(want)
              if hs[-1] > lib:
                  return ["block %d isn't irreversible on the checking node yet (it is at %d); tried again next run" % (hs[-1], lib)]
              from concurrent.futures import ThreadPoolExecutor
              runs, k = [], 0
              while k < len(hs):
                  s, e = hs[k], hs[k]
                  while k + 1 < len(hs) and hs[k + 1] == e + 1 and e - s < 99:
                      k += 1
                      e = hs[k]
                  runs.append((s, e))
                  k += 1

              def fetch(r):
                  s, e = r
                  res = _rpc(url, "block_store.get_blocks_by_height", {"head_block_id": head_id, "ancestor_start_height": str(s),
                             "num_blocks": e - s + 1, "return_block": True, "return_receipt": False})
                  return [(int(it["block_height"]), str(it["block_id"]), str(it["block"]["header"]["signer"])) for it in res.get("block_items", [])]
              errs, got = [], {}
              ex = ThreadPoolExecutor(max_workers=4)
              try:
                  for items in ex.map(fetch, runs):   # results in order; the first failure raises here
                      for hh, bid, sg in items:
                          got[hh] = (bid, sg)
              finally:
                  # Repo Lens #B-5 N-9: on a failure, drop the batches still queued instead of waiting for all of them
                  ex.shutdown(wait=True, cancel_futures=True)
              for hh in hs:
                  if hh not in got:
                      errs.append("the checking node didn't return block %d" % hh)
                  elif got[hh] != want[hh]:
                      errs.append("block %d: the checking node says id %s signer %s, the file says id %s signer %s" % (hh, got[hh][0], got[hh][1], want[hh][0], want[hh][1]))
                  if len(errs) >= 5:
                      break
              return errs


          def publish_main(argv):
              """argv: incoming dir, published dir, keep days. Env RPC_VERIFY (a third node, optional) or RPC_CHECK: every new
              block is read again there by this job. Exit 0 = publish, 1 = refuse."""
              import os
              inc_dir, pub_dir, keep = argv[0], argv[1], int(argv[2])
              incoming, other = _read_tree(inc_dir)
              published, _ = _read_tree(pub_dir)
              removals = []
              rf = os.path.join(inc_dir, "remove.txt")
              if os.path.exists(rf):
                  with open(rf, encoding="utf-8") as fh:
                      removals = [x for x in fh.read().split("\n") if x]
              errs, warns = publish_check(incoming, published, removals, keep)
              for p in other:
                  errs.append("unexpected file %s" % p)
              new_hours = [t for p, t in sorted(incoming.items()) if p.startswith("h/") and p not in published]
              if not errs and new_hours:
                  # #D-10 M-1: the record job runs repository code and npm packages; this job runs neither, and reads every new
                  # block's id and signer again itself. On RPC_VERIFY (a third node) when one is set, else on RPC_CHECK.
                  v = os.environ.get("RPC_VERIFY", "").strip() or os.environ.get("RPC_CHECK", "").strip()
                  if not v:
                      errs.append("no node to check the blocks on: set RPC_CHECK (or RPC_VERIFY)")
                  else:
                      try:
                          errs.extend(verify_blocks(new_hours, v))
                      except Exception as e:
                          errs.append("couldn't check the blocks independently (%s); tried again next run" % str(e)[:200])
              for w in warns:
                  print("::warning::" + w)
              for e in errs:
                  print("::error::" + e)
              if not errs:
                  print("ok: %d new hour(s), %d new day(s), %d removal(s); every new block checked independently" % (
                      len(new_hours), sum(1 for p in incoming if p.startswith("d/") and p not in published), len(removals)))
              return 1 if errs else 0


          def load_ledger(data_dir):
              """A Ledger over the published vhp-data (h/ and d/ files), every hour checked in order. For a game's publish job:
              recompute its cards from the ruler's data (§7). Returns (Ledger, checks)."""
              tree, _ = _read_tree(data_dir)
              texts = {}
              for p, t in tree.items():
                  m = _DAY_FILE.fullmatch(p)
                  if m:
                      d = json.loads(t)
                      for i, hr in enumerate(d["hours"]):
                          texts[d["n"] * 24 + i] = canon(hr)
              for p, t in tree.items():
                  m = _HOUR_FILE.fullmatch(p)
                  if m:
                      texts[int(m.group(1))] = t
              ns = sorted(texts)
              if not ns or ns != list(range(ns[0], ns[0] + len(ns))):
                  raise ValueError("the vhp-data hours aren't consecutive")
              checks, prev = [], None
              for n in ns:
                  t = texts[n]
                  # the oldest kept hour starts the chain (older ones were removed after retention)
                  r = check_hour(prev, t) if prev is not None else _first_kept(t)
                  if not r["ok"]:
                      raise ValueError("h/%d.json: %s" % (n, r["why"]))
                  checks.append(r)
                  prev = t
              return Ledger(timeline_from([json.loads(texts[n]) for n in ns], checks)), checks


          def check_kept(text):
              """The oldest KEPT hour (its predecessor removed after retention): its own checks without the chain link, as
              checkKept in vhp-data.js. A chained one is checked like a rebuilt one (Repo Lens #B-5 / #E-14 N-4)."""
              try:
                  h = json.loads(text)
              except Exception:
                  return _fail("not JSON")
              if not isinstance(h, dict):
                  return _fail("not an hour")
              stub = dict(h)
              stub["prev"] = ""
              if stub.get("kind") == "chained":
                  stub["kind"] = "rebuilt"
              r = check_hour("", canon(stub))
              if r["ok"]:
                  r = dict(r)
                  r["hash"] = sha_hex(text)
              return r


          def _first_kept(t):
              r = check_kept(t)
              if not r["ok"]:
                  raise ValueError("h/%s.json: %s" % (_num_inside(t), r["why"]))
              return r


          def recompute_main(argv):
              """argv: vhp-data dir, card file, the game's settings (a JSON file: {game, round, window, c, minK, poolRule, ownRule,
              paying, pooled}, from the game's own code, never from the card). Exit 0 = the card is exactly what the data gives."""
              L, _ = load_ledger(argv[0])
              with open(argv[1], encoding="utf-8") as fh:
                  card = fh.read()
              with open(argv[2], encoding="utf-8") as fh:
                  game = json.load(fh)
              same, diff = recompute(L, card, game)
              print("ok: the card matches the ruler's data" if same else "::error::the card doesn't match the ruler's data: " + diff)
              return 0 if same else 1
          # END vhp_ruler.py
          KIT_RULER_PY
          cat > "$RUNNER_TEMP/ruler-code/kit_cards.py" <<'KIT_CARDS_PY'
          import sys, os, json, hashlib, re
          sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
          import vhp_ruler as V
          data, ind, pubd, outp = sys.argv[1:5]
          def names(d):
              out = []
              if os.path.isdir(d):
                  out += [f for f in sorted(os.listdir(d)) if re.fullmatch(r"W([0-9]{3}|[1-9][0-9]{3})[.]json", f)]
              i = os.path.join(d, "inputs")
              if os.path.isdir(i):
                  out += ["inputs/" + f for f in sorted(os.listdir(i)) if re.fullmatch(r"W(0|[1-9][0-9]{0,3})[.]json", f)]
              return out
          HEX = re.compile(r"[0-9a-f]{64}")
          def entries(j):
              """A file's cards, only if the file is well formed: a dict whose cards is a list of [settings dict, sha256] with no
              sha256 twice (the check holds anything else; nothing from a malformed file is rebuilt)."""
              if not isinstance(j, dict) or not isinstance(j.get("cards"), list):
                  return None
              seen, out = set(), []
              for x in j["cards"]:
                  if not (isinstance(x, list) and len(x) == 2 and isinstance(x[0], dict) and isinstance(x[1], str) and HEX.fullmatch(x[1])):
                      return None
                  if x[1] in seen:
                      return None
                  seen.add(x[1]); out.append((x[0], x[1]))
              return out
          refs = {}
          for rel in names(ind):
              p, q = os.path.join(ind, rel), os.path.join(pubd, rel)
              if os.path.islink(p) or not os.path.isfile(p):
                  continue
              raw = open(p, "rb").read()
              if os.path.isfile(q) and open(q, "rb").read() == raw:
                  continue
              try:
                  j = json.loads(raw)
              except ValueError:
                  continue
              for s, h in entries(j) or []:
                  # #G-24 G24-1: every entry is rebuilt against ITS OWN settings: the key is the pair, never the sha256 alone.
                  refs[json.dumps([s, h], sort_keys=True, separators=(",", ":"))] = (s, h)
          ok, bad = [], {}
          if refs:
              L, _ = V.load_ledger(data)
              for key, (s, h) in sorted(refs.items()):
                  try:
                      V.check_settings(s)
                      card = V.make_card(L, s["game"], s["round"], s["window"], int(s["c"]), s["ownRule"], s["paying"], s["pooled"], s["minK"], s["poolRule"])
                      got = hashlib.sha256(V.card_json(V.score_card(L, card)).encode("utf-8")).hexdigest()
                      if got == h:
                          ok.append([s, h])
                      else:
                          bad[key] = "the ruler's data gives " + got
                  except Exception as e:
                      bad[key] = str(e)[:200]
          os.makedirs(os.path.dirname(outp), exist_ok=True)
          with open(outp, "w") as fh:
              json.dump({"ok": ok, "bad": bad}, fh, sort_keys=True)
          print("%d card(s) rebuilt, %d differ or failed" % (len(ok), len(bad)))
          KIT_CARDS_PY
      - name: Check and push the kit games' files (no repository code)
        env:
          KIT_CARDS_DIR: ${{ runner.temp }}/kit-cards
          GH_TOKEN: ${{ github.token }}
          IN: ${{ runner.temp }}/incoming
          LIST: ${{ runner.temp }}/kit-publish.txt
          KIT_GAMES: '[{"slug":"fantasy","game":4,"genesis":1792368000000,"weekMs":604800000,"sundayFunRound":true,"payoutRule":"d152","vaultValues":"dense255","entry":{"minRounds":1,"minPoints":1},"minPts":0,"rowCap":0,"maxRoundPoints":90000,"liveWeek":false,"roundsCorrectable":false,"inputsFile":true,"vhpData":true,"cardPerRound":true}]'
          CHECK_NOW_MS: ""      # the job's own clock, always (KC-29)
          # The owner's releases, read by the check itself: a recorder run can't release its own hold (KC-3).
          KIT_RELEASE_FANTASY: ${{ vars.FANTASY_RELEASE }}
        run: |
          set -euo pipefail
          if [ ! -d "$IN" ]; then echo "Nothing to publish."; exit 0; fi
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUB=$(mktemp -d)
          git init -q work && cd work
          git config user.name "knode-games-bot"; git config user.email "knode-games-bot@users.noreply.github.com"
          parent=""
          if git fetch -q --depth 1 "$remote" games-data 2>/dev/null; then
            parent=$(git rev-parse FETCH_HEAD); git read-tree FETCH_HEAD
            for g in fantasy; do
              mkdir -p "$PUB/$g/vault" "$PUB/$g/inputs"
              { git ls-tree --name-only "$parent:$g" 2>/dev/null || true; } | while IFS= read -r f; do
                if [[ "$f" =~ ^(board|alltime|W([0-9]{3}|[1-9][0-9]{3}))\.json$ ]]; then git show "$parent:$g/$f" > "$PUB/$g/$f"; fi
              done
              { git ls-tree --name-only "$parent:$g/inputs" 2>/dev/null || true; } | while IFS= read -r f; do
                if [[ "$f" =~ ^W(0|[1-9][0-9]{0,3})\.json$ ]]; then git show "$parent:$g/inputs/$f" > "$PUB/$g/inputs/$f"; fi
              done
              { git ls-tree --name-only "$parent:$g/vault" 2>/dev/null || true; } | while IFS= read -r f; do
                if [[ "$f" =~ ^((HOLD-|RELEASE-)?W(0|[1-9][0-9]{0,3}))\.json$ ]]; then git show "$parent:$g/vault/$f" > "$PUB/$g/vault/$f"; fi
              done
            done
          else
            set +e; git ls-remote --exit-code --heads "$remote" refs/heads/games-data >/dev/null 2>&1; rc=$?; set -e
            if [ "$rc" -ne 2 ]; then echo "::error::The games-data branch could not be fetched (git ls-remote exit $rc): nothing published."; exit 1; fi
            git read-tree --empty
          fi
          # G3: rebuild every new ruler card with the embedded vhp_ruler.py (no repository code); the check holds the rest.
          for g in fantasy; do
            python3 -I -B "$RUNNER_TEMP/ruler-code/kit_cards.py" "$RUNNER_TEMP/vhp-data" "$IN/$g" "$PUB/$g" "$RUNNER_TEMP/kit-cards/$g.json" || echo "::error::$g: its ruler cards couldn't be rebuilt this run; its new files are held"
          done
          # The kit's publish check, inline (kit/publish/check.inline.mjs byte for byte): it judges every file against the
          # published copy and this job's own clock, and lists only what may be published.
          node --input-type=module - "$IN" "$PUB" "$LIST" <<'KIT_CHECK_INLINE'
          // Shared Game Kit: the publish check (GAME_KIT.md §3, RECORDER_STANDARD §3, §4, §6; D-158).
          //
          // ONE self-contained Node script: it imports nothing but node:fs, node:path and node:crypto. The publish job runs no
          // repository code, so tools/kit-render-workflows.mjs copies this file VERBATIM into each data branch's publish job
          // (a test fails if the committed workflow differs). The recorder imports the same file for its week tally, so the
          // recorder and the publish job count a week with one implementation; tests compare it with each game's own math.js.
          //
          // It judges a recorder run's files against what is ALREADY published and against this job's own clock, never against
          // the run's own claims. A file that fails is held (not published); one game's bad file holds only that game's file,
          // never the job or another game (RECORDER §6.4). It writes the list of files to publish; the workflow copies only those.
          //
          // Week file (W<NNN>.json, one per vault week, kit format v2):
          //   { v: 2, game, week, start, end, min, state: "open" | "pending" | "final", seen: { hash, at },
          //     rounds:  [[id, day, fun 0|1, status "s"|"v"|"p", [[i, points] | [i, points, at], …]], …]   by id; rows by i
          //     players: [[wallet, stake, peak, voided 0|1], …] }                                            by wallet
          //   i = the wallet's index in `players`; `at` (the score time, D-159) only on a row with points, in ms after the week's
          //   start and before its results deadline (start ≤ score time < end + 3 days; #B-12 NK-3, NK-19). About 19 bytes a
          //   scored row: ~1,900 wallets answering all 60 questions fit the recorder's 1.9 MB cap (GAME_KIT.md §6 limits).
          //   status: "s" scored · "v" void (nothing scores) · "p" pending (not decided yet; rows hold points 0)
          //   Rows record every wallet that took part in the round (points 0 included), so the entry rule ("at least N counted
          //   rounds") is re-checked here without a per-game scorer.
          //   seen.hash covers what decides the week (counted rounds, their wallets, stakes, min), never Sunday fun rounds
          //   (KC-5); seen.at is when a run first read that hash, and the job holds it to its own clock (KC-1).
          import fs from "node:fs";
          import path from "node:path";
          import crypto from "node:crypto";

          // The job's clock, taken when this file loads (the conformance sandbox loads it before it traps the clock, #E-26 NE-4).
          const KIT_NOW = Date.now.bind(Date);

          export const KIT_FILE_VERSION = 2;
          export const DAY = 86400000;
          export const HOUR = 3600000;
          export const WEEK = 7 * DAY;
          export const MAX_FILE_BYTES = 2 * 1024 * 1024;      // the publish job's cap (RECORDER §6.3)
          export const RESULTS_DAYS = 3;                      // the vault takes a week's results file for 3 days (VAULT §6)
          export const STABLE_MS = HOUR;                      // final once two runs at least an hour apart read the same (D-135)
          export const MAX_PER_PLACE = 10;                    // the vault takes at most 10 wallets per free place
          export const MAX_VAULT_POINTS = 255;
          export const FUTURE_SLACK_MS = 10 * 60000;          // a recorder's "seen at" may run this far ahead of the job's clock
          // How far behind the job's clock a NEW seen.at may be (KC-1), derived from the workflow's own limits (#B-12 NK-11):
          //   MAX_BEHIND_MS  the chain time a recorder stamps may lag the runner's clock this much (the recorder stops beyond it);
          //   JOB_WAIT_MS    from a kit record job's start to the publish job's check: the hand-written record job (≤ 30 min) and
          //                  publish job (≤ 10 min) it waits for, plus 5 for its own setup. tools/kit-render-workflows.mjs refuses
          //                  a workflow whose timeouts don't fit (RECORD_TIMEOUT_MIN, LEGACY_*_MAX_MIN in kit/publish/render.mjs).
          export const MAX_BEHIND_MS = 15 * 60000;
          export const JOB_WAIT_MS = 45 * 60000;
          export const FRESH_MS = MAX_BEHIND_MS + JOB_WAIT_MS;
          // A final needs its content first read at least this long ago: a pending copy is published at most FRESH_MS after its
          // seen.at, so the final then comes at least an hour after the pending copy was published (D-135; #B-12 NK-8).
          export const FINAL_WAIT_MS = STABLE_MS + FRESH_MS;
          export const MAX_ROUNDS = 10000;                    // the recorder refuses more too (KC-11)
          export const MAX_PLAYERS = 20000;                   // wallets with an entry THIS week (KC-9)
          export const DATA_BRANCHES = ["games-data", "race-data", "games-data-testnet"];   // KC-23

          const ADDR = /^1[1-9A-HJ-NP-Za-km-z]{25,34}$/;
          const DIGITS = /^(0|[1-9][0-9]{0,30})$/;
          export const isAddr = (a) => typeof a === "string" && ADDR.test(a);
          export const nat = (x) => Number.isSafeInteger(x) && x >= 0;
          export const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
          /** The recorders' own JSON form: JSON.stringify of the value plus a newline (the publish job checks exact bytes). */
          export const canon = (o) => JSON.stringify(o) + "\n";
          export const pad3 = (w) => String(w).padStart(3, "0");
          /** A week file's name: W004 … W999, then W1000 … W9999 (KC-30). */
          export const weekName = (w) => `W${pad3(w)}.json`;
          const WEEK_FILE = /^W([0-9]{3}|[1-9][0-9]{3})\.json$/;
          export const sha256 = (s) => crypto.createHash("sha256").update(s).digest("hex");

          // ───────────────────────── clock ─────────────────────────
          /** A game's week clock from its config ({ genesis, weekMs }). All times UTC ms. */
          export function weekClock(cfg) {
            const genesis = cfg.genesis, wk = cfg.weekMs ?? WEEK;
            return {
              weekOf: (t) => Math.floor((t - genesis) / wk),
              start: (w) => genesis + w * wk,
              end: (w) => genesis + (w + 1) * wk,
              /** The vault's results deadline: end + 3 days (Kpred resultsDue: week_length / 7 × RESULTS_DAYS). */
              due: (w) => genesis + (w + 1) * wk + Math.floor(wk / 7) * RESULTS_DAYS,
            };
          }
          /** The UTC day a round counts for: the day its picks close in, the closing instant belonging to the day it ends
           *  (a round closing at exactly Sun 00:00 is Saturday's). */
          export const dayOf = (locksAt) => Math.floor((locksAt - 1) / DAY) * DAY;
          /** Sunday UTC (D-129): a day d is Sunday when (d / DAY + 4) % 7 === 0 (1 Jan 1970 was a Thursday). */
          export const isSunday = (day) => (((Math.floor(day / DAY) + 4) % 7) + 7) % 7 === 0;

          // ───────────────────────── the week file ─────────────────────────
          export const WEEK_KEYS = ["v", "game", "week", "start", "end", "min", "state", "seen", "rounds", "players"];
          export const STATES = ["open", "pending", "final"];
          /** Optional keys after `players`, in this order (Fantasy Phase 1). A week file without them is unchanged (and so is
           *  its hash). inputs: sha256 of the week's write-once inputs file (FC-9); carry / next: each wallet's game state at the
           *  week's start and after its last round, [[wallet, state], …] sorted (carried state, FC-5); extras: records-only JSON
           *  (Weekly Rival). None of these is recomputed here (the publish job runs no game code): the recorder's two-node
           *  reads, the stability wait and the HOLD on a changed final guard them, and the hash covers them. */
          export const WEEK_OPT_KEYS = ["inputs", "carry", "next", "extras", "cards"];
          /** cards (Phase 1b, vhpData games): every VHP ruler card the file's results (or price list) used, as
           *  [settings, sha256 of the scored card's cardJson], sorted by round then sha256. Rebuilt from vhp-data by the publish
           *  job once the inline ruler copy lands (G3); until then shape only, covered by the hash. */
          export const MAX_CARDS = 1000;
          const CARD_SETTING_KEYS = "game,round,window,c,minK,poolRule,ownRule,paying,pooled";
          const CARD_WINDOW_KEYS = "W0,W1,L,S0,S1";
          /** The key of one card entry: its settings AND its sha256 (#G-24 G24-1), the same in the check and the rebuild list. */
          export const cardKey = (s, h) => JSON.stringify(sortKeys([s, h]));
          const sortKeys = (v) => (Array.isArray(v) ? v.map(sortKeys) : v && typeof v === "object" ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, sortKeys(v[k])])) : v);
          export function isCardList(xs) {
            if (!Array.isArray(xs) || xs.length > MAX_CARDS) return false;
            if (new Set(xs.map((x) => (Array.isArray(x) ? x[1] : null))).size !== xs.length) return false;   // G24-1: no sha256 twice
            let last = null;
            for (const x of xs) {
              if (!Array.isArray(x) || x.length !== 2 || typeof x[1] !== "string" || !/^[0-9a-f]{64}$/.test(x[1])) return false;
              const s = x[0];
              if (!s || typeof s !== "object" || Array.isArray(s) || Object.keys(s).join() !== CARD_SETTING_KEYS) return false;
              if (!Number.isSafeInteger(s.game) || typeof s.round !== "string" || !/^[0-9]{1,20}$/.test(s.round) || typeof s.c !== "string" || !/^[0-9]{1,30}$/.test(s.c)) return false;
              if (!Number.isSafeInteger(s.minK) || typeof s.poolRule !== "string" || typeof s.ownRule !== "string" || typeof s.paying !== "boolean") return false;
              if (!Array.isArray(s.pooled) || s.pooled.length > 16 || !s.pooled.every(isAddr)) return false;
              const w = s.window;
              if (!w || typeof w !== "object" || Object.keys(w).join() !== CARD_WINDOW_KEYS || !Object.values(w).every((v) => Number.isSafeInteger(v) && v >= 0)) return false;
              const key = [s.round, x[1]];
              if (last !== null && (last[0] > key[0] || (last[0] === key[0] && last[1] >= key[1]))) return false;
              last = key;
            }
            return true;
          }
          export const MAX_STATE_BYTES = 4096;                // one wallet's carried state
          export const MAX_EXTRAS_BYTES = 256 * 1024;
          /** A round with its rows by wallet address: [id, day, fun, status, [[wallet, points, at], …]], `at` the absolute score
           *  time in ms (0 when no points). */
          export const resolveRound = (j, r) => [r[0], r[1], r[2], r[3], r[4].map((x) => [j.players[x[0]][0], x[1], x.length === 3 ? j.start + x[2] : 0])];
          /** The latest score-time offset a row may carry: before the week's results deadline (end + 3 days). */
          export const atLimit = (j) => j.end - j.start + RESULTS_DAYS * DAY;
          /** What decides a week's results (seen.hash): counted rounds by wallet address and the stakes of the wallets in them.
           *  Sunday fun rounds and wallets that only played them are left out (KC-5): they never change the week. */
          export function weekHash(j) {
            const rounds = j.rounds.filter((r) => !r[2]).map((r) => resolveRound(j, r));
            const used = new Set(rounds.flatMap((r) => r[4].map((x) => x[0])));
            const base = [j.game, j.week, j.min, rounds, j.players.filter((p) => used.has(p[0]))];
            const opt = WEEK_OPT_KEYS.filter((k) => j[k] !== undefined).map((k) => [k, j[k]]);
            return sha256(JSON.stringify(opt.length ? [...base, opt] : base));
          }
          const isStateList = (xs) => {
            if (!Array.isArray(xs) || xs.length > MAX_PLAYERS) return false;
            let last = null;
            for (const x of xs) {
              if (!Array.isArray(x) || x.length !== 2 || !isAddr(x[0]) || x[1] === null || x[1] === undefined) return false;
              if (last !== null && cmp(last, x[0]) >= 0) return false;
              if (Buffer.byteLength(JSON.stringify(x[1])) > MAX_STATE_BYTES) return false;
              last = x[0];
            }
            return true;
          };

          /** "" when the week file is in the kit's shape for this game and name, else why not. */
          export function weekShape(j, name, cfg) {
            const k = weekClock(cfg);
            if (!j || typeof j !== "object" || Array.isArray(j)) return "not an object";
            const keys = Object.keys(j);
            const opt = keys.slice(WEEK_KEYS.length);
            if (keys.length < WEEK_KEYS.length || !WEEK_KEYS.every((x, i) => keys[i] === x)
              || !opt.every((k, i) => WEEK_OPT_KEYS.includes(k) && (i === 0 || WEEK_OPT_KEYS.indexOf(opt[i - 1]) < WEEK_OPT_KEYS.indexOf(k)))) return "not the week file's keys in order";
            if (j.inputs !== undefined && !(typeof j.inputs === "string" && /^[0-9a-f]{64}$/.test(j.inputs))) return "inputs must be a sha256";
            if (!!cfg.inputsFile !== (j.inputs !== undefined)) return cfg.inputsFile ? "this game's week file must name its inputs file (FC-9)" : "inputs in a game without an inputs file";
            for (const k of ["carry", "next"]) if (j[k] !== undefined && !isStateList(j[k])) return `bad ${k} (sorted [wallet, state] pairs, each state at most ${MAX_STATE_BYTES} bytes)`;
            if ((j.carry === undefined) !== (j.next === undefined)) return "carry and next come together";
            if (!!cfg.vhpData !== (j.cards !== undefined)) return cfg.vhpData ? "a ruler game's week file must list its cards" : "cards in a game without ruler data";
            if (j.cards !== undefined && !isCardList(j.cards)) return "bad cards (sorted [settings, sha256] pairs, no sha256 twice)";
            // #G-24 Info: a ruler game's decided rounds each come from a card (cardPerRound, on by default): at least as many
            // distinct cards as decided rounds.
            if (cfg.cardPerRound && j.cards !== undefined) {
              const decided = j.rounds.filter((r) => r[3] === "s" || r[3] === "v").length;
              if (j.cards.length < decided) return `${decided} decided rounds but only ${j.cards.length} ruler cards (cardPerRound)`;
            }
            if (j.extras !== undefined && (j.extras === null || typeof j.extras !== "object" || Buffer.byteLength(JSON.stringify(j.extras)) > MAX_EXTRAS_BYTES)) return `bad extras (an object or list, at most ${MAX_EXTRAS_BYTES} bytes)`;
            if (j.v !== KIT_FILE_VERSION || j.game !== cfg.game) return "wrong version or game";
            if (!nat(j.week) || j.week > 9999 || name !== weekName(j.week)) return "week and name don't match";
            if (j.start !== k.start(j.week) || j.end !== k.end(j.week)) return "wrong start or end for that week";
            if (typeof j.min !== "string" || !DIGITS.test(j.min)) return "min must be a decimal string";
            if (!STATES.includes(j.state)) return "unknown state";
            const s = j.seen;
            if (!s || typeof s !== "object" || Object.keys(s).join() !== "hash,at" || !/^[0-9a-f]{64}$/.test(s.hash) || !nat(s.at)) return "bad seen";
            if (!Array.isArray(j.rounds) || j.rounds.length > MAX_ROUNDS) return `bad rounds (at most ${MAX_ROUNDS})`;
            if (!Array.isArray(j.players) || j.players.length > MAX_PLAYERS) return `bad players (at most ${MAX_PLAYERS})`;
            let last = null;
            for (const p of j.players) {
              if (!Array.isArray(p) || p.length !== 4 || !isAddr(p[0]) || typeof p[1] !== "string" || !DIGITS.test(p[1])
                || typeof p[2] !== "string" || !DIGITS.test(p[2]) || (p[3] !== 0 && p[3] !== 1)) return "bad player row";
              if (last !== null && cmp(last, p[0]) >= 0) return "players not sorted or repeated";
              last = p[0];
            }
            let lastId = null;
            for (const r of j.rounds) {
              if (!Array.isArray(r) || r.length !== 5) return "bad round";
              const [id, day, fun, st, rows] = r;
              if (typeof id !== "string" || !/^[A-Za-z0-9._:-]{1,40}$/.test(id)) return "bad round id";
              if (lastId !== null && cmp(lastId, id) >= 0) return "rounds not sorted or repeated";
              lastId = id;
              if (!nat(day) || day % DAY !== 0 || day < j.start || day >= j.end) return `round ${id}: its day is not in the week`;
              if (fun !== (cfg.sundayFunRound && isSunday(day) ? 1 : 0)) return `round ${id}: fun flag must follow its day (D-129)`;
              if (!["s", "v", "p"].includes(st)) return `round ${id}: bad status`;
              if (!Array.isArray(rows)) return `round ${id}: bad rows`;
              let lw = -1;
              for (const x of rows) {
                if (!Array.isArray(x) || !nat(x[0]) || x[0] >= j.players.length || !nat(x[1])) return `round ${id}: bad row`;
                if (x.length !== (x[1] > 0 ? 3 : 2)) return `round ${id}: a row has its score time only when it has points`;
                if (x.length === 3 && !(nat(x[2]) && x[2] < atLimit(j))) return `round ${id}: a score time outside the week's start to its results deadline`;
                if (x[0] <= lw) return `round ${id}: rows not sorted or repeated`;
                if (st !== "s" && x[1] !== 0) return `round ${id}: points in a round that isn't scored`;
                if (x[1] > (cfg.maxRoundPoints ?? 1000000)) return `round ${id}: points over the game's maximum`;
                lw = x[0];
              }
            }
            if (s.hash !== weekHash(j)) return "its hash isn't its content's";
            return "";
          }

          // ───────────────────────── the week tally (the generic recount) ─────────────────────────
          /** Paid set by the game's rule (RECORDER §4.3, D-152). `rows`: [{a, pts, at}] staked rows with pts ≥ 1, any order.
           *  legacy-tied-whole: walk score groups down until at least ceil(30%) are in; tied groups whole (the contract's walk).
           *  d152: exactly ceil(30%); a tie across the line admits wallets by `at` (reached the score first), then address. */
          export function paidSet(rows, rule) {
            const xs = rows.filter((r) => r.pts >= 1).slice().sort((u, v) => v.pts - u.pts || u.at - v.at || cmp(u.a, v.a));
            const need = Math.ceil((xs.length * 30) / 100);
            const paid = new Set();
            if (!need) return paid;
            if (rule === "legacy-tied-whole") {
              let cutoff = Infinity;
              for (let i = 0; i < xs.length; i++) { if (i >= need && xs[i].pts < cutoff) break; cutoff = xs[i].pts; paid.add(xs[i].a); }
              return paid;
            }
            if (rule === "d152") { for (let i = 0; i < need; i++) paid.add(xs[i].a); return paid; }
            throw new Error(`unknown payout rule ${rule}`);
          }

          /** The vault values for the staked rows (RECORDER §4.3, VAULT §6). `rows` come ordered (best first); `paid` from paidSet.
           *  points:   the row's own points (game 1: the contract refuses more points than answers, so values are real points).
           *  dense255: groups of equal (points, paid) take 255, 254, … so unpaid rows never share a paid row's value; a paid group
           *            the walk can't separate throws (no file rather than a wrong one). */
          export function vaultValues(rows, paid, mode) {
            if (mode === "points") {
              for (const r of rows) if (!(r.pts >= 1 && r.pts <= MAX_VAULT_POINTS)) throw new Error(`${r.a}: ${r.pts} points can't go in a vault file (1-255)`);
              return rows.map((r) => ({ player: r.a, points: r.pts }));
            }
            if (mode !== "dense255") throw new Error(`unknown vault values ${mode}`);
            const key = (r) => `${r.pts}|${paid.has(r.a) ? 1 : 0}`;
            // Groups best first: more points first; inside equal points the paid part first (whatever order the rows came in).
            const order = [...new Set(rows.map(key))].sort((x, y) => Number(y.split("|")[0]) - Number(x.split("|")[0]) || Number(y.split("|")[1]) - Number(x.split("|")[1]));
            const vals = new Map(order.map((k, i) => [k, Math.max(1, MAX_VAULT_POINTS - i)]));
            const out = rows.map((r) => ({ player: r.a, points: vals.get(key(r)) }));
            const minPaid = Math.min(...out.filter((x) => paid.has(x.player)).map((x) => x.points));
            if (out.some((x) => !paid.has(x.player) && x.points >= minPaid)) throw new Error("more paid places than vault values: an unpaid row would share a paid value");
            return out;
          }

          /** A port of the contract's winners walk (Kpred finalizeGameStep): the cutoff over posted values. */
          export function contractWinners(vrows) {
            const need = Math.ceil((vrows.length * 30) / 100);
            if (!need) return new Set();
            const byPts = new Map();
            let max = 0;
            for (const r of vrows) { byPts.set(r.points, (byPts.get(r.points) ?? 0) + 1); if (r.points > max) max = r.points; }
            let cum = 0, cutoff = 0;
            for (let p = max; p >= 1; p--) { cum += byPts.get(p) ?? 0; cutoff = p; if (cum >= need) break; }
            return new Set(vrows.filter((r) => cutoff >= 1 && r.points >= cutoff).map((r) => r.player));
          }

          /** Free 1st / 2nd (D-159, VAULT §6, D-034, D-082), for every game: the best free points take 1st, the next 2nd; ties
           *  share their place; a tie for 1st leaves 2nd empty. Up to 10 wallets a place: past 10, exactly 10 are paid, chosen by
           *  the earlier score time (`at`), then the address; a place is never left empty because of the cap, and wallets cut by
           *  it get nothing (they don't move to 2nd). Rows: [{ a, pts, at }]. */
          export function freePlaces(free) {
            const pick = (xs) => xs.slice().sort((u, v) => u.at - v.at || cmp(u.a, v.a)).slice(0, MAX_PER_PLACE).map((r) => r.a).sort(cmp);
            const best = free.reduce((x, r) => Math.max(x, r.pts), 0);
            const tied = free.filter((r) => best > 0 && r.pts === best);
            const rest = free.filter((r) => r.pts < best);
            const next = rest.reduce((x, r) => Math.max(x, r.pts), 0);
            return { first: pick(tied), second: tied.length === 1 ? pick(rest.filter((r) => next > 0 && r.pts === next)) : [] };
          }

          /**
           * A week's tally from its week file (fun rounds out, D-129): every row the boards, the vault file and the prizes come
           * from. cfg: { payoutRule, vaultValues, entry: { minRounds, minPoints }, minPts, rowCap }.
           *   counted  = scored, non-fun rounds the wallet took part in; pts = their points; answers = every round it took part in
           *   ok       = not voided, counted ≥ entry.minRounds, pts ≥ entry.minPoints and pts ≥ 1
           *   staked   = ok, stake > 0, stake ≥ min (the vault's week stake) and pts ≥ minPts (the vault's floor)   → the vault rows
           *   free     = ok and peak < min
           *   board    = "staked" when peak ≥ min and not voided (LEADERBOARD §1), else "free"
           *   place    = 1 + the rows above it on its board: more points, or (d152) the paid part of a tie split across the line
           * The paid set is computed over the vault rows exactly as posted, and must equal the contract's own walk over the vault
           * values (Kpred finalizeGameStep); otherwise `vaultError` says why and no vault file can be made (KC-2, KC-16).
           */
          export function tally(j, cfg) {
            const min = BigInt(j.min);
            const minRounds = cfg.entry?.minRounds ?? 1, minPoints = Math.max(1, cfg.entry?.minPoints ?? 1), floor = Math.max(1, cfg.minPts ?? 0);
            const acc = j.players.map(() => ({ pts: 0, counted: 0, answers: 0, at: 0 }));
            let complete = true;
            for (const [, , fun, st, rows] of j.rounds) {
              if (!fun && st === "p") complete = false;
              for (const [i, p, at = 0] of rows) {
                const x = acc[i];
                x.answers++;
                if (fun || st !== "s") continue;
                x.counted++; x.pts += p;
                if (p > 0 && j.start + at > x.at) x.at = j.start + at;
              }
            }
            const rows = [];
            j.players.forEach(([a, stakeS, peakS, voided], i) => {
              const x = acc[i];
              if (!x.answers) return;
              const pts = voided ? 0 : x.pts, counted = voided ? 0 : x.counted;
              const stake = voided ? 0n : BigInt(stakeS);
              const peak = BigInt(peakS) > stake ? BigInt(peakS) : stake;
              const ok = !voided && counted >= minRounds && pts >= minPoints;
              const staked = ok && stake > 0n && stake >= min && pts >= floor;
              const free = ok && peak < min;
              rows.push({ a, pts, counted, answers: x.answers, at: voided ? 0 : x.at, staked, free, ranked: staked, board: peak >= min && !voided ? "staked" : "free", place: 0 });
            });
            const stakedRows = rows.filter((r) => r.staked).sort((u, v) => v.pts - u.pts || cmp(u.a, v.a));
            const paid = paidSet(stakedRows, cfg.payoutRule);
            for (const b of ["staked", "free"]) {
              const xs = rows.filter((r) => r.board === b);
              // d152 can split a tie at the paid line: its paid part takes the place above the rest (KC-10). The whole-tie rule
              // never splits a tie, so its places are by points alone.
              const split = b === "staked" && cfg.payoutRule === "d152";
              const above = (o, r) => o.pts > r.pts || (split && o.pts === r.pts && paid.has(o.a) && !paid.has(r.a));
              for (const r of xs) r.place = 1 + xs.filter((o) => above(o, r)).length;
            }
            rows.sort((u, v) => (u.board === v.board ? 0 : u.board === "staked" ? -1 : 1) || u.place - v.place || cmp(u.a, v.a));
            const ordered = rows.filter((r) => r.staked);
            let vrows = [], vaultError = "";
            try {
              vrows = ordered.length ? vaultValues(ordered, paid, cfg.vaultValues) : [];
              const won = contractWinners(vrows);
              if (won.size !== paid.size || [...paid].some((a) => !won.has(a))) throw new Error(`the contract would pay ${won.size} wallets, the game's rule pays ${paid.size}`);
            } catch (e) { vrows = []; vaultError = String(e?.message ?? e); }
            const { first, second } = freePlaces(rows.filter((r) => r.free));
            const prizes = [...first.map((p) => ({ player: p, place: 1 })), ...second.map((p) => ({ player: p, place: 2 }))];
            return { complete, rows, paid, vault: { rows: vrows, first, second }, prizes, vaultError };
          }

          /** board.json (LEADERBOARD §1, the vault bot's board check): lastWeek with both boards. Over the game's rowCap the
           *  board keeps every ranked (vault) row and the best others up to the cap, and says how many it left out (KC-9). */
          export const BOARD_MAX_BYTES = 1_500_000;           // board.json's own budget, under the recorder's 1.9 MB write cap (#B-12 NK-4)
          /** board.json for week `j` from its tally. Every ranked (staked) row and every free prize winner's row is kept (NK-17);
           *  the other rows, best first, while they fit the game's rowCap (when set) and the board's byte budget. A board whose
           *  kept rows alone pass the budget is still returned: the recorder then doesn't write it and alerts (NK-4). */
          export function boardOf(j, t, updated, rowCap = 0) {
            const winners = new Set(t.prizes.map((p) => p.player));
            const row = (x) => ({ a: x.a, board: x.board, place: x.place, pts: x.pts, points: x.pts, counted: x.counted, answers: x.answers, ranked: x.ranked });
            const must = (x) => x.ranked || winners.has(x.a);
            const shell = (rows, cut) => {
              const lastWeek = { week: j.week, start: j.start, final: j.state === "final", complete: t.complete, rows, prizes: t.prizes };
              if (cut) lastWeek.cut = cut;
              return { v: 1, updated, lastWeek };
            };
            let bytes = Buffer.byteLength(canon(shell([], t.rows.length || 0)));
            let room = rowCap > 0 ? Math.max(0, rowCap - t.rows.filter(must).length) : Infinity;
            for (const x of t.rows) if (must(x)) bytes += Buffer.byteLength(JSON.stringify(row(x))) + 1;
            const keep = t.rows.filter((x) => {
              if (must(x)) return true;
              if (room <= 0) return false;
              const n = Buffer.byteLength(JSON.stringify(row(x))) + 1;
              if (bytes + n > BOARD_MAX_BYTES) { room = 0; return false; }
              bytes += n; room--; return true;
            });
            return shell(keep.map(row), t.rows.length - keep.length);
          }
          /** alltime.json (LEADERBOARD §2 "All time", D-137, FC-16/FC-18): every published FINAL week of the game, in week
           *  order. pts = every scored round's points, Sunday fun rounds included (D-129); weeks = weeks with a row; medals only
           *  for weeks the vault was given a results file (D-034: only earners get one): gold / silver = the free 1st / 2nd
           *  paid places, earned = in the staked paid set; best = the best weekly place on either board. Rows by points, then
           *  address; trimmed to the board's byte budget (lowest first), with how many were left out. `medalWeeks`: the weeks
           *  whose vault file is published. Rebuilt the same way here and in the recorder, so it is recomputed, never trusted. */
          export const ALLTIME_KEYS = ["v", "updated", "weeks", "rows"];
          export function allTimeOf(finals, cfg, medalWeeks, updated) {
            const acc = new Map();
            const get = (a) => { let x = acc.get(a); if (!x) acc.set(a, x = { a, pts: 0, weeks: 0, gold: 0, silver: 0, earned: 0, best: 0 }); return x; };
            const weeks = [];
            for (const j of [...finals].sort((u, v) => u.week - v.week)) {
              if (j.state !== "final") continue;
              weeks.push(j.week);
              const t = tally(j, cfg), pts = new Map();
              for (const [, , , st, rows] of j.rounds) for (const [i, p] of rows) {
                const a = j.players[i][0];
                pts.set(a, (pts.get(a) ?? 0) + (st === "s" ? p : 0));
              }
              const medals = medalWeeks.has(j.week);
              for (const r of t.rows) {
                const x = get(r.a);
                x.weeks++; x.pts += pts.get(r.a) ?? 0;
                if (r.place > 0 && (x.best === 0 || r.place < x.best)) x.best = r.place;
              }
              if (medals) {
                for (const a of t.vault.first) get(a).gold++;
                for (const a of t.vault.second) get(a).silver++;
                for (const a of t.paid) get(a).earned++;
              }
            }
            const all = [...acc.values()].sort((u, v) => v.pts - u.pts || cmp(u.a, v.a));
            const out = { v: 1, updated, weeks, rows: [] };
            let bytes = Buffer.byteLength(canon(out)) + 32, cut = 0;
            for (const x of all) {
              const n = Buffer.byteLength(JSON.stringify(x)) + 1;
              if (bytes + n > BOARD_MAX_BYTES) { cut = all.length - out.rows.length; break; }
              bytes += n; out.rows.push(x);
            }
            if (cut) out.cut = cut;
            return out;
          }

          /** The week's write-once inputs file (FC-9): inputs/W<week>.json = { game, week, data }. Published before the week
           *  opens and never changed; the week file carries the sha256 of its exact bytes. */
          export const inputsName = (w) => `inputs/W${w}.json`;
          export const INPUTS_EARLIEST_MS = 7 * DAY;           // at most a week before the week opens

          /** The vault's results file for a final week (VAULT §6): rows (staked), first and second always filled. */
          export function vaultFileOf(j, t) {
            if (t.vaultError) throw new Error(`week ${j.week}: no vault file: ${t.vaultError}`);
            return { game: j.game, week: j.week, final: true, rows: t.vault.rows, first: t.vault.first, second: t.vault.second };
          }

          // ───────────────────────── the checks ─────────────────────────
          // No leading zeros in vault names (KC-17): W4, HOLD-W4, RELEASE-W4 — never W04 or W004.
          const VNUM = "(0|[1-9][0-9]{0,3})";
          const NAMES = new RegExp(`^(board\\.json|alltime\\.json|W([0-9]{3}|[1-9][0-9]{3})\\.json|vault/(HOLD-|RELEASE-)?W${VNUM}\\.json|inputs/W${VNUM}\\.json)$`);
          const ISO = /^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$/;
          const same = (a, b) => a !== null && b !== null && Buffer.compare(a, b) === 0;
          const isHold = (h, cfg, w) => !!h && typeof h === "object" && Object.keys(h).join() === "game,week,reason" && h.game === cfg.game && h.week === w && typeof h.reason === "string" && h.reason.length > 0 && h.reason.length <= 300;

          function listFiles(dir) {
            const out = [], bad = [];
            if (!fs.existsSync(dir)) return { out, bad };
            const walk = (d, rel) => {
              for (const f of fs.readdirSync(d).sort()) {
                const p = path.join(d, f), r = rel ? `${rel}/${f}` : f, s = fs.lstatSync(p);
                if (s.isSymbolicLink()) bad.push(r);
                else if (s.isDirectory()) { if (r === "vault" || r === "inputs") walk(p, r); else bad.push(r + "/"); }
                else if (s.isFile()) out.push(r); else bad.push(r);
              }
            };
            walk(dir, "");
            return { out, bad };
          }
          const readRaw = (dir, rel) => { const p = path.join(dir, rel); return fs.existsSync(p) && fs.lstatSync(p).isFile() ? fs.readFileSync(p) : null; };
          /** Parsed JSON, only when the bytes are exactly the recorders' own form. */
          function parseCanon(raw) {
            if (raw === null) return { ok: false, why: "missing" };
            if (raw.length > MAX_FILE_BYTES) return { ok: false, why: "over 2 MB" };
            let v;
            try { v = JSON.parse(raw.toString("utf8")); } catch { return { ok: false, why: "not JSON" }; }
            if (Buffer.compare(Buffer.from(canon(v), "utf8"), raw) !== 0) return { ok: false, why: "not in the recorders' own JSON form" };
            return { ok: true, v };
          }

          /** Why a new copy of a non-final week may not replace the published one ("" = it may). RECORDER §3.3 and KC-8:
           *  rounds are never dropped; a decided round keeps its id, day, fun flag and wallets; without roundsCorrectable it
           *  never changes at all; with it (owner corrections on chain) only its status (scored ↔ void), points and score
           *  times may change, never back to pending. */
          export function roundsChange(prev, j, cfg) {
            const now = new Map(j.rounds.map((r) => [r[0], resolveRound(j, r)]));
            for (const r0 of prev.rounds) {
              const a = resolveRound(prev, r0), b = now.get(a[0]);
              if (!b) return `it drops published round ${a[0]}`;
              if (a[3] === "p") continue;
              // A Sunday fun round never counts toward the payout, so it may be corrected even in a game whose decided rounds
              // can't change (#B-12 NK-13); it still keeps its day and stays decided.
              if (!cfg.roundsCorrectable && !a[2]) { if (JSON.stringify(a) !== JSON.stringify(b)) return `it changes decided round ${a[0]}`; continue; }
              if (a[1] !== b[1] || a[2] !== b[2]) return `it moves decided round ${a[0]} to another day`;
              if (b[3] === "p") return `decided round ${a[0]} goes back to pending`;
              if (a[4].map((x) => x[0]).join() !== b[4].map((x) => x[0]).join()) return `it changes who played decided round ${a[0]}`;
            }
            return "";
          }

          /**
           * Check one game's incoming folder against its published folder, with this job's clock `now`.
           * Returns { publish: [relative names to publish], held: [{ name, why, alert }] }.
           * cfg: { slug, game, genesis, weekMs, sundayFunRound, payoutRule, vaultValues, entry, minPts, rowCap, maxRoundPoints,
           *        liveWeek, roundsCorrectable }; release: the owner's <SLUG>_RELEASE value from the job's own variables (KC-3).
           */
          export function checkGame(cfg, inDir, pubDir, now, release = "", cardsOk = null) {
            const k = weekClock(cfg), cw = k.weekOf(now);
            const held = [], publish = [];
            const hold = (name, why, alert = true) => held.push({ name, why, alert });
            // G3: a ruler game's new or changed file must list only cards this job rebuilt from the published vhp-data with the
            // embedded vhp_ruler.py (cardsOk: their sha256 values; null = the rebuild didn't run). Unchanged copies aren't rebuilt.
            const cardsWhy = (raw, old, j) => {
              if (!cfg.vhpData || (old && same(raw, old)) || !Array.isArray(j?.cards) || !j.cards.length) return null;
              if (!cardsOk) return "its ruler cards couldn't be rebuilt in this job (G3)";
              const n = j.cards.filter((x) => !cardsOk.has(cardKey(x[0], x[1]))).length;
              return n ? `${n} of its ${j.cards.length} ruler cards aren't what the published ruler data gives (G3)` : null;
            };
            const { out: files, bad } = listFiles(inDir);
            for (const b of bad) hold(b, "not a plain file in an allowed folder");
            const okWeeks = new Map();     // week -> the week file that will be published after this job (incoming or published)
            const heldWeeks = new Set();
            const pubWeek = (w) => { const r = parseCanon(readRaw(pubDir, weekName(w))); return r.ok && !weekShape(r.v, weekName(w), cfg) ? r.v : null; };
            const tallyOf = (j) => tally(j, cfg);

            // Inputs files first (FC-9): write-once, only before their week opens (by this job's clock), at most a week ahead.
            const inputsOk = new Map();    // week -> sha256 of the inputs file that will be published after this job
            const pubInputs = (w) => { const raw = readRaw(pubDir, inputsName(w)); return raw && parseCanon(raw).ok ? sha256(raw) : null; };
            for (const f of files.filter((x) => x.startsWith("inputs/"))) {
              if (!NAMES.test(f)) continue;
              const w = Number(/^inputs\/W([0-9]+)\.json$/.exec(f)[1]);
              const raw = readRaw(inDir, f), old = readRaw(pubDir, f);
              const p = parseCanon(raw);
              if (!p.ok) { hold(f, p.why); continue; }
              if (old) { if (!same(raw, old)) hold(f, "it changes a published inputs file (write-once, FC-9)"); else inputsOk.set(w, sha256(raw)); continue; }
              const j = p.v;
              if (!cfg.inputsFile) { hold(f, "this game has no inputs file"); continue; }
              if (!j || typeof j !== "object" || Array.isArray(j) || Object.keys(j).join() !== (cfg.vhpData ? "game,week,data,cards" : "game,week,data") || j.game !== cfg.game || j.week !== w || j.data === null || typeof j.data !== "object" || (cfg.vhpData && !isCardList(j.cards))) { hold(f, `not an inputs file's shape ({game, week, data${cfg.vhpData ? ", cards" : ""}})`); continue; }
              if (!(now < k.start(w))) { hold(f, "an inputs file published after its week opened, by this job's clock (FC-9)"); continue; }
              if (now < k.start(w) - INPUTS_EARLIEST_MS) { hold(f, "an inputs file more than a week before its week"); continue; }
              { const cw2 = cardsWhy(raw, old, j); if (cw2) { hold(f, cw2); continue; } }
              inputsOk.set(w, sha256(raw)); publish.push(f);
            }

            for (const f of files) {
              if (!NAMES.test(f)) { hold(f, "a name the game may not publish"); continue; }
              if (!WEEK_FILE.test(f)) continue;
              const raw = readRaw(inDir, f), old = readRaw(pubDir, f);
              const p = parseCanon(raw);
              if (!p.ok) { hold(f, p.why); continue; }
              const j = p.v, why = weekShape(j, f, cfg);
              if (why) { hold(f, why); continue; }
              const w = j.week;
              heldWeeks.add(w);
              if (cfg.inputsFile && (inputsOk.get(w) ?? pubInputs(w)) !== j.inputs) { hold(f, "its inputs hash isn't the published inputs file's (FC-9)"); continue; }
              { const cw2 = cardsWhy(raw, old, j); if (cw2) { hold(f, cw2); continue; } }
              const pv = old ? parseCanon(old) : null;
              const prev = pv?.ok && !weekShape(pv.v, f, cfg) ? pv.v : null;
              if (old && !prev) { hold(f, "the published copy can't be read: nothing replaces it"); continue; }
              if (prev?.state === "final") {
                if (!same(raw, old)) { hold(f, "it changes a published final week"); continue; }
                okWeeks.set(w, prev); heldWeeks.delete(w); continue;     // copied forward unchanged: nothing to publish
              }
              if (prev) { const ch = roundsChange(prev, j, cfg); if (ch) { hold(f, ch); continue; } }
              // KC-1: seen.at is the recorder's claim. Kept only while the hash is the published one, and exactly; a new hash must
              // be stamped by this hour's run (by this job's clock), and for an ended week after its end.
              // An unchanged hash first read before the week ended (an open copy under liveWeek) may be stamped again once the
              // week has ended, by the same window rules (#B-12 NK-7): otherwise its final could never pass the end rule below.
              const restamp = !!prev && prev.seen.hash === j.seen.hash && prev.seen.at < j.end && j.seen.at !== prev.seen.at;
              if (prev && prev.seen.hash === j.seen.hash && !restamp) {
                if (j.seen.at !== prev.seen.at) { hold(f, "it changes when its unchanged content was first read"); continue; }
              } else {
                if (j.seen.at > now + FUTURE_SLACK_MS) { hold(f, "seen in the future by this job's clock"); continue; }
                if (j.seen.at < now - FRESH_MS) { hold(f, "new content first read long before this run, by this job's clock"); continue; }
                if (j.state !== "open" && j.seen.at < j.end) { hold(f, "an ended week first read before its end"); continue; }
              }
              if (j.state === "open") {
                if (!(cfg.liveWeek && w === cw)) { hold(f, "an open week other than this week, by this job's clock"); continue; }
              } else {
                if (w !== cw - 1 || now < j.end) { hold(f, "not the week that just ended, by this job's clock"); continue; }
                if (now >= k.due(w)) { hold(f, "past the vault's 3 days for that week"); continue; }
              }
              if (j.state === "final") {
                const t = tallyOf(j);
                if (!t.complete) { hold(f, "final while rounds are still pending"); continue; }
                if (t.vaultError) { hold(f, `final, but no vault file can be made: ${t.vaultError}`); continue; }
                if (now < j.end) { hold(f, "final before Mon 00:00 UTC (D-125)"); continue; }
                if (!(prev && prev.state === "pending" && prev.seen.hash === j.seen.hash)) { hold(f, "final without an earlier published run of the same week"); continue; }
                if (j.seen.at < j.end) { hold(f, "final, but its content was first read before the week ended"); continue; }
                if (now - j.seen.at < FINAL_WAIT_MS) { hold(f, "final less than an hour after its pending copy could have been published", false); continue; }
              }
              okWeeks.set(w, j); heldWeeks.delete(w); publish.push(f);
            }

            // board.json: recomputed from its week (this run's, if it passed; else the published one).
            if (files.includes("board.json")) {
              const p = parseCanon(readRaw(inDir, "board.json"));
              const b = p.ok ? p.v : null;
              const w = b?.lastWeek?.week;
              if (!p.ok) hold("board.json", p.why);
              else if (!b || Object.keys(b).join() !== "v,updated,lastWeek" || b.v !== 1 || typeof b.updated !== "string" || !ISO.test(b.updated) || !nat(w)) hold("board.json", "not the board's shape");
              else if (heldWeeks.has(w)) hold("board.json", "its week file is held this run", false);
              else {
                const src = okWeeks.get(w) ?? pubWeek(w);
                let want = null;
                try { if (src) want = canon(boardOf(src, tallyOf(src), b.updated, cfg.rowCap ?? 0)); } catch (e) { want = null; }
                if (!src) hold("board.json", "its week has no week file (published or in this run)");
                else if (want === null || want !== canon(b)) hold("board.json", "its rows aren't the ones recomputed from the week file");
                else if (Date.parse(b.updated) > now + FUTURE_SLACK_MS) hold("board.json", "updated in the future by this job's clock");
                else publish.push("board.json");
              }
            }

            // Vault files: HOLD only added; RELEASE only the owner's (KC-3); W<n> only for a final week, inside the vault's window,
            // exactly recomputed.
            for (const f of files.filter((x) => x.startsWith("vault/") && NAMES.test(x))) {
              const m = /^vault\/(HOLD-|RELEASE-)?W([0-9]+)\.json$/.exec(f);
              const w = Number(m[2]);
              const raw = readRaw(inDir, f), old = readRaw(pubDir, f);
              const p = parseCanon(raw);
              if (!p.ok) { hold(f, p.why); continue; }
              const j = p.v;
              if (old) { if (!same(raw, old)) hold(f, "a write-once file that differs from the published one"); continue; }
              if (m[1] === "HOLD-") {
                if (!isHold(j, cfg, w)) hold(f, "not a HOLD file's shape");
                else publish.push(f);
                continue;
              }
              if (m[1] === "RELEASE-") {
                if (Object.keys(j).join() !== "game,week,code" || j.game !== cfg.game || j.week !== w || typeof j.code !== "string" || !/^[0-9a-f]{16}$/.test(j.code)) { hold(f, "not a RELEASE file's shape"); continue; }
                // Only a HOLD published by an EARLIER run can be released, and only by the owner's own variable, which this job
                // reads itself: a recorder run can compute the code from the public HOLD, but can't set the variable.
                const hp = parseCanon(readRaw(pubDir, `vault/HOLD-W${w}.json`));
                const h = hp.ok && isHold(hp.v, cfg, w) ? hp.v : null;
                if (!h) { hold(f, "releases a week with no HOLD file published by an earlier run"); continue; }
                const code = sha256(h.reason).slice(0, 16);
                if (j.code !== code) { hold(f, "its code isn't the HOLD's (sha256 of its reason, first 16)"); continue; }
                const rel = parseRelease(release);
                if (!(rel && rel.week === w && rel.code === code)) { hold(f, `not released by the owner: the game's RELEASE variable isn't "${w}:${code}"`); continue; }
                publish.push(f);
                continue;
              }
              if (!(now >= k.end(w) && now < k.due(w))) { hold(f, "not inside the vault's 3 days for that week, by this job's clock"); continue; }
              const src = okWeeks.get(w) ?? pubWeek(w);
              if (!src || src.state !== "final") { hold(f, "its week isn't final (published or in this run)", false); continue; }
              let want = null;
              try { want = canon(vaultFileOf(src, tallyOf(src))); } catch (e) { want = null; }
              if (want === null || want !== canon(j)) { hold(f, "its rows or winners aren't the ones recomputed from the final week file"); continue; }
              publish.push(f);
            }

            // alltime.json: rebuilt from every final week (published, or this run's) and the vault files published by then.
            if (files.includes("alltime.json")) {
              const p = parseCanon(readRaw(inDir, "alltime.json"));
              const b = p.ok ? p.v : null;
              if (!p.ok) hold("alltime.json", p.why);
              else if (!b || typeof b !== "object" || !ALLTIME_KEYS.every((x, i) => Object.keys(b)[i] === x) || b.v !== 1 || typeof b.updated !== "string" || !ISO.test(b.updated)) hold("alltime.json", "not the all-time board's shape");
              else if (heldWeeks.size) hold("alltime.json", "a week file is held this run", false);
              else {
                const finals = new Map();
                for (const f of fs.existsSync(pubDir) ? fs.readdirSync(pubDir) : []) {
                  const m = WEEK_FILE.exec(f);
                  if (m) { const w = Number(m[1]), v = pubWeek(w); if (v?.state === "final") finals.set(w, v); }
                }
                for (const [w, v] of okWeeks) if (v.state === "final") finals.set(w, v);
                const medal = new Set();
                for (const w of finals.keys()) if (readRaw(pubDir, `vault/W${w}.json`) || publish.includes(`vault/W${w}.json`)) medal.add(w);
                let want = null;
                try { want = canon(allTimeOf([...finals.values()], cfg, medal, b.updated)); } catch { want = null; }
                if (want === null || want !== canon(b)) hold("alltime.json", "its rows aren't the ones rebuilt from the final week files");
                else if (Date.parse(b.updated) > now + FUTURE_SLACK_MS) hold("alltime.json", "updated in the future by this job's clock");
                else publish.push("alltime.json");
              }
            }
            return { publish, held };
          }

          /** The owner's `<SLUG>_RELEASE` value, "<week>:<code>" (week without leading zeros, code 16 hex), or null. The
           *  recorder and the publish check both read it with this one parser (#B-12 NK-9). */
          export function parseRelease(s) {
            const m = typeof s === "string" ? /^\s*(0|[1-9][0-9]{0,3}):([0-9a-f]{16})\s*$/.exec(s) : null;
            return m ? { week: Number(m[1]), code: m[2] } : null;
          }

          /** The env variable a game's owner release lives in, in the publish job: KIT_RELEASE_<SLUG> (hyphens → _). */
          export const releaseEnv = (slug) => `KIT_RELEASE_${String(slug).toUpperCase().replace(/-/g, "_")}`;

          /** The publish job's entry point: node - <in> <pub> <out-list> (games from KIT_GAMES, clock from CHECK_NOW_MS or now,
           *  each game's owner release from KIT_RELEASE_<SLUG>). <in>/<slug> is that game's own artifact (KC-13). */
          export function main(argv = process.argv.slice(2), env = process.env) {
            const [inRoot, pubRoot, listFile] = argv;
            const games = JSON.parse(env.KIT_GAMES || "[]");
            const now = env.CHECK_NOW_MS ? Number(env.CHECK_NOW_MS) : KIT_NOW();
            const lines = [];
            let alert = false;
            const top = fs.existsSync(inRoot) ? fs.readdirSync(inRoot) : [];
            for (const f of top) if (!games.some((g) => g.slug === f)) { console.log(`::error::held, not published: ${f}: not a kit game on this branch`); alert = true; }
            for (const g of games) {
              try {
                const dir = path.join(inRoot, g.slug);
                if (fs.existsSync(dir) && !fs.lstatSync(dir).isDirectory()) { console.log(`::error::held, not published: ${g.slug}: not a plain folder`); alert = true; continue; }
                // G3: the cards the publish job's embedded vhp_ruler.py rebuilt for this game (absent = it didn't run or failed).
                let cardsOk = null;
                if (g.vhpData && env.KIT_CARDS_DIR) {
                  const cf = path.join(env.KIT_CARDS_DIR, `${g.slug}.json`);
                  if (fs.existsSync(cf)) { const v = JSON.parse(fs.readFileSync(cf, "utf8")); if (Array.isArray(v.ok)) cardsOk = new Set(v.ok.filter((x) => Array.isArray(x) && x.length === 2).map((x) => cardKey(x[0], x[1]))); }
                }
                const r = checkGame(g, dir, path.join(pubRoot, g.slug), now, env[releaseEnv(g.slug)] ?? "", cardsOk);
                for (const h of r.held) {
                  console.log(`${h.alert ? "::error::" : "::notice::"}held, not published: ${g.slug}/${h.name}: ${h.why}`);
                  if (h.alert) alert = true;
                }
                for (const f of r.publish) lines.push(`${g.slug}/${f}`);
                console.log(`${g.slug}: ${r.publish.length} to publish, ${r.held.length} held`);
              } catch (e) {
                // One game's broken files never stop another's (RECORDER §6.4).
                console.log(`::error::${g.slug}: its files couldn't be checked (${String(e?.message ?? e).slice(0, 200)}): none published this run`);
                alert = true;
              }
            }
            fs.writeFileSync(listFile, lines.map((l) => l + "\n").join(""));
            if (alert) fs.writeFileSync(listFile + ".alert", "1\n");
            return { lines, alert };
          }

          main();
          KIT_CHECK_INLINE
          while IFS= read -r name; do
            [[ "$name" =~ ^[a-z][a-z0-9-]{1,23}/((board|alltime|W([0-9]{3}|[1-9][0-9]{3}))|vault/(HOLD-|RELEASE-)?W(0|[1-9][0-9]{0,3})|inputs/W(0|[1-9][0-9]{0,3}))\.json$ ]] || { echo "::error::bad name from the check: $name"; exit 1; }
            h=$(git hash-object -w "$IN/$name")
            git update-index --add --cacheinfo "100644,$h,$name"
          done < "$LIST"
          tree=$(git write-tree)
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then echo "No changes."
          else
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "kit: record $(date -u +%Y-%m-%dT%H:%MZ)")
            git push -q "$remote" "$commit:refs/heads/games-data"
            echo "Published $(wc -l < "$LIST") file(s) to games-data."
          fi
          if [ -f "$LIST.alert" ]; then echo "::error::Some kit files were held (see above): the rest was published."; exit 1; fi

  kit-alerts:
    # Its own job, always run (#B-12 NK-16): the alerts fire even when publish-kit is skipped (every kit job failed,
    # timed out or was cancelled). Failing this job is what emails the owner; the two cases say different things (KC-28).
    needs: [record-fantasy, publish-kit]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Alert on a kit recorder that stopped
        if: ${{ (needs.record-fantasy.result == 'success' && needs.record-fantasy.outputs.rc != '0' && needs.record-fantasy.outputs.rc != '1') || needs.record-fantasy.result == 'failure' || needs.record-fantasy.result == 'cancelled' }}
        run: |
          echo "::error::A kit game's recorder stopped (or its job failed, timed out or was cancelled): nothing from that game was recorded this run. See its record job."
          exit 1
      - name: Alert on a kit recorder that needs the owner
        if: ${{ needs.record-fantasy.outputs.rc == '1' }}
        run: |
          echo "::error::A kit game's recorder raised an alert that needs the owner (see its record job). Its files were checked and published as usual."
          exit 1
      - name: Alert on a publish job that didn't finish
        if: ${{ needs.publish-kit.result == 'failure' || needs.publish-kit.result == 'cancelled' }}
        run: |
          echo "::error::The kit's publish job failed or was cancelled (held files, or the push): see publish-kit."
          exit 1
  # ── END kit-rendered jobs ──
