                      for t in fresh:
                          h, tm = t.get("height"), t.get("time")
                          _g, wround, woff = week_game(wk)
                          ok = type(tm) is int and type(h) is int and h == t["round"] * wround + woff and wstart <= tm < wstart + WEEK and tm <= now
