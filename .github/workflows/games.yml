                          and all(brow(r, {"days", "full"}) and nat(r["days"]) and r["days"] <= 6 and type(r["full"]) is bool and (r["earns"] in (0, 3) if r["ranked"] else r["earns"] in (0, 1, 2)) for r in b["rows"])
                          and type(b["prizes"]) is list and len(b["prizes"]) <= 20 and all(type(x) is dict and set(x) == {"player", "place"} and A(x["player"]) and x["place"] in (1, 2) for x in b["prizes"])
                          and (j["freePrize"] or (b["prizes"] == [] and all(r["earns"] in (0, 3) for r in b["rows"])))), f
                  assert type(j["rivals"]) is list and all(A(r["a"]) for r in j["rivals"]) and all(A(x["a"]) and nat(x["n"]) for x in j["mostChallenged"]), f
              else:
                  assert re.fullmatch(r"W[0-9]{3}\.json", f) and f == "W%03d.json" % j["week"], f
                  assert set(j) == {"v", "week", "start", "end", "final", "sheet", "sha256", "picks", "rivals", "players", "matches", "pending"}, f
                  # WEEK_CYCLE two-run rule: a settled week waits as pending (its result's sha256 and when it was first
                  # seen) until a later run agrees; a final week has none.
                  p = j["pending"]
                  assert p is None or (type(p) is dict and set(p) == {"hash", "at"} and re.fullmatch(r"[0-9a-f]{64}", str(p["hash"])) and nat(p["at"]) and p["at"] > 0), f
                  assert not (j["final"] and p is not None), f
                  assert nat(j["start"]) and nat(j["end"]) and j["end"] > j["start"] and j["start"] <= NOW + 8 * 86400000, f + ": a week too far ahead of the publish clock"
                  assert not j["final"] or NOW >= j["end"], f + ": final before the week ended (publish clock)"
                  s = j["sheet"]
                  assert s is None or (s["week"] == j["week"] and nat(s["budget"]) and len(s["pool"]) <= 200 and all(A(p["a"]) and nat(p["price"]) and 8 <= p["price"] <= 40 for p in s["pool"])), f
                  assert j["sha256"] is None or re.fullmatch(r"[0-9a-f]{64}", j["sha256"]), f
                  assert all(re.fullmatch(r"[0-9]+", k) and all(A(p[0]) and type(p[1]) is list and 1 <= len(p[1]) <= 5 and all(A(a) for a in p[1]) and nat(p[2]) for p in v) for k, v in j["picks"].items()), f
                  assert j["rivals"] is None or all(A(a) and A(b) for a, b in j["rivals"]), f
                  for r in j["players"]:
                      assert A(r["a"]) and num(r["points"]) and nat(r["vault"]) and r["vault"] <= 255 and type(r["full"]) is bool and nat(r["place"]) and type(r.get("staked", False)) is bool, f
                      pos = lambda t: t is None or (type(t) is list and len(t) == 5 and len(set(t)) == 5 and all(type(i) is int and 0 <= i < len(s["pool"]) for i in t))
                      assert s is not None and len(r["days"]) == 6 and all(type(x) is list and len(x) in (2, 3) and pos(x[0]) and num(x[1]) and (len(x) == 2 or (type(x[2]) is str and len(x[2]) <= 120)) for x in r["days"]), f
                  assert not j["final"] or j["picks"] == {}, f
                  assert all(A(m["a"]) and A(m["b"]) and m["result"] in ("a", "b", "draw") for m in j["matches"]), f
          # Compare with what is already published.
          old = lambda f: json.load(open(os.path.join(parent, f), encoding="utf-8")) if os.path.exists(os.path.join(parent, f)) else None
          # RECORDER_STANDARD §4.1: every new or changed week file is re-scored here, from the day records only (incoming
          # days.json, else the published one), with the ported scorer above; its vault file and boards must follow it.
          src = lambda f: json.load(open(os.path.join(d, f), encoding="utf-8")) if os.path.exists(os.path.join(d, f)) else old(f)
          dj = src("days.json"); dayrecs = {x["day"]: x for x in (dj["days"] if dj else []) if x.get("final") is True}
          od = old("days.json")
          for x in (od["days"] if od else []):
              if x.get("final") is True and x["day"] in dayrecs: assert dayrecs[x["day"]] == x, "days.json: a published final day can't change (day %d)" % x["day"]
          weeks_in = {}
          for f in os.listdir(d):
              if re.fullmatch(r"W[0-9]{3}\.json", f):
                  j = json.load(open(os.path.join(d, f), encoding="utf-8")); weeks_in[j["week"]] = j
                  if j != old(f):
                      why = fx_week_errors(j, dayrecs)
                      assert why == "", f + ": " + why
          for f in (os.listdir(vd) if os.path.isdir(vd) else []):
              j = json.load(open(os.path.join(vd, f), encoding="utf-8"))
              if os.path.exists(os.path.join(parent, "vault", f)): continue          # published: compared above, unchanged
              wk = weeks_in.get(j["week"]) or old("W%03d.json" % j["week"])
              assert wk is not None and fx_week_errors(wk, dayrecs) == "", "vault/" + f + ": its week doesn't re-score"
              want = sorted([{"player": r["a"], "points": r["vault"]} for r in wk["players"] if r.get("staked") is True and r["vault"] >= 1], key=lambda x: (-x["points"], x["player"]))
              assert j["rows"] == want, "vault/" + f + ": rows aren't the re-scored week's stakers"
              fr = [{"a": r["a"], "points": r["points"], "staked": r.get("staked", False) is True, "full": r["full"]} for r in wk["players"]]
              assert (j["first"], j["second"]) == fx_free_winners(fr), "vault/" + f + ": first / second aren't the re-scored free winners"
          bj = src("board.json")
          for k in ("week", "lastWeek"):
              b = bj and bj.get(k)
              if not b: continue
              wk = weeks_in.get(b["week"]) or old("W%03d.json" % b["week"])
              assert wk is not None, "board.json: " + k + " has no week file"
              got = {r["a"]: (r["pts"], r["ranked"]) for r in b["rows"]}
              assert got == {r["a"]: (r["points"], r.get("staked", False) is True) for r in wk["players"]}, "board.json: " + k + " isn't the week file's players, points and boards"
          for f in os.listdir(d):
              if f == "vault": continue
              j, o = json.load(open(os.path.join(d, f), encoding="utf-8")), old(f)
              if o is None: continue
              if f.startswith("W"):
                  if o.get("final"): assert j == o, f + ": a final week can't change"
                  if o.get("sheet") is not None: assert j["sheet"] == o["sheet"] and j["sha256"] == o["sha256"], f + ": a published price list can't change"
              elif f == "rivals.json":
                  assert set(o["weeks"]) <= set(j["weeks"]), f + ": counted weeks can't go missing"
                  for a, r in o["records"].items():
                      n = j["records"].get(a)
                      assert n is not None and all(n[k][i] >= r[k][i] for k in ("made", "received") for i in range(3)), f + ": a rival record can't go down"
              elif f == "alltime.json":
                  assert set(o["weeks"]) <= set(j["weeks"]), f + ": counted weeks can't go missing"
                  assert set(o.get("sundays", [])) <= set(j["sundays"]), f + ": counted Sunday fun rounds can't go missing"
                  for a, x in o["players"].items():
                      n = j["players"].get(a)
                      assert n is not None and n["points"] >= x["points"] and n["weeks"] >= x["weeks"] and n["best"] >= x["best"], f + ": an all-time total can't go down"
                      assert all(p >= q for p, q in zip(n.get("medals", [0, 0, 0]), x.get("medals", [0, 0, 0]))) and ("bestPlace" not in x or n.get("bestPlace", 10**9) <= x["bestPlace"]), f + ": a career medal or best place can't go backwards"
              elif f == "index.json":
                  assert set(o["weeks"]) <= set(j["weeks"]), f + ": weeks can't go missing"
          print("fantasy files ok")
          PY
          then echo "::error::Fantasy's files failed their check: none of them published this run (Block X's still are)."; rm -rf "$IN/fantasy"; echo '!alert' >> "$HELD"
          fi
          shopt -s nullglob
          for f in "$IN"/blockx/*.json "$IN"/blockx/vault/*.json "$IN"/fantasy/*.json "$IN"/fantasy/vault/*.json; do
            name="${f#"$IN"/}"
            # Audit BX-5: a final week's prize file (P###.json), and the Vault's results file (vault/W<week>.json), are
            # written once and never replaced.
            if grep -qxF "$name" "$HELD"; then continue; fi
            if [[ "$name" =~ (/P[0-9]{3}|/vault/W[0-9]+)\.json$ ]] && git cat-file -e ":$name" 2>/dev/null; then
              # Audit BX-81: a write-once file that differs from the published one is held (with an error, failing the job
              # at the end), never replaced; everything else is still published.
              if [ "$(git hash-object "$f")" != "$(git rev-parse ":$name")" ]; then echo "::error::$name differs from the published file: not replaced."; echo '!alert' >> "$HELD"; fi
              continue
            fi
            blob=$(git hash-object -w "$f")
            git update-index --add --cacheinfo 100644 "$blob" "$name"
          done
          tree=$(git write-tree)
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then echo "No changes."
          else
            export GIT_AUTHOR_NAME=kpred-bot GIT_AUTHOR_EMAIL=kpred-bot@users.noreply.github.com GIT_COMMITTER_NAME=kpred-bot GIT_COMMITTER_EMAIL=kpred-bot@users.noreply.github.com
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "games: record")
            git push -q "$remote" "$commit:refs/heads/games-data"
          fi
          if grep -qxF '!alert' "$HELD"; then echo "::error::A file was held, or a published file needs your check (see the errors above); everything else was published."; exit 1; fi
          echo "Games files published."

  # Repo Lens E4-7: a held week fails the run (so GitHub emails the owner), but only after publishing, so the hour's
  # files still go out. Runs no repository code and needs no permissions.
  alert:
    needs: [record, publish]
    if: ${{ always() && (needs.record.outputs.held == 'true' || needs.record.outputs.fantasy == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: A week is held before its prize list, or a recorder failed
        env:
          HELD: ${{ needs.record.outputs.held }}
          FANTASY: ${{ needs.record.outputs.fantasy }}
        run: |
          if [ "$HELD" = "true" ]; then echo "::error::Block X held a week before its prize list (see the record job's errors). Nothing is paid for it until a run reads the whole week the same."; fi
          if [ "$FANTASY" = "failure" ]; then echo "::error::The Fantasy Producers recorder failed this run (see the record job's errors). Its files were not updated; Block X's still published. The next run tries again."; fi
          exit 1
