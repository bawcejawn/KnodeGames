# Block Golf recorder: every hour, turns each live game's weekly leaderboard into Block Golf scorecards
# (bot/games/golf.ts, rules in golf-math.js) and publishes them to games-data/golf. It reads the other games'
# published files (race-data, games-data) and the question game on two nodes; it holds no key and writes nothing on chain.
#
# Two jobs, like the other recorders, so repository code never runs next to a write token:
#   record   runs the recorder with a read-only token and no secrets, and hands the files on.
#   publish  runs no repository code: it checks the files' shape and pushes games-data/golf (and nothing else).
# It has its own concurrency group (a shared one could drop queued runs); pushes to games-data are retried when another
# recorder pushed first. A data branch that exists but can't be read stops the run (never a fresh start).
# It never touches main, holds no key, and does not run on pull requests.
#
# Turn it on: Settings → Secrets and variables → Actions → Variables: GOLF_ENABLED = true
name: Block Golf recorder

on:
  schedule:
    - cron: "57 * * * *"     # every hour at minute 57 (after the race recorder at :37 and the games recorder at :47)
  workflow_dispatch: {}

concurrency:
  group: knode-golf
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    if: ${{ vars.GOLF_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # The other games' published files and Block Golf's last run (public branches; read without a token).
      # Only plain JSON files with the expected names are taken.
      - name: Take the games' results and the last run's files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prev" "$RUNNER_TEMP/race" "$RUNNER_TEMP/games/blockx"
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          # A branch that doesn't exist yet is fine; one that exists but can't be read stops the run (audit H1).
          has_branch() {
            local rc=0
            git ls-remote --exit-code --heads "$url" "$1" >/dev/null || rc=$?
            if [ "$rc" -eq 0 ]; then return 0; fi
            if [ "$rc" -eq 2 ]; then return 1; fi
            echo "::error::Couldn't read the $1 branch (git ls-remote exit $rc); nothing recorded this run."; exit 1
          }
          if has_branch race-data; then
            git fetch -q --depth 1 "$url" race-data
            for f in $(git ls-tree --name-only FETCH_HEAD); do
              if [[ "$f" =~ ^(board|W[0-9]{3})\.json$ ]]; then git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/race/$f"; fi
            done
            # The Race's own vault files: Golf's Race hole waits until the Race's week is final there (Repo Lens G-3).
            mkdir -p "$RUNNER_TEMP/race/vault"
            for f in $(git ls-tree --name-only FETCH_HEAD:vault 2>/dev/null); do
              if [[ "$f" =~ ^W[0-9]+\.json$ ]]; then git show "FETCH_HEAD:vault/$f" > "$RUNNER_TEMP/race/vault/$f"; fi
            done
          else echo "No race-data branch yet."; fi
          if has_branch games-data; then
            git fetch -q --depth 1 "$url" games-data
            if git cat-file -e "FETCH_HEAD:blockx/board.json" 2>/dev/null; then git show "FETCH_HEAD:blockx/board.json" > "$RUNNER_TEMP/games/blockx/board.json"; fi
            # The standard reader: every game that says "golf": "standard" in games.json (checked out from main above) has
            # its shared board taken the same way. Only plain lower-case ids are used; anything else is ignored.
            for id in $(node -e 'const g=JSON.parse(require("fs").readFileSync("games.json","utf8")).games||[];for(const x of g)if(x&&x.golf==="standard"&&/^[a-z][a-z0-9-]{1,30}$/.test(x.id))console.log(x.id)'); do
              mkdir -p "$RUNNER_TEMP/games/$id"
              if git cat-file -e "FETCH_HEAD:$id/board.json" 2>/dev/null; then git show "FETCH_HEAD:$id/board.json" > "$RUNNER_TEMP/games/$id/board.json"; fi
            done
            for f in $(git ls-tree --name-only FETCH_HEAD:golf 2>/dev/null); do
              if [[ "$f" =~ ^(index|board|W[0-9]{3})\.json$ ]]; then git show "FETCH_HEAD:golf/$f" > "$RUNNER_TEMP/prev/$f"; fi
            done
          else echo "No games-data branch yet."; fi
      - name: Record Block Golf
        run: npm run golf
        env:
          RPC: ${{ vars.RPC || 'https://koinos.armana.io' }}
          RPC_CHECK: ${{ vars.RPC_CHECK || 'https://api.koinosblocks.com' }}
          GOLF_PREV: ${{ runner.temp }}/prev
          GOLF_OUT: ${{ runner.temp }}/out/golf
          RACE_DATA: ${{ runner.temp }}/race
          GAMES_DATA: ${{ runner.temp }}/games
          # The first week Block Golf pays prizes (set when the vault is live). Unset: every week is practice.
          GOLF_STAKED_FROM_WEEK: ${{ vars.GOLF_STAKED_FROM_WEEK }}
          # The owner's hold: vault weeks that may not go final, e.g. "5" or "5,6" (§5.5; unset: none).
          GOLF_HOLD_WEEKS: ${{ vars.GOLF_HOLD_WEEKS }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golf-data
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: ignore

  publish:
    needs: record
    if: ${{ vars.GOLF_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # push the games-data branch (never main)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: golf-data
          path: ${{ runner.temp }}/incoming
      - name: Push games-data/golf (and nothing else)
        env:
          GH_TOKEN: ${{ github.token }}
          IN: ${{ runner.temp }}/incoming
        run: |
          set -euo pipefail
          if [ ! -d "$IN/golf" ]; then echo "Nothing to publish."; exit 0; fi
          bad=$(find "$IN" -mindepth 1 \( -type l -o \( -type d ! -path "$IN/golf" ! -path "$IN/golf/vault" \) -o \( -type f ! -regex "$IN/golf/\(index\|board\|W[0-9][0-9][0-9]\)\.json" ! -regex "$IN/golf/vault/W[0-9]+\.json" \) \) -print)
          if [ -n "$bad" ]; then echo "::error::Refusing to publish unexpected files: $bad"; exit 1; fi
          big=$(find "$IN" -type f -size +8192k -print)
          if [ -n "$big" ]; then echo "::error::Refusing to publish files over 8 MB: $big"; exit 1; fi
          # The content must be the recorder's own shape, not only parse as JSON.
          /usr/bin/python3 - "$IN/golf" <<'PY'
          import json, os, re, sys, time
          # The publish job's own clock (RECORDER_STANDARD.md §3.1-2). CHECK_NOW_MS: the tests' fixed clock; the
          # workflow never sets it.
          NOW = int(os.environ.get("CHECK_NOW_MS") or time.time() * 1000)
          GENESIS, WEEK = 1792368000000, 604800000
          CW = (NOW - GENESIS) // WEEK
          d = sys.argv[1]; addr = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}")
          isaddr = lambda x: type(x) is str and addr.fullmatch(x) is not None
          nat = lambda x: type(x) is int and 0 <= x < 10**16
          num = lambda x: type(x) in (int, float) and x == x and abs(x) < 1e16
          # A hole score as the recorder writes it (Repo Lens F-2): 0 to 1e12, at most 4 decimals (so it is written with
          # the same bytes in JS and here, and the week's fingerprint matches).
          score_ok = lambda x: type(x) in (int, float) and x == x and 0 <= x <= 1e12 and round(x, 4) == x   # B13-A1
          def text_ok(t):
              try: t.encode("utf-8"); return True
              except UnicodeEncodeError: return False
          gid = re.compile(r"[a-z0-9-]{1,24}")
          isid = lambda x: type(x) is str and gid.fullmatch(x) is not None
          small = lambda x: type(x) is int and -10**6 < x < 10**6
          def hole_ok(h):
              if type(h) is not dict or set(h) != {"id", "name", "status", "why", "field", "rows"}: return False
              if not (isid(h["id"]) and type(h["name"]) is str and text_ok(h["name"]) and len(h["name"]) <= 40 and h["status"] in ("final", "live", "skipped") and type(h["why"]) is str and len(h["why"]) <= 200 and nat(h["field"])): return False
              return type(h["rows"]) is list and len(h["rows"]) <= 100000 and all(type(r) is list and len(r) == 4 and isaddr(r[0]) and score_ok(r[1]) and r[2] in (0, 1) and type(r[3]) is int and 0 <= r[3] <= 10**9 for r in h["rows"])
          def card_ok(c, ids):
              keys = {"a", "ranked", "free", "place", "pts", "strokes", "par", "toPar", "lost", "under", "best", "mulligan", "holes"}
              if type(c) is not dict or set(c) != keys or not isaddr(c["a"]) or type(c["ranked"]) is not bool or type(c["free"]) is not bool: return False
              if not all(small(c[k]) for k in ("place", "pts", "strokes", "par", "toPar", "lost", "under", "best")) or c["place"] < 1 or c["pts"] < 0: return False
              if c["mulligan"] not in ids or type(c["holes"]) is not list or len(c["holes"]) > 32: return False
              return all(type(x) is list and len(x) == 4 and x[0] in ids and type(x[1]) is int and 1 <= x[1] <= 7 and (x[2] is None or nat(x[2])) and (x[3] is None or nat(x[3])) for x in c["holes"])
          def rows_ok(v, extra=()):
              if type(v) is not dict or type(v.get("rows")) is not list or len(v["rows"]) > 100000: return False
              keys = {"a", "place", "pts", "topar", "strokes", "holes", "lost", "ranked"}
              # boardPlace (B13-B1): on the week boards (this week / last week), not on All time
              return all(type(x) is dict and set(x) - {"boardPlace"} == keys and ("boardPlace" not in x or (nat(x["boardPlace"]) and x["boardPlace"] >= 1))
                  and isaddr(x["a"]) and type(x["ranked"]) is bool
                  and all(small(x[k]) for k in ("place", "pts", "topar", "strokes", "holes", "lost")) for x in v["rows"])
          # ── a port of golf-math.js (scoreHole, card, cards); integers only, like the original ──
          PAR, LOST, MIN_FIELD, PRACTICE_MIN_FIELD, MIN_FIELD_VHP = 4, 7, 5, 3, 10
          BANDS = [(5, 2), (25, 3), (65, 4), (90, 5), (100, 6)]
          def strokes_for(better, same, others, scored):
              if better == 0 and scored: return 1
              size, n = same + 1, others + 1
              place2 = 2 * better + size + 1
              for pct, st in BANDS:
                  if place2 * 100 <= pct * 2 * n: return st
              return 6
          def weight_of(r): return 1 if r is True else (r if type(r) is int and r > 0 else 0)
          def score_hole(rows, min_field, everyone, min_weight):
              by = {}
              for a, score, scored, w in rows:
                  w = weight_of(w); o = by.get(a)
                  if o is None or score > o["score"]: by[a] = {"a": a, "score": score, "scored": bool(scored), "w": max(w, o["w"] if o else 0)}
                  else: o["w"] = max(o["w"], w)
              allr = list(by.values())
              if everyone:
                  for r in allr: r["w"] = 1
              field = [r for r in allr if r["w"] > 0 and r["scored"]]
              n, units = len(field), sum(r["w"] for r in field)
              if n < min_field or (min_weight > 0 and units < min_weight): return None, n
              res = {}
              for r in allr:
                  better = same = ahead = 0
                  for x in field:
                      if x is r: continue
                      if x["score"] > r["score"]: better += x["w"]; ahead += 1
                      elif x["score"] == r["score"]: same += x["w"]
                  inf = r["w"] > 0 and r["scored"]
                  st = strokes_for(better, same, units - (r["w"] if inf else 0), True) if r["scored"] else 6
                  res[r["a"]] = (ahead + 1, n if inf else n + 1, st)
              return res, n
          def recompute(j):
              practice = j["practice"] is True
              live, ranked_any = [], set()
              # Staked: weight on any hole that isn't skipped, as the recorder's rankedAny (Repo Lens F-1).
              if not practice:
                  for h in j["holes"]:
                      if h["status"] != "skipped": ranked_any.update(r[0] for r in h["rows"] if r[3])
              for h in j["holes"]:
                  if h["status"] == "skipped":
                      continue
                  res, n = score_hole(h["rows"], PRACTICE_MIN_FIELD if practice else MIN_FIELD, practice, 0 if practice else MIN_FIELD_VHP)
                  assert h["field"] == n, h["id"] + ": field"
                  if res is None:
                      assert h["status"] != "final", h["id"] + ": a final hole whose field is too small must be skipped"
                      continue
                  live.append((h["id"], res))
              if len(live) < 2: return []
              notfree = set(j["notFree"])
              out = []
              for a in {a for _, res in live for a in res}:
                  row = [(hid, res[a][2], res[a][0], res[a][1], True) if a in res else (hid, LOST, None, None, False) for hid, res in live]
                  # The mulligan: the worst hole of any kind, a lost ball included; the first in course order on a tie.
                  drop = row[0]
                  for x in row:
                      if x[1] > drop[1]: drop = x
                  counted = [x for x in row if x is not drop]
                  st = sum(x[1] for x in counted); par = PAR * len(counted)
                  out.append({"a": a, "ranked": a in ranked_any, "free": a not in ranked_any and a not in notfree, "place": 0,
                      "pts": LOST * len(counted) - st, "strokes": st, "par": par, "toPar": st - par,
                      "lost": sum(1 for x in counted if not x[4]), "under": sum(1 for x in counted if x[1] < PAR),
                      "best": min(x[1] for x in counted), "mulligan": drop[0], "holes": [[x[0], x[1], x[2], x[3]] for x in row]})
              key = lambda c: (-c["pts"], c["lost"], -c["under"], c["best"])
              out.sort(key=lambda c: (key(c), c["a"]))
              for i, c in enumerate(out): c["place"] = out[i - 1]["place"] if i > 0 and key(out[i - 1]) == key(c) else i + 1
              return out
          vd = os.path.join(d, "vault")
          for f in (os.listdir(vd) if os.path.isdir(vd) else []):
              j = json.load(open(os.path.join(vd, f), encoding="utf-8"))
              assert set(j) == {"game", "week", "final", "rows", "first", "second"} and j["game"] == 6 and j["final"] is True and nat(j["week"]) and f == "W%d.json" % j["week"], "vault/" + f
              assert GENESIS + (j["week"] + 1) * WEEK <= NOW, "vault/" + f + ": sent before its week ended"
              assert type(j["rows"]) is list and len(j["rows"]) <= 100000 and all(type(r) is dict and set(r) == {"player", "points"} and isaddr(r["player"]) and type(r["points"]) is int and 1 <= r["points"] <= 255 for r in j["rows"]), "vault/" + f
              assert len({r["player"] for r in j["rows"]}) == len(j["rows"]), "vault/" + f
              assert all(type(x) is list and len(x) <= 10 and len(set(x)) == len(x) and all(isaddr(a) for a in x) for x in (j["first"], j["second"])), "vault/" + f
              w = os.path.join(d, "W%03d.json" % j["week"])
              assert os.path.exists(w), "vault/" + f + ": its week file must be published with it"
              wk = json.load(open(w, encoding="utf-8"))
              assert wk["final"] is True and wk["practice"] is False, "vault/" + f + ": its week must be final and staked"
              # The rows must be exactly the week's staked scorecards with 1+ points (fix-check V4); empty when nobody
              # staked scored (the Vault rolls that week over).
              want = sorted((c["a"], min(255, c["pts"])) for c in wk["cards"] if c["ranked"] is True and c["pts"] >= 1)
              # first/second must be the Free play board's 1st and 2nd (D-081), rebuilt from the cards.
              free = [c for c in wk["cards"] if c["free"] is True and c["ranked"] is False and c["pts"] >= 1]
              groups = []
              for c in free:
                  k = (c["pts"], -c["lost"], c["under"], -c["best"])
                  if groups and groups[-1][0] == k: groups[-1][1].append(c["a"])
                  else: groups.append((k, [c["a"]]))
              f1 = sorted(groups[0][1]) if groups else []
              f2 = sorted(groups[1][1]) if len(f1) == 1 and len(groups) > 1 else []
              f1, f2 = (f1 if len(f1) <= 10 else []), (f2 if len(f2) <= 10 else [])
              assert j["first"] == f1 and j["second"] == f2, "vault/" + f + ": first/second don't match the Free play board"
              assert sorted((r["player"], r["points"]) for r in j["rows"]) == want, "vault/" + f + ": rows don't match the week's scorecards"
          for f in os.listdir(d):
              if f == "vault": continue
              j = json.load(open(os.path.join(d, f), encoding="utf-8"))
              if f == "index.json":
                  assert set(j) == {"v", "updated", "weeks", "course", "stakedFromWeek"} and j["v"] == 1, f
                  assert type(j["weeks"]) is list and all(type(w) is int and 0 <= w <= CW + 1 for w in j["weeks"]), f + ": a week from the future"
                  assert type(j["course"]) is dict and len(j["course"]) <= 32 and all(isid(k) and type(v) is int and 0 <= v < 10000 for k, v in j["course"].items()), f
                  assert j["stakedFromWeek"] is None or (type(j["stakedFromWeek"]) is int and 0 <= j["stakedFromWeek"] < 10000), f
                  continue
              if f == "board.json":
                  assert set(j) == {"v", "updated", "today", "week", "lastWeek", "allTime"} and j["v"] == 1, f
                  assert all(rows_ok(j[k]) for k in ("today", "week", "allTime")), f
                  assert j["lastWeek"] is None or (rows_ok(j["lastWeek"]) and type(j["lastWeek"].get("final")) is bool), f
                  continue
              assert set(j) == {"v", "week", "start", "end", "final", "practice", "holes", "cards", "notFree", "check"} and j["v"] == 1 and f == "W%03d.json" % j["week"], f
              nf = j["notFree"]
              assert type(nf) is list and len(nf) <= 100000 and all(isaddr(a) for a in nf) and nf == sorted(set(nf)), f + ": notFree"
              assert not (j["practice"] is True and nf), f + ": nobody is staked in a practice week"
              # The two-run check (WEEK_CYCLE.md): null, or a sha256 fingerprint and the run that took it; a final week has none.
              c = j["check"]
              assert c is None or (type(c) is dict and set(c) == {"sig", "at"} and type(c["sig"]) is str and re.fullmatch(r"[0-9a-f]{64}", c["sig"]) is not None and nat(c["at"])), f
              assert not (j["final"] is True and c is not None), f
              # Clock: no week file from the future; final only once the week has ended (Mon 00:00 UTC, WEEK_CYCLE.md),
              # and a check stamp only from a run after the week ended, never in the future.
              assert j["week"] <= CW + 1, f + ": a week from the future"
              assert not (j["final"] is True and j["end"] > NOW), f + ": final before the week ended"
              assert c is None or j["end"] <= c["at"] <= NOW, f + ": a check stamp outside its time"
              assert nat(j["start"]) and j["start"] == 1792368000000 + j["week"] * 604800000 and j["end"] == j["start"] + 604800000 and type(j["final"]) is bool and type(j["practice"]) is bool, f
              assert type(j["holes"]) is list and len(j["holes"]) <= 32 and all(hole_ok(h) for h in j["holes"]), f
              ids = {h["id"] for h in j["holes"]}
              assert type(j["cards"]) is list and len(j["cards"]) <= 100000 and all(card_ok(c, ids) for c in j["cards"]), f
              # RECORDER_STANDARD §4.1 (Repo Lens G-5): the scorecards are recomputed here from the published hole rows,
              # with a port of golf-math.js (differential-tested against it), and must match exactly: strokes, places,
              # the mulligan, points, order, and who is Staked / Free play.
              assert recompute(j) == j["cards"], f + ": the scorecards don't match their holes"
          print("golf files ok")
          PY
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          export GIT_AUTHOR_NAME=kpred-bot GIT_AUTHOR_EMAIL=kpred-bot@users.noreply.github.com GIT_COMMITTER_NAME=kpred-bot GIT_COMMITTER_EMAIL=kpred-bot@users.noreply.github.com
          # Up to 3 tries: another recorder may push games-data between our fetch and our push.
          for try in 1 2 3; do
            rm -rf work && git init -q work && cd work
            parent=""
            if git fetch -q --depth 1 "$remote" games-data 2>/dev/null; then
              parent=$(git rev-parse FETCH_HEAD)
              git read-tree FETCH_HEAD
            else git read-tree --empty; fi
            for f in "$IN"/golf/*.json "$IN"/golf/vault/*.json; do
              [ -e "$f" ] || continue
              blob=$(git hash-object -w "$f")
              git update-index --add --cacheinfo 100644 "$blob" "golf/${f#"$IN"/golf/}"
            done
            # What's already published can't be rewritten: a final week stays exactly as it is, the list of weeks only
            # grows, and a game's joining week never changes (audit L5).
            rm -rf "$RUNNER_TEMP/old" && mkdir -p "$RUNNER_TEMP/old"
            if [ -n "$parent" ]; then
              for f in $(git ls-tree --name-only "$parent:golf" 2>/dev/null); do
                if [[ "$f" =~ ^(index|W[0-9]{3})\.json$ ]]; then git show "$parent:golf/$f" > "$RUNNER_TEMP/old/$f"; fi
              done
              mkdir -p "$RUNNER_TEMP/old/vault"
              for f in $(git ls-tree --name-only "$parent:golf/vault" 2>/dev/null); do
                if [[ "$f" =~ ^W[0-9]+\.json$ ]]; then git show "$parent:golf/vault/$f" > "$RUNNER_TEMP/old/vault/$f"; fi
              done
            fi
            /usr/bin/python3 - "$IN/golf" "$RUNNER_TEMP/old" <<'PY'
          import hashlib, json, os, sys, time
          new, old = sys.argv[1], sys.argv[2]
          load = lambda d, f: json.load(open(os.path.join(d, f), encoding="utf-8"))
          NOW = int(os.environ.get("CHECK_NOW_MS") or time.time() * 1000)   # CHECK_NOW_MS: the tests' clock only
          # Repo Lens G-5: a week that turns final must have been stamped by an earlier published run at least an hour
          # ago, with the fingerprint of exactly what is now final (the recorder's two-run check, checked here too).
          for f in os.listdir(new):
              if not (f.startswith("W") and f.endswith(".json")): continue
              nw = load(new, f)
              if nw.get("final") is not True: continue
              ow = load(old, f) if os.path.exists(os.path.join(old, f)) else None
              if ow is not None and ow.get("final") is True: continue
              c = ow.get("check") if ow else None
              assert type(c) is dict and type(c.get("at")) is int and c["at"] <= NOW - 3600000, f + ": final without an earlier run's check an hour or more ago"
              try: raw = json.dumps({"holes": nw["holes"], "cards": nw["cards"], "notFree": nw["notFree"]}, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
              except UnicodeEncodeError: raise AssertionError(f + ": a name in it can't be written as text (half an emoji?): not published") from None
              sig = hashlib.sha256(raw).hexdigest()
              assert c.get("sig") == sig, f + ": what is final isn't what the earlier run checked"
          if os.path.exists(os.path.join(old, "index.json")):
              oi, ni = load(old, "index.json"), load(new, "index.json")
              assert set(oi["weeks"]) <= set(ni["weeks"]), "the list of weeks can only grow"
              assert all(ni["course"].get(k) == v for k, v in oi["course"].items()), "a game's joining week can't change"
              assert oi.get("stakedFromWeek") is None or ni["stakedFromWeek"] == oi["stakedFromWeek"], "the first staked week can't change once set"
          ov = os.path.join(old, "vault")
          for f in (os.listdir(ov) if os.path.isdir(ov) else []):
              nf = os.path.join(new, "vault", f)
              assert not os.path.exists(nf) or load(os.path.join(new, "vault"), f) == load(ov, f), "vault/" + f + ": a sent week can't change"
          for f in os.listdir(old):
              if f.startswith("W") and load(old, f).get("final") is True:
                  assert not os.path.exists(os.path.join(new, f)) or load(new, f) == load(old, f), f + ": a final week can't change"
          print("golf history ok")
          PY
            tree=$(git write-tree)
            if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then echo "No changes."; exit 0; fi
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "golf: record")
            if git push -q "$remote" "$commit:refs/heads/games-data"; then echo "Block Golf files published."; exit 0; fi
            cd ..
            echo "Push refused (games-data moved); trying again."
            sleep 5
          done
          echo "::error::Couldn't push games-data after 3 tries."; exit 1
