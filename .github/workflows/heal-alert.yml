# Started by the self-healing script on your PC (bot/heal.mjs) whenever it restarts a node, or finds a problem it can't
# fix. This run fails on purpose, so GitHub emails you about it. The email's link shows which node and why.
name: Heal alert

on:
  workflow_dispatch:
    inputs:
      node:
        description: Which node
        required: true
        type: string
      detail:
        description: What happened
        required: true
        type: string

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Self-healing alert
        env:
          NODE_NAME: ${{ inputs.node }}
          DETAIL: ${{ inputs.detail }}
        run: |
          echo "::error title=Self-healing: $NODE_NAME::$DETAIL"
          echo "Node: $NODE_NAME"
          echo "What happened: $DETAIL"
          # R-VAULT-9: a plain-language summary at the top of the run page (ALERTS.md §7). Runs no repository code.
          {
            echo "## Heal alert: what needs your attention"
            echo ""
            echo "- **What happened:** your PC's self-healing task reports on **$NODE_NAME**: $DETAIL"
            echo "- **Does it matter:** players' stakes are safe. A node (or today's question release) needs a look; the pool earns nothing while its node is down."
            echo "- **Expected?** A restart message is expected now and then (nothing to do). \"Docker Desktop isn't running\", \"stopped trying\", \"keeps crashing\", \"Repair FAILED\" or \"questions are not out yet\" are not."
            echo "- **What to do:** find the first words of the message in \`.ai/platform/ALERTS.md\` §7. Usually: start Docker Desktop, or check \`npm run bot -- node-status\` in about 30 minutes. Before running any repair script, ask the Vault chat."
            echo "- **Deadline:** none, but a node that stays down earns nothing."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
