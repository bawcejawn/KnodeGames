# Knode Games names: once an hour (minute 4) this reads the wallets' on-chain Koinos @names (the Nicknames contract,
# from two nodes; both must agree) and the producers' pool names, and publishes names.json to the names-data branch
# when they changed. See docs/NAMES.md. (The old "claim a name by opening an issue" flow was removed on 4 Nov 2026,
# R-HUB-5: no workflow reads issues or holds an issues permission any more.)
#
# Two jobs:
#   check    a read-only token (contents: read) and no secrets. Runs bot/names.ts, which reads the chain and hands on
#            results.json and, if names.json changed, names.json.
#   publish  runs no repository code: checks names.json's shape and pushes it, alone, to names-data. Refused if
#            names-data changed since the check read it; it is simply read again on the next run.
# It never touches main, holds no key, and does not run on pull requests.
#
# Turn it on: Settings → Secrets and variables → Actions → Variables: NAMES_ENABLED = true
name: Knode Games names

on:
  schedule:
    - cron: "4 * * * *"          # the hourly @name and pool-name refresh
  workflow_dispatch: {}

concurrency:
  group: knode-names
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: ${{ vars.NAMES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # The current names.json and the producer evidence (public branches, read without a token). Plain JSON files only.
      - name: Take names.json, the race cards and the recent blocks
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p "$RUNNER_TEMP/prod" "$RUNNER_TEMP/out" "$RUNNER_TEMP/result"
          : > "$RUNNER_TEMP/base"
          for b in names-data race-data blocks-data; do
            rc=0; git ls-remote --exit-code --heads "$url" "$b" >/dev/null 2>&1 || rc=$?
            if [ "$rc" = 2 ]; then echo "No $b branch yet."; continue; fi
            if [ "$rc" != 0 ]; then echo "::error::Couldn't read the $b branch (git ls-remote exit $rc)"; exit 1; fi
            git fetch -q --depth 1 "$url" "$b"
            if [ "$b" = names-data ]; then git rev-parse FETCH_HEAD > "$RUNNER_TEMP/base"; fi
            for f in $(git ls-tree -r --name-only FETCH_HEAD); do
              if [ "$b" = names-data ] && [ "$f" = names.json ]; then git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/names.json"; fi
              if [ "$b" = race-data ] && [[ "$f" =~ ^(W[0-9]{3}|board)\.json$ ]]; then git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/prod/$f"; fi
              if [ "$b" = blocks-data ] && [ "$f" = recent-blocks.json ]; then git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/prod/$f"; fi
            done
          done
      - name: Refresh the @names and pool names
        env:
          RPC: ${{ vars.RPC || 'https://koinos.armana.io' }}
          RPC_CHECK: ${{ vars.RPC_CHECK || 'https://api.koinosblocks.com' }}
          NAMES_PREV: ${{ runner.temp }}/names.json
          NAMES_BASE_FILE: ${{ runner.temp }}/base
          PRODUCERS_DIR: ${{ runner.temp }}/prod
          NAMES_OUT: ${{ runner.temp }}/out
          NAMES_RESULT: ${{ runner.temp }}/result/results.json
        run: npm run names -- run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: names-out
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: names-result
          path: ${{ runner.temp }}/result/
          retention-days: 1

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # push the names-data branch (never main)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: names-out
          path: ${{ runner.temp }}/incoming
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: names-result
          path: ${{ runner.temp }}/result
      - name: Push names.json (and nothing else)
        env:
          GH_TOKEN: ${{ github.token }}
          IN: ${{ runner.temp }}/incoming
          RESULT: ${{ runner.temp }}/result/results.json
        run: |
          set -euo pipefail
          if [ ! -f "$IN/names.json" ]; then echo "Nothing to publish (nothing changed)."; exit 0; fi
          bad=$(find "$IN" -mindepth 1 ! -path "$IN/names.json" -print)
          if [ -n "$bad" ] || [ -L "$IN/names.json" ]; then echo "::error::Refusing to publish unexpected files: $bad"; exit 1; fi
          if [ "$(stat -c %s "$IN/names.json")" -gt 1048576 ]; then echo "::error::names.json is over 1 MB"; exit 1; fi
          # names.json's own shape (the same rules as names.js), not only valid JSON; prints the base it was built on.
          base=$(/usr/bin/python3 - "$IN/names.json" "$RESULT" <<'PY'
          import json, re, sys
          db = json.load(open(sys.argv[1], encoding="utf-8")); res = json.load(open(sys.argv[2], encoding="utf-8"))
          addr = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}")
          date = re.compile(r"\d{4}-\d{2}-\d{2}")
          sig = re.compile(r"[A-Za-z0-9_-]{80,96}={0,2}")
          name = re.compile(r"[A-Za-z0-9 .\-_']{3,24}")
          builtin = {"1Mpmf2ERhjYpX7CCiM11WERuM4j17uT1sr", "1FKTpXBhhHEbu5vVchM8UsVbAvPArJsRmR"}
          assert type(res) is dict and type(res.get("results")) is list and res.get("changed") is True, "results: nothing changed"
          b = res.get("base")
          assert type(b) is str and (b == "" or re.fullmatch(r"[0-9a-f]{40}", b)), "results: base"
          assert type(db) is dict and set(db) in ({"v", "updated", "names", "hidden", "nicknames"}, {"v", "updated", "names", "hidden", "nicknames", "pools"}) and type(db["v"]) is int and db["v"] == 1 and type(db["updated"]) is str and len(db["updated"]) <= 40, "names.json: top level"
          assert type(db["names"]) is dict and type(db["hidden"]) is dict and type(db["nicknames"]) is dict and len(db["names"]) <= 5000 and len(db["hidden"]) <= 5000 and len(db["nicknames"]) <= 5000, "names.json: sizes"
          nick = re.compile(r"[a-z0-9][a-z0-9.\-]{0,31}")
          pools = db.get("pools", {})
          assert type(pools) is dict and len(pools) <= 500, "names.json: pools"
          for a, n in pools.items():
              assert addr.fullmatch(a) and a not in builtin and type(n) is str and 1 <= len(n) <= 48 and n == n.strip() and not re.search(r"[\x00-\x1f\x7f-\x9f\u200b-\u200f\u202a-\u202e\u2066-\u2069]", n), "names.json: pool " + a
          for a, n in db["nicknames"].items():
              assert addr.fullmatch(a) and a not in builtin and type(n) is str and nick.fullmatch(n), "names.json: nickname " + a
          for a, e in db["names"].items():
              assert addr.fullmatch(a) and a not in builtin, "names.json: address " + a
              assert type(e) is dict and set(e) == {"name", "date", "signature"}, "names.json: entry " + a
              n = e["name"]
              assert type(n) is str and name.fullmatch(n) and not n.startswith(" ") and not n.endswith(" ") and "  " not in n, "names.json: name for " + a
              assert type(e["date"]) is str and date.fullmatch(e["date"]) and type(e["signature"]) is str and sig.fullmatch(e["signature"]), "names.json: entry " + a
          for a, h in db["hidden"].items():
              assert addr.fullmatch(a) and type(h) is dict and set(h) == {"reason", "date"} and type(h["reason"]) is str and len(h["reason"]) <= 200 and type(h["date"]) is str and date.fullmatch(h["date"]), "names.json: hidden " + a
          print(b)
          PY
          )
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q work && cd work
          head=""
          if git fetch -q --depth 1 "$remote" names-data 2>/dev/null; then head=$(git rev-parse FETCH_HEAD); fi
          if [ "$head" != "$base" ]; then echo "::error::names-data changed since the check read it; it is read again on the next run."; exit 1; fi
          blob=$(git hash-object -w "$IN/names.json")
          tree=$(printf '100644 blob %s\tnames.json\n' "$blob" | git mktree)
          export GIT_AUTHOR_NAME=knode-names GIT_AUTHOR_EMAIL=knode-names@users.noreply.github.com GIT_COMMITTER_NAME=knode-names GIT_COMMITTER_EMAIL=knode-names@users.noreply.github.com
          commit=$(git commit-tree "$tree" ${head:+-p "$head"} -m "names: @names and pool names")
          git push -q "$remote" "$commit:refs/heads/names-data"
          echo "names.json published."

