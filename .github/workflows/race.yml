# Producer Race recorder: every hour, takes the handicap cards (every hour: each race's start and 5 updates) and
# records finished races once their blocks are irreversible and match on two nodes. See bot/race.ts.
#
# Two jobs, like the main bot, so repository code never runs next to a write token:
#   record   runs bot/race.ts with a read-only token and no secrets (it only reads the chain), and hands the files on.
#   publish  runs no repository code: it checks the files' shape and pushes them to the race-data branch.
#            That includes vault/W<week>.json, the KnodeGames Vault's weekly results (game 7); once one is published
#            as final, publish refuses to change it. I-034: a results file goes final only 12 hours after its week,
#            and only if it is exactly the vault/PENDING-W<week>.json published at least an hour before.
#
# Owner hold (I-034): Variables → RACE_HOLD_WEEKS = "3" (or "3,4") keeps those vault weeks pending, never final, while
# you look at them. Remove the week to let it go final. Results are due 3 days after the week ends.
# It never touches main, holds no key, and does not run on pull requests.
#
# Turn it on: Settings → Secrets and variables → Actions → Variables: RACE_ENABLED = true
name: Producer race

on:
  schedule:
    - cron: "37 * * * *"     # every hour at minute 37 (a card is taken by the last run before each 1-hour leg)
  workflow_dispatch: {}

concurrency:
  group: knode-race
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # R-VAULT-9: when this run fails, a plain-language summary at the top of the run page (what happened, does it
  # matter, what to do), from .ai/platform/ALERTS.md §8. Reads two files from main; no secrets, read-only.
  summary:
    needs: [record, publish, alert]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            bot/alert-summary.mjs
            .ai/platform/ALERTS.md
          sparse-checkout-cone-mode: false
      - name: Plain-language summary (ALERTS.md §8)
        env:
          WORKFLOW_NAME: Producer race
        run: node bot/alert-summary.mjs --workflow "$WORKFLOW_NAME" --section 8

  record:
    if: ${{ vars.RACE_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # D-107 (R-RACE-13): "true" when the recorder held a paid vault week (read by the alert job below).
    outputs:
      held: ${{ steps.race.outputs.held }}
      # Repo Lens #E-11 L-2: "true" when the recorder wrote its files (the publish job fails if they don't arrive).
      files: ${{ steps.race.outputs.files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # The files the last run published (public branch; read without a token). Only plain JSON files are taken.
      - name: Take the last run's race files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prev"
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          # A missing branch is fine (the first run). Any other failure stops the run, so it never starts from nothing.
          rc=0; git ls-remote --exit-code "$url" refs/heads/race-data >/dev/null 2>&1 || rc=$?   # exactly race-data (review V3)
          if [ "$rc" = 2 ]; then echo "No race-data branch yet."
          elif [ "$rc" != 0 ]; then echo "::error::Couldn't read the race-data branch (git ls-remote exit $rc)"; exit 1
          else
            git fetch -q --depth 1 "$url" race-data
            git ls-tree -r -z --name-only FETCH_HEAD > "$RUNNER_TEMP/prev-files"   # fails the step if it fails (review V2)
            while IFS= read -r -d '' f; do
              # D-166: T<week>.json, the race types' ledger and results, comes back to the recorder too.
              if [[ "$f" =~ ^(index|board|[WT][0-9]{3})\.json$ ]]; then git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/prev/$f"; fi
              if [[ "$f" =~ ^vault/(PENDING-)?W[0-9]{1,4}\.json$ ]]; then mkdir -p "$RUNNER_TEMP/prev/vault"; git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/prev/$f"; fi
            done < "$RUNNER_TEMP/prev-files"
          fi
          # The VHP samples (race-samples.yml): each producer's card VHP is the highest of the last 6 hours.
          if git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" race-samples 2>/dev/null && git cat-file -e "FETCH_HEAD:vhp-samples.json" 2>/dev/null; then
            git show "FETCH_HEAD:vhp-samples.json" > "$RUNNER_TEMP/prev/vhp-samples.json"
          else echo "No VHP samples yet: the card uses the read at card time."; fi
      - name: Record the race
        id: race
        run: npm run race
        env:
          RPC: ${{ vars.RPC || 'https://koinos.armana.io' }}
          RPC_CHECK: ${{ vars.RPC_CHECK || 'https://api.koinosblocks.com' }}
          RACE_PREV: ${{ runner.temp }}/prev
          RACE_OUT: ${{ runner.temp }}/race-data
          RACE_HOLD_WEEKS: ${{ vars.RACE_HOLD_WEEKS || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: race-data
          path: ${{ runner.temp }}/race-data/
          retention-days: 1
          if-no-files-found: ignore

  publish:
    needs: record
    if: ${{ vars.RACE_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # push the race-data branch (never main)
    # D-107 (R-RACE-13): "true" when this job held a vault file (read by the alert job below).
    outputs:
      held: ${{ steps.push.outputs.held }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: race-data
          path: ${{ runner.temp }}/incoming
      # Audit BX-131 (round 9): the same Node as the recorders (22), for the recorders'-own-JSON check below.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Push race-data (and nothing else)
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          IN: ${{ runner.temp }}/incoming
          RECORD_FILES: ${{ needs.record.outputs.files }}
        run: |
          set -euo pipefail
          if [ ! -d "$IN" ]; then
            # Repo Lens #E-11 L-2: the recorder wrote files but none arrived: the hand-over between the jobs failed.
            if [ "${RECORD_FILES:-}" = "true" ]; then echo "::error::The record job wrote its files, but they didn't reach the publish job (artifact hand-over failed). Nothing was published this run; the next run tries again."; exit 1; fi
            echo "Nothing to publish."; exit 0
          fi
          # Round 8 (BX-122): the recorder's own JSON form, checked by the same script for the vault folder and the rest.
          # It prints the files that fail, one per line, and exits 1.
          canon='const fs=require("fs"),p=require("path"),bad=[];(function w(d){for(const f of fs.readdirSync(d)){const q=p.join(d,f),s=fs.lstatSync(q);if(s.isDirectory()){w(q);continue}if(!f.endsWith(".json"))continue;if(!s.isFile()){bad.push(p.relative(process.argv[1],q));continue}const raw=fs.readFileSync(q);let ok=false;try{ok=Buffer.compare(Buffer.from(JSON.stringify(JSON.parse(raw.toString("utf8")))+"\n","utf8"),raw)===0}catch(e){}if(!ok)bad.push(p.relative(process.argv[1],q))}})(process.argv[1]);if(bad.length){console.log(bad.join("\n"));process.exit(1)}'
          command -v node >/dev/null || { echo "::error::node is missing on this runner; nothing published"; exit 1; }
          # I-037 B1-4: a bad vault folder (an unexpected or nested file, a file over 2 MB, or one not in the recorder's
          # own JSON form) is held on its own, as the per-file vault checks below already do: no vault file is published
          # this run (no file means no prize; the alert says so), and the race cards Block X needs still publish.
          hold_vault() {
            # Repo Lens #B-8 B8-B3: paths relative to $IN, and no apostrophe in the fixed text (tr would turn it into ?).
            echo "::error::vault results held, not published this run: $(printf '%s' "$1" | sed "s#$IN/##g" | tr -c '[:alnum:]/._ ,:-' '?' | cut -c1-300) (the race cards still publish; I-037 B1-4)"
            if [ -n "${GITHUB_OUTPUT:-}" ]; then echo "held=true" >> "$GITHUB_OUTPUT"; fi
            rm -rf "$IN/vault"
          }
          if [ -e "$IN/vault" ] || [ -L "$IN/vault" ]; then
            vbad=$(find "$IN/vault" \( -type l -o \( -type d ! -path "$IN/vault" \) -o \( ! -type d ! -regex "$IN/vault/\(PENDING-\)?W[0-9][0-9]?[0-9]?[0-9]?\.json" \) \) -print)
            if [ -n "$vbad" ]; then hold_vault "unexpected files in vault/: $vbad"
            elif [ -n "$(find "$IN/vault" -type f -size +2048k -print)" ]; then hold_vault "a file in vault/ is over 2 MB"
            elif ! vout=$(node -e "$canon" -- "$IN/vault"); then hold_vault "not in the recorders own JSON form: $vout"
            fi
          fi
          # Repo Lens #D-13 M-1 / M-3: a race-types file (T) over 2 MB or not in the recorder's own JSON form is held on
          # its own, like the vault folder: the 6-hour race's files, the board and the vault still publish.
          for tf in "$IN"/T[0-9][0-9][0-9].json; do
            [ -f "$tf" ] && [ ! -L "$tf" ] || continue
            tdir="$RUNNER_TEMP/tcheck"; rm -rf "$tdir"; mkdir -p "$tdir"; cp "$tf" "$tdir/"
            twhy=""
            if [ -n "$(find "$tf" -size +2048k -print)" ]; then twhy="over 2 MB"
            elif ! node -e "$canon" -- "$tdir" >/dev/null; then twhy="not in the recorders own JSON form"; fi
            if [ -n "$twhy" ]; then
              echo "::error::$(basename "$tf") (race types) held, not published this run: $twhy (the 6-hour race files still publish; Repo Lens #D-13 M-3)"
              if [ -n "${GITHUB_OUTPUT:-}" ]; then echo "held=true" >> "$GITHUB_OUTPUT"; fi
              rm -f "$tf"
            fi
          done
          bad=$(find "$IN" -mindepth 1 \( -type l -o \( -type d ! -path "$IN/vault" \) -o \( -type f ! -regex "$IN/\(index\|board\|[WT][0-9][0-9][0-9]\)\.json" ! -regex "$IN/vault/\(PENDING-\)?W[0-9][0-9]?[0-9]?[0-9]?\.json" \) \) -print)
          if [ -n "$bad" ]; then echo "::error::Refusing to publish unexpected files: $bad"; exit 1; fi
          big=$(find "$IN" -type f -size +2048k -print)
          if [ -n "$big" ]; then echo "::error::Refusing to publish files over 2 MB: $big"; exit 1; fi
          # Round 8 (BX-122) and the class behind BX-95 / BX-112 / BX-113: every incoming file must be EXACTLY what the
          # JavaScript recorder writes for its own content (JSON.stringify of its parse, plus a newline). Then the next
          # recorder run reads back the same values and writes the same bytes, whatever Python thinks of them: no 5.0, no
          # -0, no 1e2, no big integer, no spacing or escaping a recorder never writes.
          node -e 'const fs=require("fs"),p=require("path"),bad=[];(function w(d){for(const f of fs.readdirSync(d)){const q=p.join(d,f),s=fs.lstatSync(q);if(s.isDirectory()){w(q);continue}if(!f.endsWith(".json"))continue;if(!s.isFile()){bad.push(p.relative(process.argv[1],q));continue}const raw=fs.readFileSync(q);let ok=false;try{ok=Buffer.compare(Buffer.from(JSON.stringify(JSON.parse(raw.toString("utf8")))+"\n","utf8"),raw)===0}catch(e){}if(!ok)bad.push(p.relative(process.argv[1],q))}})(process.argv[1]);if(bad.length){console.log("::error::not in the recorders own JSON form (JSON.stringify of its parse), nothing published: "+bad.join(", "));process.exit(1)}' -- "$IN"
          # The content must be the recorder's own shape, not only parse as JSON.
          # The published files, to check that a card once published is never changed (audit BX-44).
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q work
          parent=""
          mkdir -p "$RUNNER_TEMP/published"
          if git -C work fetch -q --depth 1 "$remote" race-data 2>/dev/null; then
            parent=$(git -C work rev-parse FETCH_HEAD)
            git -C work ls-tree --name-only FETCH_HEAD | while IFS= read -r f; do
              if [[ "$f" =~ ^([WT][0-9]{3}|index)\.json$ ]]; then git -C work show "FETCH_HEAD:$f" > "$RUNNER_TEMP/published/$f"; fi
            done
            # I-034: the published vault files, to check the hold (a final file needs its pending file, published earlier).
            git -C work ls-tree --name-only FETCH_HEAD vault/ | while IFS= read -r f; do
              if [[ "$f" =~ ^vault/(PENDING-)?W[0-9]{1,4}\.json$ ]]; then mkdir -p "$RUNNER_TEMP/published/vault"; git -C work show "FETCH_HEAD:$f" > "$RUNNER_TEMP/published/$f"; fi
            done
          fi
          /usr/bin/python3 - "$IN" "$RUNNER_TEMP/published" <<'PY'
          import json, os, re, sys
          d = sys.argv[1]; pub = sys.argv[2] if len(sys.argv) > 2 else ""; addr = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}")
          isaddr = lambda v: type(v) is str and addr.fullmatch(v) is not None
          # Round-7 blind review: JavaScript compares with ===, Python's == says True == 1 and 3.0 == 3. So every check of
          # a file's header is type-strict (v, week, game), and published content is compared with same() (types too).
          def same(a, b):
              if type(a) is not type(b): return False
              if type(a) is dict: return a.keys() == b.keys() and all(same(a[k], b[k]) for k in a)
              if type(a) is list: return len(a) == len(b) and all(same(x, y) for x, y in zip(a, b))
              return a == b
          one = lambda x: type(x) is int and x == 1
          num = lambda x: type(x) in (int, float) and x == x and abs(x) <= 2**53 - 1   # audit BX-113: JavaScript's exact range
          # Audit BX-95 / BX-112 / BX-113 (rounds 6-7), the root cause: the recorders are JavaScript. Every value of every
          # incoming file must be one JavaScript reads back exactly (integers and numbers within 2^53 - 1, finite), so a
          # bad run can never publish a value that makes every honest run after it look like a rewrite.
          def js_safe(o, depth=0):
              if depth > 64: return False
              if o is None or type(o) in (bool, str): return True
              if type(o) is int: return abs(o) <= 2**53 - 1
              if type(o) is float: return o == o and abs(o) <= 2**53 - 1 and not o.is_integer()   # BX-122: JSON.stringify never writes 5.0
              if type(o) is list: return all(js_safe(x, depth + 1) for x in o)
              if type(o) is dict: return all(type(k) is str and js_safe(v, depth + 1) for k, v in o.items())
              return False
          for _root, _dirs, _files in os.walk(d):
              if os.path.relpath(_root, d).split(os.sep)[0] == "vault": continue   # checked below, on its own (blind review V1)
              for _f in _files:
                  # Repo Lens #D-14 N-1: T files are checked on their own (check_types), so a bad one is held alone.
                  if _f.endswith(".json") and not (_root == d and re.fullmatch(r"T[0-9]{3}\.json", _f)):
                      assert js_safe(json.load(open(os.path.join(_root, _f), encoding="utf-8"))), "a value the recorder (JavaScript) can't read back exactly: " + _f
          def card_ok(c):
              # Audit BX-44: exact keys (cards feed Block X's scores). "samples" (how many VHP samples it used) is new.
              if c is None: return True
              # Audit BX-55: "flagged", the producers whose VHP the two nodes read differently (Block X holds their targets).
              # Round 4: "topInDoubt" (BX-73: the nodes disagreed at the top; Block X holds every target on it), "height" (BX-77).
              if type(c) is not dict or set(c) - {"samples", "flagged", "topInDoubt", "height"} != {"at", "blocksPerRace", "c", "fairness", "field", "paddock"}: return False
              if "topInDoubt" in c and c["topInDoubt"] is not True: return False
              if "height" in c and not (type(c["height"]) is int and 0 < c["height"] < 10**12): return False
              if "samples" in c and not (type(c["samples"]) is int and 0 <= c["samples"] <= 1000): return False
              if "flagged" in c and not (type(c["flagged"]) is list and 0 < len(c["flagged"]) <= 500 and all(isaddr(a) for a in c["flagged"]) and len(set(c["flagged"])) == len(c["flagged"])): return False
              if not num(c["at"]) or not num(c["c"]) or not num(c["blocksPerRace"]): return False
              if not (c["fairness"] is None or (type(c["fairness"]) is list and len(c["fairness"]) == 2 and all(num(v) for v in c["fairness"]))): return False
              if type(c["field"]) is not list or type(c["paddock"]) is not list or len(c["field"]) + len(c["paddock"]) > 500: return False
              return all(type(r) is dict and set(r) == {"a", "vhp", "k", "h"} and isaddr(r["a"]) and num(r["vhp"]) and 0 <= r["vhp"] < 1e12 and num(r["k"]) and num(r["h"]) and r["h"] > 0 for r in c["field"]) and \
                  all(type(r) is dict and set(r) == {"a", "vhp", "k"} and isaddr(r["a"]) and num(r["vhp"]) and 0 <= r["vhp"] < 1e12 and num(r["k"]) for r in c["paddock"])
          def result_ok(r):
              if r is None: return True
              if type(r) is not dict or r.get("final") is not True: return False
              if r.get("missed"): return set(r) <= {"final", "missed", "note"} and len(str(r.get("note", ""))) < 200
              st = r.get("standings")
              if not set(r) <= {"final", "checked", "heights", "blocks", "line", "winner", "standings", "picks"}: return False
              # Standings: real addresses, each once, in finishing order (most steps first), at most 500.
              if type(st) is not list or len(st) > 500 or not all(type(x) is dict and type(x.get("a")) is str and addr.fullmatch(x["a"]) and num(x.get("steps"))
                  and type(x.get("blocks")) is int for x in st): return False
              if len({x["a"] for x in st}) != len(st) or any(st[i]["steps"] < st[i + 1]["steps"] for i in range(len(st) - 1)): return False
              # The winner and the win and show flags must follow from the standings (race-math.js: winners, shows).
              won = bool(st) and st[0]["steps"] > 0
              if r.get("winner") != (st[0]["a"] if won else None): return False
              shows = {x.get("a") for x in st[1:3] if num(x.get("steps")) and x["steps"] > 0} if won else set()
              flag = lambda v: type(v) is int and v in (0, 1)
              pk = r.get("picks", [])
              if type(pk) is not list or len(pk) > 100000 or not all(type(x) is list and len(x) in (5, 6) and isaddr(x[0]) and isaddr(x[1])
                  and type(x[2]) is int and flag(x[3]) and flag(x[4]) and x[3] == (1 if x[1] == r.get("winner") else 0)
                  and (len(x) == 5 or (flag(x[5]) and x[5] == (1 if x[1] != r.get("winner") and x[1] in shows else 0))) for x in pk): return False
              return type(r.get("checked")) is int and r["checked"] in (1, 2)
          def rows_ok(b):
              rows = b.get("rows") if type(b) is dict else None
              # earns: 1 or 2 = the free prize's place (free players only), 3 = a share of the staked bucket, 0 = nothing.
              return type(rows) is list and len(rows) <= 100000 and all(type(x) is dict and set(x) == {"a", "pts", "correct", "shows", "picks", "ranked", "boardPlace", "earns"}
                  and type(x["earns"]) is int and x["earns"] in (0, 1, 2, 3) and (x["earns"] != 3 or x["ranked"] is True) and (x["earns"] not in (1, 2) or x["ranked"] is False)
                  and isaddr(x["a"]) and all(type(x[k]) is int and 0 <= x[k] < 10**9 for k in ("pts", "correct", "shows", "picks")) and type(x["boardPlace"]) is int and 1 <= x["boardPlace"] <= len(rows)
                  # D-166: the race types score their own points (a win 2, 3, 6 or 12; a show 1, 2 or 4), so pts lies between
                  # those bounds; the recompute below checks the last week's exactly.
                  and x["correct"] + x["shows"] <= x["picks"] and (x["pts"] == 3 * x["correct"] + x["shows"] if TYPES_FROM >= TYPES_OFF else 2 * x["correct"] + x["shows"] <= x["pts"] <= 12 * x["correct"] + 4 * x["shows"]) and type(x["ranked"]) is bool for x in rows)
          import time
          GENESIS, WEEK = 1792368000, 7 * 86400   # the vault's week 0 (Mon 19 Oct 2026 00:00 UTC), in seconds
          NOW = float(os.environ.get("RACE_CHECK_NOW") or time.time())   # the tests set a clock; the workflow never does
          # D-125 (owner, 4 Nov): the weekly rhythm. From RHYTHM_FROM (M.RHYTHM_FROM_WEEK in race-math.js; tests only set
          # RACE_RHYTHM_FROM) races run Mon 00:00 -> Sat 24:00 UTC, Sunday UTC is the review day, and a week may go final
          # from Monday 00:00 UTC (no 12-hour wait after it: the review day came first).
          RHYTHM_FROM = int(os.environ.get("RACE_RHYTHM_FROM") or 3)
          # D-166, Repo Lens #D-13 L-2: the first week the race types count (M.TYPES_FROM_WEEK in race-math.js; TYPES_OFF
          # while it is null; tests only set RACE_TYPES_FROM). Before it a T file is refused; from it a final vault week
          # needs its T file with every typed race final.
          TYPES_OFF = 1000000
          TYPES_FROM_WEEK = TYPES_OFF   # = M.TYPES_FROM_WEEK when the owner turns the types on (a test checks they match)
          TYPES_FROM = int(os.environ.get("RACE_TYPES_FROM") or TYPES_FROM_WEEK)
          DAY_S = 86400
          def vault_ok(f, j, early=False):
              # The KnodeGames Vault's results (game 7, the Producer Race). rows: staked players, points 1-255 in board
              # order. first/second: free-prize places, at most 10 wallets each. No wallet twice. Nothing before the week
              # is final, and final only once the week has ended by this runner's clock. 2nd only after a single 1st (a
              # tie for 1st takes both prizes). skipped: race ids of that week.
              m = re.fullmatch(r"W([0-9]{1,4})\.json", f)
              if not m or type(j) is not dict or set(j) != {"game", "week", "final", "rows", "first", "second", "skipped"}: return False
              if type(j["game"]) is not int or j["game"] != 7 or type(j["week"]) is not int or f != "W%d.json" % j["week"] or type(j["final"]) is not bool: return False
              a, b, rows, sk = j["first"], j["second"], j["rows"], j["skipped"]
              if type(a) is not list or type(b) is not list or type(rows) is not list or type(sk) is not list: return False
              if len(a) > 10 or len(b) > 10 or len(rows) > 100000 or len(sk) > 28: return False
              if not all(type(r) is dict and set(r) == {"player", "points"} and isaddr(r["player"]) and type(r["points"]) is int and 1 <= r["points"] <= 255 for r in rows): return False
              if any(rows[i]["points"] < rows[i + 1]["points"] for i in range(len(rows) - 1)): return False
              who = [r["player"] for r in rows] + a + b
              if not all(isaddr(x) for x in a + b) or len(set(who)) != len(who): return False
              if not all(type(x) is str and re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T(00|06|12|18)", x) for x in sk): return False
              if not j["final"]: return not (a or b or rows or sk)
              if GENESIS + (j["week"] + 1) * WEEK > NOW and not early: return False
              return not (b and len(a) != 1)
          # I-034 (R-RACE-1): the hold. PENDING-W<n>.json is the file the recorder WOULD make final, and when it first saw
          # it ("at", ms). A pending file with new content must be dated now, within 35 minutes, so a run can't backdate it (a slow record job still fits); one whose content is
          # already published keeps its published date. A final W<n>.json that isn't already published as final must be
          # 12 hours past its week AND exactly the pending file published at least an hour ago; otherwise only that file
          # is held (removed from this push), and the pending file and the race files still publish.
          HOLD_S, STABLE_S = 12 * 3600, 3600
          # D-107 (R-RACE-13): a held vault file fails the run after publishing (the alert job), so the owner gets an email.
          def held_out():
              o = os.environ.get("GITHUB_OUTPUT")
              if o:
                  with open(o, "a", encoding="utf-8") as fh: fh.write("held=true\n")
          def pub_json(rel):
              q = os.path.join(pub, rel) if pub else ""
              try: return json.load(open(q, encoding="utf-8")) if q and os.path.isfile(q) else None
              except Exception: return None
          def pending_ok(f, j):
              m = re.fullmatch(r"PENDING-W([0-9]{1,4})\.json", f)
              if not m or type(j) is not dict or set(j) != {"game", "week", "at", "file"} or type(j["game"]) is not int or j["game"] != 7: return False
              if type(j["week"]) is not int or f != "PENDING-W%d.json" % j["week"] or type(j["at"]) is not int: return False
              fl = j["file"]
              rhythm = j["week"] >= RHYTHM_FROM
              play_end = GENESIS + (j["week"] + 1) * WEEK - (DAY_S if rhythm else 0)   # D-125: pending from Sunday 00:00 UTC
              if NOW < play_end: return False
              if type(fl) is not dict or fl.get("final") is not True or fl.get("week") != j["week"] or not vault_ok("W%d.json" % j["week"], fl, early=rhythm): return False
              if j["at"] < play_end * 1000: return False
              if not pub: return True                                            # the offline shape tests (no published folder)
              old = pub_json("vault/" + f)
              if type(old) is dict and same(old.get("file"), fl): return same(old.get("at"), j["at"])
              return NOW * 1000 - 35 * 60 * 1000 <= j["at"] <= NOW * 1000 + 300 * 1000   # Repo Lens #D-5 R85-2 (owner, 4 Nov): 35 min, not 2 h
          def final_held(f, j):
              # "" when this final file may publish; otherwise why it's held.
              # The workflow always passes the published folder; only the offline shape tests leave it out.
              if not pub or type(j) is not dict or j.get("final") is not True: return ""
              old = pub_json("vault/" + f)
              if type(old) is dict and old.get("final") is True: return ""        # already final: the lock below decides
              if j["week"] >= RHYTHM_FROM:
                  if NOW < GENESIS + (j["week"] + 1) * WEEK: return "its week hasn't ended (D-125: final from Monday 00:00 UTC)"
              elif NOW < GENESIS + (j["week"] + 1) * WEEK + HOLD_S: return "less than 12 hours after its week"
              p = pub_json("vault/PENDING-" + f)
              if type(p) is not dict or not same(p.get("file"), j): return "no published pending file with exactly this content"
              if type(p.get("at")) is not int or p["at"] > NOW * 1000 - STABLE_S * 1000: return "its pending file is less than an hour old"
              return recompute_held(j)
          # I-085 (R-RACE-12, RECORDER_STANDARD §4.1): a new final file's rows / first / second are worked out again here,
          # from the week's race file (this push's, else the published one) and the board's Staked / Free split, with the
          # recorder's own rules (bot/race.ts: tally, rank, stakedRows, prizePlaces). Anything different holds the file.
          # Who is staked comes from board.json; the vault bot checks that list against the chain (PR #74).
          PRIZES_FROM = int(os.environ.get("RACE_PRIZES_FROM") or 3)   # PRIZES_FROM_WEEK in bot/race.ts; tests only set it
          def week_json(w, pattern="W%03d.json"):
              name = pattern % w
              for q in (os.path.join(d, name), os.path.join(pub, name) if pub else ""):
                  if q and os.path.isfile(q):
                      try: return json.load(open(q, encoding="utf-8"))
                      except Exception: return None
