                      # Repo Lens #E-11 H-1 (a): a race's published final result never changes either (the recorder keeps
                      # it as it is). Picks stored before Show existed have 5 fields; the recorder adds the 6th when it
                      # loads them, so those are compared on their first 5.
                      if o and type(o.get("result")) is dict and o["result"].get("final") is True:
                          a, b = o["result"], r["result"]
                          ok = type(b) is dict and same({k: v for k, v in a.items() if k != "picks"}, {k: v for k, v in b.items() if k != "picks"})
                          pa, pb = a.get("picks"), b.get("picks") if type(b) is dict else None
                          ok = ok and (pa is None) == (pb is None) and (pa is None or (type(pa) is list and type(pb) is list and len(pa) == len(pb)
                              and all(same(x, y) or (type(x) is list and len(x) == 5 and type(y) is list and len(y) == 6 and same(x, y[:5])) for x, y in zip(pa, pb))))
                          assert ok, f"{f} {r['id']}: a published final result would change"
          print("race files ok")
          PY
          cd work
          if [ -n "$parent" ]; then git read-tree "$parent"; else git read-tree --empty; fi
          for f in "$IN"/*.json "$IN"/vault/*.json; do
            [ -e "$f" ] || continue
            rel="${f#"$IN"/}"
            # A vault results file already published as final never changes: the vault may have posted it.
            if [[ "$rel" == vault/* ]] && [ -n "$parent" ] && git show "$parent:$rel" > "$RUNNER_TEMP/old.json" 2>/dev/null \
              && /usr/bin/python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("final") is True else 1)' "$RUNNER_TEMP/old.json" \
              && ! cmp -s "$RUNNER_TEMP/old.json" "$f"; then
              # Repo Lens #B-8 B8-B1: hold that file only (the published copy stays, from read-tree) and alert; the race
              # cards still publish.
              echo "::error::Refusing to change $rel: it was already published as final (vault file held; race cards still publish)."
              if [ -n "${GITHUB_OUTPUT:-}" ]; then echo "held=true" >> "$GITHUB_OUTPUT"; fi
              continue
            fi
            blob=$(git hash-object -w "$f")
            git update-index --add --cacheinfo 100644 "$blob" "$rel"
          done
          tree=$(git write-tree)
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then echo "No changes."; exit 0; fi
          export GIT_AUTHOR_NAME=kpred-bot GIT_AUTHOR_EMAIL=kpred-bot@users.noreply.github.com GIT_COMMITTER_NAME=kpred-bot GIT_COMMITTER_EMAIL=kpred-bot@users.noreply.github.com
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "race: record")
          git push -q "$remote" "$commit:refs/heads/race-data"
          echo "Race files published."

  # D-107 (R-RACE-13, I-087): a held paid vault week fails the run (so GitHub emails the owner), but only after
  # publishing, so the hour's cards and boards still go out. Runs no repository code and needs no permissions.
  alert:
    needs: [record, publish]
    if: ${{ always() && (needs.record.outputs.held == 'true' || needs.publish.outputs.held == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: A Race vault week is held
        run: |
          echo "::error::The Producer Race held a vault week. The record or publish job's errors above name the week, why, the deadline and what you can do (.ai/platform/RUNBOOK.md §3). Everything else was published."
          exit 1
