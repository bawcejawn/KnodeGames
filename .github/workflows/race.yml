                          s0 = r["start"] + i * leg
                          assert leg > 0 and s0 - 2 * 3600000 <= c["at"] < s0 + leg, f + " " + r["id"] + ": a card dated outside its leg"
                          # I-042 (BX-118): never a card from the future (the recorder takes cards at the moment it runs;
