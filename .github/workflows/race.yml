              wf = week_json(w)
              if type(wf) is not dict or wf.get("week") != w or type(wf.get("races")) is not list: return "its week's race file can't be read to check it"
              t, reached = {}, {}
              import datetime as _dt
              # D-166: the 6-hour races (W file), then the race types (T file, this push's else the published one), each
              # with its own points: [win, show] by type.
              tw = week_json(w, "T%03d.json") if w >= TYPES_FROM else None
              typed = tw.get("races") if type(tw) is dict and tw.get("week") == w and type(tw.get("races")) is list else []
              if w >= TYPES_FROM:
                  # Repo Lens #D-13 L-2 / L-3: a week with race types goes final only with its T file, and with every typed
                  # race that counts for it (not Sunday's) final (scored, or missed for want of a card).
                  if not typed: return "its race-types file (T) can't be read to check it"
                  if any(type(r) is not dict or type(r.get("result")) is not dict or r["result"].get("final") is not True for r in typed
                         if not (w >= RHYTHM_FROM and type(r) is dict and type(r.get("start")) is int and _dt.datetime.fromtimestamp(r["start"] / 1000, _dt.timezone.utc).weekday() == 6)):
                      return "a typed race of the week isn't final yet"
              PTS = {0: (3, 1), 1: (2, 1), 2: (2, 1), 3: (6, 2), 4: (12, 4)}
              for r in [dict(x, type=0) if type(x) is dict else x for x in wf["races"]] + typed:
                  # D-129: a Sunday race in a rhythm week counts on no week's board or prize.
                  if w >= RHYTHM_FROM and type(r) is dict and type(r.get("start")) is int and _dt.datetime.fromtimestamp(r["start"] / 1000, _dt.timezone.utc).weekday() == 6: continue
                  res = r.get("result") if type(r) is dict else None
                  if type(res) is not dict or res.get("final") is not True or type(res.get("picks")) is not list: continue
                  pw, ps = PTS.get(r.get("type"), (0, 0))
                  for x in res["picks"]:
                      who, right, show = x[0], x[3] == 1, len(x) > 5 and x[5] == 1
                      c = t.setdefault(who, [0, 0, 0, 0])
                      c[2] += 1; c[0] += 1 if right else 0; c[1] += 1 if (not right and show) else 0; c[3] += pw if right else ps if show else 0
                      # D-152: when the wallet reached its score = its latest scoring pick (a win or a show).
                      if (right or show) and (who not in reached or x[2] > reached[who]): reached[who] = x[2]
              bp = os.path.join(d, "board.json")
              try: b = json.load(open(bp, encoding="utf-8")) if os.path.isfile(bp) else None
              except Exception: b = None
              lw = b.get("lastWeek") if type(b) is dict else None
              if not t:
                  return "" if not (j["rows"] or j["first"] or j["second"]) else "nobody picked that week, yet the file lists players"
              if type(lw) is not dict or lw.get("week") != w or type(lw.get("rows")) is not list: return "this push has no board for that week to check it against"
              staked = {}
              for x in lw["rows"]:
                  if type(x) is not dict or x.get("a") in staked: return "the board's last week lists a wallet twice"
                  staked[x.get("a")] = x.get("ranked") is True
                  c = t.get(x.get("a"))
                  if c is None or [x.get("correct"), x.get("shows"), x.get("picks"), x.get("pts")] != c: return "the board's last week doesn't match the week's picks (" + str(x.get("a")) + ")"
              if set(staked) != set(t): return "the board's last week leaves out a wallet that picked"
              rows = sorted(({"a": a, "correct": c[0], "shows": c[1], "picks": c[2], "pts": c[3], "ranked": staked[a]} for a, c in t.items()),
                            key=lambda r: (-r["pts"], -r["correct"], -r["picks"], reached.get(r["a"], float("inf")), r["a"]))
              def groups(rs):
                  out = []
                  for r in rs:
                      if out and (out[-1][0]["pts"], out[-1][0]["correct"], out[-1][0]["picks"]) == (r["pts"], r["correct"], r["picks"]): out[-1].append(r)
                      else: out.append([r])
                  return out
              # Values 255 … 1 per tied group. Past 255 groups (I-086) the paid set (the board's earns == 3, the vault's
              # top 30%) is kept apart: if the paid groups reach the 255th group, groups 254 … the last paid share 2 and
              # every unpaid wallet gets 1 (bot/race.ts rowValues).
              srows = [r for r in rows if r["ranked"] and r["pts"] >= 1]
              paid = {x.get("a") for x in lw["rows"] if type(x) is dict and x.get("earns") == 3}
              # Repo Lens #B-8 B8-A1, the cheap guard: the board's paid list can't be more than the top 30% of the staked
              # wallets with a point, and only those can be in it (the vault bot's own check is R-VAULT, D-152).
              if not paid <= {r["a"] for r in srows} or len(paid) > (len(srows) * 30 + 99) // 100: return "its paid list (earns 3) isn't within the top 30% of the staked wallets with a point"
              # D-152: in each tied group with a paid wallet, the wallets after its last paid one take the next place
              # (bot/race.ts cutLine), so the vault pays exactly the top 30%.
              sg = []
              for g in groups(srows):
                  k = max([i for i, r in enumerate(g) if r["a"] in paid], default=-1)
                  sg += [g[:k + 1], g[k + 1:]] if 0 <= k < len(g) - 1 else [g]
              last = max([i for i, g in enumerate(sg) if any(r["a"] in paid for r in g)], default=-1)
              exact = len(sg) <= 255 or last <= 253
              val = lambda i: max(1, 255 - i) if exact else (255 - i if i <= 252 else 2 if i <= last else 1)
              want_rows = [{"player": r["a"], "points": val(i)} for i, g in enumerate(sg) for r in g]
              fg = groups([r for r in rows if not r["ranked"] and r["pts"] >= 1])
              # D-159: each place up to 10 wallets; within a tie, the wallets that reached their score first (rows' order, D-152).
              early = lambda g, n: [r["a"] for r in g][:n]
              if not fg: want_first, want_second = [], []
              elif len(fg[0]) > 1 or len(fg) == 1: want_first, want_second = early(fg[0], 10), []
              else: want_first, want_second = [fg[0][0]["a"]], early(fg[1], 10)
