              assert js_safe(j), f + ": a value the recorder (JavaScript) can't read back exactly"
              # D-166: the race types' week file: the hour ledger and the week's 260 races of types 1-4.
              assert j["week"] >= TYPES_FROM if type(j) is dict and type(j.get("week")) is int else False, f + ": race types aren't on for that week (TYPES_FROM)"
              import datetime
              assert set(j) == {"v", "week", "start", "end", "hours", "races"} and one(j["v"]) and type(j["week"]) is int and 0 <= j["week"] < 10000 and f == "T%03d.json" % j["week"], f
              assert j["start"] == 1792368000000 + j["week"] * 7 * 86400000 and j["end"] == j["start"] + 7 * 86400000, f
              hs = j["hours"]
              assert type(hs) is list and len(hs) <= 168, f + ": hours"
              for k, h in enumerate(hs):
                  assert type(h) is dict and set(h) == {"t", "a", "b", "n", "l", "c"} and type(h["t"]) is int and j["start"] <= h["t"] < j["end"] and h["t"] % 3600000 == 0 \
                      and (k == 0 or hs[k - 1]["t"] < h["t"]) and type(h["a"]) is int and type(h["b"]) is int and 0 < h["a"] <= h["b"] + 1 < 10**12, f + ": an hour"
                  assert type(h["n"]) is dict and len(h["n"]) <= 500 and all(isaddr(a) and type(v) is int and 0 <= v <= 100000 for a, v in h["n"].items()) \
                      and sum(h["n"].values()) == h["b"] - h["a"] + 1, f + ": an hour's block counts"
                  assert type(h["l"]) is dict and set(h["l"]) <= set(h["n"]) and all(type(v) is int and h["t"] <= v < h["t"] + 3600000 for v in h["l"].values()), f + ": an hour's last block times"
                  assert type(h["c"]) is list and len(h["c"]) == 4 and all(num(v) and 0 <= v <= 2.5 for v in h["c"]), f + ": an hour's luck trims"
              def iso(ms, fmt): return datetime.datetime.fromtimestamp(ms / 1000, datetime.timezone.utc).strftime(fmt)
              want = []
              for ty, step, ln, pre, fmt in ((1, 3600000, 3600000, "H1-", "%Y-%m-%dT%H"), (2, 7200000, 7200000, "H2-", "%Y-%m-%dT%H"), (3, 86400000, 86400000, "D-", "%Y-%m-%d"), (4, 7 * 86400000, 6 * 86400000, "W-", "%Y-%m-%d")):
                  for st in range(j["start"], j["end"], step): want.append((ty, pre + iso(st, fmt), st, st + ln))
              assert type(j["races"]) is list and len(j["races"]) == len(want) == 260, f + ": races"
              for r, (ty, rid, st, en) in zip(j["races"], want):
                  assert type(r) is dict and set(r) == {"type", "id", "start", "end", "result"} and r["type"] == ty and type(r["type"]) is int and r["id"] == rid \
                      and r["start"] == st and type(r["start"]) is int and r["end"] == en and type(r["end"]) is int, f + ": race " + str(rid)
                  assert result_ok(r["result"]) and (r["result"] is None or "heights" not in r["result"]), f + " " + rid
              # Repo Lens #D-13 L-8: the ledger runs on from hour to hour, every producer with blocks has its last time,
              # and a scored typed race is over, has all its hours in the ledger, and its standings' blocks are the
              # ledger's counts.
              for k in range(1, len(hs)):
                  if hs[k]["t"] == hs[k - 1]["t"] + 3600000: assert hs[k]["a"] == hs[k - 1]["b"] + 1, f + ": the ledger's heights don't run on"
              for h in hs: assert set(h["l"]) == set(h["n"]), f + ": an hour's last block times"
              byt = {h["t"]: h for h in hs}
              for r in j["races"]:
                  x = r["result"]
                  if type(x) is dict and x.get("final") is True and not x.get("missed"):
                      assert r["end"] <= NOW * 1000, f + " " + r["id"] + ": scored before it ended"
                      hrs = list(range(r["start"], r["end"], 3600000))
                      assert all(t0 in byt for t0 in hrs), f + " " + r["id"] + ": an hour of it isn't in the ledger"
                      assert type(x.get("standings")) is list and all(type(e) is dict and e.get("blocks") == sum(byt[t0]["n"].get(e.get("a"), 0) for t0 in hrs) for e in x["standings"]), f + " " + r["id"] + ": its standings aren't the ledger's counts"
              if pub and os.path.exists(os.path.join(pub, f)):
                  o = json.load(open(os.path.join(pub, f), encoding="utf-8"))
                  # Like the 6-hour cards and results (H-1 a): a published ledger hour and a published final result
                  # never change.
                  oh = {h.get("t"): h for h in o.get("hours", []) if type(h) is dict}
                  nh = {h["t"]: h for h in hs}
                  for t0, h in oh.items(): assert t0 in nh and same(h, nh[t0]), f"{f}: a published ledger hour would change or go"
                  orr = {r.get("id"): r for r in o.get("races", []) if type(r) is dict}
                  for r in j["races"]:
                      x = orr.get(r["id"])
                      if x and type(x.get("result")) is dict and x["result"].get("final") is True: assert same(x["result"], r["result"]), f"{f} {r['id']}: a published final result would change"
          # ── the VHP ruler (owner, 11 Nov 2026; bot/race-ruler.ts): R<week>.json. vhp_ruler.py is the copy embedded in the step
          # above (byte for byte the repository's file, tested), loaded from that path only. ──
          RULER_GAME = {"game": 7, "c": "500000", "minK": 10, "poolRule": "min", "ownRule": "spot", "paying": True, "pooled": ["1Mpmf2ERhjYpX7CCiM11WERuM4j17uT1sr"]}   # = RULER in bot/race-ruler.ts (tested)
          RULER_CARD = 7200   # = CARD_BLOCKS in bot/race-ruler.ts (the card window, the 6 hours before the lock)
          _vr = None
          def VR():
              global _vr
              if _vr is None:
                  import importlib.util
                  rp = os.environ.get("RULER_PY") or ""
                  assert rp and os.path.isfile(rp), "the ruler's code (vhp_ruler.py) isn't available to check the ruler files"
                  spec = importlib.util.spec_from_file_location("vhp_ruler", rp); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m); _vr = m
              return _vr
          # The switch: the variable as the owner set it, read strictly (anything odd stops the run: nothing is published).
          _rv = os.environ.get("RACE_RULER_FROM_WEEK", "")
          RULER_FROM = None if _rv == "" else VR().switch_from(_rv)
          def ruler_mode(w): return "off" if RULER_FROM is None else VR().ruler_mode(w, RULER_FROM)
          _ledger = []
          def ruler_ledger():
              if not _ledger and os.environ.get("RACE_RULER_TL"):
                  # the tests' made-up chain as a ruler timeline (the workflow never sets it; it reads vhp-data)
                  _tl = json.load(open(os.environ["RACE_RULER_TL"], encoding="utf-8"))
                  for _x in _tl["deltas"]: _x["d"] = int(_x["d"]); _x["inc"] = int(_x["inc"])
                  for _x in _tl["anchors"].values(): _x["v"] = int(_x["v"])
                  _ledger.append(VR().Ledger(_tl))
              if not _ledger:
                  vd = os.environ.get("RULER_VHP_DATA") or ""
                  assert vd and os.path.isdir(vd), "the ruler's data (vhp-data) isn't available to check the ruler's cards"
                  _ledger.append(VR().load_ledger(vd)[0])
              return _ledger[0]
          def round_of(start_ms, ty=0):
              import datetime
              return datetime.datetime.fromtimestamp(start_ms / 1000, datetime.timezone.utc).strftime("%Y%m%d%H") + str(ty)
          def window_of(S0, S1):
              L = S0 - 1
              return {"W0": L - RULER_CARD + 1, "W1": L, "L": L, "S0": S0, "S1": S1}
          def placings_of(card):
              field = [p for p in card.get("producers", []) if type(p) is dict and p.get("entry") is True and p.get("void") is not True and p.get("fpct") is not None]
              field.sort(key=lambda p: (-int(p["fpct"]), p["a"]))
              return [p["a"] for p in field[:3]]
          def check_ruler(f, j):
              assert js_safe(j), f + ": a value the recorder (JavaScript) can't read back exactly"
              assert type(j) is dict and set(j) == {"v", "week", "rulerFrom", "mode", "shadow", "races"} and one(j["v"]) and type(j["week"]) is int and 0 <= j["week"] < 10000 and f == "R%03d.json" % j["week"], f
              w = j["week"]
              assert (j["rulerFrom"] is None and RULER_FROM is None) or (type(j["rulerFrom"]) is int and j["rulerFrom"] == RULER_FROM), f + ": it wasn't made with the switch as set (RACE_RULER_FROM_WEEK)"
              assert j["mode"] == ruler_mode(w) and j["shadow"] is (j["mode"] == "shadow"), f + ": its mode isn't the switch's"
              rs = j["races"]
              assert type(rs) is list and len(rs) <= 28, f + ": races"
              if j["mode"] == "off": assert rs == [], f + ": a week the ruler is off for has no cards"
              wf = week_json(w)
              byid = {r.get("id"): r for r in (wf.get("races", []) if type(wf) is dict and wf.get("week") == w else []) if type(r) is dict}
              old = {}
              if pub and os.path.isfile(os.path.join(pub, f)):
                  try: old = {e.get("id"): e for e in json.load(open(os.path.join(pub, f), encoding="utf-8")).get("races", []) if type(e) is dict}
                  except Exception: old = {}
              seen = set()
              for e in rs:
                  assert type(e) is dict and set(e) == {"id", "round", "window", "card", "note", "placings"} and type(e["id"]) is str and e["id"] not in seen, f + ": an entry"
                  seen.add(e["id"])
                  r = byid.get(e["id"]); res = r.get("result") if r else None
                  # the window comes from the 6-hour race's own first block (its recorded heights), never from the entry
                  hh = res.get("heights") if type(res) is dict else None
                  assert type(res) is dict and res.get("final") is True and not res.get("missed") and type(hh) is list and len(hh) == 2 and all(type(x) is int for x in hh) and hh[0] <= hh[1], f + " " + e["id"] + ": no recorded 6-hour race for it"
                  # the window comes from the race's own recorded blocks [S0, S1], never from the entry
                  assert same(e["window"], window_of(hh[0], hh[1])) and e["round"] == round_of(r["start"]), f + " " + e["id"] + ": its window or round isn't the race's"
                  assert e["note"] is None or (type(e["note"]) is str and len(e["note"]) < 400), f + " " + e["id"] + ": note"
                  assert type(e["placings"]) is list and len(e["placings"]) <= 3 and all(isaddr(a) for a in e["placings"]) and len(set(e["placings"])) == len(e["placings"]), f + " " + e["id"] + ": placings"
                  o = old.get(e["id"])
                  if o and type(o.get("card")) is str: assert e["card"] == o["card"], f + " " + e["id"] + ": a published ruler card would change"
                  if e["card"] is None:
                      assert e["placings"] == [], f + " " + e["id"] + ": placings without a card"
                      continue
                  assert type(e["card"]) is str and len(e["card"]) < 500000, f + " " + e["id"] + ": card"
                  assert e["placings"] == placings_of(json.loads(e["card"])), f + " " + e["id"] + ": its placings aren't the card's (fpct order)"
                  if o and o.get("card") == e["card"]: continue   # checked byte for byte when it was published
                  game = dict(RULER_GAME, round=e["round"], window=window_of(hh[0], hh[1]))
                  ok, diff = VR().recompute(ruler_ledger(), e["card"], game)
                  assert ok, f + " " + e["id"] + ": the ruler's data doesn't give this card: " + str(diff)[:200]
          # A started week never changes whether the ruler scores it: this run's switch against the one the last published ruler
          # file recorded (a missing file = unset). Refused: nothing is published, and the run fails (GitHub emails the owner).
          _cw = int((NOW * 1000 - 1792368000000) // (7 * 86400000))
          _prevs = sorted([g for g in (os.listdir(pub) if pub and os.path.isdir(pub) else []) if re.fullmatch(r"R[0-9]{3}\.json", g)])
          _prev_from = None
          if _prevs:
              try: _prev_from = json.load(open(os.path.join(pub, _prevs[-1]), encoding="utf-8")).get("rulerFrom")
              except Exception: _prev_from = None
          _why = VR().switch_change("" if _prev_from is None else _prev_from, "" if RULER_FROM is None else RULER_FROM, _cw) if (_prev_from is not None or RULER_FROM is not None) else None
          if _why:
              print("::error::The ruler switch change is refused, nothing was published this run: " + re.sub(r"[^A-Za-z0-9 ./:,_()'-]", "?", _why)[:300] + ". Set RACE_RULER_FROM_WEEK back, or to a later week (the owner's check: tools/vhp-ruler-switch.mjs).")
              sys.exit(1)
          # Repo Lens #D-13 M-3: the T files first, so a held one is gone before the vault recount reads it.
          for f in sorted(os.listdir(d), key=lambda f: (0 if re.fullmatch(r"T[0-9]{3}\.json", f) else 1, f)):
              if f == "vault":
                  # Blind review V1 (round 10): a vault file that fails its check is held on its own (not published this
                  # run: no file means no prize), so a bug there can't stop the race cards Block X needs. A file already
                  # published as final still never changes (the push loop below).
                  load = lambda g: json.load(open(os.path.join(d, f, g), encoding="utf-8"))
                  # Repo Lens #B-8 B8-B2: any error reading or checking a file (RecursionError included) holds vault/ only.
                  def vgood(g):
                      try:
                          j = load(g)
                          return js_safe(j) and (pending_ok(g, j) if g.startswith("PENDING-") else vault_ok(g, j))
                      except Exception:
                          return False
                  bad = [g for g in sorted(os.listdir(os.path.join(d, f))) if not vgood(g)]
                  if bad:
                      import shutil
                      print("::error::vault results held, not published this run: " + ", ".join("vault/" + g for g in bad) + " (they failed the publish check; the race cards still publish)")
                      held_out()
                      shutil.rmtree(os.path.join(d, f))
                      continue
                  for g in sorted(os.listdir(os.path.join(d, f))):
                      why = "" if g.startswith("PENDING-") else final_held(g, load(g))
                      if why:
                          print("::error::vault/" + g + " held (I-034): " + why + "; its pending file still publishes")
                          held_out()
                          os.remove(os.path.join(d, f, g))
                  continue
              if re.fullmatch(r"R[0-9]{3}\.json", f):
                  # The VHP ruler's week file: one that fails any check is held on its own (removed from this push, with an
                  # alert); the vault recount then reads the published one, so a board that used it won't match: held.
                  try:
                      check_ruler(f, json.load(open(os.path.join(d, f), encoding="utf-8")))
                  except Exception as e:
                      print("::error::" + f + " (VHP ruler) held, not published this run: " + re.sub(r"[^A-Za-z0-9 ./:,_()'-]", "?", str(e))[:300])
                      held_out()
                      os.remove(os.path.join(d, f))
                  continue
              j = None if re.fullmatch(r"T[0-9]{3}\.json", f) else json.load(open(os.path.join(d, f), encoding="utf-8"))
              if f == "board.json":
                  assert set(j) == {"v", "updated", "today", "week", "lastWeek", "allTime"} and one(j["v"]), f
                  assert all(rows_ok(j[k]) for k in ("today", "week", "allTime")) and (j["lastWeek"] is None or rows_ok(j["lastWeek"])), f
                  continue
              if f == "index.json":
                  assert set(j) == {"v", "updated", "weeks"} and one(j["v"]) and all(type(w) is int and 0 <= w < 10000 for w in j["weeks"]), f
                  # Audit BX-111 (round 6, as BX-96): the week list never loses a published week.
                  pi = os.path.join(pub, "index.json") if pub else ""
                  if pi and os.path.isfile(pi):
                      pw = json.load(open(pi, encoding="utf-8")).get("weeks", [])
                      assert type(pw) is not list or all(w in j["weeks"] for w in pw), f + ": a published week would be dropped"
                      # Audit BX-119 (round 7): a new week only around now (the recorder keeps last week, this week and,
                      # near the end of a week, next week's first card).
                      import time
                      cw = (int(os.environ.get("CHECK_NOW_MS") or time.time() * 1000) - 1792368000000) // (7 * 86400000)
                      assert type(pw) is not list or all(w in pw or cw - 1 <= w <= cw + 1 for w in j["weeks"]), f + ": a new week that isn't around this one"
                  continue
              if re.fullmatch(r"T[0-9]{3}\.json", f):
                  # Repo Lens #D-13 M-3: a T file that fails any check is held on its own (removed from this push, with
                  # an alert), so the race types can never stop the 6-hour race's files, the board or the vault. Checked
                  # before everything else (the sort below), so the vault recount then reads the published T, which a
                  # board that counted the held results won't match: the vault holds (fails closed).
                  try:
                      j = json.load(open(os.path.join(d, f), encoding="utf-8"))
                      check_types(f, j)
                  except Exception as e:
                      print("::error::" + f + " (race types) held, not published this run: " + re.sub(r"[^A-Za-z0-9 ./:,_()'-]", "?", str(e))[:300] + " (the 6-hour race files still publish; Repo Lens #D-13 M-3)")
                      held_out()
                      os.remove(os.path.join(d, f))
                  continue
              assert set(j) == {"v", "week", "start", "end", "races"} and one(j["v"]) and type(j["week"]) is int and 0 <= j["week"] < 10000 and f == "W%03d.json" % j["week"], f
              assert type(j["races"]) is list and len(j["races"]) == 28, f
              # Round-7 blind review: race i is the week's race i (start, end and id), every id once: race.ts finds races
              # by id and keeps the first.
              import datetime
              assert j["start"] == 1792368000000 + j["week"] * 7 * 86400000 and j["end"] == j["start"] + 7 * 86400000, f
              for i, r in enumerate(j["races"]):
                  st = j["start"] + i * 21600000
                  assert type(r) is dict and r.get("start") == st and type(r.get("start")) is int and r.get("end") == st + 21600000 and type(r.get("end")) is int and \
                      r.get("id") == datetime.datetime.fromtimestamp(st / 1000, datetime.timezone.utc).strftime("%Y-%m-%dT%H"), f + ": race " + str(i) + " isn't the week's race " + str(i)
              for r in j["races"]:
                  assert set(r) == {"id", "start", "end", "cards", "result"} and re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T(00|06|12|18)", r["id"]), f
                  assert type(r["cards"]) is list and len(r["cards"]) in (3, 6) and all(card_ok(c) for c in r["cards"]) and result_ok(r["result"]), f + " " + r["id"]
                  # D-129 (owner, 4 Nov): Sunday races on the rhythm run and are scored for fun (Today and All time boards). They
                  # never count for the week: the recompute below leaves them out of the week's rows and winners.
                  # Audit BX-54: a card's time fits its leg: taken at most 2 hours before the leg starts and before it ends.
                  leg = (r["end"] - r["start"]) // len(r["cards"]) if type(r.get("start")) is int and type(r.get("end")) is int else 0
                  for i, c in enumerate(r["cards"]):
                      if c is not None:
                          s0 = r["start"] + i * leg
                          assert leg > 0 and s0 - 2 * 3600000 <= c["at"] < s0 + leg, f + " " + r["id"] + ": a card dated outside its leg"
                          # I-042 (BX-118): never a card from the future (the recorder takes cards at the moment it runs;
                          # 60 s for clocks, as for samples). Block X scores a target with the card in force at its lock.
                          assert c["at"] <= NOW * 1000 + 60000, f + " " + r["id"] + ": a card dated in the future"
              if pub and os.path.exists(os.path.join(pub, f)):
                  old = {r["id"]: r for r in json.load(open(os.path.join(pub, f), encoding="utf-8")).get("races", []) if type(r) is dict and "id" in r}
                  for r in j["races"]:
                      o = old.get(r["id"])
                      if o and type(o.get("cards")) is list and len(o["cards"]) == len(r["cards"]):
                          for i, c in enumerate(o["cards"]):
                              assert c is None or same(c, r["cards"][i]), f"{f} {r['id']}: a published card would change"
                      # Repo Lens #E-11 H-1 (a): a race's published final result never changes either (the recorder keeps
                      # it as it is). Picks stored before Show existed have 5 fields; the recorder adds the 6th when it
                      # loads them, so those are compared on their first 5.
                      if o and type(o.get("result")) is dict and o["result"].get("final") is True:
                          a, b = o["result"], r["result"]
                          ok = type(b) is dict and same({k: v for k, v in a.items() if k != "picks"}, {k: v for k, v in b.items() if k != "picks"})
                          pa, pb = a.get("picks"), b.get("picks") if type(b) is dict else None
                          ok = ok and (pa is None) == (pb is None) and (pa is None or (type(pa) is list and type(pb) is list and len(pa) == len(pb)
                              and all(same(x, y) or (type(x) is list and len(x) == 5 and type(y) is list and len(y) == 6 and same(x, y[:5])) for x, y in zip(pa, pb))))
                          assert ok, f"{f} {r['id']}: a published final result would change"
          print("race files ok")
          PY
          cd work
          if [ -n "$parent" ]; then git read-tree "$parent"; else git read-tree --empty; fi
          for f in "$IN"/*.json "$IN"/vault/*.json; do
            [ -e "$f" ] || continue
            rel="${f#"$IN"/}"
            # A vault results file already published as final never changes: the vault may have posted it.
            if [[ "$rel" == vault/* ]] && [ -n "$parent" ] && git show "$parent:$rel" > "$RUNNER_TEMP/old.json" 2>/dev/null \
              && /usr/bin/python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("final") is True else 1)' "$RUNNER_TEMP/old.json" \
              && ! cmp -s "$RUNNER_TEMP/old.json" "$f"; then
              # Repo Lens #B-8 B8-B1: hold that file only (the published copy stays, from read-tree) and alert; the race
              # cards still publish.
              echo "::error::Refusing to change $rel: it was already published as final (vault file held; race cards still publish)."
              if [ -n "${GITHUB_OUTPUT:-}" ]; then echo "held=true" >> "$GITHUB_OUTPUT"; fi
              continue
            fi
            blob=$(git hash-object -w "$f")
            git update-index --add --cacheinfo 100644 "$blob" "$rel"
          done
          tree=$(git write-tree)
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then echo "No changes."; exit 0; fi
          export GIT_AUTHOR_NAME=kpred-bot GIT_AUTHOR_EMAIL=kpred-bot@users.noreply.github.com GIT_COMMITTER_NAME=kpred-bot GIT_COMMITTER_EMAIL=kpred-bot@users.noreply.github.com
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "race: record")
          git push -q "$remote" "$commit:refs/heads/race-data"
          echo "Race files published."

  # D-107 (R-RACE-13, I-087): a held paid vault week fails the run (so GitHub emails the owner), but only after
  # publishing, so the hour's cards and boards still go out. Runs no repository code and needs no permissions.
  alert:
    needs: [record, publish]
    if: ${{ always() && (needs.record.outputs.held == 'true' || needs.publish.outputs.held == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: A Race vault week is held
        run: |
          echo "::error::The Producer Race held a vault week. The record or publish job's errors above name the week, why, the deadline and what you can do (.ai/platform/RUNBOOK.md §3). Everything else was published."
          exit 1
