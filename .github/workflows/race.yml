                      if x and type(x.get("result")) is dict and x["result"].get("final") is True: assert same(x["result"], r["result"]), f"{f} {r['id']}: a published final result would change"
          # Repo Lens #D-13 M-3: the T files first, so a held one is gone before the vault recount reads it.
          for f in sorted(os.listdir(d), key=lambda f: (0 if re.fullmatch(r"T[0-9]{3}\.json", f) else 1, f)):
              if f == "vault":
