                  for t0, h in oh.items(): assert t0 in nh and same(h, nh[t0]), f"{f}: a published ledger hour would change or go"
                  orr = {r.get("id"): r for r in o.get("races", []) if type(r) is dict}
                  for r in j["races"]:
