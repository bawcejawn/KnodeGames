# Producer Race recorder: every hour, takes the handicap cards (every hour: each race's start and 5 updates) and
# records finished races once their blocks are irreversible and match on two nodes. See bot/race.ts.
#
# Two jobs, like the main bot, so repository code never runs next to a write token:
#   record   runs bot/race.ts with a read-only token and no secrets (it only reads the chain), and hands the files on.
#   publish  runs no repository code: it checks the files' shape and pushes them to the race-data branch.
#            That includes vault/W<week>.json, the KnodeGames Vault's weekly results (game 7); once one is published
#            as final, publish refuses to change it. I-034: a results file goes final only 12 hours after its week,
#            and only if it is exactly the vault/PENDING-W<week>.json published at least an hour before.
#
# Owner hold (I-034): Variables → RACE_HOLD_WEEKS = "3" (or "3,4") keeps those vault weeks pending, never final, while
# you look at them. Remove the week to let it go final. Results are due 3 days after the week ends.
# It never touches main, holds no key, and does not run on pull requests.
#
# Turn it on: Settings → Secrets and variables → Actions → Variables: RACE_ENABLED = true
name: Producer race

on:
  schedule:
    - cron: "37 * * * *"     # every hour at minute 37 (a card is taken by the last run before each 1-hour leg)
  workflow_dispatch: {}

concurrency:
  group: knode-race
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # R-VAULT-9: when this run fails, a plain-language summary at the top of the run page (what happened, does it
  # matter, what to do), from .ai/platform/ALERTS.md §8. Reads two files from main; no secrets, read-only.
  summary:
    needs: [record, publish, alert]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            bot/alert-summary.mjs
            .ai/platform/ALERTS.md
          sparse-checkout-cone-mode: false
      - name: Plain-language summary (ALERTS.md §8)
        env:
          WORKFLOW_NAME: Producer race
        run: node bot/alert-summary.mjs --workflow "$WORKFLOW_NAME" --section 8

  record:
    if: ${{ vars.RACE_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # D-107 (R-RACE-13): "true" when the recorder held a paid vault week (read by the alert job below).
    outputs:
      held: ${{ steps.race.outputs.held }}
      # Repo Lens #E-11 L-2: "true" when the recorder wrote its files (the publish job fails if they don't arrive).
      files: ${{ steps.race.outputs.files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # The files the last run published (public branch; read without a token). Only plain JSON files are taken.
      - name: Take the last run's race files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prev"
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          # A missing branch is fine (the first run). Any other failure stops the run, so it never starts from nothing.
          rc=0; git ls-remote --exit-code "$url" refs/heads/race-data >/dev/null 2>&1 || rc=$?   # exactly race-data (review V3)
          if [ "$rc" = 2 ]; then echo "No race-data branch yet."
          elif [ "$rc" != 0 ]; then echo "::error::Couldn't read the race-data branch (git ls-remote exit $rc)"; exit 1
          else
            git fetch -q --depth 1 "$url" race-data
            git ls-tree -r -z --name-only FETCH_HEAD > "$RUNNER_TEMP/prev-files"   # fails the step if it fails (review V2)
            while IFS= read -r -d '' f; do
              # D-166: T<week>.json, the race types' ledger and results, comes back to the recorder too.
              # The VHP ruler: R<week>.json, the ruler's cards and the switch value they were made with, comes back too.
              if [[ "$f" =~ ^(index|board|[RWT][0-9]{3})\.json$ ]]; then git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/prev/$f"; fi
              if [[ "$f" =~ ^vault/(PENDING-)?W[0-9]{1,4}\.json$ ]]; then mkdir -p "$RUNNER_TEMP/prev/vault"; git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/prev/$f"; fi
            done < "$RUNNER_TEMP/prev-files"
          fi
          # The VHP samples (race-samples.yml): each producer's card VHP is the highest of the last 6 hours.
          if git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" race-samples 2>/dev/null && git cat-file -e "FETCH_HEAD:vhp-samples.json" 2>/dev/null; then
            git show "FETCH_HEAD:vhp-samples.json" > "$RUNNER_TEMP/prev/vhp-samples.json"
          else echo "No VHP samples yet: the card uses the read at card time."; fi
      - name: Take the VHP ruler's data
        # vhp-data (public, read without a token), only when the ruler switch is set.
        if: ${{ vars.RACE_RULER_FROM_WEEK != '' }}
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/vhp-data"
          git -C "$RUNNER_TEMP/vhp-data" fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" vhp-data
          git -C "$RUNNER_TEMP/vhp-data" checkout -q FETCH_HEAD
      - name: Record the race
        id: race
        run: npm run race
        env:
          RPC: ${{ vars.RPC || 'https://koinos.armana.io' }}
          RPC_CHECK: ${{ vars.RPC_CHECK || 'https://api.koinosblocks.com' }}
          RACE_PREV: ${{ runner.temp }}/prev
          RACE_OUT: ${{ runner.temp }}/race-data
          RACE_HOLD_WEEKS: ${{ vars.RACE_HOLD_WEEKS || '' }}
          # The first week the vault pays the Race (the one variable Block X reads too; owner, 10 Nov). Unset or not a
          # plain week number: no prizes at all (fails closed).
          PRIZES_FROM_WEEK: ${{ vars.PRIZES_FROM_WEEK }}
          # The VHP ruler switch (owner, 11 Nov): empty = off; vault week N = shadow in N - 1, on from N. Anything else
          # stops the run (KRuler.switchFrom).
          RACE_RULER_FROM_WEEK: ${{ vars.RACE_RULER_FROM_WEEK }}
          RACE_VHP_DATA: ${{ vars.RACE_RULER_FROM_WEEK != '' && format('{0}/vhp-data', runner.temp) || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: race-data
          path: ${{ runner.temp }}/race-data/
          retention-days: 1
          if-no-files-found: ignore

  publish:
    needs: record
    if: ${{ vars.RACE_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # push the race-data branch (never main)
    # D-107 (R-RACE-13): "true" when this job held a vault file (read by the alert job below).
    outputs:
      held: ${{ steps.push.outputs.held }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: race-data
          path: ${{ runner.temp }}/incoming
      # Audit BX-131 (round 9): the same Node as the recorders (22), for the recorders'-own-JSON check below.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: The VHP ruler's code and data
        # vhp_ruler.py is EMBEDDED below (generated by tools/race-ruler-embed.mjs; a test keeps it byte for byte the
        # repository's file), so this job still runs no repository code. vhp-data is the public branch, read without a token.
        if: ${{ vars.RACE_RULER_FROM_WEEK != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruler-code"
          cat > "$RUNNER_TEMP/ruler-code/vhp_ruler.py" <<'RULERPY'
          # BEGIN vhp_ruler.py
          """Knode Games — the shared VHP ruler, Python twin of vhp-ruler.js (design .ai/standards/VHP_RULER.md v2, D-111, D-112).

          The publish job runs no repo code (RECORDER_STANDARD §6), so it carries a copy of this file inside the workflow; a test
          keeps the two byte-identical, and another test checks that this file and vhp-ruler.js make byte-identical cards (§8
          sim 11). Pure: standard library only, integers only (no float anywhere). Read vhp-ruler.js for the rules in words.
          """
          import array, bisect, hashlib, json, re

          VHP_CONTRACT = "12Y5vW6gk8GceH53YfRkRre2Rrcsgw7Naq"
          DELAY, ACTIVE, HIGH, AVG, FORM, HISTORY, SEED_AFTER = 20, 7200, 1200, 28800, 403200, 28800, 20
          M = 1000000
          MIN_K, FORM_GATE = 10 * M, 800000
          RULE_VERSION, OWN_RULES, POOL_RULES = 4, ("spot", "high1h", "avg24h"), ("min",)
          RULE_VERSIONS = (4, 5)   # 5: the core judged on [T - 14 d, T - 3 d) (as vhp-ruler.js); a card without version is 4
          STEADY_BAND = 150000   # D-120 as the owner ruled (5 Nov), millionths: steady = every daily rate within this of the 14-day rate
          CORE_LINE = 970000     # D-165: A′'s core is the field members with form ≥ this × the field's median form (millionths)
          BAND_SD = 2            # D-171: an other core member more than this many sd from its share is left out of a yardstick
          SET_ASIDE_EXPECTED = 45500  # D-172: millionths of core member-races a 2-sd band leaves aside by chance
          PCT_SCALE = 1 << 256
          # Rules for every race length (owner, 11 Nov 2026; RULE_VERSION 4), as in vhp-ruler.js: the void band [down, up] by the
          # scoring window's length, and the luck cap (no producer is scored on more than LUCK_CAP expected blocks)
          # the length classes reach a quarter past their nominal length (UTC-clock races hold about, not exactly, 1,200 blocks an hour)
          VOID_BANDS, VOID_LONG = ((3000, 50000, 250000), (9000, 100000, 250000), (36000, 120000, 500000)), (150000, 1000000)
          LUCK_CAP = 1000 * M
          # Scoring modes (owner, 11 Nov 2026), as in vhp-ruler.js: A VHP only; B clear edge and C best day, raise only: the best
          # of 11 one-day stretches over [T - 14 days, T - 3 days), each (signed - sd*isqrt(signed)) / expected (sd 2 in B, 1 in C)
          # against the field's median raw form that day (Repo Lens #G-19); D even odds (luck cap 100). A card without a mode
          # scores exactly as before.
          MODES, MODE_CAP = ("A", "B", "C", "D"), {"A": LUCK_CAP, "B": LUCK_CAP, "C": LUCK_CAP, "D": 100 * M}
          LIFT_SKIP, LIFT_SPAN, STRETCHES, LIFT_SD = 86400, 316800, {"B": 11, "C": 11}, {"B": 2, "C": 1}


          def lift_form(signed, expected, sd=1):
              """A stretch's measure for the lift: (signed - sd*sqrt(signed)) / expected share, millionths, as liftForm in vhp-ruler.js."""
              sm = signed * M
              x = sm - sd * isqrt(sm * M)
              return x * M // expected if expected > 0 and x > 0 else 0


          def void_band(blocks):
              if type(blocks) is not int or blocks < 1:
                  raise ValueError("blocks must be a whole number from 1")
              for up_to, down, up in VOID_BANDS:
                  if blocks <= up_to:
                      return (down, up)
              return VOID_LONG


          def _int(x):
              if type(x) is bool:
                  raise ValueError("not an integer")
              if type(x) is int:
                  return x
              if type(x) is str and re.fullmatch(r"-?[0-9]+", x):
                  return int(x)
              raise ValueError("not an integer: %r" % (x,))


          def _dec(x, what):
              """A game id or round as plain decimal text (no sign, spaces or hex), exactly as vhp-ruler.js's dec()."""
              if type(x) is int and 0 <= x <= 2 ** 53 - 1:
                  return str(x)
              if type(x) is str and re.fullmatch(r"[0-9]{1,30}", x) and int(x) <= 2 ** 53 - 1:
                  return str(int(x))
              raise ValueError("%s must be a whole number from 0 to 2^53 - 1" % what)


          def card_time(seed_block_id, game, rnd, W0, W1):
              if type(W0) is not int or type(W1) is not int or W1 < W0:
                  raise ValueError("bad card window")
              if type(seed_block_id) is not str or not re.fullmatch(r"0x[0-9a-f]+", seed_block_id):
                  raise ValueError("seed block id must be lowercase 0x-hex")
              d = hashlib.sha256(("%s|%s|%s" % (seed_block_id, _dec(game, "game"), _dec(rnd, "round"))).encode("utf-8")).digest()
              return W0 + int.from_bytes(d[:8], "big") % (W1 - W0 + 1)


          def isqrt(n):
              if n < 0:
                  raise ValueError("isqrt of a negative number")
              if n < 2:
                  return n
              x = 1 << ((n.bit_length() + 1) >> 1)
              while True:
                  y = (x + n // x) >> 1
                  if y >= x:
                      return x
                  x = y


          def trim(k, c):
              k, c = _int(k), _int(c)
              if k <= 0:
                  raise ValueError("trim needs k > 0")
              if c < 0:
                  raise ValueError("trim needs c >= 0")
              return isqrt(c * c * M // k)


          def credit_of(own, eff_b):
              return M if eff_b <= own else own * M // eff_b


          def pct(lam, x):
              """Fix A: the mid-p Poisson percentile in millionths, the same arithmetic as pct in vhp-ruler.js."""
              lam, x = _int(lam), _int(x)
              if lam < 0 or x < 0:
                  raise ValueError("pct needs λ ≥ 0 and x ≥ 0")
              n, f = divmod(x, M)
              q, i, total, below, qn, qn1 = PCT_SCALE, 0, 0, 0, 0, 0
              while True:
                  if i < n:
                      below += q
                  elif i == n:
                      qn = q
                  elif i == n + 1:
                      qn1 = q
                  total += q
                  nx = q * lam // (M * (i + 1))
                  i += 1
                  if nx == 0 and i * M > lam and i > n + 1:
                      break
                  q = nx
              mid0, mid1 = 2 * below + qn, 2 * below + 2 * qn + qn1
              r = (mid0 * (M - f) + mid1 * f) * M // (2 * total * M)
              return M - 1 if lam > 0 and r >= M else r


          def fpct(n, a, b, x):
              """A′: the field percentile, the same arithmetic as fpct in vhp-ruler.js."""
              n, a, b, x = _int(n), _int(a), _int(b), _int(x)
              if n < 0 or a < 0 or b < a or x < 0:
                  raise ValueError("fpct needs n ≥ 0 and 0 ≤ a ≤ b, x ≥ 0")
              k, f = divmod(x, M)
              if k > n:
                  return M  # x above every possible count: certain (Repo Lens #B-10 P1)

              def mid_at(j):
                  if a == 0:
                      return (2, 1) if j > 0 else (1, 1)
                  if a == b or b == 0:
                      return (0, 1) if j < n else (1, 1) if j == n else (2, 1)
                  return None
              if mid_at(k):
                  m0, t = mid_at(k)
                  m1, _ = mid_at(k + 1)
                  return (m0 * (M - f) + m1 * f) * M // (2 * t * M)
              q, total, below, qk, qk1 = PCT_SCALE, 0, 0, 0, 0
              i = 0
              while i <= n:
                  if i < k:
                      below += q
                  elif i == k:
                      qk = q
                  elif i == k + 1:
                      qk1 = q
                  total += q
                  q = q * (n - i) * a // ((i + 1) * (b - a))
                  if q == 0 and i > k:
                      break
                  i += 1
              mid0, mid1 = 2 * below + qk, 2 * below + 2 * qk + qk1
              r = (mid0 * (M - f) + mid1 * f) * M // (2 * total * M)
              return M - 1 if r >= M else r


          def k_of(blocks, own, total):
              return blocks * own * M // total if total > 0 else 0


          def vhp_deltas(events, contract=VHP_CONTRACT):
              out = []
              for e in events if isinstance(events, list) else []:
                  if not isinstance(e, dict) or e.get("src") != contract or type(e.get("h")) is not int:
                      continue
                  n = str(e.get("name") or "")
                  if not re.fullmatch(r"(token\.)?(transfer|mint|burn)_event", n):
                      continue
                  if not re.fullmatch(r"[0-9]+", str(e.get("value"))):
                      raise ValueError("bad VHP event value at block %d" % e["h"])
                  v = int(e["value"])
                  # kind and c (the other address) are recorded for D-172's void record only; no number uses them
                  if n.endswith("transfer_event"):
                      out.append({"h": e["h"], "a": e["from"], "d": -v, "inc": 0, "kind": "out", "c": str(e["to"])})
                      out.append({"h": e["h"], "a": e["to"], "d": v, "inc": v, "kind": "in", "c": str(e["from"])})
                  elif n.endswith("mint_event"):
                      out.append({"h": e["h"], "a": e["to"], "d": v, "inc": v, "kind": "mint", "c": None})
                  else:
                      out.append({"h": e["h"], "a": e["from"], "d": -v, "inc": 0, "kind": "burn", "c": None})
              return out


          class Ledger:
              """Same contract as ledger() in vhp-ruler.js."""

              def __init__(self, tl):
                  frm, to = tl["from"], tl["to"]
                  n = to - frm + 1
                  if type(frm) is not int or type(to) is not int or n < ACTIVE + DELAY:
                      raise ValueError("the timeline is too short")
                  if len(tl["signers"]) != n:
                      raise ValueError("one signer per block is required")
                  self.frm, self.to, self.valid_from = frm, to, frm + ACTIVE
                  self.ids = tl.get("ids")
                  self.bad = tl.get("bad") or []
                  self.rebuilt = tl.get("rebuilt") or []
                  self.pending = tl.get("pending") or []
                  addrs, ix = [], {}

                  def add(a):
                      if a not in ix:
                          ix[a] = len(addrs)
                          addrs.append(a)
                      return ix[a]
                  sig = [add(a) for a in tl["signers"]]
                  anchors = tl.get("anchors") or {}
                  for a in sorted(anchors):
                      add(a)
                  for a in addrs:
                      if a not in anchors:
                          raise ValueError("no anchor for %s" % a)
                  per = [dict() for _ in addrs]
                  allx = [[] for _ in addrs]
                  for x in tl.get("deltas") or []:
                      i = ix.get(x["a"])
                      if i is None:
                          continue
                      allx[i].append(x)
                      if x["h"] < frm or x["h"] > to:
                          continue
                      g = per[i].setdefault(x["h"], [0, 0])
                      g[0] += _int(x["d"])
                      g[1] += _int(x.get("inc", 0))
                  self.addrs, self.ix, self.sig = addrs, ix, sig
                  self.allx = allx
                  lo, hi = frm + DELAY, to + 1
                  self.cp, self.ev, self.ps, self.bal = [], [], [], []
                  for i, a in enumerate(addrs):
                      an = anchors[a]
                      ah, av = an["h"], _int(an["v"])
                      if type(ah) is not int or ah < frm - 1:
                          raise ValueError("anchor for %s is before the timeline" % a)
                      b0 = av
                      for x in allx[i]:
                          if frm <= x["h"] <= ah:
                              b0 -= _int(x["d"])
                      hs = sorted(per[i])
                      net, inc = [0], [0]
                      for h in hs:
                          net.append(net[-1] + per[i][h][0])
                          inc.append(inc[-1] + per[i][h][1])

                      def bal_before(H, hs=hs, net=net, b0=b0):
                          return b0 + net[bisect.bisect_right(hs, H - 1)]

                      def eff_at(H, hs=hs, inc=inc, bal_before=bal_before, a=a):
                          b = bal_before(H)
                          if b < 0:
                              raise ValueError("the VHP rebuild for %s went below zero at block %d (a missed event)" % (a, H))
                          e = b - (inc[bisect.bisect_right(hs, H - 1)] - inc[bisect.bisect_right(hs, H - DELAY)])
                          return e if e > 0 else 0
                      pts = {lo}
                      for h in hs:
                          if lo < h + 1 <= hi:
                              pts.add(h + 1)
                          if per[i][h][1] > 0 and lo < h + DELAY <= hi:
                              pts.add(h + DELAY)
                      cp = sorted(pts)
                      ev = [eff_at(H) for H in cp]
                      ps = [0]
                      for j in range(len(cp)):
                          ps.append(ps[j] + ev[j] * ((cp[j + 1] if j + 1 < len(cp) else hi + 1) - cp[j]))
                      self.cp.append(cp)
                      self.ev.append(ev)
                      self.ps.append(ps)
                      self.bal.append(bal_before)
                  self.signed_at = [[] for _ in addrs]
                  for k in range(n):
                      self.signed_at[sig[k]].append(frm + k)
                  vf = self.valid_from
                  cnt = [0] * len(addrs)
                  cur = [self._eff(i, vf) for i in range(len(addrs))]
                  for h in range(frm, vf):
                      cnt[sig[h - frm]] += 1
                  N = sum(cur[i] for i in range(len(addrs)) if cnt[i] > 0)
                  changes = {}
                  for i in range(len(addrs)):
                      for j, H in enumerate(self.cp[i]):
                          if H > vf:
                              changes.setdefault(H, []).append((i, self.ev[i][j]))
                  Nb = [N]
                  for H in range(vf + 1, to + 2):
                      for i, v in changes.get(H, ()):
                          if cnt[i] > 0:
                              N += v - cur[i]
                          cur[i] = v
                      s, r = sig[H - 1 - frm], sig[H - 1 - ACTIVE - frm]
                      if cnt[s] == 0:
                          N += cur[s]
                      cnt[s] += 1
                      cnt[r] -= 1
                      if cnt[r] == 0:
                          N -= cur[r]
                      Nb.append(N)
                  self.Nb = Nb
                  self._shares = {}

              def _need(self, a):
                  if a not in self.ix:
                      raise ValueError("unknown address %s" % a)
                  return self.ix[a]

              def _eff(self, i, H):
                  if H < self.frm + DELAY or H > self.to + 1:
                      raise ValueError("block %d is outside the data" % H)
                  return self.ev[i][bisect.bisect_right(self.cp[i], H) - 1]

              def eff(self, a, H):
                  return self._eff(self._need(a), H)

              def balance_before(self, a, H):
                  return self.bal[self._need(a)](H)

              def sum_eff(self, a, H0, H1):
                  if H1 < H0:
                      return 0
                  i = self._need(a)
                  self._eff(i, H0)
                  self._eff(i, H1)
                  cp, ev, ps = self.cp[i], self.ev[i], self.ps[i]

                  def S(x):
                      j = bisect.bisect_right(cp, x - 1) - 1
                      return 0 if j < 0 else ps[j] + ev[j] * (x - cp[j])
                  return S(H1 + 1) - S(H0)

              def max_eff(self, a, H0, H1):
                  i = self._need(a)
                  m = self._eff(i, H0)
                  cp, ev = self.cp[i], self.ev[i]
                  j = bisect.bisect_right(cp, H0)
                  while j < len(cp) and cp[j] <= H1:
                      if ev[j] > m:
                          m = ev[j]
                      j += 1
                  return m

              def N(self, H):
                  if H < self.valid_from or H > self.to + 1:
                      raise ValueError("no network total at block %d" % H)
                  return self.Nb[H - self.valid_from]

              def signer(self, h):
                  if h < self.frm or h > self.to:
                      raise ValueError("block %d is outside the data" % h)
                  return self.addrs[self.sig[h - self.frm]]

              def active(self, H):
                  if H < self.valid_from or H > self.to + 1:
                      raise ValueError("no active set at block %d" % H)
                  return sorted({self.addrs[self.sig[h - self.frm]] for h in range(H - ACTIVE, H)})

              def signed_in(self, a, H0, H1):
                  if H1 < H0:
                      return 0
                  l = self.signed_at[self._need(a)]
                  return bisect.bisect_right(l, H1) - bisect.bisect_left(l, H0)

              def signed_blocks(self, a, H0, H1):
                  l = self.signed_at[self._need(a)]
                  return l[bisect.bisect_left(l, H0):bisect.bisect_right(l, H1)]

              def moves(self, a, H0, H1):
                  """D-172: a producer's VHP moves in [H0, H1], in data order."""
                  out = []
                  for x in self.allx[self._need(a)]:
                      if H0 <= x["h"] <= H1:
                          d = _int(x["d"])
                          out.append({"h": x["h"], "d": d, "kind": x.get("kind") or ("burn" if d < 0 else "in"), "c": x.get("c")})
                  return out

              def first_signed(self, a):
                  l = self.signed_at[self._need(a)]
                  return l[0] if l else None

              def share_sum(self, a, H0, H1):
                  if H1 < H0:
                      return 0
                  if H0 < self.valid_from or H1 > self.to:
                      raise ValueError("no shares for blocks %d … %d" % (H0, H1))
                  i = self._need(a)
                  s = self._shares.get(i)
                  if s is None:
                      vf, cp, ev, Nb = self.valid_from, self.cp[i], self.ev[i], self.Nb
                      # prefix sums ~ blocks x 10^6 (a producer outside the active set can exceed 1 a block; still far inside 64 bits)
                      s = array.array("q", bytes(8 * (self.to - vf + 2)))
                      j = bisect.bisect_right(cp, vf) - 1
                      acc = 0
                      for H in range(vf, self.to + 1):
                          while j + 1 < len(cp) and cp[j + 1] <= H:
                              j += 1
                          Nh = Nb[H - vf]
                          if Nh > 0:
                              acc += ev[j] * M // Nh
                          s[H - vf + 1] = acc
                      self._shares[i] = s
                  return s[H1 - self.valid_from + 1] - s[H0 - self.valid_from]


          def own(L, a, T, rule):
              if rule == "spot":
                  return L.eff(a, T)
              if rule == "high1h":
                  return L.max_eff(a, T - HIGH + 1, T)
              if rule == "avg24h":
                  return avg(L, a, T)
              raise ValueError("unknown own rule %s" % rule)


          def avg(L, a, T):
              return L.sum_eff(a, T - AVG, T - 1) // AVG


          def total(L, T):
              return sum(avg(L, q, T) for q in L.active(T))


          def rate_of(L, a, T, f=None):
              """D-120: (rate, steady), as rateOf in vhp-ruler.js."""
              f = f or form_of(L, a, T)
              if T - FORM < L.valid_from or f["expected"] <= 0:
                  return M, False
              for d in range(FORM // AVG):
                  H0 = T - FORM + d * AVG
                  e, s = L.share_sum(a, H0, H0 + AVG - 1), L.signed_in(a, H0, H0 + AVG - 1)
                  dr = s * M * M // e if e > 0 else 0
                  if abs(dr - f["form"]) > STEADY_BAND:
                      return M, False
              return (f["form"] if f["form"] < M else M), True


          def form_of(L, a, T):
              H0, H1 = max(L.valid_from, T - FORM), T - 1
              expected, signed = L.share_sum(a, H0, H1), L.signed_in(a, H0, H1)
              return {"form": signed * M * M // expected if expected > 0 else 0, "signed": signed, "expected": expected, "from": H0}


          def _bad_for(L, a, h0, h1):
              return any(r["h0"] <= h1 and r["h1"] >= h0 and (not r.get("a") or r.get("a") == a) for r in L.bad)


          def _rebuilt_in(L, h0, h1):
              return any(r["h0"] <= h1 and r["h1"] >= h0 for r in L.rebuilt)


          def _pending_in(L, h0, h1):
              return any(r["h0"] <= h1 and r["h1"] >= h0 for r in L.pending)


          EARLY = DELAY - 1   # a change up to 19 blocks before a window still moves effective VHP inside it (Repo Lens #B-5 N-7)


          def _not_yet(L, h0, h1):
              r = sorted((x for x in L.pending if x["h0"] <= h1 and x["h1"] >= h0), key=lambda x: x["h0"])[0]
              return "not yet: unverified chained hours in the card's windows (from block %d); it is made once the next live hour checks them" % r["h0"]


          def newcomer(L, a, T):
              """(isNew, history) of producer a at T, as newcomer in vhp-ruler.js (Repo Lens #B-5 N-6)."""
              lb0 = T - FORM - ACTIVE
              if lb0 >= L.frm:
                  return L.signed_in(a, lb0, T - FORM - 1) == 0, L.signed_in(a, lb0, T - HISTORY) > 0
              first = L.first_signed(a)
              seen_at_start = first is not None and first < L.valid_from
              return ((not seen_at_start) and first is not None and T - first < FORM,
                      first is not None and (T - L.frm >= HISTORY if seen_at_start else T - first >= HISTORY))


          def _js(v):
              if type(v) is bool or v is None or type(v) is str:
                  return v
              if type(v) is int:
                  return v
              if isinstance(v, dict):
                  return {k: _js(x) for k, x in v.items()}
              if isinstance(v, list):
                  return [_js(x) for x in v]
              raise ValueError("not a card value: %r" % (v,))


          # the card's fields that are BigInt in JavaScript (written as decimal strings)
          _BIG_TOP, _BIG_ROW = ("c", "total"), ("own", "avg", "k", "form", "rate", "expected", "lift", "target", "credited", "pct", "coreForm", "z", "fpct")


          def week_summary(cards):
              """D-172's weekly summary, as weekSummary in vhp-ruler.js. Data only."""
              voids, sets, senders = {}, {}, {}
              races = field_races = core_races = set_asides = void_count = own_moves = 0
              for c in cards:
                  c = json.loads(c) if isinstance(c, str) else c
                  if not any("credited" in p for p in c.get("producers") or []):
                      continue
                  races += 1
                  race = "%s:%s" % (c["game"], c["round"])
                  for p in c["producers"]:
                      if p["entry"] and not p["void"]:
                          field_races += 1
                      if p.get("core"):
                          core_races += 1
                      if p.get("setAside"):
                          set_asides += 1
                          sets[p["a"]] = sets.get(p["a"], 0) + 1
                      if p["void"] and p.get("moves"):
                          void_count += 1
                          voids[p["a"]] = voids.get(p["a"], 0) + 1
                          if p["moves"]["ownMove"]:
                              own_moves += 1
                          for r in p["moves"].get("received") or []:
                              x = senders.setdefault(r["a"], (set(), set()))
                              x[0].add(race)
                              x[1].add(p["a"])

              def counts(m):
                  return [{"a": a, "races": k} for a, k in sorted(m.items(), key=lambda t: (-t[1], t[0]))]
              repeat = sorted(({"a": a, "races": len(x[0]), "producers": sorted(x[1])} for a, x in senders.items() if len(x[0]) >= 2),
                              key=lambda t: (-t["races"], t["a"]))
              return {"races": races, "fieldRaces": field_races, "coreRaces": core_races, "voids": void_count, "ownMoves": own_moves,
                      "setAsides": set_asides, "setAsideRate": set_asides * 1000000 // core_races if core_races else 0,
                      "setAsideExpected": SET_ASIDE_EXPECTED, "voidsByProducer": counts(voids), "setAsidesByProducer": counts(sets),
                      "repeatSenders": repeat}


          SWITCH_MAX = 999999


          def switch_from(v):
              """The ruler switch (owner, 11 Nov 2026), as switchFrom in vhp-ruler.js: None, or the vault week N."""
              if v is None or (type(v) is str and v == ""):
                  return None
              if type(v) is str and re.fullmatch(r"[1-9][0-9]{0,5}", v):
                  return int(v)
              if type(v) is int and 1 <= v <= SWITCH_MAX:
                  return v
              raise ValueError("the ruler switch must be empty or a vault week from 1 to 999999")


          def _switch_week(w):
              if type(w) is int and 0 <= w <= SWITCH_MAX:
                  return w
              raise ValueError("week must be a vault week from 0 to 999999")


          def _mode_of(w, f):
              return "off" if f is None or w < f - 1 else "shadow" if w < f else "on"


          def ruler_mode(week, frm):
              """as rulerMode: "off", "shadow" (week N − 1) or "on" (from week N)."""
              return _mode_of(_switch_week(week), switch_from(frm))


          def switch_change(prev, nxt, week):
              """as switchChange: None, or why the change would change whether a started week is scored by the ruler."""
              w, p, n = _switch_week(week), switch_from(prev), switch_from(nxt)
              if p == n:
                  return None
              at = sorted(x for x in (0, w, -1 if p is None else p - 1, -1 if p is None else p, -1 if n is None else n - 1,
                                      -1 if n is None else n) if 0 <= x <= w)
              for x in at:
                  a, b = _mode_of(x, p), _mode_of(x, n)
                  if (a == "on") != (b == "on"):
                      return ("the ruler switch moved from %s to %s: week %d has started and would change from %s to %s; whether a "
                              "started week is scored by the ruler never changes (a first switch-on: %d or later)"
                              % ("unset" if p is None else p, "unset" if n is None else n, x, a, b, w + 1))
              return None


          _SCHED = re.compile(r"[1-9][0-9]{0,5}:[ABCD](,[1-9][0-9]{0,5}:[ABCD])*")
          _VSCHED = re.compile(r"[1-9][0-9]{0,5}:[45](,[1-9][0-9]{0,5}:[45])*")
          _INC_ADDR = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}")


          def check_include(x):
              """The kit's include list, as checkInclude in vhp-ruler.js: a non-empty list of distinct addresses in rising order."""
              if not isinstance(x, list) or not x or not all(type(a) is str and _INC_ADDR.fullmatch(a) for a in x):
                  raise ValueError("include must be a non-empty list of addresses")
              for i in range(1, len(x)):
                  if not x[i - 1] < x[i]:
                      raise ValueError("include must be in rising order with no repeats")


          def version_schedule(v):
              """A game's RULE_VERSION schedule, as versionSchedule in vhp-ruler.js: None, or [(week, version), ...] with rising weeks."""
              if v is None or (type(v) is str and v == ""):
                  return None
              if type(v) is not str or not _VSCHED.fullmatch(v):
                  raise ValueError("the ruler version schedule must be empty or week:version pairs like 6:5 (versions 4 or 5)")
              out = [(int(x.split(":")[0]), int(x.split(":")[1])) for x in v.split(",")]
              for i in range(1, len(out)):
                  if out[i][0] <= out[i - 1][0]:
                      raise ValueError("the ruler version schedule's weeks must rise")
              if out[-1][0] > SWITCH_MAX:
                  raise ValueError("the ruler version schedule's weeks must be at most 999999")
              return out


          def version_at(week, schedule):
              """as versionAt: the RULE_VERSION of a vault week under the schedule (4 before the first pair or with no schedule)."""
              w, s = _switch_week(week), version_schedule(schedule)
              n = RULE_VERSION
              for x, v in s or ():
                  if x <= w:
                      n = v
              return n


          def version_change(prev, nxt, week):
              """as versionChange: None, or why the change would alter the version of a week that has started."""
              w, p, n = _switch_week(week), version_schedule(prev), version_schedule(nxt)
              at = sorted(set([0] + [x for x, _ in p or ()] + [x for x, _ in n or ()]))
              for x in at:
                  if x > w:
                      continue
                  a, b = version_at(x, prev), version_at(x, nxt)
                  if a != b:
                      return ("the ruler version schedule moved from %s to %s: week %d has started and would change from %d to %d; a change "
                              "may only touch weeks after %d" % (json.dumps(prev if prev is not None else ""), json.dumps(nxt if nxt is not None else ""), x, a, b, w))
              return None


          def mode_schedule(v):
              """The admin's mode schedule, as modeSchedule in vhp-ruler.js: None, or [(week, mode), ...] with rising weeks."""
              if v is None or (type(v) is str and v == ""):
                  return None
              if type(v) is not str or not _SCHED.fullmatch(v):
                  raise ValueError("the ruler mode schedule must be empty or week:mode pairs like 5:B,8:C (modes A, B, C or D)")
              out = [(int(x.split(":")[0]), x.split(":")[1]) for x in v.split(",")]
              for i in range(1, len(out)):
                  if out[i][0] <= out[i - 1][0]:
                      raise ValueError("the ruler mode schedule's weeks must rise")
              if out[-1][0] > SWITCH_MAX:
                  raise ValueError("the ruler mode schedule's weeks must be at most 999999")
              return out


          def mode_at(week, schedule):
              """as modeAt: the mode of a vault week under the schedule ("A" before the first pair or with no schedule)."""
              w, s = _switch_week(week), mode_schedule(schedule)
              m = "A"
              for x, mm in s or ():
                  if x <= w:
                      m = mm
              return m


          def mode_change(prev, nxt, week):
              """as modeChange: None, or why the change would alter the mode of a week that has started."""
              w, p, n = _switch_week(week), mode_schedule(prev), mode_schedule(nxt)
              at = sorted(set([0] + [x for x, _ in p or ()] + [x for x, _ in n or ()]))
              for x in at:
                  if x > w:
                      continue
                  a, b = mode_at(x, prev), mode_at(x, nxt)
                  if a != b:
                      return ("the ruler mode schedule moved from %s to %s: week %d has started and would change from %s to %s; a change "
                              "may only touch weeks after %d" % (json.dumps(prev if prev is not None else ""), json.dumps(nxt if nxt is not None else ""), x, a, b, w))
              return None


          def card_json(card):
              c = dict(card)
              for k in _BIG_TOP:
                  c[k] = str(_int(c[k]))
              rows = []
              for p in c["producers"]:
                  p = dict(p)
                  for k in _BIG_ROW:
                      if k in p and p[k] is not None:
                          p[k] = str(_int(p[k]))
                  rows.append(p)
              c["producers"] = rows
              return json.dumps(_js(c), separators=(",", ":"), ensure_ascii=False) + "\n"


          def _check_window(w):
              for k in ("W0", "W1", "S0", "S1", "L"):
                  if type(w.get(k)) is not int:
                      raise ValueError("window %s must be a block height" % k)
              if not (w["W0"] <= w["W1"] <= w["L"] <= w["S0"] <= w["S1"]):
                  raise ValueError("window order must be W0 <= W1 <= L <= S0 <= S1")


          def make_card(L, game, rnd, window, c, own_rule, paying, pooled=(), min_k=10, pool_rule="min", mode=None, include=None, version=RULE_VERSION):
              w = window
              _check_window(w)
              if own_rule not in OWN_RULES:
                  raise ValueError("ownRule must be spot, high1h or avg24h")
              seed_block = w["L"] + SEED_AFTER
              if not L.ids:
                  raise ValueError("the data has no block ids")
              seed_id = L.ids[seed_block - L.frm] if 0 <= seed_block - L.frm < len(L.ids) else None
              if type(seed_id) is not str:
                  raise ValueError("no id for the seed block %d" % seed_block)
              T = card_time(seed_id, game, rnd, w["W0"], w["W1"])
              if T - AVG < L.frm + DELAY:
                  raise ValueError("not enough history before the card time (24 h of data are needed)")
              pooled, c, paying = set(pooled), _int(c), bool(paying)
              if type(min_k) is not int or not 1 <= min_k <= 100000:
                  raise ValueError("minK must be a whole number of blocks from 1")
              if pool_rule not in POOL_RULES:
                  raise ValueError("poolRule must be min")
              if mode is not None and mode not in MODES:
                  raise ValueError("mode must be A, B, C or D")
              if type(version) is not int or version not in RULE_VERSIONS:
                  raise ValueError("version must be 4 or 5")
              if include is not None:
                  check_include(include)
              if paying and T - L.frm < FORM + ACTIVE:
                  raise ValueError("a paying card needs %d blocks of data before its moment (14 days + 6 h)" % (FORM + ACTIVE))
              if paying and _pending_in(L, T - AVG - EARLY, T):
                  raise ValueError(_not_yet(L, T - AVG - EARLY, T))
              form_from = max(L.valid_from, T - FORM)
              look0 = min(T - AVG, form_from)
              blocks, tot = w["S1"] - w["S0"] + 1, total(L, T)
              rows = []
              # the kit's include, as in vhp-ruler.js: listed producers get a row even when not active(T); not in the total
              act = L.active(T)
              act_set = set(act)
              for a in list(act) + [x for x in (include or []) if x not in act_set]:
                  o, av, f = own(L, a, T, own_rule), avg(L, a, T), form_of(L, a, T)
                  k = k_of(blocks, o, tot)
                  is_new, history = newcomer(L, a, T)
                  rate, steady = rate_of(L, a, T, f)   # owner, 5 Nov: steady producers play at full size; rate is shown only
                  rows.append({"a": a, "own": o, "avg": av, "k": k, "form": f["form"], "rate": rate,
                               "entry": k >= min_k * M and (steady or f["form"] >= FORM_GATE) and history and (a in act_set or f["signed"] > 0), "pooled": a in pooled,
                               "isNew": is_new, "quality": "ok"})
              rows.sort(key=lambda r: (-r["own"], r["a"]))
              # D-113: on a paying card only the 24-h size window must be free of rebuilt hours; form's older days may read them
              if any(_bad_for(L, r["a"], look0 - EARLY, T) for r in rows) or (paying and _rebuilt_in(L, T - AVG - EARLY, T)):
                  for r in rows:
                      r["quality"] = "flagged"
              out = {"ruleVersion": version, "game": int(_dec(game, "game")), "round": _dec(rnd, "round"), "ownRule": own_rule, "paying": paying,
                     "T": T, "seedBlock": seed_block, "seedBlockId": seed_id, "seedProducer": L.signer(seed_block),
                     "window": {"W0": w["W0"], "W1": w["W1"], "L": w["L"], "S0": w["S0"], "S1": w["S1"]},
                     "c": c, "minK": min_k, "poolRule": pool_rule}
              if mode is not None:
                  out["mode"] = mode
              if include is not None:
                  out["include"] = list(include)
              out.update({"total": tot, "formFrom": form_from, "producers": rows})
              return out


          def isqrt(v):
              """floor(sqrt(v)) for a whole number v ≥ 0, as isqrt in vhp-ruler.js."""
              if v < 2:
                  return v
              x = 1 << ((v.bit_length() + 1) // 2)
              y = (x + v // x) >> 1
              while y < x:
                  x = y
                  y = (x + v // x) >> 1
              return x


          def void_record(L, a, o, T, S0, S1):
              """D-172, as voidRecord in vhp-ruler.js. Data only."""
              lo = hi = None
              H = S0
              while H <= S1:
                  e = L.eff(a, H)
                  H2 = H
                  while H2 + 1 <= S1 and L.eff(a, H2 + 1) == e:
                      H2 += 1
                  lo = e if lo is None or e < lo else lo
                  hi = e if hi is None or e > hi else hi
                  H = H2 + 1
              inn, out, minted, burned = {}, {}, 0, 0
              for x in L.moves(a, T + 1, S1):
                  if x["kind"] == "mint":
                      minted += x["d"]
                  elif x["kind"] == "burn":
                      burned -= x["d"]
                  else:
                      m = inn if x["kind"] == "in" else out
                      k = "?" if x["c"] is None else x["c"]
                      m[k] = m.get(k, 0) + abs(x["d"])

              def lst(m):
                  return [{"a": k, "v": str(m[k])} for k in sorted(m)]
              return {"own": str(o), "effS0": str(L.eff(a, S0)), "effS1": str(L.eff(a, S1)), "lo": str(lo), "hi": str(hi),
                      "received": lst(inn), "sent": lst(out), "minted": str(minted), "burned": str(burned), "ownMove": len(out) > 0}


          def score_card(L, card):
              S0, S1 = card["window"]["S0"], card["window"]["S1"]
              tot = _int(card["total"])
              if card["paying"] and _pending_in(L, S0 - EARLY, S1):
                  raise ValueError(_not_yet(L, S0 - EARLY, S1))
              flagged = any(p["quality"] == "flagged" or _bad_for(L, p["a"], S0 - EARLY, S1) for p in card["producers"]) \
                  or (card["paying"] and _rebuilt_in(L, S0 - EARLY, S1))
              mode = card.get("mode")
              if mode is not None and mode not in MODES:
                  raise ValueError("mode must be A, B, C or D")
              cap = LUCK_CAP if mode is None else MODE_CAP[mode]
              blocks = S1 - S0 + 1
              band_down, band_up = void_band(blocks)
              draws = {}

              def draw(H):
                  u = draws.get(H)
                  if u is None:
                      d = hashlib.sha256(("sample|%s|%d" % (card["seedBlockId"], H)).encode("utf-8")).digest()
                      u = int.from_bytes(d[:8], "big") % M
                      draws[H] = u
                  return u
              rows = []
              for p in card["producers"]:
                  o, k = _int(p["own"]), _int(p["k"])
                  sample = cap * M // k if k > cap else M
                  every = sample == M
                  credited = sum(credit_of(o, L.eff(p["a"], b)) for b in L.signed_blocks(p["a"], S0, S1) if every or draw(b) < sample)
                  lo, hi = o * (M - band_down) // M, o * (M + band_up) // M
                  is_void, expected = False, 0
                  H = S0
                  while H <= S1:
                      e = L.eff(p["a"], H)
                      H2 = H
                      while H2 + 1 <= S1 and L.eff(p["a"], H2 + 1) == e:
                          H2 += 1
                      if e < lo or e > hi:
                          is_void = True
                      cnt = H2 - H + 1 if every else sum(1 for b in range(H, H2 + 1) if draw(b) < sample)
                      m = e if e < o else o
                      expected += cnt * (m * M // tot if tot > 0 else 0)
                      H = H2 + 1
                  q = dict(p)
                  q.update({"quality": "flagged" if flagged else "ok", "sample": sample, "expected": expected,
                            "signed": L.signed_in(p["a"], S0, S1), "credited": credited, "pct": pct(expected, credited),
                            "void": is_void, "moves": void_record(L, p["a"], o, card["T"], S0, S1) if is_void else None})
                  rows.append(q)
              # A′ (D-165, D-171), as scoreCard in vhp-ruler.js: the core is the field members with form ≥ CORE_LINE × the field's
              # median form weighted by expected blocks (exact tie: the lower member's form), at full size; a producer's yardstick
              # is the core less any other core member more than BAND_SD sd from its share of the core's blocks, plus itself
              def in_field(r):
                  return r["entry"] and not r["void"]
              frows = sorted((r for r in rows if in_field(r)), key=lambda r: _int(r["form"]))
              e_all = sum(r["expected"] for r in frows)
              median, cum = 0, 0
              for r in frows:
                  cum += r["expected"]
                  if 2 * cum >= e_all:
                      median = _int(r["form"])
                      break
              # the mode's target (lift and target on each row only on a card with a mode); the yardstick, the band, fpct and pct
              # use the target, as in vhp-ruler.js
              def E(r):
                  return r["expected"] if mode is None else r["target"]
              if mode is not None:
                  # B and C: the best of the mode's stretches over [T - LIFT_SKIP - LIFT_SPAN, T - LIFT_SKIP), as in vhp-ruler.js
                  for r in rows:
                      r["lift"] = M
                  k = STRETCHES.get(mode, 0)
                  span = LIFT_SPAN // (k or 1)
                  for i in range(k):
                      H0 = card["T"] - LIFT_SKIP - LIFT_SPAN + i * span
                      H1 = H0 + span - 1
                      if H0 < L.valid_from:
                          continue
                      raw, lf = {}, {}
                      for r in rows:
                          e, sg = L.share_sum(r["a"], H0, H1), L.signed_in(r["a"], H0, H1)
                          raw[r["a"]] = sg * M * M // e if e > 0 else 0
                          lf[r["a"]] = lift_form(sg, e, LIFT_SD[mode])
                      med, c = 0, 0
                      for r in sorted(frows, key=lambda r: raw[r["a"]]):
                          c += r["expected"]
                          if 2 * c >= e_all:
                              med = raw[r["a"]]
                              break
                      if med <= 0:
                          continue
                      for r in rows:
                          x = lf[r["a"]] * M // med
                          if x > r["lift"]:
                              r["lift"] = x
                  for r in rows:
                      r["target"] = r["expected"] * r["lift"] // M
                      r["pct"] = pct(r["target"], r["credited"])
              # RULE_VERSION 5, as in vhp-ruler.js: the core is judged on the form over [T - 14 d, T - 3 d)
              if card.get("ruleVersion") not in RULE_VERSIONS or type(card.get("ruleVersion")) is not int:
                  raise ValueError("the card's ruleVersion must be 4 or 5")
              v5, core_form, c_median = card["ruleVersion"] == 5, {}, median
              if v5:
                  H0, H1 = max(L.valid_from, card["T"] - FORM), card["T"] - LIFT_SKIP - 1
                  for r in rows:
                      e = L.share_sum(r["a"], H0, H1)
                      core_form[r["a"]] = _int(r["form"]) if H1 < H0 else (L.signed_in(r["a"], H0, H1) * M * M // e if e > 0 else 0)
                  c_median, c5 = 0, 0
                  for r in sorted(frows, key=lambda r: core_form[r["a"]]):
                      c5 += r["expected"]
                      if 2 * c5 >= e_all:
                          c_median = core_form[r["a"]]
                          break
              line = c_median * CORE_LINE // M

              def in_core(r):
                  return in_field(r) and (core_form[r["a"]] if v5 else _int(r["form"])) >= line
              # the yardstick counts CREDITED blocks (millionths), as in vhp-ruler.js
              n = sum(r["credited"] for r in rows if in_core(r))
              b = sum(E(r) for r in rows if in_core(r))
              nY, bY = n, b
              for r in rows:
                  if v5:
                      r["coreForm"] = core_form[r["a"]]
                  r["core"], r["z"], r["setAside"] = in_core(r), None, False
                  if not r["core"]:
                      continue
                  e = E(r)
                  dev, v = r["credited"] * b - n * e, n * e * (b - e) * M
                  if v > 0:
                      q = abs(dev) * M // isqrt(v)
                      r["z"] = -q if dev < 0 else q
                  if dev * dev > BAND_SD * BAND_SD * v:
                      r["setAside"] = True
                      nY -= r["credited"]
                      bY -= e
              for r in rows:
                  if not in_field(r):
                      r["fpct"] = None
                  elif r["core"] and not r["setAside"]:
                      r["fpct"] = fpct(nY // M, E(r), bY, r["credited"])
                  else:
                      r["fpct"] = fpct((nY + r["credited"]) // M, E(r), bY + E(r), r["credited"])
              out = dict(card)
              out["producers"] = rows
              return out


          _SETTINGS, _WKEYS = ("game", "round", "window", "c", "minK", "poolRule", "ownRule", "paying", "pooled"), ("W0", "W1", "L", "S0", "S1")
          _OPTIONAL = ("mode", "include", "version")


          def check_settings(g):
              """The game's settings, strictly (Repo Lens #B-5 N-5), as checkSettings in vhp-ruler.js."""
              if not isinstance(g, dict):
                  raise ValueError("recompute needs the game's own settings")
              if any(k not in g for k in _SETTINGS) or any(k not in _SETTINGS and k not in _OPTIONAL for k in g):
                  raise ValueError("the game's settings must have exactly: " + ", ".join(_SETTINGS) + " (and, optionally, " + ", ".join(_OPTIONAL) + ")")
              if "mode" in g and g["mode"] not in MODES:
                  raise ValueError("mode must be A, B, C or D")
              if "version" in g and (type(g["version"]) is not int or g["version"] not in RULE_VERSIONS):
                  raise ValueError("version must be 4 or 5")
              if "include" in g:
                  check_include(g["include"])
              _dec(g["game"], "game")
              _dec(g["round"], "round")
              w = g["window"]
              if not isinstance(w, dict) or sorted(w) != sorted(_WKEYS):
                  raise ValueError("window must have exactly: " + ", ".join(_WKEYS))
              c = g["c"]
              if not ((type(c) is int and 0 <= c <= 2 ** 53 - 1) or (type(c) is str and re.fullmatch(r"[0-9]{1,30}", c))):
                  raise ValueError("c must be a whole number of millionths")
              if type(g["minK"]) is not int or not 1 <= g["minK"] <= 100000:
                  raise ValueError("minK must be a whole number of blocks from 1")
              if g["poolRule"] not in POOL_RULES:
                  raise ValueError("poolRule must be min")
              if g["ownRule"] not in OWN_RULES:
                  raise ValueError("ownRule must be spot, high1h or avg24h")
              if type(g["paying"]) is not bool:
                  raise ValueError("paying must be true or false")
              if not isinstance(g["pooled"], list) or not all(type(a) is str for a in g["pooled"]):
                  raise ValueError("pooled must be a list of addresses")


          def recompute(L, published, game):
              """published: the card's JSON text; game: the game's OWN settings {game, round, window, c, minK, poolRule, ownRule, paying, pooled}
              (Repo Lens #E-12 M-1: never the card's own settings). Returns (same, diff)."""
              try:
                  check_settings(game)
              except ValueError as e:
                  return False, "the game's settings: %s" % e
              pub = json.loads(published)
              w = game["window"]
              want = {"game": int(_dec(game["game"], "game")), "round": _dec(game["round"], "round"), "ownRule": game["ownRule"],
                      "paying": game["paying"], "c": str(int(game["c"])), "minK": game["minK"], "poolRule": game["poolRule"]}
              want["mode"] = game.get("mode")   # always compared (Repo Lens #G-19): no mode on one side is a clear refusal
              want["version"] = game.get("version", RULE_VERSION)
              want["include"] = json.dumps(game.get("include"), separators=(",", ":"))
              want.update({"W0": w["W0"], "W1": w["W1"], "L": w["L"], "S0": w["S0"], "S1": w["S1"]})
              got = {"game": pub.get("game"), "round": pub.get("round"), "ownRule": pub.get("ownRule"), "paying": pub.get("paying"),
                     "c": str(pub.get("c")), "minK": pub.get("minK"), "poolRule": pub.get("poolRule"), "mode": pub.get("mode"),
                     "version": pub.get("ruleVersion"), "include": json.dumps(pub.get("include"), separators=(",", ":"))}
              got.update(pub.get("window") or {})
              for k in want:
                  if got.get(k) != want[k] or type(got.get(k)) is not type(want[k]):
                      return False, "setting %s: the card says %s, the game says %s" % (k, json.dumps(got.get(k)), json.dumps(want[k]))
              try:
                  mine = make_card(L, game["game"], game["round"], w, int(game["c"]), game["ownRule"], game["paying"], game["pooled"],
                                   game["minK"], game["poolRule"], game.get("mode"), game.get("include"), game.get("version", RULE_VERSION))
                  if any("credited" in p for p in pub.get("producers", [])):
                      mine = score_card(L, mine)
              except ValueError as e:
                  return False, "the data can't make this card: %s" % e
              a = card_json(mine)
              if a == published:
                  return True, ""
              i = 0
              while i < min(len(a), len(published)) and a[i] == published[i]:
                  i += 1
              return False, "differs at byte %d" % i


          # ── the vhp-data format and its checks: the twin of vhp-data.js (read it for the format in words) ──
          HOUR, DAY, DATA_VERSION = 1200, 28800, 1
          _ADDR = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}")
          _ID = re.compile(r"0x1220[0-9a-f]{64}")
          _SAT = re.compile(r"(0|[1-9][0-9]{0,24})")


          def canon(o):
              return json.dumps(o, separators=(",", ":"), ensure_ascii=False) + "\n"


          def sha_hex(text):
              return hashlib.sha256(text.encode("utf-8")).hexdigest()


          def _safe_int(x):
              return type(x) is int and -(2 ** 53 - 1) <= x <= 2 ** 53 - 1


          def _sorted_keys(o):
              ks = list(o.keys())
              return all(ks[i - 1] < ks[i] for i in range(1, len(ks)))


          def _check_shape(h):
              if not isinstance(h, dict) or type(h.get("v")) is not int or h.get("v") != DATA_VERSION:
                  return "not a version-1 hour"
              keys = ["v", "n", "from", "to", "prev", "kind", "addrs", "sig", "ids", "burns", "events", "tail", "anchor"]
              if list(h.keys()) != keys:
                  return "fields must be exactly " + ", ".join(keys)
              if not _safe_int(h["n"]) or h["n"] < 0 or not _safe_int(h["from"]) or not _safe_int(h["to"]) \
                      or h["from"] != h["n"] * HOUR or h["to"] != h["from"] + HOUR - 1:
                  return "from/to must be block-hour n"
              if type(h["prev"]) is not str or not re.fullmatch(r"([0-9a-f]{64})?", h["prev"]):
                  return "prev must be a sha256"
              if h["kind"] not in ("live", "rebuilt", "chained"):
                  return "kind must be live, rebuilt or chained"
              addrs = h["addrs"]
              if not isinstance(addrs, list) or not all(type(a) is str and _ADDR.fullmatch(a) for a in addrs):
                  return "bad address"
              if any(not addrs[i - 1] < addrs[i] for i in range(1, len(addrs))):
                  return "addrs must be sorted and unique"
              aset = set(addrs)

              def blocks(b, n, where):
                  if not isinstance(b, dict) or not all(isinstance(b.get(k), list) for k in ("sig", "ids", "burns", "events")):
                      return where + ": sig, ids, burns, events"
                  if len(b["sig"]) != n or len(b["ids"]) != n or len(b["burns"]) != n:
                      return where + ": exactly one signer, one id and one burn per block"
                  if not all(_safe_int(i) and 0 <= i < len(addrs) for i in b["sig"]):
                      return where + ": bad signer index"
                  if not all(type(x) is str and _ID.fullmatch(x) for x in b["ids"]):
                      return where + ": bad block id"
                  if not all(type(x) is str and _SAT.fullmatch(x) and x != "0" for x in b["burns"]):
                      return where + ": every block burns VHP from its signer"
                  return None
              e1 = blocks(h, HOUR, "hour")
              if e1:
                  return e1
              a = h["anchor"]
              if not isinstance(a, dict) or list(a.keys()) != ["at", "id", "bal", "reads"]:
                  return "anchor fields must be at, id, bal, reads"
              if not _safe_int(a["at"]) or a["at"] < h["to"] or a["at"] > h["to"] + DAY:
                  return "the anchor block must be at most a day after the hour"
              if type(a["id"]) is not str or not _ID.fullmatch(a["id"]):
                  return "bad anchor block id"
              t = h["tail"]
              if not isinstance(t, dict) or list(t.keys()) != ["sig", "ids", "burns", "events"]:
                  return "tail fields must be sig, ids, burns, events"
              e2 = blocks(t, a["at"] - h["to"], "tail")
              if e2:
                  return e2
              if (t["ids"][a["at"] - h["to"] - 1] if a["at"] > h["to"] else h["ids"][HOUR - 1]) != a["id"]:
                  return "the anchor block id isn't the id of block `at`"
              for lo, hi, lst in ((h["from"], h["to"], h["events"]), (h["to"] + 1, a["at"], t["events"])):
                  last = lo
                  for e in lst:
                      if not isinstance(e, list) or len(e) != 5:
                          return "an event is [h, kind, from, to, value]"
                      eh, k, f, to, v = e
                      if not _safe_int(eh) or eh < lo or eh > hi or eh < last:
                          return "events out of range or order"
                      last = eh
                      if k not in ("m", "t", "b") or type(v) is not str or not _SAT.fullmatch(v) or type(f) is not str or type(to) is not str:
                          return "bad event"
                      if (k == "m") != (f == "") or (k == "b") != (to == ""):
                          return "bad event ends"
                      if (f != "" and f not in aset) or (to != "" and to not in aset):
                          return "an event names an address not in addrs"
              if not isinstance(a["bal"], dict) or not _sorted_keys(a["bal"]):
                  return "anchor bal must be an object with sorted keys"
              if not all(k in aset and type(v) is str and _SAT.fullmatch(v) for k, v in a["bal"].items()):
                  return "bad anchor bal"
              if not isinstance(a["reads"], dict) or list(a["reads"].keys()) != ["A", "B"]:
                  return "anchor reads must be A and B"
              for node in ("A", "B"):
                  rs = a["reads"][node]
                  if not isinstance(rs, dict) or not _sorted_keys(rs):
                      return "reads %s must be an object with sorted keys" % node
                  for k, r in rs.items():
                      if k not in a["bal"]:
                          return "reads %s: %s isn't anchored" % (node, k)
                      if not isinstance(r, list) or len(r) != 3 or not _safe_int(r[0]) or r[0] < h["to"] or r[0] > a["at"]:
                          return "reads %s: %s must be [h, balance, eff] read between the hour's end and the anchor block" % (node, k)
                      if type(r[1]) is not str or not _SAT.fullmatch(r[1]) or type(r[2]) is not str or not (r[2] == "" or _SAT.fullmatch(r[2])):
                          return "reads %s: bad numbers for %s" % (node, k)
              if h["kind"] != "live" and (a["reads"]["A"] or a["reads"]["B"]):
                  return "a %s hour carries no reads" % h["kind"]
              if h["kind"] == "live":
                  for node in ("A", "B"):
                      for k in a["bal"]:
                          if k not in a["reads"][node]:
                              return "a live hour reads every anchored address on both nodes (%s on %s)" % (k, node)
              return None


          def deltas_of(h, with_tail=True):
              out = []

              def take(b, start):
                  for i, v in enumerate(b["burns"]):
                      out.append({"h": start + i, "a": h["addrs"][b["sig"][i]], "d": -int(v), "inc": 0, "kind": "burn", "c": None})
                  for eh, k, f, t, v in b["events"]:  # kind and c (the other address): D-172's void record only
                      x = int(v)
                      if k != "m":
                          out.append({"h": eh, "a": f, "d": -x, "inc": 0, "kind": "burn" if k == "b" else "out", "c": None if k == "b" else t})
                      if k != "b":
                          out.append({"h": eh, "a": t, "d": x, "inc": x, "kind": "mint" if k == "m" else "in", "c": None if k == "m" else f})
              take(h, h["from"])
              if with_tail:
                  take(h["tail"], h["to"] + 1)
              return out


          def _block_of(f, x):
              if f["from"] <= x <= f["to"]:
                  i = x - f["from"]
                  return "%s|%s|%s" % (f["addrs"][f["sig"][i]], f["ids"][i], f["burns"][i])
              if f["to"] < x <= f["anchor"]["at"]:
                  i = x - f["to"] - 1
                  t = f["tail"]
                  return "%s|%s|%s" % (f["addrs"][t["sig"][i]], t["ids"][i], t["burns"][i])
              return None


          def _events_in(f, x0, x1):
              return "|".join(canon(e)[:-1] for e in f["events"] + f["tail"]["events"] if x0 <= e[0] <= x1)


          def _fail(why):
              return {"ok": False, "why": why}


          def check_hour(prev_text, text):
              """Same answers as checkHour in vhp-data.js."""
              try:
                  h = json.loads(text)
                  if canon(h) != text:
                      return _fail("not in canonical form")
              except Exception:
                  return _fail("not JSON")
              bad = _check_shape(h)
              if bad:
                  return _fail(bad)
              prev = None
              if prev_text:
                  try:
                      prev = json.loads(prev_text)
                  except Exception:
                      return _fail("previous file is not JSON")
                  if h["prev"] != sha_hex(prev_text):
                      return _fail("the hash chain is broken (prev isn't the previous file's sha256)")
                  if h["n"] != prev["n"] + 1:
                      return _fail("hours must be consecutive")
                  if prev["kind"] != "rebuilt" and h["kind"] == "rebuilt":
                      return _fail("a rebuilt hour can't follow a %s one" % prev["kind"])
                  if h["anchor"]["at"] < prev["anchor"]["at"]:
                      return _fail("anchors go forward")
                  if h["kind"] == "chained" and h["anchor"]["at"] != max(h["to"], prev["anchor"]["at"]):
                      return _fail("a chained hour's anchor is its own last block, or the previous anchor if that is later")
                  for x in range(h["from"], prev["anchor"]["at"] + 1):
                      if _block_of(prev, x) != _block_of(h, x):
                          return _fail("block %d differs from the previous hour's tail" % x)
                  if _events_in(prev, h["from"], prev["anchor"]["at"]) != _events_in(h, h["from"], prev["anchor"]["at"]):
                      return _fail("the events after the previous hour differ from its tail")
              elif h["prev"] != "":
                  return _fail("the first file must have an empty prev")
              elif h["kind"] == "chained":
                  return _fail("a chained hour needs the hour before it")
              bal = h["anchor"]["bal"]
              addrs = list(bal.keys())
              for s in [h["addrs"][i] for i in h["sig"] + h["tail"]["sig"]]:
                  if s not in bal:
                      return _fail("signer %s has no anchor" % s)
              ds = deltas_of(h)
              by_a = {}
              for x in ds:
                  by_a.setdefault(x["a"], []).append(x)

              def after(a, h0):
                  return sum(x["d"] for x in by_a.get(a, ()) if x["h"] > h0)
              if prev is not None:
                  for a in prev["anchor"]["bal"]:
                      if a not in bal:
                          return _fail("%s was anchored before and must stay anchored" % a)
                  for a in addrs:
                      if a not in prev["anchor"]["bal"]:
                          continue
                      v = int(prev["anchor"]["bal"][a]) + after(a, prev["anchor"]["at"])
                      if v != int(bal[a]):
                          return _fail("%s: the previous anchor plus the changes since isn't this anchor (%d vs %s)" % (a, v, bal[a]))
              for a in addrs:
                  v = int(bal[a])
                  for x in sorted(by_a.get(a, ()), key=lambda x: -x["h"]):
                      v -= x["d"]
                      if v < 0:
                          return _fail("%s: the rebuild goes below zero (a missed event)" % a)
              hsh = sha_hex(text)
              if h["kind"] != "live":
                  return {"ok": True, "quality": "ok", "flagged": [], "hash": hsh}
              reads = h["anchor"]["reads"]
              for node in ("A", "B"):
                  for a in addrs:
                      rh, rb, _ = reads[node][a]
                      if int(rb) + after(a, rh) != int(bal[a]):
                          return _fail("%s: node %s's balance read at block %d plus the changes since isn't the anchor" % (a, node, rh))

              def eff_of(a, H):
                  b, recv = int(bal[a]), 0
                  for x in by_a.get(a, ()):
                      if x["h"] >= H:
                          b -= x["d"]
                      elif x["h"] >= H - DELAY + 1:
                          recv += x["inc"]
                  e = b - recv
                  return e if e > 0 else 0
              missed, nxt, head = [], True, True
              for a in addrs:
                  ra, rb = reads["A"][a], reads["B"][a]
                  if ra[2] == "" or rb[2] == "":
                      missed.append("%s (no answer)" % a)
                      continue
                  for r in (ra, rb):
                      v = int(r[2])
                      if v != eff_of(a, r[0] + 1):
                          nxt = False
                      if v != eff_of(a, r[0]):
                          head = False
              eff_at = "next" if nxt else "head" if head else ""
              if missed or not eff_at:
                  return {"ok": True, "quality": "flagged", "flagged": ["*"], "hash": hsh,
                          "why": ("effective balance not answered: " + ", ".join(missed)) if missed
                          else "the effective balances match the rebuild neither at the block after each read nor at each read block"}
              return {"ok": True, "quality": "ok", "flagged": [], "effAt": eff_at, "hash": hsh}


          def check_day(text, prev_hour_text):
              try:
                  d = json.loads(text)
                  if not isinstance(d, dict) or canon(d) != text:
                      return _fail("not in canonical form")
              except Exception:
                  return _fail("not JSON")
              if list(d.keys()) != ["v", "n", "from", "to", "hashes", "hours"] or type(d["v"]) is not int or d["v"] != DATA_VERSION:
                  return _fail("fields must be v, n, from, to, hashes, hours")
              if not _safe_int(d["n"]) or not _safe_int(d["from"]) or not _safe_int(d["to"]) or d["from"] != d["n"] * DAY or d["to"] != d["from"] + DAY - 1:
                  return _fail("from/to must be day n")
              if not isinstance(d["hours"], list) or len(d["hours"]) != 24 or not isinstance(d["hashes"], list) or len(d["hashes"]) != 24:
                  return _fail("a day holds 24 hours")
              prev, flagged = prev_hour_text or "", []
              for i in range(24):
                  hr = d["hours"][i]
                  if not isinstance(hr, dict) or hr.get("n") != d["n"] * 24 + i:
                      return _fail("hour %d is not block-hour %d" % (i, d["n"] * 24 + i))
                  t = canon(hr)
                  if sha_hex(t) != d["hashes"][i]:
                      return _fail("hour %d: its sha256 isn't the one listed" % i)
                  r = check_hour(prev, t)
                  if not r["ok"]:
                      return _fail("hour %d: %s" % (i, r["why"]))
                  if r["quality"] == "flagged":
                      flagged.append({"n": hr["n"], "flagged": r["flagged"]})
                  prev = t
              return {"ok": True, "flagged": flagged, "last": prev}


          def timeline_from(hours, checks=None):
              if not hours:
                  raise ValueError("no hours")
              signers, ids, deltas, bad, rebuilt, pending = [], [], [], [], [], []
              for i, h in enumerate(hours):
                  if i and h["n"] != hours[i - 1]["n"] + 1:
                      raise ValueError("hours %d and %d aren't consecutive" % (hours[i - 1]["n"], h["n"]))
                  signers.extend(h["addrs"][s] for s in h["sig"])
                  ids.extend(h["ids"])
                  deltas.extend(deltas_of(h, i == len(hours) - 1))
                  if h["kind"] == "rebuilt":
                      rebuilt.append({"h0": h["from"], "h1": h["to"]})
                  elif h["kind"] == "chained" and not any(x["kind"] == "live" for x in hours[i + 1:]):
                      pending.append({"h0": h["from"], "h1": h["to"]})
                  c = checks[i] if checks else None
                  if c and c["quality"] == "flagged":
                      if "*" in c["flagged"]:
                          bad.append({"h0": h["from"], "h1": h["to"]})
                      else:
                          bad.extend({"h0": h["from"], "h1": h["to"], "a": a} for a in c["flagged"])
              last = hours[-1]
              anchors = {a: {"h": last["anchor"]["at"], "v": int(v)} for a, v in last["anchor"]["bal"].items()}
              return {"from": hours[0]["from"], "to": last["to"], "signers": signers, "ids": ids, "deltas": deltas,
                      "anchors": anchors, "bad": bad, "rebuilt": rebuilt, "pending": pending}


          # ── the publish job (.github/workflows/vhp-ruler.yml runs this whole file, then publish_main) ──
          # canonical numbers only (Repo Lens #D-10 M-5): h/024010.json can't stand beside h/24010.json
          _HOUR_FILE, _DAY_FILE = re.compile(r"h/(0|[1-9][0-9]{0,8})\.json"), re.compile(r"d/(0|[1-9][0-9]{0,8})\.json")
          # MIN_KEEP_DAYS: Repo Lens #G-9 G9-1, a 6-day race's card needs about 25.3 days of hours when the week closes
          MAX_HOUR_BYTES, MAX_DAY_BYTES, MIN_KEEP_DAYS = 4 << 20, 16 << 20, 26


          def _read_tree(d):
              """{relative path: text} for h/*.json and d/*.json under d (other files are an error, reported by the caller)."""
              import os
              out, other = {}, []
              if not d or not os.path.isdir(d):
                  return out, other
              for root, dirs, files in os.walk(d):
                  for f in files:
                      p = os.path.relpath(os.path.join(root, f), d).replace(os.sep, "/")
                      if p in ("remove.txt", "verify.txt"):
                          continue
                      if os.path.islink(os.path.join(root, f)) or not (_HOUR_FILE.fullmatch(p) or _DAY_FILE.fullmatch(p)):
                          other.append(p)
                          continue
                      with open(os.path.join(root, f), "rb") as fh:
                          raw = fh.read()
                      try:
                          out[p] = raw.decode("utf-8")
                      except UnicodeDecodeError:
                          other.append(p)
              return out, other


          def _num_inside(text):
              try:
                  n = json.loads(text).get("n")
                  return n if _safe_int(n) else None
              except Exception:
                  return None


          def publish_check(incoming, published, removals, keep_days):
              """incoming / published: {path: text}; removals: paths the run asks to remove. Returns (errors, warnings)."""
              errs, warns = [], []
              keep_days = max(MIN_KEEP_DAYS, keep_days)
              hours = {int(_HOUR_FILE.fullmatch(p).group(1)): t for p, t in published.items() if _HOUR_FILE.fullmatch(p)}
              days = {int(_DAY_FILE.fullmatch(p).group(1)): t for p, t in published.items() if _DAY_FILE.fullmatch(p)}
              new_h = {int(_HOUR_FILE.fullmatch(p).group(1)): t for p, t in incoming.items() if _HOUR_FILE.fullmatch(p)}
              new_d = {int(_DAY_FILE.fullmatch(p).group(1)): t for p, t in incoming.items() if _DAY_FILE.fullmatch(p)}
              empty = not hours and not days
              for n, t in list(new_h.items()):
                  if _num_inside(t) != n:
                      errs.append("h/%d.json holds another hour's number" % n)   # #D-10 L-12
                  if len(t.encode("utf-8")) > MAX_HOUR_BYTES:
                      errs.append("h/%d.json is over %d bytes" % (n, MAX_HOUR_BYTES))
                  if n in hours:
                      if hours[n] != t:
                          errs.append("h/%d.json is already published and can't be rewritten" % n)
                      del new_h[n]
              for n, t in list(new_d.items()):
                  if _num_inside(t) != n:
                      errs.append("d/%d.json holds another day's number" % n)
                  if len(t.encode("utf-8")) > MAX_DAY_BYTES:
                      errs.append("d/%d.json is over %d bytes" % (n, MAX_DAY_BYTES))
                  if n in days:
                      if days[n] != t:
                          errs.append("d/%d.json is already published and can't be rewritten" % n)
                      del new_d[n]

              def hour_text(n):
                  for src in (hours, new_h):
                      if n in src:
                          return src[n]
                  for src in (days, new_d):
                      if n // 24 in src:
                          try:
                              return canon(json.loads(src[n // 24])["hours"][n % 24])
                          except Exception:
                              return None
                  return None
              known = set(hours) | {d * 24 + i for d in days for i in range(24)}
              newest = max(known) if known else None
              # new hours: consecutive, after the newest published one, each checked against the one before
              if new_h:
                  ns = sorted(new_h)
                  if ns != list(range(ns[0], ns[0] + len(ns))):
                      errs.append("new hours must be consecutive")
                  elif newest is not None and ns[0] != newest + 1:
                      errs.append("the first new hour must be h/%d.json" % (newest + 1))
                  else:
                      prev = hour_text(ns[0] - 1) if newest is not None else ""
                      if prev is None:
                          errs.append("the hour before h/%d.json isn't published" % ns[0])
                      elif not empty and prev == "":
                          errs.append("only the very first publish may start a chain")
                      else:
                          for n in ns:
                              r = check_hour(prev, new_h[n])
                              if not r["ok"]:
                                  errs.append("h/%d.json: %s" % (n, r["why"]))
                                  break
                              if r["quality"] == "flagged":
                                  warns.append("h/%d.json is flagged: %s" % (n, r.get("why", "")))
                              prev = new_h[n]
              # new days (#D-10 M-6): only roll up hours that already exist (published or new h/ files), byte for byte; the
              # chain is checked from the hour before
              for d in sorted(new_d):
                  try:
                      hrs = json.loads(new_d[d])["hours"]
                      texts = [canon(h) for h in hrs]
                  except Exception:
                      errs.append("d/%d.json is not a day file" % d)
                      continue
                  missing = [d * 24 + i for i in range(len(texts)) if (hours.get(d * 24 + i) or new_h.get(d * 24 + i)) != texts[i]]
                  if len(texts) != 24 or missing:
                      errs.append("d/%d.json: its hours must be published (or new) hour files, byte for byte (hour %s)" % (d, missing[0] if missing else "count"))
                      continue
                  first_prev = json.loads(texts[0]).get("prev")
                  prev = hour_text(d * 24 - 1)
                  if prev is None:
                      if first_prev != "" or d * 24 != min(known | set(new_h)):   # only the day that starts the chain
                          errs.append("d/%d.json: the hour before it isn't available" % d)
                          continue
                      prev = ""
                  r = check_day(new_d[d], prev)
                  if not r["ok"]:
                      errs.append("d/%d.json: %s" % (d, r["why"]))
              # removals: an hour only once a day file holds it (same sha256); days only beyond retention, oldest first, with
              # no hole (#D-10 M-6); newest day from the hour files themselves
              all_days = dict(days)
              all_days.update(new_d)
              hour_ns = set(hours) | set(new_h)
              newest_day = (max(hour_ns) // 24) if hour_ns else (max(all_days) if all_days else 0)
              day_rm = []
              for p in removals:
                  m_h, m_d = _HOUR_FILE.fullmatch(p), _DAY_FILE.fullmatch(p)
                  if m_h:
                      n = int(m_h.group(1))
                      if n not in hours:
                          errs.append("remove %s: not published" % p)
                      elif n // 24 not in all_days or json.loads(all_days[n // 24])["hashes"][n % 24] != sha_hex(hours[n]):
                          errs.append("remove %s: no day file holds it" % p)
                  elif m_d:
                      n = int(m_d.group(1))
                      if n not in days:
                          errs.append("remove %s: not published" % p)
                      elif n >= newest_day - keep_days:
                          errs.append("remove %s: still inside the %d days kept" % (p, keep_days))
                      day_rm.append(n)
                  else:
                      errs.append("remove %s: not a vhp-data file" % p)
              if day_rm and sorted(day_rm) != sorted(days)[:len(day_rm)]:
                  errs.append("days are removed oldest first, with no hole")
              return errs, warns


          def _rpc(url, method, params, timeout=60):
              import urllib.request
              body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode("utf-8")
              req = urllib.request.Request(url, data=body, headers={"content-type": "application/json", "user-agent": "knode-vhp-ruler-publish"})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          out = json.loads(r.read().decode("utf-8"))
                      if "error" in out:
                          raise ValueError(str(out["error"])[:200])
                      return out["result"]
                  except Exception:
                      if attempt == 3:
                          raise
                      import time
                      time.sleep(2 * (attempt + 1))


          def verify_blocks(new_hours, url):
              """Repo Lens #D-10 M-1: the record job's files prove consistency, not truth. Every new block's id and signer (and
              each anchor block's id) must also be what a node says when this job, with no repository code, asks it itself.
              Returns a list of errors."""
              want = {}
              for t in new_hours:
                  h = json.loads(t)
                  for part, start in ((h, h["from"]), (h["tail"], h["to"] + 1)):
                      for i, idx in enumerate(part["sig"]):
                          want[start + i] = (part["ids"][i], h["addrs"][idx])
              if not want:
                  return []
              head = _rpc(url, "chain.get_head_info", {})
              head_id, lib = head["head_topology"]["id"], int(head.get("last_irreversible_block", 0))
              hs = sorted(want)
              if hs[-1] > lib:
                  return ["block %d isn't irreversible on the checking node yet (it is at %d); tried again next run" % (hs[-1], lib)]
              from concurrent.futures import ThreadPoolExecutor
              runs, k = [], 0
              while k < len(hs):
                  s, e = hs[k], hs[k]
                  while k + 1 < len(hs) and hs[k + 1] == e + 1 and e - s < 99:
                      k += 1
                      e = hs[k]
                  runs.append((s, e))
                  k += 1

              def fetch(r):
                  s, e = r
                  res = _rpc(url, "block_store.get_blocks_by_height", {"head_block_id": head_id, "ancestor_start_height": str(s),
                             "num_blocks": e - s + 1, "return_block": True, "return_receipt": False})
                  return [(int(it["block_height"]), str(it["block_id"]), str(it["block"]["header"]["signer"])) for it in res.get("block_items", [])]
              errs, got = [], {}
              ex = ThreadPoolExecutor(max_workers=4)
              try:
                  for items in ex.map(fetch, runs):   # results in order; the first failure raises here
                      for hh, bid, sg in items:
                          got[hh] = (bid, sg)
              finally:
                  # Repo Lens #B-5 N-9: on a failure, drop the batches still queued instead of waiting for all of them
                  ex.shutdown(wait=True, cancel_futures=True)
              for hh in hs:
                  if hh not in got:
                      errs.append("the checking node didn't return block %d" % hh)
                  elif got[hh] != want[hh]:
                      errs.append("block %d: the checking node says id %s signer %s, the file says id %s signer %s" % (hh, got[hh][0], got[hh][1], want[hh][0], want[hh][1]))
                  if len(errs) >= 5:
                      break
              return errs


          def publish_main(argv):
              """argv: incoming dir, published dir, keep days. Env RPC_VERIFY (a third node, optional) or RPC_CHECK: every new
              block is read again there by this job. Exit 0 = publish, 1 = refuse."""
              import os
              inc_dir, pub_dir, keep = argv[0], argv[1], int(argv[2])
              incoming, other = _read_tree(inc_dir)
              published, _ = _read_tree(pub_dir)
              removals = []
              rf = os.path.join(inc_dir, "remove.txt")
              if os.path.exists(rf):
                  with open(rf, encoding="utf-8") as fh:
                      removals = [x for x in fh.read().split("\n") if x]
              errs, warns = publish_check(incoming, published, removals, keep)
              for p in other:
                  errs.append("unexpected file %s" % p)
              new_hours = [t for p, t in sorted(incoming.items()) if p.startswith("h/") and p not in published]
              if not errs and new_hours:
                  # #D-10 M-1: the record job runs repository code and npm packages; this job runs neither, and reads every new
                  # block's id and signer again itself. On RPC_VERIFY (a third node) when one is set, else on RPC_CHECK.
                  v = os.environ.get("RPC_VERIFY", "").strip() or os.environ.get("RPC_CHECK", "").strip()
                  if not v:
                      errs.append("no node to check the blocks on: set RPC_CHECK (or RPC_VERIFY)")
                  else:
                      try:
                          errs.extend(verify_blocks(new_hours, v))
                      except Exception as e:
                          errs.append("couldn't check the blocks independently (%s); tried again next run" % str(e)[:200])
              for w in warns:
                  print("::warning::" + w)
              for e in errs:
                  print("::error::" + e)
              if not errs:
                  print("ok: %d new hour(s), %d new day(s), %d removal(s); every new block checked independently" % (
                      len(new_hours), sum(1 for p in incoming if p.startswith("d/") and p not in published), len(removals)))
              return 1 if errs else 0


          def load_ledger(data_dir):
              """A Ledger over the published vhp-data (h/ and d/ files), every hour checked in order. For a game's publish job:
              recompute its cards from the ruler's data (§7). Returns (Ledger, checks)."""
              tree, _ = _read_tree(data_dir)
              texts = {}
              for p, t in tree.items():
                  m = _DAY_FILE.fullmatch(p)
                  if m:
                      d = json.loads(t)
                      for i, hr in enumerate(d["hours"]):
                          texts[d["n"] * 24 + i] = canon(hr)
              for p, t in tree.items():
                  m = _HOUR_FILE.fullmatch(p)
                  if m:
                      texts[int(m.group(1))] = t
              ns = sorted(texts)
              if not ns or ns != list(range(ns[0], ns[0] + len(ns))):
                  raise ValueError("the vhp-data hours aren't consecutive")
              checks, prev = [], None
              for n in ns:
                  t = texts[n]
                  # the oldest kept hour starts the chain (older ones were removed after retention)
                  r = check_hour(prev, t) if prev is not None else _first_kept(t)
                  if not r["ok"]:
                      raise ValueError("h/%d.json: %s" % (n, r["why"]))
                  checks.append(r)
                  prev = t
              return Ledger(timeline_from([json.loads(texts[n]) for n in ns], checks)), checks


          def check_kept(text):
              """The oldest KEPT hour (its predecessor removed after retention): its own checks without the chain link, as
              checkKept in vhp-data.js. A chained one is checked like a rebuilt one (Repo Lens #B-5 / #E-14 N-4)."""
              try:
                  h = json.loads(text)
              except Exception:
                  return _fail("not JSON")
              if not isinstance(h, dict):
                  return _fail("not an hour")
              stub = dict(h)
              stub["prev"] = ""
              if stub.get("kind") == "chained":
                  stub["kind"] = "rebuilt"
              r = check_hour("", canon(stub))
              if r["ok"]:
                  r = dict(r)
                  r["hash"] = sha_hex(text)
              return r


          def _first_kept(t):
              r = check_kept(t)
              if not r["ok"]:
                  raise ValueError("h/%s.json: %s" % (_num_inside(t), r["why"]))
              return r


          def recompute_main(argv):
              """argv: vhp-data dir, card file, the game's settings (a JSON file: {game, round, window, c, minK, poolRule, ownRule,
              paying, pooled}, from the game's own code, never from the card). Exit 0 = the card is exactly what the data gives."""
              L, _ = load_ledger(argv[0])
              with open(argv[1], encoding="utf-8") as fh:
                  card = fh.read()
              with open(argv[2], encoding="utf-8") as fh:
                  game = json.load(fh)
              same, diff = recompute(L, card, game)
              print("ok: the card matches the ruler's data" if same else "::error::the card doesn't match the ruler's data: " + diff)
              return 0 if same else 1
          # END vhp_ruler.py
          RULERPY
          git init -q "$RUNNER_TEMP/vhp-data"
          git -C "$RUNNER_TEMP/vhp-data" fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" vhp-data
          git -C "$RUNNER_TEMP/vhp-data" checkout -q FETCH_HEAD
      - name: Push race-data (and nothing else)
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          IN: ${{ runner.temp }}/incoming
          RECORD_FILES: ${{ needs.record.outputs.files }}
          PRIZES_FROM_WEEK: ${{ vars.PRIZES_FROM_WEEK }}
          RACE_RULER_FROM_WEEK: ${{ vars.RACE_RULER_FROM_WEEK }}
          RULER_PY: ${{ vars.RACE_RULER_FROM_WEEK != '' && format('{0}/ruler-code/vhp_ruler.py', runner.temp) || '' }}
          RULER_VHP_DATA: ${{ vars.RACE_RULER_FROM_WEEK != '' && format('{0}/vhp-data', runner.temp) || '' }}
        run: |
          set -euo pipefail
          if [ ! -d "$IN" ]; then
            # Repo Lens #E-11 L-2: the recorder wrote files but none arrived: the hand-over between the jobs failed.
            if [ "${RECORD_FILES:-}" = "true" ]; then echo "::error::The record job wrote its files, but they didn't reach the publish job (artifact hand-over failed). Nothing was published this run; the next run tries again."; exit 1; fi
            echo "Nothing to publish."; exit 0
          fi
          # Round 8 (BX-122): the recorder's own JSON form, checked by the same script for the vault folder and the rest.
          # It prints the files that fail, one per line, and exits 1.
          canon='const fs=require("fs"),p=require("path"),bad=[];(function w(d){for(const f of fs.readdirSync(d)){const q=p.join(d,f),s=fs.lstatSync(q);if(s.isDirectory()){w(q);continue}if(!f.endsWith(".json"))continue;if(!s.isFile()){bad.push(p.relative(process.argv[1],q));continue}const raw=fs.readFileSync(q);let ok=false;try{ok=Buffer.compare(Buffer.from(JSON.stringify(JSON.parse(raw.toString("utf8")))+"\n","utf8"),raw)===0}catch(e){}if(!ok)bad.push(p.relative(process.argv[1],q))}})(process.argv[1]);if(bad.length){console.log(bad.join("\n"));process.exit(1)}'
          command -v node >/dev/null || { echo "::error::node is missing on this runner; nothing published"; exit 1; }
          # I-037 B1-4: a bad vault folder (an unexpected or nested file, a file over 2 MB, or one not in the recorder's
          # own JSON form) is held on its own, as the per-file vault checks below already do: no vault file is published
          # this run (no file means no prize; the alert says so), and the race cards Block X needs still publish.
          hold_vault() {
            # Repo Lens #B-8 B8-B3: paths relative to $IN, and no apostrophe in the fixed text (tr would turn it into ?).
            echo "::error::vault results held, not published this run: $(printf '%s' "$1" | sed "s#$IN/##g" | tr -c '[:alnum:]/._ ,:-' '?' | cut -c1-300) (the race cards still publish; I-037 B1-4)"
            if [ -n "${GITHUB_OUTPUT:-}" ]; then echo "held=true" >> "$GITHUB_OUTPUT"; fi
            rm -rf "$IN/vault"
          }
          if [ -e "$IN/vault" ] || [ -L "$IN/vault" ]; then
            vbad=$(find "$IN/vault" \( -type l -o \( -type d ! -path "$IN/vault" \) -o \( ! -type d ! -regex "$IN/vault/\(PENDING-\)?W[0-9][0-9]?[0-9]?[0-9]?\.json" \) \) -print)
            if [ -n "$vbad" ]; then hold_vault "unexpected files in vault/: $vbad"
            elif [ -n "$(find "$IN/vault" -type f -size +2048k -print)" ]; then hold_vault "a file in vault/ is over 2 MB"
            elif ! vout=$(node -e "$canon" -- "$IN/vault"); then hold_vault "not in the recorders own JSON form: $vout"
            fi
          fi
          # Repo Lens #D-13 M-1 / M-3: a race-types file (T) over 2 MB or not in the recorder's own JSON form is held on
          # its own, like the vault folder: the 6-hour race's files, the board and the vault still publish.
          for tf in "$IN"/T[0-9][0-9][0-9].json; do
            [ -f "$tf" ] && [ ! -L "$tf" ] || continue
            tdir="$RUNNER_TEMP/tcheck"; rm -rf "$tdir"; mkdir -p "$tdir"; cp "$tf" "$tdir/"
            twhy=""
            if [ -n "$(find "$tf" -size +2048k -print)" ]; then twhy="over 2 MB"
            elif ! node -e "$canon" -- "$tdir" >/dev/null; then twhy="not in the recorders own JSON form"; fi
            if [ -n "$twhy" ]; then
              echo "::error::$(basename "$tf") (race types) held, not published this run: $twhy (the 6-hour race files still publish; Repo Lens #D-13 M-3)"
              if [ -n "${GITHUB_OUTPUT:-}" ]; then echo "held=true" >> "$GITHUB_OUTPUT"; fi
              rm -f "$tf"
            fi
          done
          bad=$(find "$IN" -mindepth 1 \( -type l -o \( -type d ! -path "$IN/vault" \) -o \( -type f ! -regex "$IN/\(index\|board\|[RWT][0-9][0-9][0-9]\)\.json" ! -regex "$IN/vault/\(PENDING-\)?W[0-9][0-9]?[0-9]?[0-9]?\.json" \) \) -print)
          if [ -n "$bad" ]; then echo "::error::Refusing to publish unexpected files: $bad"; exit 1; fi
          big=$(find "$IN" -type f -size +2048k -print)
          if [ -n "$big" ]; then echo "::error::Refusing to publish files over 2 MB: $big"; exit 1; fi
          # Round 8 (BX-122) and the class behind BX-95 / BX-112 / BX-113: every incoming file must be EXACTLY what the
          # JavaScript recorder writes for its own content (JSON.stringify of its parse, plus a newline). Then the next
          # recorder run reads back the same values and writes the same bytes, whatever Python thinks of them: no 5.0, no
          # -0, no 1e2, no big integer, no spacing or escaping a recorder never writes.
          node -e 'const fs=require("fs"),p=require("path"),bad=[];(function w(d){for(const f of fs.readdirSync(d)){const q=p.join(d,f),s=fs.lstatSync(q);if(s.isDirectory()){w(q);continue}if(!f.endsWith(".json"))continue;if(!s.isFile()){bad.push(p.relative(process.argv[1],q));continue}const raw=fs.readFileSync(q);let ok=false;try{ok=Buffer.compare(Buffer.from(JSON.stringify(JSON.parse(raw.toString("utf8")))+"\n","utf8"),raw)===0}catch(e){}if(!ok)bad.push(p.relative(process.argv[1],q))}})(process.argv[1]);if(bad.length){console.log("::error::not in the recorders own JSON form (JSON.stringify of its parse), nothing published: "+bad.join(", "));process.exit(1)}' -- "$IN"
          # The content must be the recorder's own shape, not only parse as JSON.
          # The published files, to check that a card once published is never changed (audit BX-44).
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q work
          parent=""
          mkdir -p "$RUNNER_TEMP/published"
          if git -C work fetch -q --depth 1 "$remote" race-data 2>/dev/null; then
            parent=$(git -C work rev-parse FETCH_HEAD)
            git -C work ls-tree --name-only FETCH_HEAD | while IFS= read -r f; do
              if [[ "$f" =~ ^([RWT][0-9]{3}|index)\.json$ ]]; then git -C work show "FETCH_HEAD:$f" > "$RUNNER_TEMP/published/$f"; fi
            done
            # I-034: the published vault files, to check the hold (a final file needs its pending file, published earlier).
            git -C work ls-tree --name-only FETCH_HEAD vault/ | while IFS= read -r f; do
              if [[ "$f" =~ ^vault/(PENDING-)?W[0-9]{1,4}\.json$ ]]; then mkdir -p "$RUNNER_TEMP/published/vault"; git -C work show "FETCH_HEAD:$f" > "$RUNNER_TEMP/published/$f"; fi
            done
          fi
          /usr/bin/python3 - "$IN" "$RUNNER_TEMP/published" <<'PY'
          import json, os, re, sys
          d = sys.argv[1]; pub = sys.argv[2] if len(sys.argv) > 2 else ""; addr = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}")
          isaddr = lambda v: type(v) is str and addr.fullmatch(v) is not None
          # Round-7 blind review: JavaScript compares with ===, Python's == says True == 1 and 3.0 == 3. So every check of
