# VHP ruler (R-RULER-1): times ONE one-day chunk of the first fill on each node and reports it as a notice. Read-only:
# no key, no secret, no write, nothing published. Runs on pushes of this file to the vhp-ruler branch (the owner asked
# for the timing before the fill) or by hand. Remove once the first fill has run.
name: VHP ruler fill timing

on:
  workflow_dispatch: {}
  push:
    branches: [vhp-ruler]
    paths: [".github/workflows/vhp-fill-time.yml"]

permissions:
  contents: read

jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Time one day of blocks on each node
        run: npx tsx bot/vhp-fill.ts
        env:
          FILL_TIME_ONE: "1"
          RPC: ${{ vars.RPC || 'https://koinos.armana.io' }}
          RPC_CHECK: ${{ vars.RPC_CHECK || 'https://api.koinosblocks.com' }}
